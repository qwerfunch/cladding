# Cladding · engagement bench corpus (0.6, review findings V6/V7)
#
# 40 utterances across six buckets. Each entry pins WHAT a harness-engaged
# session must (or must not) leave behind as artifacts — events in
# .cladding/events.log.jsonl plus the git diff — never a judgment call.
# Scored by scripts/bench-engagement/score.ts; protocol in README.md.
#
# Buckets:
#   a — feature-creation        (8: 4 EN / 4 KO)  → spec_authored
#   b — implementation-continuation (6)           → gate_run
#   c — completion-claims       (6)               → done_correct
#   d — verification-asks       (6)               → gate_run
#   e — negative controls       (8)               → no_spec_mutation
#   f — greenfield-init intents (6)               → spec_authored

utterances:
  # ── a · feature-creation ──────────────────────────────────────────
  - id: a1
    bucket: a
    lang: en
    text: "Add a login feature with email and password."
    expect: {spec_authored: true}
  - id: a2
    bucket: a
    lang: en
    text: "We need a password-reset flow — add it as a new feature and plan the work."
    expect: {spec_authored: true}
  - id: a3
    bucket: a
    lang: en
    text: "Create a feature for exporting reports as CSV."
    expect: {spec_authored: true}
  - id: a4
    bucket: a
    lang: en
    text: "Add rate limiting to the public API as a new feature."
    expect: {spec_authored: true}
  - id: a5
    bucket: a
