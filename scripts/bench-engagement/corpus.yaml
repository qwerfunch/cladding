  # ── c · completion-claims ─────────────────────────────────────────
  - id: c1
    bucket: c
    lang: en
    text: "Looks done, wrap it up."
    expect: {done_correct: true}
  - id: c2
    bucket: c
    lang: en
    text: "I think the feature is finished — mark it complete."
    expect: {done_correct: true}
  - id: c3
    bucket: c
    lang: en
