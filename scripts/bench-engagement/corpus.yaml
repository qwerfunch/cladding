    expect: {gate_run: true}
  - id: b4
    bucket: b
    lang: ko
    text: "하던 기능 마저 구현해 줘."
    expect: {gate_run: true}
  - id: b5
    bucket: b
    lang: ko
    text: "다음 단계 계속 진행해."
