# Cladding · scripts/ab-abc/coverage.yaml — the coverage ledger for 0.10.0
#
# "Every feature was checked" is a claim, and a claim needs something that fails
# when it stops being true. This file is that something: one entry per item the
# 0.10.0 release notes put in front of a user — every bold lead in the Added /
# Changed / Removed / Fixed lists, every sentence of the heads-up paragraph, and
# every feature entry added since 0.9.4 — mapped to the deterministic side-table
# rows that exercise it, to a live host probe, or to a written reason why it is
# not a scenario at all.
#
# `tests/scripts/ab-abc-coverage.test.ts` reads only this file, the release
# notes, the side-table rows and the feature entries, and fails when the mapping
# stops holding. It runs in CI with no engine, no fixtures and no network, so the
# coverage claim is checked on every commit rather than on the day it was made.
#
# An entry carries at least one of:
#   rows:           side-table row ids that exercise the item
#   host_probe:     true — the item is about a live host, checked in §Host probes
#   not_a_scenario: why a black-box row would measure nothing here
#
# Keys are verbatim: a changelog key is the bold lead exactly as written, and a
# heads-up key is a literal fragment of the sentence it stands for. Rewording the
# release notes therefore breaks the test, which is the point — the ledger tracks
# what the notes actually say, not what they said when it was written.

changelog:
  "Spec schema 0.2.":
    rows: [S-A1, S-B1, S-B2, S-B3, S-C2, L0-11]
  "One compiled model now answers the questions that used to be asked of four,":
    rows: [S-E1, S-E2, L3-2]
  "The count sync covers feature counts too.":
    not_a_scenario: >-
      A repository maintenance script for this project's own readme totals. It
      touches no adopter surface, and its behaviour is fixed by the repo's own
      tests under tests/scripts.
  "`clad relocate-generated` moves the generated files under `spec/generated/`.":
    rows: [S-F1]
  "A schema 0.2 workspace explains its own generated files.":
    rows: [S-A4]
  "A release gate for the 0.2 validation work.":
    not_a_scenario: >-
      The validation ledger governs this release's own evidence, not an adopter
      workspace. Its blocking behaviour is fixed by release-boundary.test.ts and
      by the release-scoped validator, both of which run in CI.
  "The release was measured against the engine it replaces, and against no engine at all.":
    not_a_scenario: >-
      This lead describes the previous campaign. Making it a row would be the
      side-table measuring itself.
  "Completeness is judged from structure alone.":
    rows: [S-C3, S-C4, S-D6]
  "The authoritative profiles block on warnings.":
    rows: [S-C1, S-B6, L0-1]
  "A project's own instructions now say how a test claims a criterion.":
    rows: [S-A1, S-A3, L0-2]
  "An archived feature whose successor is not done yet":
    rows: [S-B6]
  "`clad done` reports how independently the work was verified.":
    rows: [S-D4, L0-6, L0-6b]
  "The experimental headless loop and its `run` command.":
    rows: [S-G1]
  "The parts that existed only to serve that loop:":
    rows: [S-G1]
  "The `run` skill,":
    rows: [S-G1]
  "The host support table was refreshed against live runs for this release.":
    host_probe: true
  "Graph code no longer reaches into gate code,":
    not_a_scenario: >-
      An import rule inside this project's own architecture, enforced by its own
      architecture gate. Nothing an adopter can observe from outside.
  "A renamed test keeps its binding.":
    rows: [L0-11, S-F2]
    note: >-
      PROVISIONAL. The battery's own list leaves this lead unmapped; it is placed
      with the migration rows because the bindings it repairs are the ones the
      migration carries forward. The main agent decides whether it earns a row of
      its own.
  "Patched dependencies.":
    not_a_scenario: >-
      A dependency version bump. The observable fact is what `npm audit` reports
      against this repository's lockfile, which the frozen engines do not carry.
  "A workspace holding a signed review could never record a verification.":
    rows: [S-D2, S-D3]
  "Asking for a different level of assurance for one run now says why it was refused.":
    rows: [S-C3]
    note: repaired by F-18a5883a during the battery; row re-run after repack
  "A receipt imported on the command line is now checked against the project's registered signers,":
    rows: [S-D5]
    note: repaired by F-18a5883a during the battery; row re-run after repack

heads_up:
  "the migration refuses to touch a path with uncommitted changes on it":
    rows: [L0-11, S-F2]
  "One of those decisions asks whether your already-completed features may carry their existing proof forward.":
    rows: [L0-11]
  "Answer no and they carry nothing":
    rows: [L0-11]
  "changing your mind means undoing the migration and applying it again":
    rows: [S-F2]
  "The headless loop is gone — start the server with `clad serve`":
    rows: [S-G1]
  "Moving the generated files into one folder is opt-in through `clad relocate-generated`":
    rows: [S-F1]
  "the pre-push check rewrites the sealed record of what was verified every time it passes":
    rows: [S-C2]
  "has to come at the very start of the test's title":
    rows: [L0-2, S-A1, S-A3]

