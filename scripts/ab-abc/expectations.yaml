    steps:
      - name: strict
        run: cli
        arms: [B, C]
        family: done
        args: ["check", "--tier=pre-push", "--strict", "--json"]
    expect:
      b: {strict_exit_nonzero: true}
      c: {strict_exit_nonzero: true}
    observed: "both arms strict exit 1, failing stage_1.3 and stage_2.1"
    classification: match
    lock:
      strict-B: {exit: 1}
      strict-C: {exit: 1}

  - id: L0-10
    title: An L4 cycle replays end to end
    fixture_family: inprogress
    mode: auto
    question: >-
      At L4, is a strict pre-push honestly unresolved before any human receipt
      exists — and green once every criterion is audited, the feature is
      UAT-signed, and the cycle completes?
    recipe: >-
      Rebuilt to follow the documented recipe after the first run stayed at exit
      1. Three faults, all in the harness: the row ran on a project already
      completed at L2 and raised the level afterwards, so completion never
      published an L4 row; it signed one criterion out of three; and it passed
      `--criterion` to the feature-scoped UAT claim, which refuses it. The
      fixture is now an in-progress project raised to L4 inside its cycle, and
      the row signs every criterion, signs UAT feature-wide, then completes.
      The fixture also carries the project-owned smoke, performance and visual
      runners an L4 profile calls: without them those three stages skip, and a
      skipped stage is an unobserved obligation the gate must refuse.
    steps:
      - name: l4-replay
        run: script
        script: row-l4.sh
        arms: [C]
        family: inprogress
    expect:
      b: {applicable: false}
      c: {unresolved_before_signing: true, done_exit: 0, green_after_completion: true, independence: "self-certified"}
      note: "needs `expect`; without it the row records not-run rather than guessing"
    expect_revised: "rewritten after the first run exposed three harness faults, BEFORE the repaired run"
    observed: "before signing exit 1; audit signed for all three criteria and UAT feature-wide; clad done exit 0 with Smoke/Performance/Visual and Audit/UAT all ✓, independence self-certified; strict pre-push after completion exit 0, achieved L4 of configured L4"
    classification: match
    lock:
      l4-replay-C: {exit: 0, contains: ["completion exit: 0", "strict pre-push AFTER completion: exit 0", "achieved L4 of configured L4"]}

  - id: L0-11
    title: Migrating a 0.1 project to 0.2, accepted and rejected
    fixture_family: done
    mode: auto
    question: >-
      Does the preview describe the same change the apply makes, does a rejected
      decision leave the workspace untouched, and is the accepted result
      strict-pre-push green? The input is the completed 0.1 project arm B built,
      so the migration has real content to migrate.
    steps:
      - name: migrate-both-ways
        run: script
        script: row-migrate.sh
        arms: [C]
        family: done
    recipe: >-
      Rebuilt after the first run measured nothing: it called `--preview` and
      `--decisions reject|accept`, none of which the verb defines, so every
      migrate call exited 1 with "unknown option" and the strict pre-push that
      followed ran on an unmigrated 0.1 tree — its exit 0 was about the old
      workspace, not about a migration. The real surface is a read-only
      `migrate --to 0.2 --json` preview, then `--apply --resolutions <file>`
      carrying the reviewed digest and one confirmation per required decision.
      Accept and reject are not whole-migration modes; the only two-valued
      decision is the legacy L2 baseline, which is what the two passes now vary.
      The "1 changed path" the first run reported was the fixture's own
      `node_modules` symlink, which the porcelain check now excludes.
    expect:
      b: {applicable: false, note: "the migration verb is a 0.2 surface"}
      c:
        preview_writes_nothing: true
        reject_applies: true
        reject_strict_exit: 1
        reject_reason: "the criteria migrate as unobserved/stale — rejecting the baseline is refusing to carry the historic completion evidence forward"
        accept_strict_exit: 0
        accept_reason: "the same criteria are satisfied through migration_baseline observations"
    designed_paths:
      reject: >-
        Red on C by design, and recorded as such in the case document rather than
        in G1's relaxation list: rejecting the legacy baseline writes no
        completion evidence (D14, "reject writes none"), so the migrated criteria
        arrive unobserved and the gate refuses them. It is not a reversal — B has
        nothing to say here — and not an R4 trigger, which is about the accept
        path.
    expect_revised: "rewritten twice: the shape BEFORE the repaired run, then the reject/accept split AFTER seeing what each decision does"
    observed: "the six paths each apply touches are all spec writes — spec.yaml, spec/architecture.yaml, spec/capabilities.yaml, the feature shard, a deleted spec/attestation.yaml, a new spec/generated/; preview exit 0 leaving 0 changed paths; reject applied (6 paths) and its strict pre-push exits 1 with every criterion unobserved/stale; accept applied (6 paths), spec.yaml declares schema 0.2, and its strict pre-push exits 0 with the criteria satisfied through migration_baseline"
    classification: match
    lock:
      migrate-both-ways-C: {exit: 0, contains: ["preview left 0 changed paths", "reject strict pre-push exit: 1", "accept strict pre-push exit: 0", "spec.yaml now declares schema 0.2"]}

  - id: L3-1
    title: A clean seed passes its own gate
    fixture_family: per-version-init
    mode: auto
    question: >-
      Does a freshly scaffolded workspace, synced, behave the same under both
      engines when nothing else has been done to it?
    recipe: >-
      The guess `check_exit: 0` was wrong for a reason that is not about
      cladding: an empty scaffold has no `src` or `tests` file, so `tsc --noEmit`
      fails with TS18003 ("no inputs were found") and the Type stage reports it.
      Both engines exit 1, identically, so the row is now a parity row — the
      answer that is actually available from a bare seed — rather than a
      green-seed claim neither engine can make.
    steps:
      - name: sync
        run: cli
        arms: [B, C]
        family: per-version-init
        args: ["sync"]
      - name: check
        run: cli
        arms: [B, C]
        family: per-version-init
        args: ["check", "--json"]
    expect:
      b: {sync_exit: 0, check_exit: 1, note: "TS18003 — an empty scaffold has no TypeScript inputs"}
      c: {sync_exit: 0, check_exit: "same as B", failed_stages: "same set as B"}
    expect_revised: "rewritten AFTER seeing the first run — both engines fail identically on an empty scaffold"
    observed: "first run: sync 0/0, check 1/1 in both arms"
    classification: expectation-wrong
    lock:
      sync-B: {exit: 0}
      sync-C: {exit: 0}
      check-B: {exit: 1, contains: ["TS18003"]}
      check-C: {exit: 1, contains: ["TS18003"]}

  - id: L3-2
    title: The context payload is unchanged, and the working set agrees with it
    fixture_family: shared-0.1
    mode: auto
    question: >-
      On one shared 0.1 project, do both engines return a byte-identical
      `clad_get_context` payload? And does the candidate's `clad_get_working_set`
      name the schema version while staying a subset of the same context?
    steps:
      - name: context
        run: mcp
        arms: [B, C]
        family: shared-0.1
        calls:
          - {type: tool, name: clad_get_context, args: {query: "{shared_feature}"}}
      - name: working-set
        run: mcp
        arms: [B, C]
        family: shared-0.1
        calls:
          - {type: tool, name: clad_get_working_set, args: {query: "{shared_feature}"}}
    recipe: >-
      Corrected after the first run: both tools require a `query`, both calls
      omitted it, and both engines answered with the same validation error — so
      the "byte-identical" reading was an identical refusal, not an identical
      payload. The shared fixture now carries one feature created once by the
      released engine, and both arms ask about that id.
    expect:
      b: {context_bytes: "baseline"}
      c: {context_bytes: "byte-identical to B apart from any version field, which is compared separately", working_set_names_schema_version: true, working_set_subset_of_context: true}
    expect_revised: "rewritten after the first run exposed a missing required argument, BEFORE the repaired run"
    observed: "context payloads byte-identical (488B each); working set: schema_version 1 in both, C adds one key — authority: graph-ir — 1483B on B against 1510B on C"
    classification: match
    lock:
      context-B: {exit: 0, bytes: 871}
      context-C: {exit: 0, bytes: 872}
      working-set-B: {exit: 0, bytes: 1964, contains: ["schema_version\\\": 1"]}
      working-set-C: {exit: 0, bytes: 1997, contains: ["schema_version\\\": 1", "authority\\\": \\\"graph-ir"]}

  - id: L3-3
    title: The tool catalogue each engine advertises
    fixture_family: shared-0.1
    mode: auto
    question: How many tools does each engine expose, and how large is the catalogue a host must read?
    steps:
      - name: catalogue
        run: mcp
        arms: [B, C]
        family: shared-0.1
        calls:
          - {type: tools/list}
          - {type: resources/list}
          - {type: prompts/list}
    expect:
      b: {tools: 22}
      c: {tools: 27}
    observed: "B 22 tools / 60526B catalogue; C 27 tools / 158700B"
    classification: match
    lock:
      catalogue-B: {exit: 0, bytes: 60526}
      catalogue-C: {exit: 0, bytes: 158700}

  - id: L3-4
    title: What the everyday gate costs in wall time
    fixture_family: shared-0.1
    mode: auto
    question: How long does the pre-commit tier take on the same project under each engine?
    steps:
      - name: hyperfine
        run: hyperfine
        arms: [B, C]
        family: shared-0.1
        args: ["check", "--tier=pre-commit"]
        runs: 5
    expect:
      b: {note: "baseline median; no pass/fail"}
      c: {note: "recorded against B's median; a regression over ~1.5x is a finding"}
    observed: "pre-commit median 1.299s on B against 1.352s on C — 1.04×"
    classification: match
    lock:
      hyperfine-B: {exit: 0}
      hyperfine-C: {exit: 0}

# ── Live-cell measures (L1/L2) ───────────────────────────────────────────────
# Not rows: the live cells have no per-row expectation to pre-register, because
# nobody knows in advance what three agents will build. What IS pre-registered
# is the list of measures and which of them may move a release decision. Every
# one is deterministic, computed by scripts/ab-abc/score.ts from artifacts after
# the session ends. The transcript's prose is never scored.
live_metrics:
  verdict_bearing:
    # Only these may block, delay, or reword the release.
    - completed_honest      # kept done_attempted + shard done + judge exit 0
    - hand_flip             # a done shard with no kept completion behind it
    - engaged               # a feature_created event (B/C)
    - binding_mode          # covers-token | test_refs | none
    - judge_exit            # the arm's own strict pre-push, re-run by the driver
    - judge_failed_stages
    - judge_findings        # per detector and severity
    - gate_runs
    - gate_red_then_green   # an honest red that later became green
    - permission_denials
    - tool_errors
    - worktree_clean_at_end
    - spec_artifacts        # shards, criteria, statements, ears fields, test refs
    - scorer_reproducible   # the same cell scored twice, byte-identical

  cost_bearing:
    # These decide one sentence in the release notes (hypothesis G3) and nothing
    # else. Cost is the host's list-price estimate for an OAuth session, not an
    # amount billed.
    - duration_ms
    - duration_api_ms
    - wall_ms
    - num_turns
    - time_to_first_edit_ms
    - first_gate_tool_ordinal
    - first_green_gate_ordinal
    - tokens_input
    - tokens_output
    - tokens_cache_read
    - tokens_cache_creation
    - tokens_thinking
    - tokens_total
    - cache_read_ratio
    - total_cost_usd
    - static_instruction_tokens   # approxTokens(prompt + AGENTS.md + CLAUDE.md)
    - tool_calls_total
    - tool_calls_mcp

  reported_only:
    # PRE-REGISTERED AS NULL-EXPECTED. Four prior campaigns found correctness
    # orthogonal to the harness, and nothing here re-opens that question. These
    # numbers are published whatever they say, and a difference in them does not
    # block, delay, or justify a release claim.
    - blind_oracle_pass       # scripts/ab-abc/oracle/, hidden from every arm
    - loc_src
    - lint_errors
    - lint_warnings
    - tsc_clean
    - complexity_max
    - complexity_mean
    - any_count
    - api_conformance
    - error_class_named
    - comment_density
    - jsdoc_blocks
    - header_comment_present
    - files_outside_scope
    - test_count
    - assertion_count
    - ac_titled
    - negative_test_present
    - skip_or_only
    - coverage_lines_pct
    - git_commits

  secondary_not_run:
    # A blinded model-graded rubric (scripts/ab-abc/judge.sh). Non-deterministic,
    # roughly $0.10 per cell, and refuses to run without an explicit confirmation.
    # Recorded here so its absence is a decision rather than an oversight.
    - blind_rubric_readability
    - blind_rubric_error_handling
    - blind_rubric_test_design
