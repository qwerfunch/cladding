  - id: S-B1
    title: The statement grammar, four ways to get it wrong
    fixture_family: per-version-init
    mode: auto
    status: unlocked
    question: >-
      The new format accepts one sentence shape for an acceptance criterion, so
      that a criterion always says one testable thing. Are the four ways of
      breaking that shape each refused with a reason, is a correct one accepted,
      and does the released engine take the same four texts without comment?
    steps:
      - name: strict-grammar
        run: mcp
        arms: [C]
        family: per-version-init
        calls:
          - type: tool
            name: clad_create_feature
            args:
              slug: grammar-two-shalls
              title: A criterion carrying two obligations
              purpose: The row needs one criterion that states more than one obligation.
              modules: [src/grammar-two-shalls.ts]
              capability_refs: []
              acceptance_criteria:
                - kind: behavior
                  statement: The system shall reject an empty title and shall accept a full one.
          - type: tool
            name: clad_create_feature
            args:
              slug: grammar-no-period
              title: A criterion that does not end
              purpose: The row needs one criterion with no terminal period.
              modules: [src/grammar-no-period.ts]
              capability_refs: []
              acceptance_criteria:
                - kind: behavior
                  statement: The system shall accept a title that carries slug-able characters
          - type: tool
            name: clad_create_feature
            args:
              slug: grammar-comma-clause
              title: A criterion whose condition runs on
              purpose: The row needs one criterion with a comma inside its condition.
              modules: [src/grammar-comma-clause.ts]
              capability_refs: []
              acceptance_criteria:
                - kind: behavior
                  statement: When a title arrives, and it is empty, the system shall reject it.
          - type: tool
            name: clad_create_feature
            args:
              slug: grammar-bare-subject
              title: A criterion whose subject is not the system
              purpose: The row needs one criterion whose subject phrase does not open with "the".
              modules: [src/grammar-bare-subject.ts]
              capability_refs: []
              acceptance_criteria:
                - kind: behavior
                  statement: Slug builder shall reject a title that carries no slug-able characters.
          - type: tool
            name: clad_create_feature
            args:
              slug: grammar-correct
              title: A criterion in the shape the format accepts
              purpose: The row needs one criterion the grammar accepts, so refusal is not the only outcome available.
              modules: [src/grammar-correct.ts]
              capability_refs: []
              acceptance_criteria:
                - kind: behavior
                  statement: The system shall accept a title that carries slug-able characters.
      - name: legacy-grammar
        run: mcp
        arms: [B]
        family: per-version-init
        calls:
          - type: tool
            name: clad_create_feature
            args:
              slug: grammar-two-shalls
              title: A criterion carrying two obligations
              modules: [src/grammar-two-shalls.ts]
              acceptance_criteria:
                - ears: ubiquitous
                  text: The system shall reject an empty title and shall accept a full one.
          - type: tool
            name: clad_create_feature
            args:
              slug: grammar-no-period
              title: A criterion that does not end
              modules: [src/grammar-no-period.ts]
              acceptance_criteria:
                - ears: ubiquitous
                  text: The system shall accept a title that carries slug-able characters
          - type: tool
            name: clad_create_feature
            args:
              slug: grammar-comma-clause
              title: A criterion whose condition runs on
              modules: [src/grammar-comma-clause.ts]
              acceptance_criteria:
                - ears: event
                  text: When a title arrives, and it is empty, the system shall reject it.
          - type: tool
            name: clad_create_feature
            args:
              slug: grammar-bare-subject
              title: A criterion whose subject is not the system
              modules: [src/grammar-bare-subject.ts]
              acceptance_criteria:
                - ears: ubiquitous
                  text: Slug builder shall reject a title that carries no slug-able characters.
          - type: tool
            name: clad_create_feature
            args:
              slug: grammar-correct
              title: A criterion in the shape the format accepts
              modules: [src/grammar-correct.ts]
              acceptance_criteria:
                - ears: ubiquitous
                  text: The system shall accept a title that carries slug-able characters.
    expect:
      b: {refused: 0, accepted: 5}
      c: {refused: 4, accepted: 1, each_refusal_names_a_reason: true}
    expect_revised:
      b: {refused: 1, accepted: 4, refusal_follows_from: "the row's own EARS label, not the sentence"}
      c: {refused: 4, accepted: 1, each_refusal_names_a_reason: false, refusal_text: "one generic sentence for all four"}
      why: >-
        rewritten AFTER seeing the first run, on both arms. The candidate refuses
        all four malformed statements, which is the substance of the guess; but
        every refusal reads only "has an invalid strict statement", naming
        neither the rule broken nor the offending words, so "each refusal names a
        reason" was too generous. On the released engine the guess was too harsh:
        it refuses one of the four, and a control create showed that refusal
        comes from the row labelling that sentence as a condition-shaped one, not
        from the sentence itself.
    observed: "C refused all four malformed statements with INVALID_OPERATION and accepted the fifth. But every refusal reads only 'Criterion AC-\u2026 has an invalid strict statement' \u2014 it names neither the rule broken nor the offending text \u2014 so the 'each refusal names a reason' half of the guess is not met. B accepted three of the four (two obligations, missing terminal period, bare subject) and refused only the condition-shaped one, on EARS shape; a throwaway create of the same sentence under `ears: ubiquitous` was ACCEPTED, so B's refusal follows from the row's own `ears: event` label rather than from the sentence."
