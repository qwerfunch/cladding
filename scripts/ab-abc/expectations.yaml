    note: >-
      The refusals are correct — all four malformed statements are turned away
      and the well-formed one is accepted — but every message reads only that the
      statement is invalid, without naming the rule or quoting the offending
      words. An author has to work out which of the four rules they broke. A 0.10.x
      wording candidate, not a release blocker.

