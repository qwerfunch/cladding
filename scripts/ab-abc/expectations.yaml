  - id: S-F1
    title: The generated projections move once, safely, and refuse the two cases they must
    fixture_family: done
    mode: auto
    status: unlocked
    question: >-
      Does the relocation preview write nothing, does the apply move all three
      derived files byte-identically and retarget the merge=union line, does the
