    steps:
      - name: retired-verb
        run: cli
        arms: [B, C]
        family: shared-0.1
        args: ["run", "--help"]
    expect:
      b: {exit: 0, note: "the verb still exists on the released engine"}
      c: {exit_nonzero: true, note: "unknown command, no partial execution"}
    # The first run recorded exit 0 in BOTH arms: 0.10.0 answers `run --help`
    # with its own help text rather than an unknown-command error. Kept as a
    # record row — what matters is that nothing half-executed, and the retirement
    # of the verb is visible in the help text itself.
    observed: "B exit 0 (831B); C exit 0 (6956B) — the candidate prints top-level help, not a partial run"
    classification: record
    lock:
      retired-verb-B: {exit: 0}
      retired-verb-C: {exit: 0}

  - id: L0-8
    title: A typed spec edit refuses stale input
    fixture_family: per-version-init
    mode: auto
    question: >-
      Does a typed edit whose declared input digest no longer matches the file
      get refused, rather than applied over someone else's change?
    steps:
      - name: stale-edit
        run: script
        script: row-stale-edit.sh
        arms: [C]
        family: per-version-init
    recipe: >-
      The first run never reached a tool: the row scanned `spec/features` in a
      freshly scaffolded workspace that holds no feature, and threw ENOENT. The
      script now creates the feature it edits, and sends the apply call in the
      shape the surface defines — `operations` plus the prepare's own
      `input_revisions` map — instead of a guessed `input_sha256` field.
    expect:
      b: {applicable: false, note: "typed edits are a 0.2 surface"}
      c: {refused_with: "STALE_INPUT"}
    observed: "C refused with STALE_INPUT: The feature:F-… input changed since it was read."
    classification: match
    lock:
      stale-edit-C: {exit: 0, contains: ["STALE_INPUT"]}

  - id: L0-9
    title: Vacuous green — a feature whose own tests are all skipped
    fixture_family: done
    mode: auto
    mutations: [vacuous-green]
    question: >-
      The module stays covered by a neighbouring test file while the feature's
