# ── Live-cell measures (L1/L2) ───────────────────────────────────────────────
# Not rows: the live cells have no per-row expectation to pre-register, because
# nobody knows in advance what three agents will build. What IS pre-registered
# is the list of measures and which of them may move a release decision. Every
# one is deterministic, computed by scripts/ab-abc/score.ts from artifacts after
# the session ends. The transcript's prose is never scored.
  # ---------------------------------------------------------------------------
  # 0.10.0 feature-scenario battery (added 2026-09-09). Every row below carries
  # `status: unlocked`: the sixteen rows above are pinned and enforced, these are
  # still being read. The runner records them and prints how many remain.
  # ---------------------------------------------------------------------------

  - id: S-A1
    title: What each engine's own scaffold tells the project
    fixture_family: template
    mode: auto
    status: unlocked
    question: >-
      Onboarding is the first and often only place an adopter reads how this
      works. Run each engine's default over the identical untouched template:
      what does the project declare, and do the instructions left behind name the
      binding that engine's gate actually reads?
    steps:
      - name: scaffold
        run: script
        script: row-init.sh
        arms: [B, C]
        family: template
    expect:
      b: {schema: "0.1 (no schema key)", agents_md_covers_token: absent, claude_md_section: "0.1 wording"}
      c:
        schema: "0.2"
        assurance_level: L2
        scenario_policy: advisory
        project_purpose: present
        agents_md_covers_token: present
        agents_md_clad_begin: present
        claude_md_token_sentence: present
    expect_revised:
      b: {schema: "0.1 (no schema key)", agents_md_covers_token: absent, claude_md_written_at_init: false}
      c:
        schema: "0.2"
        assurance_level: L2
        scenario_policy: advisory
        project_purpose: present
        agents_md_covers_token: present
        agents_md_clad_begin: present
        claude_md_written_at_init: false
      why: >-
        rewritten AFTER seeing the first run. Everything the guess said about
        spec.yaml and AGENTS.md held on both engines; the CLAUDE.md clause had no
        surface to be asked on, because neither engine writes CLAUDE.md at init.
        That file belongs to the adopter, and only `clad update` writes the
        managed section into it — which is the question S-A3 asks.
    observed: "B (0.9.4): init exit 0; spec.yaml declares schema \"0.1\" with no assurance_level, scenario_policy or project purpose; AGENTS.md carries the feature-cycle heading but no covers token and no clad_begin. C: schema \"0.2\", assurance_level L2, scenario_policy advisory, project purpose present; AGENTS.md carries both the covers token and clad_begin. Neither engine writes CLAUDE.md at init \u2014 the file belongs to the adopter and only `clad update` writes the managed section \u2014 so the guess's CLAUDE.md clause is answered by S-A3 instead."
    classification: expectation-wrong

