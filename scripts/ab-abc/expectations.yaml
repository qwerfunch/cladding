    classification: match
    lock:
      relocate-C: {exit: 0, contains: ["preview state old; moves 3; writes 0", "preview left 0 changed paths", "old paths still present: 0 of 3", "index bytes identical after the move: yes", "spec/generated/index.yaml merge=union", "strict push profile after the move: exit 0", "second apply state new; changed false", "conflict apply exit: 1", "relocation_conflict", "Run `clad migrate --to 0.2` first"]}
