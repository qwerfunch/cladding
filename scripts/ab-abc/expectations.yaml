  - id: S-F2
    title: The three guards around a migration
    fixture_family: done
    mode: auto
    status: unlocked
    question: >-
      Is an apply refused when a planned path carries uncommitted work, is a
      baseline decision that has already been applied protected from being
      re-answered, and does a 0.1 criterion the 0.2 grammar cannot parse become a
      question for a human rather than a guess?
    recipe: >-
      Each guard runs on its own copy of the completed 0.1 project (done/B) inside
      the row's workspace, so a refusal in one pass cannot be mistaken for a state
      another left behind.
    steps:
      - name: migrate-guards
        run: script
        script: row-migrate-guards.sh
        arms: [C]
        family: done
    expect:
      b: {applicable: false, note: "the migration verb is a 0.2 surface"}
      c:
        dirty_code: DIRTY_PLANNED_PATH
        second_answer_changes_nothing: true
        unparseable_criterion_demands_a_decision: true
        apply_without_that_answer_refused: true
    expect_revised:
      b: {applicable: false, note: "the migration verb is a 0.2 surface"}
      c:
        dirty_before_the_preview: DIRTY_PLANNED_PATH
        dirty_after_the_preview: STALE_INPUT
        second_answer_changes_nothing: true
        unparseable_criterion_demands_a_decision: true
        apply_without_that_answer_refused: true
      why: >-
        the dirty pass was rewritten during the dry run, before the recorded run:
        dirtying the tree AFTER taking the preview never reaches the
        uncommitted-path guard, because the preview digest has already changed
        and the apply answers STALE_INPUT first. The refusal this row is about
        needs the dirt to precede the preview. Both orders are now run and
        recorded, so the two refusals are not mistaken for each other.
    observed: >-
      C: with spec.yaml dirty before the preview, the apply exits 1 with code
      DIRTY_PLANNED_PATH — "Migration planned paths have uncommitted changes;
      unrelated paths may remain dirty." — writes 0, no 0.2 marker in spec.yaml and
      only the one dirty file changed; with the same edit made after the preview
      the apply exits 1 with STALE_INPUT instead. After a migration applied with
      the legacy baseline accepted and committed, re-applying the same preview
      with the answer flipped to reject exits 0 with changed false, spec.yaml
      byte-identical and 0 paths changed. A criterion rewritten to "slug things,
      mostly" makes the preview demand 5 decisions including
      CRITERION_STATEMENT_CONFLICT for criterion:F-fb84bdc8/AC-9140ff77, and an
      apply that answers everything except that one exits 1 with
      MIGRATION_UNRESOLVED, 0 paths changed. ~3 s.
    classification: expectation-wrong
    lock:
      migrate-guards-C: {exit: 0, contains: ["DIRTY_PLANNED_PATH", "dirtied-after-preview apply exit: 1", "STALE_INPUT", "second apply with the other answer exit: 0", "spec.yaml unchanged by the second answer: yes", "criterion-text decision demanded for: criterion:F-fb84bdc8/AC-9140ff77", "MIGRATION_UNRESOLVED"]}

live_metrics:
  verdict_bearing:
    # Only these may block, delay, or reword the release.
    - completed_honest      # kept done_attempted + shard done + judge exit 0
    - hand_flip             # a done shard with no kept completion behind it
    - engaged               # a feature_created event (B/C)
    - binding_mode          # covers-token | test_refs | none
    - judge_exit            # the arm's own strict pre-push, re-run by the driver
    - judge_failed_stages
    - judge_findings        # per detector and severity
    - gate_runs
    - gate_red_then_green   # an honest red that later became green
    - permission_denials
    - tool_errors
    - worktree_clean_at_end
    - spec_artifacts        # shards, criteria, statements, ears fields, test refs
    - scorer_reproducible   # the same cell scored twice, byte-identical

  cost_bearing:
    # These decide one sentence in the release notes (hypothesis G3) and nothing
    # else. Cost is the host's list-price estimate for an OAuth session, not an
    # amount billed.
    - duration_ms
    - duration_api_ms
    - wall_ms
    - num_turns
    - time_to_first_edit_ms
    - first_gate_tool_ordinal
    - first_green_gate_ordinal
    - tokens_input
    - tokens_output
    - tokens_cache_read
    - tokens_cache_creation
    - tokens_thinking
    - tokens_total
    - cache_read_ratio
    - total_cost_usd
    - static_instruction_tokens   # approxTokens(prompt + AGENTS.md + CLAUDE.md)
    - tool_calls_total
    - tool_calls_mcp

  reported_only:
    # PRE-REGISTERED AS NULL-EXPECTED. Four prior campaigns found correctness
    # orthogonal to the harness, and nothing here re-opens that question. These
    # numbers are published whatever they say, and a difference in them does not
    # block, delay, or justify a release claim.
    - blind_oracle_pass       # scripts/ab-abc/oracle/, hidden from every arm
    - loc_src
    - lint_errors
    - lint_warnings
    - tsc_clean
    - complexity_max
