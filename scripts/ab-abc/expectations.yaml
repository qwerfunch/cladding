# Cladding · scripts/ab-abc/expectations.yaml — the L0/L3 deterministic side-table
#
# These rows run with no agent: the engine is driven directly, so the same input
# gives the same answer every time. Two fixture families are kept apart on
# purpose, because they answer different questions:
#
#   shared-0.1        one schema-0.1 workspace, driven by BOTH engines. Anything
#                     that differs here is a back-compatibility change: the same
#                     project, a newer engine, a different answer.
#   per-version-init  each engine scaffolds its own default from the identical
#                     template (B: `clad init --no-llm`; C: `clad init --schema 0.2
#                     --no-llm`). Differences here are the intended 0.2 delta, not
#                     a regression.
#
# `expect` is the pre-registered guess, and it is itself under test. A run fills
# `observed`, and a human fills `classification` from this vocabulary:
#
#   match              observed matches expect
#   defect-fixed       the row found something that had to be repaired before the
#                      table could be believed, and the repaired run is what the
#                      row now records
#   expectation-wrong  the engine's behaviour is defensible; the row's guess was
#                      not. Correct the expectation, say so in the case doc.
#   designed           the difference is a deliberate 0.2 change, named in the
#                      case document's list before the fact
#   record             the row has nothing to be right or wrong about; it exists
#                      to write down what each engine says
#
# While `status: unlocked` a mismatch is a finding to classify, never a blocker.
# Once a human has classified every row, flip to `status: locked` — from then on
# a mismatch blocks the release, which is the whole point of writing the guesses
# down before looking.
#
# LOCKING is what makes that a machine fact rather than a promise. Each row
# carries a `lock:` map — one entry per `<step>-<arm>`, pinning the exit code, and
# where the substance is in the output rather than the exit, the literal strings
# that output must still contain and the byte count it must still have. While the
# file is locked the runner compares every pinned value against what it just saw
# and exits non-zero on the first difference. Prose in `observed` is for the
# reader; `lock:` is what actually blocks.
#
# A pinned literal is matched against the artifact's own bytes, so a string that
# reaches the artifact inside a JSON payload is pinned in its escaped form —
# `schema_version\": 1`, not `"schema_version": 1`. That is deliberate: the pin
# names what is on disk, and nothing re-parses the artifact to make the guess
# look tidier.

# FIRST RUN, 2026-09-08. Every row ran. Eight rows measured nothing on that run
# — the fault was the harness in every case, not the engine: a mutation that
# stripped one comment style and left another, an arm whose shard bound no
# module, tool calls missing a required argument, a fixture with no feature in
# it, an L4 replay that signed one criterion of three and completed at the wrong
# point in the cycle, and a migration driven with two flags the verb does not
# define. Those are repaired, the rows re-ran, and each row now carries
# `expect_revised` saying whether its guess was corrected before or after the
# repaired run.
#
# LOCKED 2026-09-08, after the corrected table was read row by row and one row
# was added: L0-6b, the refusal case for the independence policy, which closes
# the gap L0-6 recorded. The lock preceded every COMPARISON cell; the one live
# session that ran before it was a single-arm instrumentation check of the driver
# and the scorer, and no row here reads a number from it.

status: locked
locked_at: "2026-09-08"
engines:
  b: "cladding@0.9.4 (registry) — prefix-B"
  c: "cladding 0.10.0 (packed from this checkout) — prefix-C"

rows:
  - id: L0-1
    title: A warn-severity finding does not block a non-strict gate
    fixture_family: done
    mode: auto
    mutations: [strip-module-header]
    question: >-
      With a completed feature whose module lost its header comment — a
      warn-level convention finding — does the pre-push tier still exit 0 without
      --strict, and does --strict still block?
    steps:
      - name: non-strict
        run: cli
        arms: [B, C]
        family: done
        args: ["check", "--tier=pre-push", "--json"]
      - name: strict
        run: cli
        arms: [B, C]
        family: done
        args: ["check", "--tier=pre-push", "--strict", "--json"]
    expect:
      # Corrected after the first run. Two harness faults made this row vacuous:
      # the mutation removed only a leading `//` line and left the module's JSDoc
      # block as the first non-empty line — which CONVENTION_DRIFT accepts as a
      # header just the same — and arm B's shard carried `modules: []`, so the
      # detector had no module to walk. Both are fixed; the guess below is
      # therefore about severity, which is what the row meant to ask.
      b: {non_strict_exit: 0, strict_exit: 1, finding: CONVENTION_DRIFT}
      c: {non_strict_exit: 1, strict_exit: 1, finding: CONVENTION_DRIFT}
      # The discriminating finding is CONVENTION_DRIFT by name, not "a warn" as a
      # class: the first run's C fixture carried a STALE_ATTESTATION warn on its
      # own and still exited 0 without --strict.
    expect_revised: "rewritten after the first run exposed a dead mutation, BEFORE the repaired run"
    observed: "B non-strict 0 / strict 1; C non-strict 1 / strict 1. CONVENTION_DRIFT:warn present in both arms (with STALE_ATTESTATION:warn alongside, since the mutation changes module bytes); an unmutated control on the same C fixture is non-strict exit 0 with no warn at all"
    classification: defect-fixed
    lock:
      non-strict-B: {exit: 0, contains: ["CONVENTION_DRIFT"]}
      non-strict-C: {exit: 1, contains: ["CONVENTION_DRIFT"]}
      strict-B: {exit: 1, contains: ["CONVENTION_DRIFT"]}
      strict-C: {exit: 1, contains: ["CONVENTION_DRIFT"]}

