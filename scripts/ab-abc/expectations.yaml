    expect:
      b: {applicable: false, note: "0.1 binds through test_refs, not title tokens"}
      c: {strict_exit_nonzero: true, note: "a trailing token is not a binding — the criteria go unclaimed"}
    observed: "C strict exit 1: three MISSING_TESTS errors and three unbound criteria, each naming the leading-token form"
    classification: match
    lock:
      trailing-token-C: {exit: 1, contains: ["MISSING_TESTS", "[covers:"]}

  - id: L0-3
    title: clad_create_feature — a criterion with no statement, and test_refs on each schema
    fixture_family: per-version-init
    mode: auto
    question: >-
      (a) Does each engine refuse a criterion carrying no statement text?
      (b) What happens to a per-criterion `test_refs` argument on each schema —
      0.1 stores it, and 0.2 is expected to say so rather than drop it silently?
    recipe: >-
      Rewritten after the first run. The old row asked for a feature with no
      `statement` argument at all: both engines accepted it, because a feature
      with no criteria is legal, so the row tested nothing. It also sent
      `statement` and `test_refs` at the TOP level, which 0.2 rejects at the
      schema boundary before any wording is reached, and it ran both arms on the
      shared 0.1 workspace, where the newer engine writes a 0.1 shard and cannot
      show its own refusal. Each arm now runs on its own scaffold and sends the
      arguments its schema actually defines.
    steps:
      - name: no-statement-b
        run: mcp
        arms: [B]
        family: per-version-init
        calls:
          - {type: tool, name: clad_create_feature, args: {slug: "no-statement", title: "A feature whose criterion has no text", acceptance_criteria: [{ears: "ubiquitous"}]}}
      - name: no-statement-c
        run: mcp
        arms: [C]
        family: per-version-init
        calls:
          - {type: tool, name: clad_create_feature, args: {slug: "no-statement", title: "A feature whose criterion has no statement", purpose: "The row needs a criterion with nothing said in it.", capability_refs: [], acceptance_criteria: [{kind: "behavior"}]}}
      - name: with-test-refs-b
        run: mcp
        arms: [B]
        family: per-version-init
        calls:
          - {type: tool, name: clad_create_feature, args: {slug: "with-refs", title: "A feature carrying test refs", acceptance_criteria: [{ears: "ubiquitous", text: "The system shall record a test reference.", test_refs: ["tests/example.test.ts"]}]}}
      - name: with-test-refs-c
        run: mcp
        arms: [C]
        family: per-version-init
        calls:
          - {type: tool, name: clad_create_feature, args: {slug: "with-refs", title: "A feature carrying test refs", purpose: "The row needs a criterion that names its own test.", capability_refs: [], acceptance_criteria: [{kind: "behavior", statement: "The system shall record a test reference.", test_refs: ["tests/example.test.ts"]}]}}
      - name: list-features
        run: mcp
        arms: [B, C]
        family: per-version-init
        calls:
          - {type: tool, name: clad_list_features, args: {}}
    expect:
      b: {no_statement: "accepted — 0.1 has no required criterion text", test_refs: "stored on the criterion"}
      c: {no_statement: "refused", test_refs: "refused with INVALID_OPERATION naming the [covers: token as the 0.2 binding"}
    expect_revised: "rewritten after the first run exposed a call shape the schema never reached, BEFORE the repaired run"
    observed: "B accepted the empty criterion and its own gate reported AC_DRIFT error; C refused with INVALID_OPERATION 'Criterion 1 needs kind and a strict statement.'. B stored test_refs on the criterion; C refused with INVALID_OPERATION naming the [covers:F-…/AC-…] binding"
    classification: match
    lock:
      no-statement-b-B: {exit: 0, contains: ["AC_DRIFT"]}
      no-statement-c-C: {exit: 0, contains: ["INVALID_OPERATION", "needs kind and a strict statement"]}
      with-test-refs-b-B: {exit: 0, contains: ["AC_DRIFT"]}
      with-test-refs-c-C: {exit: 0, contains: ["INVALID_OPERATION", "[covers:"]}
      list-features-B: {exit: 0, contains: ["\\\"total\\\": 2"]}
      list-features-C: {exit: 0, contains: ["\\\"total\\\": 0"]}

  - id: L0-4
    title: clad_get_graph honours max_depth
    fixture_family: shared-0.1
    mode: auto
    question: >-
      Does a max_depth of 3 return a strict subset of the same query at 5 — and
      what does the candidate, whose documented ceiling is 3, do with a 5?
    recipe: >-
      Corrected after the first run: the calls named no `query`, and with the
      seed omitted both engines answer with corpus statistics, which no depth
      argument touches. That is why depth-3 and depth-5 came back byte-identical
      in both arms. The shared fixture now carries one feature, and the row seeds
      the traversal with it.
    steps:
      - name: depth-5
        run: mcp
        arms: [B, C]
        family: shared-0.1
        calls:
          - {type: tool, name: clad_get_graph, args: {query: "{shared_feature}", max_depth: 5}}
      - name: depth-3
        run: mcp
        arms: [B, C]
        family: shared-0.1
        calls:
          - {type: tool, name: clad_get_graph, args: {query: "{shared_feature}", max_depth: 3}}
    expect:
      b: {depth_3_subset_of_5: true, note: "0.9.4 advertises a ceiling of 6"}
      c: {depth_5: "refused or clamped — the advertised ceiling is 3", depth_3: "answered within the byte ceiling"}
    expect_revised: "rewritten after the first run exposed a missing seed argument, BEFORE the repaired run"
    observed: "C max_depth 5 → isError with kind: rejected, reason 'max_depth must be an integer between 1 and 3'; C max_depth 3 → a projection (2403B). B accepted both and returned the same graph either way, its ceiling being 6 on a two-node graph"
    classification: match
    lock:
      depth-5-B: {exit: 0}
      depth-5-C: {exit: 0, contains: ["max_depth must be an integer between 1 and 3"]}
      depth-3-B: {exit: 0}
      depth-3-C: {exit: 0}

  - id: L0-5
    title: The wording a completed feature reports
    fixture_family: done
    mode: auto
    question: >-
      What does each engine print when a feature completes — and does the newer
      wording still name the evidence rather than only the outcome? The text is
      captured verbatim while the fixture is built, so this row reads a record
      rather than re-running a completion.
    steps:
      - name: completion-output
        run: file
        arms: [B, C]
        family: done
        path: "{root}/sidetable/done/{arm}.done-output.txt"
    expect:
      b: {note: "records the released wording verbatim; no pass/fail"}
      c: {note: "records the 0.10.0 wording verbatim; no pass/fail"}
    # Confirmed as a record row after the first run: both files were captured, and
    # a record row has nothing to be right or wrong about.
    observed: "both arms captured their completion text (B 361B, C 431B)"
    classification: record
    lock:
      completion-output-B: {exit: 0, bytes: 361, contains: ["independence: self-certified"]}
      completion-output-C: {exit: 0, bytes: 431, contains: ["independence: not applicable"]}

  - id: L0-6
    title: independence_policy require — what the gate says about a self-signed cycle
    fixture_family: done
    mode: auto
    mutations: [require-independence]
    question: >-
      With the policy turned up to `require` on a completed L2 feature whose only
      author is also its only signer, what does the gate report about
      independence — and is that a pass?
    recipe: >-
      Redefined after the first run. The old row expected `require` to block a
      completed L2 cycle, and the candidate let it through. That is the designed
      relaxation, not a defect: at L2 the kernel labels independence
      `not-applicable`, because the profile asks for no human review at all, and
      0.2's `require` refuses only what is `self-certified` or unobserved (see
      the CHANGELOG's Changed entry). The refusal case therefore belongs to the
      L4 row, where a human receipt exists to be judged, and this row records
      what `require` means at L2.
    steps:
      - name: policy-require
        run: cli
        arms: [C]
        family: done
        args: ["check", "--tier=pre-push", "--strict", "--json"]
    expect:
      b: {applicable: false, note: "0.9.4 has no trust registry; `require` there refuses a legacy self-certified completion"}
      c: {independence: "not-applicable", strict_exit: 0, note: "designed relaxation — at L2 the profile asks for no human review"}
      companion: >-
        The refusal case is L0-6b, added before the table was locked: the same
        policy at L4, where a self-signed receipt is the thing `require` refuses.
        Read the two rows together — one says what the policy passes and why, the
        other says what it stops.
    expect_revised: "rewritten AFTER seeing the first run — the guess was wrong about a designed relaxation, not about an engine fault"
    observed: "C worst 0, independence not-applicable, achieved L2 — the completed cycle passes under require"
    classification: designed
    lock:
      policy-require-C: {exit: 0, contains: ["\"independence\": \"not-applicable\""]}

  - id: L0-6b
    title: independence_policy require — a self-signed L4 cycle is refused
    fixture_family: inprogress
    mode: auto
    mutations: [require-independence]
    question: >-
      At L4, where human receipts exist and the only issuer is also the only
      author, does `require` refuse the completion — and does the refusal say who
      to ask instead of only saying no?
    recipe: >-
      Added 2026-09-08, before any comparison cell ran — the only live session
      by then was the single-arm instrumentation check, which no row reads — to
      close the gap L0-6 recorded: `require` at L2 has nothing to refuse, so the L2 pass on its own
      could not tell a designed relaxation apart from a policy that never ran.
      This row replays L0-10's recipe on the same in-progress fixture with the
      policy turned up: every criterion audited and the feature UAT-signed by the
      committing author, then `clad done`. The script refuses to measure anything
      unless the mutation is visible in the workspace's own spec.yaml first.
    steps:
      - name: l4-require
        run: script
        script: row-l4-require.sh
        arms: [C]
        family: inprogress
    expect:
      b: {applicable: false, note: "assurance levels and the trust registry are a 0.2 surface — not run"}
      c:
        done_exit: 1
        remedy_named: "Ask a registered issuer other than the implementation authors for a verified review"
        note: "the receipts are self-certified, which is what `require` refuses"
    expect_revised: "written before the row first ran"
    observed: null
    classification: match
    lock:
      l4-require-C: {exit: 0, contains: ["Ask a registered issuer other than the implementation authors for a verified review", "refused as required: completion exit 1"]}

  - id: L0-7
    title: The retired standalone-runner verb
    fixture_family: shared-0.1
    mode: auto
    question: >-
      0.10.0 retired a verb 0.9.4 still carried. Does the newer engine fail
