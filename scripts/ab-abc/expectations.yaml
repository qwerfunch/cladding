# Cladding · scripts/ab-abc/expectations.yaml — the L0/L3 deterministic side-table
#
# These rows run with no agent: the engine is driven directly, so the same input
# gives the same answer every time. Five fixture families are kept apart on
# purpose, because they answer different questions:
#
#   shared-0.1        one schema-0.1 workspace, driven by BOTH engines. Anything
#                     that differs here is a back-compatibility change: the same
#                     project, a newer engine, a different answer.
#   per-version-init  each engine scaffolds its own default from the identical
#                     template (B: `clad init --no-llm`; C: `clad init --schema 0.2
#                     --no-llm`). Differences here are the intended 0.2 delta, not
#                     a regression.
#   done              a project that has genuinely finished a feature, per arm —
#                     the input every question about completion, warn severity,
#                     independence or migration actually needs.
#   inprogress        the same project stopped one step short of completion, for
#                     the questions that are about the cycle rather than its end.
#   template          the skeleton before any engine has touched it. The
#                     onboarding rows scaffold it themselves; that is their
#                     question.
#
# `expect` is the pre-registered guess, and it is itself under test. A run fills
# `observed`, and a human fills `classification` from this vocabulary:
#
#   match              observed matches expect
#   defect-fixed       the row found something that had to be repaired before the
#                      table could be believed, and the repaired run is what the
#                      row now records
#   expectation-wrong  the engine's behaviour is defensible; the row's guess was
#                      not. Correct the expectation, say so in the case doc.
#   designed           the difference is a deliberate 0.2 change, named in the
#                      case document's list before the fact
#   record             the row has nothing to be right or wrong about; it exists
#                      to write down what each engine says
#
# While `status: unlocked` a mismatch is a finding to classify, never a blocker.
# Once a human has classified every row, flip to `status: locked` — from then on
# a mismatch blocks the release, which is the whole point of writing the guesses
# down before looking.
#
# LOCKING is what makes that a machine fact rather than a promise. Each row
# carries a `lock:` map — one entry per `<step>-<arm>`, pinning the exit code, and
# where the substance is in the output rather than the exit, the literal strings
# that output must still contain and the byte count it must still have. While the
# file is locked the runner compares every pinned value against what it just saw
# and exits non-zero on the first difference. Prose in `observed` is for the
# reader; `lock:` is what actually blocks.
#
# A row may carry its own `status: unlocked` inside a locked file. That only ever
# loosens: the row is recorded, counted and reported, never enforced, so a batch
# still being read can sit beside pinned rows without either weakening the gate
# or blocking on guesses nobody has checked yet. The run prints how many remain.
#
# A pinned literal is matched against the artifact's own bytes, so a string that
# reaches the artifact inside a JSON payload is pinned in its escaped form —
# `schema_version\": 1`, not `"schema_version": 1`. That is deliberate: the pin
# names what is on disk, and nothing re-parses the artifact to make the guess
# look tidier.

# FIRST RUN, 2026-09-08. Every row ran. Eight rows measured nothing on that run
# — the fault was the harness in every case, not the engine: a mutation that
# stripped one comment style and left another, an arm whose shard bound no
# module, tool calls missing a required argument, a fixture with no feature in
# it, an L4 replay that signed one criterion of three and completed at the wrong
# point in the cycle, and a migration driven with two flags the verb does not
# define. Those are repaired, the rows re-ran, and each row now carries
# `expect_revised` saying whether its guess was corrected before or after the
# repaired run.
#
# LOCKED 2026-09-08, after the corrected table was read row by row and one row
# was added: L0-6b, the refusal case for the independence policy, which closes
# the gap L0-6 recorded. The lock preceded every COMPARISON cell; the one live
# session that ran before it was a single-arm instrumentation check of the driver
# and the scorer, and no row here reads a number from it.

status: locked
locked_at: "2026-09-08"
engines:
  b: "cladding@0.9.4 (registry) — prefix-B"
  c: "cladding 0.10.0 (packed from this checkout) — prefix-C"

rows:
  - id: L0-1
    title: A warn-severity finding does not block a non-strict gate
    fixture_family: done
    mode: auto
    mutations: [strip-module-header]
    question: >-
      With a completed feature whose module lost its header comment — a
      warn-level convention finding — does the pre-push tier still exit 0 without
      --strict, and does --strict still block?
    steps:
      - name: non-strict
        run: cli
        arms: [B, C]
        family: done
        args: ["check", "--tier=pre-push", "--json"]
      - name: strict
        run: cli
        arms: [B, C]
        family: done
        args: ["check", "--tier=pre-push", "--strict", "--json"]
    expect:
      # Corrected after the first run. Two harness faults made this row vacuous:
      # the mutation removed only a leading `//` line and left the module's JSDoc
      # block as the first non-empty line — which CONVENTION_DRIFT accepts as a
      # header just the same — and arm B's shard carried `modules: []`, so the
      # detector had no module to walk. Both are fixed; the guess below is
      # therefore about severity, which is what the row meant to ask.
      b: {non_strict_exit: 0, strict_exit: 1, finding: CONVENTION_DRIFT}
      c: {non_strict_exit: 1, strict_exit: 1, finding: CONVENTION_DRIFT}
      # The discriminating finding is CONVENTION_DRIFT by name, not "a warn" as a
      # class: the first run's C fixture carried a STALE_ATTESTATION warn on its
      # own and still exited 0 without --strict.
    expect_revised: "rewritten after the first run exposed a dead mutation, BEFORE the repaired run"
    observed: "B non-strict 0 / strict 1; C non-strict 1 / strict 1. CONVENTION_DRIFT:warn present in both arms (with STALE_ATTESTATION:warn alongside, since the mutation changes module bytes); an unmutated control on the same C fixture is non-strict exit 0 with no warn at all"
    classification: defect-fixed
    lock:
      non-strict-B: {exit: 0, contains: ["CONVENTION_DRIFT"]}
      non-strict-C: {exit: 1, contains: ["CONVENTION_DRIFT"]}
      strict-B: {exit: 1, contains: ["CONVENTION_DRIFT"]}
      strict-C: {exit: 1, contains: ["CONVENTION_DRIFT"]}

  - id: L0-2
    title: Where a covers token may sit inside a test title
    fixture_family: done
    mode: auto
    mutations: [covers-token-trailing]
    question: >-
      The completed C fixture binds its criteria with a token at the head of each
      test title. With the same token moved to the END of the title, does the
      binding still resolve?
    steps:
      - name: trailing-token
        run: cli
        arms: [C]
        family: done
        args: ["check", "--tier=pre-push", "--strict", "--json"]
    expect:
      b: {applicable: false, note: "0.1 binds through test_refs, not title tokens"}
      c: {strict_exit_nonzero: true, note: "a trailing token is not a binding — the criteria go unclaimed"}
    observed: "C strict exit 1: three MISSING_TESTS errors and three unbound criteria, each naming the leading-token form"
    classification: match
    lock:
      trailing-token-C: {exit: 1, contains: ["MISSING_TESTS", "[covers:"]}

  - id: L0-3
    title: clad_create_feature — a criterion with no statement, and test_refs on each schema
    fixture_family: per-version-init
    mode: auto
    question: >-
      (a) Does each engine refuse a criterion carrying no statement text?
      (b) What happens to a per-criterion `test_refs` argument on each schema —
      0.1 stores it, and 0.2 is expected to say so rather than drop it silently?
    recipe: >-
      Rewritten after the first run. The old row asked for a feature with no
      `statement` argument at all: both engines accepted it, because a feature
      with no criteria is legal, so the row tested nothing. It also sent
      `statement` and `test_refs` at the TOP level, which 0.2 rejects at the
      schema boundary before any wording is reached, and it ran both arms on the
      shared 0.1 workspace, where the newer engine writes a 0.1 shard and cannot
      show its own refusal. Each arm now runs on its own scaffold and sends the
      arguments its schema actually defines.
    steps:
      - name: no-statement-b
        run: mcp
        arms: [B]
        family: per-version-init
        calls:
          - {type: tool, name: clad_create_feature, args: {slug: "no-statement", title: "A feature whose criterion has no text", acceptance_criteria: [{ears: "ubiquitous"}]}}
      - name: no-statement-c
        run: mcp
        arms: [C]
        family: per-version-init
        calls:
          - {type: tool, name: clad_create_feature, args: {slug: "no-statement", title: "A feature whose criterion has no statement", purpose: "The row needs a criterion with nothing said in it.", capability_refs: [], acceptance_criteria: [{kind: "behavior"}]}}
      - name: with-test-refs-b
        run: mcp
        arms: [B]
        family: per-version-init
        calls:
          - {type: tool, name: clad_create_feature, args: {slug: "with-refs", title: "A feature carrying test refs", acceptance_criteria: [{ears: "ubiquitous", text: "The system shall record a test reference.", test_refs: ["tests/example.test.ts"]}]}}
      - name: with-test-refs-c
        run: mcp
        arms: [C]
        family: per-version-init
        calls:
          - {type: tool, name: clad_create_feature, args: {slug: "with-refs", title: "A feature carrying test refs", purpose: "The row needs a criterion that names its own test.", capability_refs: [], acceptance_criteria: [{kind: "behavior", statement: "The system shall record a test reference.", test_refs: ["tests/example.test.ts"]}]}}
      - name: list-features
        run: mcp
        arms: [B, C]
        family: per-version-init
        calls:
          - {type: tool, name: clad_list_features, args: {}}
    expect:
      b: {no_statement: "accepted — 0.1 has no required criterion text", test_refs: "stored on the criterion"}
      c: {no_statement: "refused", test_refs: "refused with INVALID_OPERATION naming the [covers: token as the 0.2 binding"}
    expect_revised: "rewritten after the first run exposed a call shape the schema never reached, BEFORE the repaired run"
    observed: "B accepted the empty criterion and its own gate reported AC_DRIFT error; C refused with INVALID_OPERATION 'Criterion 1 needs kind and a strict statement.'. B stored test_refs on the criterion; C refused with INVALID_OPERATION naming the [covers:F-…/AC-…] binding"
    classification: match
    lock:
      no-statement-b-B: {exit: 0, contains: ["AC_DRIFT"]}
      no-statement-c-C: {exit: 0, contains: ["INVALID_OPERATION", "needs kind and a strict statement"]}
      with-test-refs-b-B: {exit: 0, contains: ["AC_DRIFT"]}
      with-test-refs-c-C: {exit: 0, contains: ["INVALID_OPERATION", "[covers:"]}
      list-features-B: {exit: 0, contains: ["\\\"total\\\": 2"]}
      list-features-C: {exit: 0, contains: ["\\\"total\\\": 0"]}

  - id: L0-4
    title: clad_get_graph honours max_depth
    fixture_family: shared-0.1
    mode: auto
    question: >-
      Does a max_depth of 3 return a strict subset of the same query at 5 — and
      what does the candidate, whose documented ceiling is 3, do with a 5?
    recipe: >-
      Corrected after the first run: the calls named no `query`, and with the
      seed omitted both engines answer with corpus statistics, which no depth
      argument touches. That is why depth-3 and depth-5 came back byte-identical
      in both arms. The shared fixture now carries one feature, and the row seeds
      the traversal with it.
    steps:
      - name: depth-5
        run: mcp
        arms: [B, C]
        family: shared-0.1
        calls:
          - {type: tool, name: clad_get_graph, args: {query: "{shared_feature}", max_depth: 5}}
      - name: depth-3
        run: mcp
        arms: [B, C]
        family: shared-0.1
        calls:
          - {type: tool, name: clad_get_graph, args: {query: "{shared_feature}", max_depth: 3}}
    expect:
      b: {depth_3_subset_of_5: true, note: "0.9.4 advertises a ceiling of 6"}
      c: {depth_5: "refused or clamped — the advertised ceiling is 3", depth_3: "answered within the byte ceiling"}
    expect_revised: "rewritten after the first run exposed a missing seed argument, BEFORE the repaired run"
    observed: "C max_depth 5 → isError with kind: rejected, reason 'max_depth must be an integer between 1 and 3'; C max_depth 3 → a projection (2403B). B accepted both and returned the same graph either way, its ceiling being 6 on a two-node graph"
    classification: match
    lock:
      depth-5-B: {exit: 0}
      depth-5-C: {exit: 0, contains: ["max_depth must be an integer between 1 and 3"]}
      depth-3-B: {exit: 0}
      depth-3-C: {exit: 0}

  - id: L0-5
    title: The wording a completed feature reports
    fixture_family: done
    mode: auto
    question: >-
      What does each engine print when a feature completes — and does the newer
      wording still name the evidence rather than only the outcome? The text is
      captured verbatim while the fixture is built, so this row reads a record
      rather than re-running a completion.
    steps:
      - name: completion-output
        run: file
        arms: [B, C]
        family: done
        path: "{root}/sidetable/done/{arm}.done-output.txt"
    expect:
      b: {note: "records the released wording verbatim; no pass/fail"}
      c: {note: "records the 0.10.0 wording verbatim; no pass/fail"}
    # Confirmed as a record row after the first run: both files were captured, and
    # a record row has nothing to be right or wrong about.
    observed: "both arms captured their completion text (B 361B, C 431B)"
    classification: record
    lock:
      completion-output-B: {exit: 0, bytes: 361, contains: ["independence: self-certified"]}
      completion-output-C: {exit: 0, bytes: 431, contains: ["independence: not applicable"]}

  - id: L0-6
    title: independence_policy require — what the gate says about a self-signed cycle
    fixture_family: done
    mode: auto
    mutations: [require-independence]
    question: >-
      With the policy turned up to `require` on a completed L2 feature whose only
      author is also its only signer, what does the gate report about
      independence — and is that a pass?
    recipe: >-
      Redefined after the first run. The old row expected `require` to block a
      completed L2 cycle, and the candidate let it through. That is the designed
      relaxation, not a defect: at L2 the kernel labels independence
      `not-applicable`, because the profile asks for no human review at all, and
      0.2's `require` refuses only what is `self-certified` or unobserved (see
      the CHANGELOG's Changed entry). The refusal case therefore belongs to the
      L4 row, where a human receipt exists to be judged, and this row records
      what `require` means at L2.
    steps:
      - name: policy-require
        run: cli
        arms: [C]
        family: done
        args: ["check", "--tier=pre-push", "--strict", "--json"]
    expect:
      b: {applicable: false, note: "0.9.4 has no trust registry; `require` there refuses a legacy self-certified completion"}
      c: {independence: "not-applicable", strict_exit: 0, note: "designed relaxation — at L2 the profile asks for no human review"}
      companion: >-
        The refusal case is L0-6b, added before the table was locked: the same
        policy at L4, where a self-signed receipt is the thing `require` refuses.
        Read the two rows together — one says what the policy passes and why, the
        other says what it stops.
    expect_revised: "rewritten AFTER seeing the first run — the guess was wrong about a designed relaxation, not about an engine fault"
    observed: "C worst 0, independence not-applicable, achieved L2 — the completed cycle passes under require"
    classification: designed
    lock:
      policy-require-C: {exit: 0, contains: ["\"independence\": \"not-applicable\""]}

  - id: L0-6b
    title: independence_policy require — a self-signed L4 cycle is refused
    fixture_family: inprogress
    mode: auto
    mutations: [require-independence]
    question: >-
      At L4, where human receipts exist and the only issuer is also the only
      author, does `require` refuse the completion — and does the refusal say who
      to ask instead of only saying no?
    recipe: >-
      Added 2026-09-08, before any comparison cell ran — the only live session
      by then was the single-arm instrumentation check, which no row reads — to
      close the gap L0-6 recorded: `require` at L2 has nothing to refuse, so the L2 pass on its own
      could not tell a designed relaxation apart from a policy that never ran.
      This row replays L0-10's recipe on the same in-progress fixture with the
      policy turned up: every criterion audited and the feature UAT-signed by the
      committing author, then `clad done`. The script refuses to measure anything
      unless the mutation is visible in the workspace's own spec.yaml first.
    steps:
      - name: l4-require
        run: script
        script: row-l4-require.sh
        arms: [C]
        family: inprogress
    expect:
      b: {applicable: false, note: "assurance levels and the trust registry are a 0.2 surface — not run"}
      c:
        done_exit: 1
        remedy_named: "Ask a registered issuer other than the implementation authors for a verified review"
        note: "the receipts are self-certified, which is what `require` refuses"
    expect_revised: "written before the row first ran"
    observed: null
    classification: match
    lock:
      l4-require-C: {exit: 0, contains: ["Ask a registered issuer other than the implementation authors for a verified review", "refused as required: completion exit 1"]}

  - id: L0-7
    title: The retired standalone-runner verb
    fixture_family: shared-0.1
    mode: auto
    question: >-
      0.10.0 retired a verb 0.9.4 still carried. Does the newer engine fail
      cleanly on it rather than half-executing?
    steps:
      - name: retired-verb
        run: cli
        arms: [B, C]
        family: shared-0.1
        args: ["run", "--help"]
    expect:
      b: {exit: 0, note: "the verb still exists on the released engine"}
      c: {exit_nonzero: true, note: "unknown command, no partial execution"}
    # The first run recorded exit 0 in BOTH arms: 0.10.0 answers `run --help`
    # with its own help text rather than an unknown-command error. Kept as a
    # record row — what matters is that nothing half-executed, and the retirement
    # of the verb is visible in the help text itself.
    observed: "B exit 0 (831B); C exit 0 (6956B) — the candidate prints top-level help, not a partial run"
    classification: record
    lock:
      retired-verb-B: {exit: 0}
      retired-verb-C: {exit: 0}

  - id: L0-8
    title: A typed spec edit refuses stale input
    fixture_family: per-version-init
    mode: auto
    question: >-
      Does a typed edit whose declared input digest no longer matches the file
      get refused, rather than applied over someone else's change?
    steps:
      - name: stale-edit
        run: script
        script: row-stale-edit.sh
        arms: [C]
        family: per-version-init
    recipe: >-
      The first run never reached a tool: the row scanned `spec/features` in a
      freshly scaffolded workspace that holds no feature, and threw ENOENT. The
      script now creates the feature it edits, and sends the apply call in the
      shape the surface defines — `operations` plus the prepare's own
      `input_revisions` map — instead of a guessed `input_sha256` field.
    expect:
      b: {applicable: false, note: "typed edits are a 0.2 surface"}
      c: {refused_with: "STALE_INPUT"}
    observed: "C refused with STALE_INPUT: The feature:F-… input changed since it was read."
    classification: match
    lock:
      stale-edit-C: {exit: 0, contains: ["STALE_INPUT"]}

  - id: L0-9
    title: Vacuous green — a feature whose own tests are all skipped
    fixture_family: done
    mode: auto
    mutations: [vacuous-green]
    question: >-
      The module stays covered by a neighbouring test file while the feature's
      own tests are every one skipped. Does either engine still call that green?
    steps:
      - name: strict
        run: cli
        arms: [B, C]
        family: done
        args: ["check", "--tier=pre-push", "--strict", "--json"]
    expect:
      b: {strict_exit_nonzero: true}
      c: {strict_exit_nonzero: true}
    observed: "both arms strict exit 1, failing stage_1.3 and stage_2.1"
    classification: match
    lock:
      strict-B: {exit: 1}
      strict-C: {exit: 1}

  - id: L0-10
    title: An L4 cycle replays end to end
    fixture_family: inprogress
    mode: auto
    question: >-
      At L4, is a strict pre-push honestly unresolved before any human receipt
      exists — and green once every criterion is audited, the feature is
      UAT-signed, and the cycle completes?
    recipe: >-
      Rebuilt to follow the documented recipe after the first run stayed at exit
      1. Three faults, all in the harness: the row ran on a project already
      completed at L2 and raised the level afterwards, so completion never
      published an L4 row; it signed one criterion out of three; and it passed
      `--criterion` to the feature-scoped UAT claim, which refuses it. The
      fixture is now an in-progress project raised to L4 inside its cycle, and
      the row signs every criterion, signs UAT feature-wide, then completes.
      The fixture also carries the project-owned smoke, performance and visual
      runners an L4 profile calls: without them those three stages skip, and a
      skipped stage is an unobserved obligation the gate must refuse.
    steps:
      - name: l4-replay
        run: script
        script: row-l4.sh
        arms: [C]
        family: inprogress
    expect:
      b: {applicable: false}
      c: {unresolved_before_signing: true, done_exit: 0, green_after_completion: true, independence: "self-certified"}
      note: "needs `expect`; without it the row records not-run rather than guessing"
    expect_revised: "rewritten after the first run exposed three harness faults, BEFORE the repaired run"
    observed: "before signing exit 1; audit signed for all three criteria and UAT feature-wide; clad done exit 0 with Smoke/Performance/Visual and Audit/UAT all ✓, independence self-certified; strict pre-push after completion exit 0, achieved L4 of configured L4"
    classification: match
    lock:
      l4-replay-C: {exit: 0, contains: ["completion exit: 0", "strict pre-push AFTER completion: exit 0", "achieved L4 of configured L4"]}

  - id: L0-11
    title: Migrating a 0.1 project to 0.2, accepted and rejected
    fixture_family: done
    mode: auto
    question: >-
      Does the preview describe the same change the apply makes, does a rejected
      decision leave the workspace untouched, and is the accepted result
      strict-pre-push green? The input is the completed 0.1 project arm B built,
      so the migration has real content to migrate.
    steps:
      - name: migrate-both-ways
        run: script
        script: row-migrate.sh
        arms: [C]
        family: done
    recipe: >-
      Rebuilt after the first run measured nothing: it called `--preview` and
      `--decisions reject|accept`, none of which the verb defines, so every
      migrate call exited 1 with "unknown option" and the strict pre-push that
      followed ran on an unmigrated 0.1 tree — its exit 0 was about the old
      workspace, not about a migration. The real surface is a read-only
      `migrate --to 0.2 --json` preview, then `--apply --resolutions <file>`
      carrying the reviewed digest and one confirmation per required decision.
      Accept and reject are not whole-migration modes; the only two-valued
      decision is the legacy L2 baseline, which is what the two passes now vary.
      The "1 changed path" the first run reported was the fixture's own
      `node_modules` symlink, which the porcelain check now excludes.
    expect:
      b: {applicable: false, note: "the migration verb is a 0.2 surface"}
      c:
        preview_writes_nothing: true
        reject_applies: true
        reject_strict_exit: 1
        reject_reason: "the criteria migrate as unobserved/stale — rejecting the baseline is refusing to carry the historic completion evidence forward"
        accept_strict_exit: 0
        accept_reason: "the same criteria are satisfied through migration_baseline observations"
    designed_paths:
      reject: >-
        Red on C by design, and recorded as such in the case document rather than
        in G1's relaxation list: rejecting the legacy baseline writes no
        completion evidence (D14, "reject writes none"), so the migrated criteria
        arrive unobserved and the gate refuses them. It is not a reversal — B has
        nothing to say here — and not an R4 trigger, which is about the accept
        path.
    expect_revised: "rewritten twice: the shape BEFORE the repaired run, then the reject/accept split AFTER seeing what each decision does"
    observed: "the six paths each apply touches are all spec writes — spec.yaml, spec/architecture.yaml, spec/capabilities.yaml, the feature shard, a deleted spec/attestation.yaml, a new spec/generated/; preview exit 0 leaving 0 changed paths; reject applied (6 paths) and its strict pre-push exits 1 with every criterion unobserved/stale; accept applied (6 paths), spec.yaml declares schema 0.2, and its strict pre-push exits 0 with the criteria satisfied through migration_baseline"
    classification: match
    lock:
      migrate-both-ways-C: {exit: 0, contains: ["preview left 0 changed paths", "reject strict pre-push exit: 1", "accept strict pre-push exit: 0", "spec.yaml now declares schema 0.2"]}

  - id: L3-1
    title: A clean seed passes its own gate
    fixture_family: per-version-init
    mode: auto
    question: >-
      Does a freshly scaffolded workspace, synced, behave the same under both
      engines when nothing else has been done to it?
    recipe: >-
      The guess `check_exit: 0` was wrong for a reason that is not about
      cladding: an empty scaffold has no `src` or `tests` file, so `tsc --noEmit`
      fails with TS18003 ("no inputs were found") and the Type stage reports it.
      Both engines exit 1, identically, so the row is now a parity row — the
      answer that is actually available from a bare seed — rather than a
      green-seed claim neither engine can make.
    steps:
      - name: sync
        run: cli
        arms: [B, C]
        family: per-version-init
        args: ["sync"]
      - name: check
        run: cli
        arms: [B, C]
        family: per-version-init
        args: ["check", "--json"]
    expect:
      b: {sync_exit: 0, check_exit: 1, note: "TS18003 — an empty scaffold has no TypeScript inputs"}
      c: {sync_exit: 0, check_exit: "same as B", failed_stages: "same set as B"}
