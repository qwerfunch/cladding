# Cladding · Tier C — verification attestation. Legacy module rows retain byte compatibility;
# schema 0.1 feature rows need a GREEN strict pre-push gate; v3 replaces a schema 0.2 feature row only after an authoritative profile-complete GREEN result.
# Do not edit by hand.
#
#   policy:             verifier identity: Cladding version, strict blocking,
#                       and SHA-256 of the ordered detector catalog.
#   attested_modules:  one line per module file across all done features,
#                      value = sha256 of that file's bytes (16 hex). Editing a
#                      file moves exactly its own line — not every co-owning
#                      feature's — so parallel work rarely conflicts here.
#   attested_features: legacy constant `ok` markers for done features not
#                      replaced by a v3 row. STALE_ATTESTATION reads the v3
#                      closure seal first, otherwise this marker + modules.
#
# Merge conflict here? NEVER hand-resolve the hashes — keep either side and run
# `clad check --tier=pre-push --strict`; the GREEN gate rewrites the truth.
# Content-anchored: survives fresh clones and squash/rebase.
