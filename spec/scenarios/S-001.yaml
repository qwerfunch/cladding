id: S-001
title: User runs the L1 base-static suite on their project
flow: Developer installs cladding · invokes the six stage runners
  (type/lint/drift/commit/arch/secret) on their codebase · receives a one-line
  JSON StageResult per gate. cladding auto-resolves the project's toolchain so
  the same six commands work across 9 languages.
