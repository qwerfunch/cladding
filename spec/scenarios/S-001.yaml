id: S-001
title: User runs the L1 base-static suite on their project
actor: Developer
goal: Run Cladding's L1 base-static checks on the project through its detected
  toolchain.
success: Type, Lint, Drift, Commit, Architecture, and Secret each return a
  one-line JSON StageResult and the project receives all six results.
steps:
  - Install Cladding in the project.
  - Invoke the Type, Lint, Drift, Commit, Architecture, and Secret stage runners.
  - Allow Cladding to detect the project toolchain and delegate each supported
    check.
  - Review the one-line JSON StageResult returned by each stage.
