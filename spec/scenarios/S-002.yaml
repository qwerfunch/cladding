id: S-002
title: Author and validate a cladding spec.yaml
actor: Developer
goal: Author and validate the project's Cladding specification.
success: The specification passes validation and becomes available to downstream
  drift detection.
steps:
  - Write or update spec.yaml.
  - Run `clad sync` to validate the specification.
  - Review any point-by-point schema errors.
  - Correct reported errors and rerun `clad sync` until validation passes.
feature_refs:
  - F-010
