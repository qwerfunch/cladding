id: F-069
title: AnthropicSdkTransport — first real-LLM dispatch path (v0.3.0 substep 2)
status: done
modules:
  - src/adapters/sdk/anthropic.ts
  - src/adapters/index.ts
  - tests/adapters/anthropic.test.ts
  - tests/adapters/index.test.ts
  - package.json
depends_on:
  - F-049
  - F-068
capability_refs: []
acceptance_criteria:
  - id: AC-187
    statement: The system shall ship AnthropicTransport — the first real-LLM
      Transport implementation — and the claudeAnthropicAdapter that composes
      it.
  - id: AC-188
    statement: While the selector resolves mode=sdk + name=claude-anthropic, the
      system shall return the claudeAnthropicAdapter — not the generic-mcp
      fallback.
  - id: AC-189
    statement: If AnthropicTransport.invoke is called without an ANTHROPIC_API_KEY
      in the environment or constructor option, then the transport shall throw
      an Error naming the missing key rather than silently fall back.
    kind: behavior
  - id: AC-190
    statement: While AnthropicTransport.invoke runs with a valid API key, the
      transport shall forward persona.body as the system message, forward
      ctx.featureShard and guardrails as the user message, and surface the SDK
      text response in AgentResult.summary.
    kind: behavior
  - id: AC-191
    statement: The system shall instantiate the Anthropic SDK client lazily on first
      dispatch and reuse it for subsequent invocations.
