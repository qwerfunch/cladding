id: F-195cb59e
title: onboarding hands off to authoring the first feature spec, not straight to code
status: done
modules:
  - skills/init/SKILL.md
  - src/cli/clarify.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-f75cc3de
    statement: While reporting onboarding completion, the init host instruction
      shall state that the next step is to author the first feature
      specification before writing code and not tell the host that ordinary
      development can simply begin.
    kind: behavior
    notes: "Root cause of the ungoverned-code case: skills/init/SKILL.md said
      'report that ordinary development can begin', so the host read it as
      'write code now' and scaffolded a whole project with features: []. The
      handoff is where the feature cycle must be pointed at."
  - id: AC-3b2026e1
    statement: While the CLI reports onboarding complete, the CLI message shall tell
      the user to author the first feature specification before writing code so
      the spec-first cycle is triggered at handoff.
    kind: behavior
    notes: src/cli/clarify.ts final message previously ended at 'onboarding
      complete' with no next-step steer.
  - id: AC-d21ead41
    statement: While steering to the first feature specification, the onboarding
      message shall name its acceptance criteria as testable promises and the
      files it covers so author a spec is not vague about what to write.
    kind: behavior
    notes: "Closes the audit gap that no user-facing string bundled 'what it must do
      (acceptance criteria) + which files it covers'. Plain language: no
      'shard', no MCP tool name."
