id: F-65814a
title: sentinel-miss telemetry surfaces LLM fallbacks in events.log (v0.3.39)
status: done
modules:
  - src/events/log.ts
  - src/cli/scan/llm.ts
  - src/cli/init.ts
depends_on:
  - F-d3bde4
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: The system shall add a sentinel_miss EventType plus a standard
      payload schema so every LLM dispatcher fallback is captured as a
      structured event in .cladding/events.log.jsonl.
  - id: AC-002
    statement: The system shall track which labelled sentinels the LLM left blank in
      the parsed reply so the outer fallback wrapper can distinguish
      per_artifact misses from total misses.
  - id: AC-003
    statement: While the dispatcher throws or the LLM reply leaves CONVENTIONS_MD or
      ARCHITECTURE_YAML blank, the system shall emit a sentinel_miss event with
      fallback "total" and collapse to deterministicInterpret.
  - id: AC-004
    statement: While CONVENTIONS_MD and ARCHITECTURE_YAML parse but a non-critical
      sentinel returns blank, the system shall emit a sentinel_miss event with
      fallback "per_artifact" and keep the LLM-refined critical sections.
  - id: AC-005
    statement: The system shall extend renderProjectContextMdWithLlm with the same
      telemetry hook so project-context misses are visible alongside
      scan-artifact misses.
  - id: AC-006
    statement: The system shall thread the workspace cwd from runInit into both
      refinement helpers so production calls always reach the telemetry sink
      while unit tests stay silent when no cwd is supplied.
    evidence_refs:
      - src/cli/init.ts
