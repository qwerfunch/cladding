id: F-031
title: Spec sharding — multi-file SSoT support (T2c)
status: done
modules:
  - src/spec/load.ts
  - tests/spec/load.test.ts
depends_on:
  - F-010
capability_refs: []
acceptance_criteria:
  - id: AC-045
    statement: Where spec.yaml's features field is empty or missing and a
      spec/features/ directory exists, the loader shall load each *.yaml file
      under that directory as one feature and merge the results into the spec
      object.
  - id: AC-046
    statement: When spec.yaml carries inline features and a spec/features/ directory
      also exists, the loader shall use the inline values and ignore the
      directory to preserve compatibility with unsharded specifications.
    kind: behavior
  - id: AC-047
    statement: Where spec/architecture.yaml exists and the master spec has no inline
      architecture, the loader shall load that file as the spec's architecture.
    evidence_refs:
      - fixture:F-031_AC-047
