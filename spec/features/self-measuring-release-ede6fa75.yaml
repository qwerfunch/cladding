id: F-ede6fa75
title: clad changelog --measure embeds the release's own reproducible numbers,
  refusing anything it cannot reproduce at HEAD
status: done
modules:
  - src/changelog/render.ts
  - src/optimizer/measure-ledger.ts
  - src/cli/changelog.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-713458d9
    statement: When a snapshot matches current HEAD, the system shall render a
      Measured block from that snapshot including the head, spec_digest, and the
      exact reproduce command (git checkout <head> && clad measure).
    notes: "WHY: a release note that carries its own re-derivable measurement cannot
      go stale the way the README 4× claim did."
  - id: AC-36b1df91
    statement: If no snapshot matches HEAD, then the system shall render a
      not-measured-at-this-commit notice without substituting older snapshot
      numbers.
    kind: behavior
    notes: "WHY: nearest-older substitution is exactly the stale-claim failure mode."
  - id: AC-38b63d18
    statement: The Measured block shall always carry the deterministic-upper-bound
      attribution disclaimer verbatim (the MEASUREMENT_DISCLAIMER constant),
      never a headline number without its honest qualifier.
    notes: "WHY: the 4× headline was reclassified as cap arithmetic — the qualifier
      is load-bearing, tested as literal string."
  - id: AC-a7e810b1
    statement: Where both endpoints are measured, the system shall append a
      release-over-release delta line for median slice tokens, median structural
      ratio, and median coverage.
    notes: "WHY: trend at release granularity, reusing F-39609db4 math."
  - id: AC-8969e2af
    statement: If the ledger is unreadable, then the changelog shall render fully
      with the not-measured notice and carry measured as a snapshot object or
      null with a reason in JSON.
    kind: behavior
    notes: "WHY: measurement embellishes the release note, never breaks it; JSON
      consumers need explicit absence."
