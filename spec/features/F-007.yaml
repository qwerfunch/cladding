id: F-007
title: stage_1.4 Commit — clean-tree check
status: done
modules:
  - stages/commit.ts
acceptance_criteria:
  - id: AC-010
    ears: ubiquitous
    action: invoke `git status --porcelain` and pass iff the output is empty
    response: returns a stage_1.4 StageResult
    text: The system shall invoke `git status --porcelain` and pass stage_1.4 iff
      the working tree and index are both clean.
    test_refs:
      - self-dogfood:stage:commit-postcommit
  - id: AC-011
    ears: unwanted
    condition: if git is not available or the directory is not a repo
    action: return pass=false with exitCode 2
    response: the stage is treated as skipped, not a false failure
    text: If git is unavailable or the cwd is not a git repository, the system shall
      return exitCode 2 so the stage is treated as skipped.
