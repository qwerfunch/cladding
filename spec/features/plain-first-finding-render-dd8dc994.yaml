acceptance_criteria:
  - id: AC-746969b3
    statement: The Soft Shell catalog shall give every detector exactly one clear
      plain-English lead and optional user action, enforce completeness against
      the live detector registry, allow CLI commands in actions, and exclude MCP
      tool names.
    kind: behavior
    notes: >-
      ## Why

      Adopters meet raw DETECTOR_ID + mechanism text in the host UI. The Soft
      Shell layer is the declared human-render boundary and the glossary already
      carries per-detector plain glosses — this wires the two loudest emitters
      through the boundary they were bypassing.


      ## 2026-07-06 pivot (F-9af291fa)

      The catalog carries exactly one clear English string per detector; the
      host agent renders the user's language via the interpreter instruction.
      cladding no longer ships or resolves a locale — the reviewed English leads
      are the single translation source.
  - id: AC-263adf79
    statement: When the four human render sites emit a finding, the renderer shall
      place the plain lead first with the machine detail following as a tail.
    kind: behavior
  - id: AC-25f77cec
    statement: The machine finding-tail renderer shall render machine finding tails
      from detector and normalized-path values only, with no locale resolver,
      locale type, user-locale sidecar, or project.locale field in the compiled
      product closure.
    notes: >-
      ## Why

      The 2026-07-06 pivot (F-9af291fa) removed the multi-locale catalog and the
      locale-resolution chain. cladding ships one clear English source; the host
      agent, directed by the interpreter instruction, renders the user's own
      language by meaning.


      ## Non-normative history (2026-08-31)


      Replaced absence-only prose with a deterministic source-universe adapter.
      `String.localeCompare` remains an allowed unrelated API.
  - id: AC-ad2a34e1
    statement: When human-first rendering is available, the system shall preserve
      the declared raw machine schema of CLI JSON findings.
    notes: >-
      ## 2026-08-31 criterion decomposition


      Original compound text (verbatim): If a machine contract drifts, existing
      tests shall catch it — JSON, MCP, SARIF, events, and the dedup fingerprint
      stay byte-compatible.


      Reason: split CLI JSON, MCP, SARIF, and lifecycle/fingerprint
      compatibility into independently observable contracts while retaining this
      legacy address.
  - id: AC-1b03c358
    statement: When human-first rendering is available, the system shall preserve
      the declared raw machine schema of MCP finding projections.
  - id: AC-59a9d9ee
    statement: When human-first rendering is available, the system shall preserve
      the standard raw machine schema of SARIF finding projections.
  - id: AC-0eee6e0a
    statement: When human-first rendering is available, the system shall preserve
      lifecycle-event fields and stop-block fingerprint inputs.
