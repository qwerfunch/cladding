id: F-3788c2
title: PLANNED_BACKLOG detector — enforced floor for the per-feature cadence (v0.4.x)
status: done
modules:
  - src/stages/detectors/planned-backlog.ts
  - src/stages/detectors/index.ts
depends_on:
  - F-3b3690
capability_refs:
  - drift-detection
acceptance_criteria:
  - id: AC-001
    statement: When more than DEFAULT_MAX_PLANNED_AHEAD planned or in_progress
      features have no implemented module on disk, the system shall raise a
      PLANNED_BACKLOG finding that the spec has raced ahead of the code.
  - id: AC-002
    statement: The system shall classify the backlog finding as warn-severity, so it
      is advisory by default and blocking only under --strict.
  - id: AC-003
    statement: If a planned or in_progress feature has at least one existing module
      on disk, then the system shall not count it toward the planned backlog.
