id: F-c2c996
title: Iron Law backbone Phase 1 — feature_checkpoint / feature_rolled_back
  events + clad checkpoint / rollback (v0.3.20)
status: done
modules:
  - src/core/checkpoint.ts
  - src/events/log.ts
  - src/cli/clad.ts
depends_on:
  - F-b99577
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: The system shall extend the EventType union with feature_checkpoint
      and feature_rolled_back so the lifecycle of an Iron Law Phase 1 rollback
      (ironclad-design 02-iron-law §2.5) lives in the same events.log.jsonl
      stream as the other 6 lifecycle transitions.
  - id: AC-002
    statement: The system shall record a feature_checkpoint event with git HEAD plus
      spec digest plus timestamp so the maintainer can later identify the
      precise working-tree state to restore without depending on git reflog
      alone.
  - id: AC-003
    statement: The system shall read the latest checkpoint for a feature by walking
      events.log in reverse so historical checkpoints stay accessible in the raw
      audit-log while the common case (most recent) is one tail scan.
  - id: AC-004
    statement: The system shall record a feature_rolled_back event referencing the
      target checkpoint so the rollback transition is auditable and the lineage
      from checkpoint to rollback survives across sessions.
  - id: AC-005
    statement: When checkpoint records a lifecycle boundary, the system shall append
      exactly one feature_checkpoint event without modifying tracked source or
      specification content.
    notes: >-
      ## 2026-08-31 criterion decomposition


      Original compound text (verbatim): The system shall expose clad checkpoint
      and clad rollback CLI subcommands so a maintainer (or a later
      auto-rollback driver) has an entry point to the event surface without
      touching the working tree — cladding records the transition and prints the
      git command, but the actual checkout stays with the maintainer because
      branch policy varies.


      Reason: split checkpoint, successful rollback, failed rollback, and
      no-working-tree-mutation observables while retaining this legacy address.
  - id: AC-e4bf75ed
    statement: When rollback has a prior checkpoint and a reason, the system shall
      append exactly one feature_rolled_back event and print a maintainer-owned
      Git or manual restore instruction.
  - id: AC-804e61b1
    statement: If rollback has no prior checkpoint, then the system shall fail
      without appending a feature_rolled_back event.
  - id: AC-a06e5151
    statement: The checkpoint and rollback commands shall never invoke checkout.
