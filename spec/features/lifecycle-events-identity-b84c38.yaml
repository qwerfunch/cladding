id: F-b84c38
title: "Lifecycle events with identity: feature_created / done_attempted /
  gate_run land in the ledger"
status: done
modules:
  - src/events/log.ts
  - src/spec/new.ts
  - src/cli/done.ts
  - src/cli/clad.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-88923c
    statement: When createFeature or createScenario writes a shard, the system shall
      append a feature_created / scenario_created event carrying the new id,
      slug, and actor identity (git author when resolvable, else OS user), so
      spec authorship is reconstructable from the ledger.
    notes: >-
      ## Why

      Today only scan/checkpoint/the deprecated loop emit events — the supported
      per-feature cadence leaves no trace, so neither engagement measurement
      (0.6 bench) nor staleness detection (attestation) has a data source.
      Identity reuses the hitl Identity shape; 23 hand-flipped dones proved why
      the ledger must say WHO.
  - id: AC-ac4a10
    statement: When runDone attempts a status flip, the system shall append a
      done_attempted event recording feature id, gate outcome, kept-or-reverted,
      git HEAD, and identity, so every done transition is forensic data.
  - id: AC-49da41
    statement: When runCheckStages completes a tier run, the system shall append a
      gate_run event with tier, strict, worst, anyFailed, git HEAD, identity,
      and compact blocker evidence, deduplicating when the outcome and blocker
      evidence are identical to the latest gate_run, so verification freshness
      gains a data source without hiding changed blockers or growing on exact
      repeats.
  - id: AC-346653
    statement: If the events log exceeds the rotation threshold (default 5 MB), then
      the system shall roll it to events.log.1.jsonl before appending
      (single-generation roll, newest kept live), so unbounded append-only
      growth cannot make every doctor/read O(entire history).
    kind: quality
  - id: AC-24c5f2
    statement: The system shall keep event appends non-throwing and best effort so
      identity-resolution, log-stat, or write failures never break the calling
      command and the ledger observes the harness rather than becoming a new
      failure mode.
    kind: behavior
    notes: >-
      ## Decision

      error-as-data: append failures degrade silently (the command outcome is
      unchanged). ## Trade-off

      A lost event is acceptable; a gate broken by its own telemetry is not.
