acceptance_criteria:
  - id: AC-001
    ears: ubiquitous
    action: split the monolithic scan.ts plus scan-roots.ts plus scan-llm.ts into src/cli/scan/ submodules with a single public entry
    response: 'src/cli/scan/index.ts owns scanRoot orchestrator and re-exports every public type and helper; cli/scan/ now holds types.ts (12 type definitions), thresholds.ts (8 tunable constants), walker.ts (BFS walk + entrypoint priority + per-dir soft cap), roots.ts (manifest plus heuristic source-root inference), conventions.ts (14 deterministic detectors), architecture.ts (layerOf + groupByLayer + extractArchitecture + forbidden-import candidates), examples.ts (representative module picker), stats.ts (language counts plus dominant language), scenarios.ts (legacy stub proposer), llm.ts (buildPrompt plus parseLlmResponse plus deterministicInterpret plus interpretWithLlm), and helpers.ts (isJsLike shared predicate); the three legacy files at src/cli/scan.ts / scan-roots.ts / scan-llm.ts are deleted'
    text: The system shall split the monolithic scan.ts plus scan-roots.ts plus scan-llm.ts into src/cli/scan/ submodules with a single public entry so each responsibility lives in its own file and a future analyzer drop-in is a one-file change instead of a 600+ line patch.
    test_refs: [tests/cli/scan.test.ts]
  - id: AC-002
    ears: ubiquitous
    action: expose every magic number plus name set through src/cli/scan/thresholds.ts so external adopters tune through ScanOptions
    response: 'src/cli/scan/thresholds.ts exports DEFAULT_MAX_FILES, PER_DIR_SOFT_CAP, ROOT_PROMOTION_THRESHOLD, DEFAULT_EXTENSIONS, DEFAULT_IGNORE, LAYER_BLACKLIST, ENTRYPOINT_NAMES, EXT_TO_LANGUAGE; ScanOptions extends with optional layerBlacklist, entrypoints, perDirCap, rootPromotionThreshold so a large monorepo can raise the per-dir cap or a custom project can replace the entrypoint set without touching scan source'
    text: The system shall expose every magic number plus name set through src/cli/scan/thresholds.ts so external adopters tune through ScanOptions instead of patching cladding.
    evidence_refs: [src/cli/scan/thresholds.ts, src/cli/scan/types.ts]
  - id: AC-003
    ears: ubiquitous
    action: keep behaviour byte-identical across the refactor
    response: '713/713 tests pass unchanged; clad sync reports 102 features valid; clad check --strict drift-green; cladding self-scan + cobra/react/Signal-Android/django/rails rescan produce identical layer/scenario counts to the v0.3.28 baseline; the refactor is a pure structure change with no logic touch'
    text: The system shall keep behaviour byte-identical across the refactor so the v0.3.28 audit baseline holds and downstream consumers (init.ts, tests, scan-llm) read the same data shapes through new paths.
    test_refs: [tests/cli/scan.test.ts, tests/cli/scan-roots.test.ts, tests/cli/scan-llm.test.ts, tests/cli/clad.test.ts]
  - id: AC-004
    ears: ubiquitous
    action: centralise types in src/cli/scan/types.ts so every analyzer module reads the same shape
    response: 'src/cli/scan/types.ts defines ScanOptions, Conventions, Layer, ImportEdge, ArchitectureScan, ScenarioStub, ExampleQuote, ScanResult, ScanStats, SourceFile and re-exports SourceRoot from roots.js; the 9 analyzer modules import types from this single source so adding a Conventions field touches one file then surfaces everywhere automatically'
    text: The system shall centralise types in src/cli/scan/types.ts so every analyzer module reads the same shape and adding a new Conventions field touches one file.
    evidence_refs: [src/cli/scan/types.ts]
  - id: AC-005
    ears: ubiquitous
    action: thread thresholds + blacklist + entrypoints overrides through walker and architecture so ScanOptions wins over defaults
    response: 'src/cli/scan/walker.ts walk accepts maxFiles, perDirCap, entrypoints, ignore, extensions all as optional overrides; src/cli/scan/architecture.ts groupByLayer accepts layerBlacklist and rootPromotionThreshold overrides; the index.ts orchestrator forwards opts straight through so a caller setting perDirCap to 100 sees the walker honour 100 on a fresh ScanResult'
    text: The system shall thread thresholds plus blacklist plus entrypoints overrides through walker and architecture so ScanOptions wins over defaults — a maintainer with a large monorepo can raise per-dir cap to 100 without forking scan internals.
    evidence_refs: [src/cli/scan/walker.ts, src/cli/scan/architecture.ts, src/cli/scan/index.ts]
