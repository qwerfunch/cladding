acceptance_criteria:
  - id: AC-001
    statement: The scan public entry shall compose its documented scan submodules
      without retaining a second legacy scan implementation authority.
    notes: >
      ## Historical note

      The monolith/file-length/future-patch prediction was a completed refactor
      record, not a permanent product promise.
  - id: AC-002
    statement: The system shall expose every magic number plus name set through
      src/cli/scan/thresholds.ts so external adopters tune through ScanOptions
      instead of patching cladding.
    evidence_refs:
      - src/cli/scan/thresholds.ts
      - src/cli/scan/types.ts
  - id: AC-003
    statement: The scan public entry shall compose typed conventions, architecture,
      scenarios, examples, stats, and project context fields from the
      corresponding scan analyzers, with architecture retaining derived
      forbidden-import candidates.
    notes: >
      ## Historical note (2026-05-20, v0.3.29, source commit 5826349)

      The completed refactor report recorded 713/713 passing tests, 102 valid
      features,

      strict green status, and five-project count parity for cobra, react,

      Signal-Android, django, and rails against the v0.3.28 baseline. It also

      recorded cladding self-scan and a byte-identical/pure-no-logic-touch
      claim.

      Those observations are historical evidence, not continuing product
      invariants.
  - id: AC-004
    statement: The system shall centralise types in src/cli/scan/types.ts so every
      analyzer module reads the same shape and adding a new Conventions field
      touches one file.
    evidence_refs:
      - src/cli/scan/types.ts
  - id: AC-005
    statement: The system shall thread thresholds plus blacklist plus entrypoints
      overrides through walker and architecture so ScanOptions wins over
      defaults — a maintainer with a large monorepo can raise per-dir cap to 100
      without forking scan internals.
    evidence_refs:
      - src/cli/scan/walker.ts
      - src/cli/scan/architecture.ts
      - src/cli/scan/index.ts
