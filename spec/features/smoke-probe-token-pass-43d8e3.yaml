id: F-43d8e3
title: Functional smoke probe — AC-token flips liveness to pass
status: done
modules:
  - src/spec/types.ts
  - src/spec/schema.json
  - src/stages/deliverable-smoke.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-0e2aa7
    statement: The spec schema shall accept project.smoke as an array of probes,
      each with kind (cli|none) and optional run, expect{ac,exit,token}, binds,
      and why.
  - id: AC-46afdd
    statement: When a cli smoke probe exits as expected and its stdout contains the
      declared expect.token, the smoke stage shall report disposition 'pass'
      (green) — the AC-token upgrade of an otherwise exit-only liveness.
  - id: AC-dc287f
    statement: When a CLI smoke probe exits as expected with no declared token, the
      smoke stage shall report liveness, report a blocking fail when a declared
      token is absent from stdout, and report NA for a kind:none probe.
    kind: behavior
