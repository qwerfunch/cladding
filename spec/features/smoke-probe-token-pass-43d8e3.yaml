acceptance_criteria:
  - id: AC-0e2aa7
    ears: ubiquitous
    text: "The spec schema shall accept project.smoke as an array of probes, each with kind (cli|none) and optional run, expect{ac,exit,token}, binds, and why."
    test_refs: ["tests/stages/deliverable-smoke.test.ts"]
  - id: AC-46afdd
    ears: event
    condition: "when a cli smoke probe exits as expected and its stdout contains expect.token"
    text: "When a cli smoke probe exits as expected and its stdout contains the declared expect.token, the smoke stage shall report disposition 'pass' (green) — the AC-token upgrade of an otherwise exit-only liveness."
    test_refs: ["tests/stages/deliverable-smoke.test.ts"]
  - id: AC-dc287f
    ears: event
    condition: "when a cli smoke probe exits as expected with no declared token"
    text: "When a cli smoke probe exits as expected with no declared token the stage shall report liveness; when the declared token is absent from stdout it shall report a blocking fail; a kind:none probe shall report na."
    test_refs: ["tests/stages/deliverable-smoke.test.ts"]
