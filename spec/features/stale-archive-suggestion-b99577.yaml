capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: The system shall allow a DriftFinding to carry an optional typed
      remediation suggestion while preserving the severity and message semantics
      of an omitted suggestion.
    kind: behavior
    notes: >
      ## Historical note

      The fixed detector count is historical; optional suggestion compatibility
      is the current contract.
  - id: AC-002
    statement: The system shall emit propose-archive suggestions from
      STALE_SPECIFICATION for the three branches whose remediation is
      unambiguous so clad sync --propose-archive can walk them, while the
      project-owned removal-cadence branch (archived feature with surviving
      modules) stays unsuggested.
  - id: AC-003
    statement: The system shall add a --propose-archive flag on clad sync that lists
      Tier 2 candidates so a maintainer (or the Librarian agent) can review
      proposals without the CLI making spec changes autonomously.
  - id: AC-004
    statement: The system shall filter out findings without a propose-archive
      suggestion from --propose-archive output so legacy warn-only findings stay
      in the regular drift report and do not pollute the Tier 2 workflow.
  - id: AC-005
    statement: The canonical planner persona shall state the current design-impact
      responsibility and human-resolution boundary, with generated mirrors
      reproducing that source.
    notes: |
      ## Historical schema-0.1 note
      The Librarian Tier 2 wording is historical, not current planner authority.
