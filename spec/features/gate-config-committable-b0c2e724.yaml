id: F-b0c2e724
title: "Gate config survives a fresh clone: committable .cladding/config.yaml"
status: done
modules:
  - src/init/gitignore-policy.ts
  - src/cli/init.ts
  - src/cli/doctor.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-2e9c61f8
    statement: When clad init writes the cladding ignore entry, the system shall
      write `.cladding/*` and `!.cladding/config.yaml` so the gate config file
      is committable while runtime state stays ignored.
    notes: |
      ## Why
      Measured live: the strict gate is CI's reason to exist, yet the one file
      that tunes it was unignorable-in-reverse — `.cladding/` (directory form)
      blocks `!.cladding/config.yaml` re-inclusion entirely, so every documented
      gate.commands recommendation produced local-only configuration. Found by a
      live host run during the gate.language E2E and verified with
      git check-ignore.
  - id: AC-6a58f0d1
    statement: If a cladding ignore entry already exists in any recognized form,
      then the system shall not modify .gitignore.
    kind: behavior
  - id: AC-d47b93c5
    statement: When the root .gitignore blocks the gate config from being committed,
      the clad doctor shall report it in text and JSON and still exit zero.
    kind: behavior
  - id: AC-f30a7c62
    statement: The system shall expose pure functions that render the managed ignore
      entry and classify a .gitignore text as commitable, blocked, or absent for
      the gate config.
design_impact:
  classification: none
  rationale: Changes one scaffold line, adds a read-only doctor diagnosis; no gate
    policy, architecture, or capability change.
  status: resolved
  artifacts: []
