id: F-ef93141b
title: Specialist personas are selectable role briefs, not mandated agents
status: done
modules:
  - src/agents/planner.md
  - src/agents/developer.md
  - src/agents/reviewer.md
  - src/agents/observability.md
  - src/agents/blind-author.md
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-163773ad
    statement: The system shall present each planner, developer, reviewer,
      observability, and blind-author persona as a selectable role brief with
      scope, outcome conditions, and evidence obligations that a host may embody
      through any agent shape rather than an agent cladding mandates spawning.
    kind: behavior
  - id: AC-46fef26f
    statement: The system shall keep persona briefs free of removed
      choreography-layer references including numbered invocation principles and
      the intent-routing table so no brief dangles against the orchestrator
      contract card.
    kind: constraint
    rationale: Prevents obsolete orchestration claims from remaining in role briefs.
  - id: AC-4f568698
    statement: The diet shall preserve every pinned persona invariant — file names,
      Soft Shell sections, size budgets, and glossary coverage — so downstream
      hosts and mirrors keep loading the same roles.
design_impact:
  classification: none
  rationale: Prose-layer reframing of the specialist personas to match the
    role-contract architecture (host owns execution form; cladding declares
    conditions and judges evidence). No engine code, file renames, or capability
    changes; mirrors regenerate from the same sources.
  status: resolved
  artifacts: []
