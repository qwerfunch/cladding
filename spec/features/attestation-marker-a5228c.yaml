id: F-a5228c
title: "Committed content-anchored attestation: GREEN strict verification stamps
  module tree-hashes; STALE_ATTESTATION catches unverified change"
status: done
modules:
  - src/spec/attestation.ts
  - src/stages/detectors/stale-attestation.ts
  - src/stages/detectors/index.ts
  - src/cli/clad.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-e93858
    statement: When a strict pre-push/all run ends GREEN (or RED solely from
      STALE_ATTESTATION with all verification stages passing), the system shall
      write spec/attestation.yaml mapping done features to module tree-hashes
      and count the solely-stale run GREEN.
    notes: >-
      ## Why

      The first design keyed staleness off the gitignored local events ledger —
      undefined on fresh clones/CI and squash-broken (review blockers E1+T3).
      Content anchoring (committed hashes of the modules themselves) is
      clone-portable and history-rewrite-immune.

      ## Decision

      The solely-stale exemption kills the deadlock: a stale warning blocking
      the very gate that re-verifies would make re-attestation impossible; in
      the cheap pre-commit tier (no tests run) staleness keeps blocking under
      strict — exactly 'you changed verified code, run the full gate'.
  - id: AC-4d16d1
    statement: If a done feature's module tree-hash disagrees with its attestation
      entry (or its entry is missing while the file exists), then the detector
      shall warn naming the feature, blocking under strict in tiers that cannot
      re-attest.
    kind: behavior
  - id: AC-b3fe0c
    statement: While spec/attestation.yaml is absent, the detector shall emit one
      info finding naming the attestation path and never a blanket RED, so
      upgrades and adoptions are not retro-failed.
