id: F-074
title: McpSamplingTransport + live audit notification (v0.2.25, v0.3.0 Phase B)
status: done
modules:
  - src/adapters/host/transport.ts
  - src/hitl/audit.ts
  - src/serve/server.ts
depends_on:
  - F-049
  - F-068
  - F-069
  - F-073
capability_refs: []
acceptance_criteria:
  - id: AC-211
    statement: The system shall add a McpSamplingTransport implementation of the
      Transport interface that delegates the LLM call to the connected MCP
      client through the SDK's createMessage sampling request, returning the
      client's reply as an AgentResult.
  - id: AC-212
    statement: While the MCP client returns a text reply to createMessage, the
      system shall map the reply to an AgentResult with identity.author='llm', a
      host-tagged identity.name, a 200-char-truncated summary, an empty
      mutations list (v0.2.25 scope), and notes carrying model + stopReason.
  - id: AC-213
    statement: The audit module shall expose a subscribeAudit(handler) observer hook
      in src/hitl/audit.ts that fires after a successful appendEvidence write,
      returns a dispose callback, and swallows handler exceptions so a
      misbehaving observer cannot corrupt the audit chain.
    kind: behavior
  - id: AC-214
    statement: While the MCP server is built via buildServer(cwd) and a new evidence
      entry is appended to that cwd's audit log, the system shall emit a
      notifications/resources/updated notification for cladding://audit so a
      subscribed client can refresh its cached view.
  - id: AC-215
    statement: If new evidence is appended for a cwd other than the server project
      root, then the server shall not emit a resources/updated notification for
      that server so multiple cladding processes coexist without cross-talk.
    kind: behavior
  - id: AC-216
    statement: While a connected MCP client subscribes to cladding://audit and
      receives a resources/updated notification and rereads the resource, the
      server shall surface the new evidence entry in returned content as the
      end-to-end live-tail contract.
    kind: behavior
