acceptance_criteria:
  - id: AC-2c2d29
    statement: "When PreToolUse sees an edit that introduces status: done into spec
      or a hand-authored F-NNN shard filename, the hook shall block it by naming
      the sanctioned path while allowing all other specification maintenance."
    kind: behavior
  - id: AC-973837
    statement: When Stop fires (stop_hook_active false), the hook shall run the
      deterministic trio; fresh failure fingerprints block with top findings + a
      stop_blocked event; an identical fingerprint demotes to allow.
    notes: >-
      ## Decision

      Fingerprint-keyed demotion (not per-session counting) — the review showed
      attempt-count demotion is itself a vacuous-green vector; identical-failure
      demotion is state-keyed and the SessionStart card resurfaces it.
      Toolchain-heavy stages never run here (pre-commit trio only), so the
      toolchain-missing exemption is structural.
  - id: AC-29e900
    statement: When SessionStart or a classifiable UserPromptSubmit fires, the hook
      shall print the context card / one-line routing suggestion, injected
      mechanically rather than prompt-advisorily.
  - id: AC-03da31
    statement: The plugin shall ship hooks/hooks.json wiring all five events to the
      bundled engine via node ${CLAUDE_PLUGIN_ROOT}/dist/clad.js hook <event>,
      validated in the test suite against the expected hook-config shape, so the
      wiring itself cannot drift silently.
    notes: >-
      ## Trade-off

      Claude-Code-first asymmetry is accepted and documented: Gemini/Codex have
      no lifecycle hooks — their structural channel is the MCP gate footer
      (F-570a3f).
