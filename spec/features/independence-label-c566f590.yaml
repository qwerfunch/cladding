id: F-c566f590
slug: independence-label
title: "clad done/verdict carry an evidence-based independence label"
status: done
modules:
  - src/hitl/independence.ts
  - src/cli/done.ts
  - src/cli/verdict.ts
  - src/verdict/verdict.ts
  - src/cli/clad.ts
  - src/spec/types.ts
acceptance_criteria:
  - id: AC-e216b03f
    ears: ubiquitous
    response: "computeIndependence(featureId, evidence) → {label: 'independent' | 'self-certified', basis}"
    text: "computeIndependence shall label a feature 'independent' when at least one of its evidence entries is human-authored or blind-authored (blind: true), and 'self-certified' otherwise — including when the feature has no evidence at all."
    test_refs: ["tests/hitl/independence.test.ts"]
  - id: AC-d5210389
    ears: event
    condition: "when clad done runs"
    action: "the DoneResult and the recorded done_attempted event shall carry the feature's computed independence label"
    response: "DoneResult.independence + done_attempted payload.independence"
    text: "When clad done runs, the DoneResult and the recorded done_attempted event shall carry the feature's computed independence label."
    test_refs: ["tests/cli/done-independence.test.ts"]
  - id: AC-6f228987
    ears: ubiquitous
    response: "clad verdict --json includes independence[] for done features; computeVerdict stays IO-free"
    text: "clad verdict shall include per-done-feature independence labels in its --json output, computed in the CLI wrapper from the evidence ledger; the pure reducer computeVerdict shall remain IO-free."
    test_refs: ["tests/cli/verdict-independence.test.ts"]
  - id: AC-ad5ea48b
    ears: state
    condition: "while project.independence_policy is 'require'"
    action: "clad done shall refuse to keep a self-certified feature done, reverting the spec entry and asking for independent or human review"
    response: "runDone refuses (ok: false, shard reverted) under independence_policy: require + self-certified"
    text: "While project.independence_policy is 'require', clad done shall refuse to keep a self-certified feature done — reverting the spec entry and asking for independent or human review; under the default 'label' policy the transition completes and is only labeled."
    test_refs: ["tests/cli/done-independence.test.ts"]
design_impact:
  classification: additive
  rationale: "Adds an evidence-derived independence layer (label by default, opt-in require policy) to the done/verdict surfaces. Default-policy behavior of existing projects is unchanged — the label is additive audit data; refusal only activates when a project opts in via project.independence_policy."
  status: resolved
  artifacts: []
