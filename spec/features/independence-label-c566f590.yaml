id: F-c566f590
title: clad done/verdict carry an evidence-based independence label
status: done
modules:
  - src/hitl/independence.ts
  - src/cli/done.ts
  - src/cli/verdict.ts
  - src/verdict/verdict.ts
  - src/cli/clad.ts
  - src/spec/types.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-e216b03f
    statement: "The computeIndependence shall label a feature 'independent' when at
      least one of its evidence entries is human-authored or blind-authored
      (blind: true), and 'self-certified' otherwise — including when the feature
      has no evidence at all."
    kind: behavior
  - id: AC-d5210389
    statement: When clad done runs, the DoneResult and the recorded done_attempted
      event shall carry the feature's computed independence label.
  - id: AC-6f228987
    statement: The CLI wrapper shall include per-done-feature independence labels in
      clad verdict --json output based on the evidence ledger while the pure
      computeVerdict reducer remains IO-free.
    kind: behavior
  - id: AC-ad5ea48b
    statement: While project.independence_policy is require, the clad done command
      shall reject a self-certified done transition by reverting the
      specification entry and requesting independent or human review, while the
      default label policy completes and only labels the transition.
    kind: behavior
design_impact:
  classification: additive
  rationale: Adds an evidence-derived independence layer (label by default, opt-in
    require policy) to the done/verdict surfaces. Default-policy behavior of
    existing projects is unchanged — the label is additive audit data; refusal
    only activates when a project opts in via project.independence_policy.
  status: resolved
  artifacts: []
