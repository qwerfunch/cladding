id: F-aee1da
title: scan deterministic fixes — flat _root promotion + workspace direct files
  + dominant language (v0.3.27)
status: done
modules:
  - src/cli/scan/architecture.ts
  - src/cli/scan/stats.ts
  - src/cli/init.ts
depends_on:
  - F-94dda4
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: "If a flat workspace has at least ROOT_PROMOTION_THRESHOLD direct
      source files and no layer subdirectory, then the architecture inference
      shall omit the promoted root bucket and render layers: [] rather than a
      bogus cwd-named layer."
    kind: behavior
    notes: |
      ## Historical note
      The former root-promotion rule was superseded by F-77a90ac6/AC-974ef7b2:
      a cwd-named layer cannot resolve to a real sub-layer or matching glob.
  - id: AC-002
    statement: When a file lives directly inside a workspace src root with no
      intervening subdirectory, the system shall surface the file under the
      workspace name itself instead of skipping so react-style monorepos with
      flat src/ directories no longer collapse to a single layer.
  - id: AC-003
    statement: The system shall record per-language file counts and a
      dominant-language label on ScanStats so callers can pick the project
      language by file-extension majority instead of trusting detectToolchain
      (which always picks package.json first and mis-identifies polyglot repos
      as typescript).
  - id: AC-004
    statement: The system shall prefer scan dominant language over detectToolchain
      manifest signal in runInit so polyglot repos with a package.json for
      tooling (Django, Rails, RxSwiftExt, …) get the spec.yaml language field
      that matches their actual source files.
    evidence_refs:
      - src/cli/init.ts
  - id: AC-005
    statement: The system shall retain normal flat src/<layer> paths as bare layer
      records with root-qualified directories, observed module counts, and
      extension-majority language statistics.
    kind: quality
    notes: |
      ## Historical note (2026-05-20, v0.3.27, source commit f1da6b5)
      The former dogfood claim required byte-identical v0.3.26 output,
      described cladding's TypeScript-only flat layout, and recorded a
      100-feature sync result. Those environmental observations are historical
      evidence rather than a permanent regression baseline.
