id: F-dd51b42c
title: First-class Kotlin support (Gradle toolchain + language-aware detectors)
status: done
modules:
  - src/stages/toolchain/types.ts
  - src/stages/toolchain/detect.ts
  - src/stages/toolchain/language-config.ts
  - src/stages/detectors/architecture-from-spec.ts
  - src/stages/detectors/convention-drift.ts
  - src/stages/detectors/ai-hints-forbidden-pattern.ts
  - src/stages/detectors/stale-tests.ts
  - src/stages/detectors/coverage-drop.ts
  - src/stages/detectors/unmapped-artifact.ts
  - src/cli/scan/greenfield-seeds.ts
  - src/cli/scan/roots.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-2dc3e787
    statement: When detectToolchain runs in a directory whose Gradle/Maven manifest
      is accompanied by at least one .kt or .kts source file, the system shall
      classify the project as language 'kotlin' and return Gradle-based gates
      (compileKotlin/ktlintCheck/test/jacocoTestReport).
  - id: AC-df69edf9
    statement: While a committed gradlew wrapper exists at the project root, the
      system shall invoke Kotlin gates through ./gradlew, falling back to the
      gradle executable on PATH when no wrapper is present.
  - id: AC-ae2d4113
    statement: If a Gradle/Maven manifest is present but no Kotlin source file
      exists, then the system shall continue to classify the project as 'java'
      (no regression for pure-JVM/Maven repos).
    kind: behavior
  - id: AC-b3e9213f
    statement: The system shall expose a single language-config source of truth
      mapping each language to its source extension, source roots, test globs,
      coverage-summary path, and import matcher, defaulting cleanly to
      TypeScript conventions ('ts', ['src']) for unknown languages.
  - id: AC-2d888ee2
    statement: When a relevant detector runs on a Kotlin project, the system shall
      inspect .kt files under Kotlin source roots such as src/main/kotlin rather
      than silently skip them, resolve source root and extension from
      language-config, and apply this to architecture-from-spec,
      convention-drift, ai-hints-forbidden-pattern, stale-tests, coverage-drop,
      and unmapped-artifact detectors.
    kind: behavior
  - id: AC-2ce66a38
    statement: When architecture-from-spec evaluates forbidden-import rules on a
      Kotlin project, the system shall match JVM dotted-package import
      statements (import a.b.C) and flag those crossing into a forbidden layer.
  - id: AC-562a6cc3
    statement: When clad init scaffolds a greenfield Kotlin project, the system
      shall emit idiomatic Kotlin convention seeds and a src/main/kotlin-based
      architecture/source-root baseline.
  - id: AC-28c2f47d
    statement: While running clad check on cladding itself (a TypeScript project),
      the system shall produce identical results to before this change, with
      language-config defaulting to ts/src so no detector regresses.
