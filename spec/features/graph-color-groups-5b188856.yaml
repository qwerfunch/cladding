capability_refs: []
acceptance_criteria:
  - id: AC-590579
    statement: The graph viewer shall encode node color by kind only, have
      semanticHue return the kind hue or DEFAULT_NODE when kind is absent,
      ignore tier, and remove the prior tier-and-kind double encoding where blue
      meant both feature and tier A.
    kind: quality
    notes: >-
      ## Why

      The sidebar showed the same blue labeled both 'Spec·sealed' (tier A) and
      'feature' (kind) because semanticHue let tier win over kind. Tier is
      derivable from kind (feature→A, capability→B, code→none), so encoding both
      in one hue was redundant AND collided (feature+scenario both blue; tier-C
      teal ≈ skill turquoise). Hue now carries exactly one axis: kind. Tier
      moves to the sidebar filter + tooltip.
  - id: AC-6b822a
    statement: The KIND_COL palette shall group feature and scenario and capability
      in a blue SPEC family, place module in an orange anchor and test in a
      green anchor and doc and skill in a pink DOCS family, place SKILL.md in
      the 300-to-340-degree DOCS pink arc rather than the code or test zone, and
      keep every hue above the bloom luminance floor.
    kind: quality
    notes: >-
      ## Why

      User anchors: spec=blue, module=orange, test=green (strong,
      instantly-separable). The rest adjust around them — SPEC a blue family,
      DOCS a pink family — so the group reads at a glance while each member
      stays distinct (luminance + small hue step). skill was turquoise (read as
      code); it is .md, so it belongs with doc. Palette verified by simulation:
      Y≥125 floor, colorblind 4-group separation, hub-whitening within-family
      distinctness. Honest residuals (accepted): module orange sits near the
      health-burn arc (disambiguated by the burn's 2.2-3× pulse vs static node),
      and orange↔green is the textbook red-green colorblind pair (conceptually
      adjacent code↔test, luminance backstop).
  - id: AC-21ae30
    statement: The viewer sidebar shall present one color legend grouping kinds into
      spec, code, test, and docs zones and present the SSoT tier section as a
      swatch-less filter.
    kind: quality
    notes: >-
      ## Why

      Previously two colored legends (tiers + kinds) used overlapping colors, so
      the same blue appeared in both with different labels. With hue=kind, the
      kinds legend is the sole color key (grouped by zone so it teaches the
      spec/code/test/docs split), and tier becomes a filter rendered without a
      color swatch.
