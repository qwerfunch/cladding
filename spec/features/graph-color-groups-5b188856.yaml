id: F-5b188856
slug: graph-color-groups
title: "graph viewer color system — hue=kind only, grouped spec(blue)/code(orange)/test(green)/docs(pink); skill is a doc"
status: done
depends_on:
  - F-77f7ead0
  - F-64a5c159
modules:
  - src/graph/stellar.ts
  - src/graph/viewer-shell.ts
  - src/graph/viewer/main.ts
