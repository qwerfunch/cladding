id: F-6e49fd24
title: Inventory block churn diet — stop emitting last_synced
status: done
modules:
  - src/spec/inventory.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-f2004981
    statement: When the inventory block is upserted, the system shall emit count
      fields only — no last_synced — so an unchanged-count re-sync is
      byte-identical.
    notes: >-
      ## Why

      43 commits touched spec.yaml since 2026-06-01; two branches each running
      sync produced a guaranteed conflict on the last_synced date line even when
      nothing real changed. Verified before design: zero production readers of
      last_synced (writer at inventory.ts:82,122 and a stale comment at
      clad.ts:246 only).
  - id: AC-d9915fe5
    statement: When a legacy last_synced line exists, the system shall drop it on
      the next inventory upsert while preserving all other spec.yaml content.
  - id: AC-de828ae2
    statement: The Inventory type shall keep last_synced as an optional field so
      spec.yaml files written by older cladding versions still parse and
      validate.
