id: F-e8912be3
title: Status-aware MISSING_IMPLEMENTATION — the spec-first window is a normal
  state, not an error
status: done
modules:
  - src/stages/detectors/missing-implementation.ts
  - conformance/runner.ts
  - docs/feature-cycle.md
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-daff1078
    statement: While a feature is planned or in_progress, the detector shall report
      a missing declared module as informational rather than blocking.
    kind: behavior
    notes: >-
      ## Why

      Real-adopter screenshot (2026-07-06): the Stop hook blocked a session with
      'feature F-049cb0 declares module ... but the file does not exist' during
      the exact window the cycle documentation prescribes (author spec entry →
      implement). MISSING_IMPLEMENTATION was the only status-blind detector of
      its family — UNTESTED_AC and MISSING_TESTS are already done-scoped.
  - id: AC-9f1a7ad1
    statement: The detector shall report a missing declared module as an error for
      done and archived features while STATUS_DRIFT independently guards done
      and this detector solely covers archived modules.
    kind: behavior
    notes: >-
      ## Why

      Demotion must not weaken the shipped-code invariant: done+missing stays a
      two-detector catch, archived+missing keeps its only guard.
  - id: AC-e8e0bf03
    statement: When the in_progress all-missing fixture runs non-strict, the system
      shall pass and state the window-is-legal intent in its narrative.
    kind: behavior
  - id: AC-5b108de2
    statement: The feature-cycle documentation shall correctly describe the status
      policy — UNTESTED_AC is done-scoped (the previous text claiming it
      status-blind was wrong) and the missing-implementation window tolerance is
      documented.
