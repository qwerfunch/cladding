    condition: "while a check-only formatter (dart/dotnet format) fails the lint stage"
    response: "attach a one-line remediation hint naming the fix command"
    text: "While a recognised check-only formatter fails the lint stage, the stage result shall carry a one-line remediation hint naming the command that fixes the formatting (e.g. `dart format .`), which the check renderer prints under the findings."
    notes: "No stage prints a fix hint today; the house style is a backticked command in a short imperative. Derived from the resolved lint command, not hard-coded per project."
