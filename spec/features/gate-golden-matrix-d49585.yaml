id: F-d49585
title: Characterization golden matrix freezes the runCheckStages exit contract
  before the 0.6 refactors
status: done
modules:
  - tests/cli/gate-golden-matrix.test.ts
  - src/cli/clad.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-526e25
    statement: "The test suite shall pin the gate's exit contract as a golden
      matrix: with stage runners stubbed, every combination of tier (pre-commit,
      pre-push, all) x strict (on, off) x per-stage outcome (pass=0, fail=1,
      skip=2) asserts the gate's worst exit code, whether the gate blocks, and
      each stage's reported status."
    notes: >-
      ## Why

      Features #1 (gate_run events), #5 (skip-policy), #10 (attestation) all
      rewire runCheckStages — the single function defining the 0/1/2 contract
      for clad check AND clad done. Its direct tests today cover 4 cases; the
      comment at the skip-relay site records a real prior bug (tsc's raw exit 2
      relayed as skip let a type failure pass). Freeze the contract first,
      refactor against it.
  - id: AC-40db4c
    statement: If a code-verification stage skips under strict mode, then the gate
      shall promote stage 1.1, 2.1, or 2.3 to RED only when the current
      strict-skip demand table declares its precondition, keep non-strict,
      undemanded, and out-of-tier skips non-blocking, and leave stage_2.4
      safe-deliverable demand solely to SMOKE_PROBE_DEMAND without appending a
      duplicate failure.
    kind: behavior
    notes: >-
      ## Decision

      This golden matrix characterizes the current gate boundary. F-67d2e9 owns
      the 1.1/2.1/2.3 strict-skip semantics and preserves the false-RED defense;
      SMOKE_PROBE_DEMAND owns stage_2.4, so the matrix pins non-duplication
      without restoring the retired arm.
  - id: AC-3f7ea4
    statement: The golden matrix shall run with injected stage stubs only — no
      toolchain spawn, no spec fixture I/O beyond a minimal temp spec — so the
      full matrix executes in under a second and runs in every CI invocation.
