id: F-9af291fa
title: Instruction-led language — one English source, the agent renders the
  user's language
status: done
modules:
  - src/ui/softShell.ts
  - src/init/host-instructions.ts
  - CLAUDE.md
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-71ce42e5
    statement: The Soft Shell catalog and surface templates shall carry exactly one
      clear English string per detector and per surface — no locale types, no
      locale resolution, no user-locale sidecar reads, no project.locale field —
      with the plain-lead-first render order unchanged.
    notes: >-
      ## Why

      2026-07-06 user pivot: cladding must not force-transform output languages.
      Static multi-locale catalogs, detection heuristics, and locale packs are
      the wrong mechanism — hook messages are agent-delivered channels, and the
      LLM renders the user's language naturally when instructed. The reviewed
      English leads survive as the single translation source.
  - id: AC-ddb938fb
    statement: The interpreter instruction shall explicitly cover relaying — the
      injected CLAUDE.md anchor and the AGENTS.md rule direct the agent to relay
      cladding's own gate and hook messages in the user's language, by meaning —
      with both freshness literals verbatim and the size guard respected (or
      deliberately raised with a dated rationale).
    notes: >-
      ## Why

      The positive half of the pivot: language capability moves from shipped
      strings to the instruction layer, where it handles every language for
      free.
  - id: AC-3f34759a
    statement: If locale machinery reappears in source or tests, then the structural
      sweep shall fail.
    kind: constraint
    rationale: Prevents obsolete locale machinery from returning.
