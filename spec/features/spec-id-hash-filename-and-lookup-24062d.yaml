id: F-24062d
title: Hash-filename + slug-friendly lookup + multi-dev guide (v0.3.10)
status: done
modules:
  - src/spec/new.ts
  - src/serve/server.ts
  - docs/spec-ids-multi-dev.md
depends_on:
  - F-67e33f
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: The system shall write new feature files at
      spec/features/<slug>-<hash6>.yaml so two simultaneous calls to
      createFeature with the same slug across two branches produce distinct file
      paths by construction, eliminating the file-level merge conflict that
      would otherwise occur.
  - id: AC-002
    statement: While createFeature is invoked twice with the same slug in the same
      cwd, the system shall produce two distinct files with different hashes and
      no throw — the semantic conflict is surfaced by the SLUG_CONFLICT detector
      on the next check, not by createFeature itself.
  - id: AC-003
    statement: The system shall extend clad_list_features with a slugSubstring
      case-insensitive filter and a sort option ('alphabetical' default ·
      'recent' by file mtime) so a user can ask the host AI for "auth-related
      features" or "recently edited features" and the LLM resolves the request
      through the MCP tool without needing the exact hash id.
  - id: AC-004
    statement: The system shall extend clad_get_feature to accept either id or slug;
      this lets the host LLM look a feature up by its human-friendly slug when
      the user does not remember the F-<hash> id.
  - id: AC-005
    statement: The system shall ship docs/spec-ids-multi-dev.md so external adopters
      can understand how the model behaves across the common multi-developer
      scenarios without reading source code or detector implementations.
    evidence_refs:
      - docs/spec-ids-multi-dev.md
