acceptance_criteria:
  - id: AC-4f4a1201
    statement: When independently prepared edits touch different feature shards, the
      transaction authority shall apply both edits against the latest candidate
      while rejecting a stale edit of the same canonical shard.
  - id: AC-4f4a1202
    statement: When a specification mutation is busy or interrupted, the transaction
      authority shall leave no partial candidate visible and recover byte-exact
      pre-state before the next compiler snapshot.
    kind: behavior
  - id: AC-4f4a1203
    statement: The specification edit boundary shall accept only closed typed
      operations, derive canonical input revisions from their registry-owned
      regions, and keep context revisions outside write authorization.
  - id: AC-4f4a1204
    statement: When a schema migration is explicitly confirmed, the transaction
      authority shall bind the request to the current preview digest and apply
      or replay the candidate without a partial schema switch.
design_impact:
  classification: structural
  rationale: The F4 boundary centralizes schema 0.2 writes, durable recovery, and
    migration application across CLI and MCP adapters.
  status: resolved
