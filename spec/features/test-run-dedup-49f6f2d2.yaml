id: F-49f6f2d2
title: gate-scoped test-run dedup — run the suite once, without disabling the
  vacuous-test guard
status: done
modules:
  - src/stages/test-run-cache.ts
  - src/stages/unit.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-9a1c4e21
    statement: While a gate run is primed and the coverage runner is vitest, the
      system shall execute the test suite exactly once and share that run
      between the unit stage and the coverage stage.
    notes: "The waste #215 names: pre-push runs vitest in stage_2.1 (unit) AND
      stage_2.2 (coverage). One shared coverage run serves both. Mirrors the
      run-scoped detector-result-cache lifetime (prime before the stage loop,
      clear in finally)."
  - id: AC-6b2d81f7
    statement: If the unit stage reuses the shared coverage run under --strict, then
      the unit stage shall evaluate the F-b81d203e vacuous-test guard against
      the shared per-test JSON and not return a passing unit result before the
      guard runs.
    kind: behavior
    notes: "THE reason #216 was rejected: its reuse-pass path returned {pass:true}
      before the guard, silently disabling F-b81d203e. This AC forbids that: the
      guard is mandatory on the reuse path, not optional."
  - id: AC-3f7e0c94
    statement: While deduping on a vitest project, the shared run shall carry the
      dual json reporter so the vacuous-test guard has the per-test results it
      consumes.
    notes: The shared command is the coverage command augmented with
      --reporter=default --reporter=json --outputFile=<tmp>. vitest reporters
      are orthogonal to --coverage, so one invocation yields both the coverage
      report and the per-test testResults[].
  - id: AC-8c5a2fb0
    statement: If the shared run is not green, then the unit stage shall run its own
      tests-only command so a coverage-threshold-only miss is not attributed as
      a unit-test failure.
    kind: behavior
    notes: "Preserves #216's sound unitActionFromCoverage property: reuse-pass only
      on a green shared run; otherwise fall back."
  - id: AC-2d4b9e63
    statement: When no gate run is primed for a standalone stage call or MCP read
      path, the shared-run cache shall pass through while leaving unit and
      coverage behavior byte-identical.
    kind: quality
    notes: "Same pass-through discipline as detector-result-cache: a fresh map per
      gate run, cleared in finally, so the long-lived MCP server never serves a
      stale test result across requests."
  - id: AC-d769e24f
    statement: While a gate run is primed and the coverage runner is pytest, the
      system shall execute the suite exactly once by having the unit stage run
      the coverage-instrumented `coverage run -m pytest` and publishing it so
      the coverage stage folds the same process.
    notes: "The Python analogue of #215's vitest dedup: coverage.py's exit code IS
      pytest's, so one instrumented run yields both the unit pass/fail and the
      coverage data. cov.ts's peekSharedRun fold is already language-agnostic;
      the producer gate lives in unit.ts (tryReuseSharedPytestRun)."
  - id: AC-f8e85a99
    statement: If the unit stage reuses the shared pytest run under --strict, then
      the unit stage shall evaluate the zero-executed-tests guard against the
      shared summary and not return a passing result for a run that collected
      zero tests.
    kind: behavior
    notes: "Mirrors AC-6b2d81f7 for pytest: the reuse-pass path is not a guard
      bypass. reportsZeroExecutedTests recognizes pytest's `collected 0 items`,
      so a coverage-instrumented pytest run that exits 0 yet collected nothing
      blocks instead of reading as verified."
