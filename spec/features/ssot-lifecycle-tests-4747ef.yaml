  - id: AC-001
    statement: The system shall complete the declared greenfield lifecycle in one
      valid initialized workspace through current public command or core
      surfaces.
    notes: >
      ## Historical atomicity note — 2026-08-31

      Reason: the former criterion combined lifecycle completion, transition
      coverage, and scenario-reference integrity.

      Previous compound criterion text (non-normative): The system shall ship a
      6-stage greenfield lifecycle test that exercises the full intent-aware
      onboarding + refine + re-scan path while asserting tier integrity at every
      step.
  - id: AC-7e3e3f37
    statement: The system shall exercise every declared greenfield onboarding and
      refinement transition in the same continuing workspace through its current
      command surface.
  - id: AC-e5aababf
    statement: When each greenfield lifecycle transition completes, the system shall
      retain structurally valid scenario-to-feature references.
    kind: behavior
  - id: AC-002
    statement: The system shall complete the declared adoption lifecycle from the
      committed populated TypeScript fixture in one continuing workspace.
    notes: >
      ## Historical atomicity note — 2026-08-31

      Reason: the former criterion combined adoption lifecycle completion,
      collision preservation, and scenario-reference integrity.

      Previous compound criterion text (non-normative): The system shall ship a
      6-stage existing-adoption lifecycle test using a populated TypeScript
      fixture so the existing-project code path is exercised end-to-end.
  - id: AC-4e9c049b
    statement: The system shall preserve authored collision inputs byte-identically
      and expose the proposal escape end-to-end during adoption.
    kind: quality
  - id: AC-e9094179
    statement: When a lifecycle transition completes, the system shall retain
      structurally valid scenario-to-feature references through adoption,
      refinement, and binding.
    kind: behavior
  - id: AC-003
    statement: The system shall introduce a portable token-measurement library so
      persona prompts, meta docs, LLM dispatcher prompts, and generated
      artifacts can all be measured uniformly.
    evidence_refs:
      - tests/scenarios/_token-meter.ts
  - id: AC-004
    statement: The system shall define size budgets for every cladding-managed
      artifact category with a ratchet mechanism so PR-level bloat regressions
      fail the gate rather than silently shipping.
    evidence_refs:
      - tests/scenarios/_size-budgets.ts
  - id: AC-005
    statement: The system shall emit a token-efficiency digest at the end of each
      lifecycle test that surfaces every measurement against its budget so
      reviewers audit trends even on passing runs.
    evidence_refs:
      - tests/scenarios/_assertions.ts
  - id: AC-006
    statement: The system shall ship reusable lifecycle assertions so the two test
      files read like checklists not maze of expect calls.
    evidence_refs:
      - tests/scenarios/_assertions.ts
  - id: AC-007
    statement: The system shall provide a realistic existing-TypeScript fixture so
      the existing-adoption lifecycle test exercises observed layers and
      README-derived capabilities exactly like a real adopter.
    evidence_refs:
      - tests/scenarios/_fixtures/sample-existing-ts/
  - id: AC-008
    statement: While the LLM dispatcher response omits the standard Tier banner from
      capabilities.yaml or architecture.yaml bodies, the system shall prepend
      the Tier B yaml banner so every cladding-managed artifact's first line
      carries the standard banner regardless of which path produced it.
    evidence_refs:
      - src/cli/scan/intent-onboarding.ts
