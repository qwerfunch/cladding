capability_refs: []
acceptance_criteria:
  - id: AC-164
    statement: The system shall refactor src/cli/clad.ts to expose every verb's
      handler plus a createProgram() factory, so unit tests can exercise the CLI
      without spawning a subprocess.
    evidence_refs:
      - src/cli/clad.ts
  - id: AC-165
    statement: When a public CLI command is registered, the command registry shall
      expose a callable action with its declared option boundaries while retired
      aliases fail closed.
    kind: behavior
    notes: >
      ## Historical schema-0.1 note

      2026-05-19 · v0.2.15 · 8379db7. CLI fixtures: 7 handlers, actions,
      options,

      exits, absent specs, intent, strict mode, JSON, and errors; at least 90%
      line

      coverage; non-current. Released title: "Final coverage closure — every
      source dir ≥ 90% lines".
  - id: AC-166
    statement: When an agent adapter is resolved, the adapter selector shall apply
      environment selection before configuration and automatic selection,
      resolve registered adapters exactly, and fall back to the generic host
      adapter for incomplete, malformed, or unknown selections without provider
      credential access.
    kind: behavior
    notes: |
      ## Historical schema-0.1 note
      2026-05-19 · v0.2.15 · 8379db7. Adapter-selection fixtures: environment,
      config, auto detection, malformed/partial input, unknown hosts, and SDK
      fallback; at least 95% line coverage; non-current.
  - id: AC-167
    statement: While current coverage assurance is evaluated, the assurance registry
      shall derive it from the coverage obligation and treat the v0.2.15
      source-directory measurement as historical evidence only.
    kind: quality
    notes: >
      ## Historical schema-0.1 note

      v0.2.15’s source-dir ≥90% and total ≥93% measurement is historical, not
      current assurance.
