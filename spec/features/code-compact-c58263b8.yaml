  - id: AC-65b3d185
    ears: ubiquitous
    text: "The git ref resolution shall live exactly once in src/core/git-ops.ts — resolveRefToCommit(cwd, ref) returning the commit sha or null, never throwing, with refExists as its boolean projection — and the three prior duplicate sites (changelog collector, report, changelog CLI) routed through that single home with no forbidden-import rule violated."
    notes: "## Why\nThe changelog CLI site consumes the resolved sha (not a boolean), so the single home is the resolving probe; a boolean-only helper would have changed behavior. Split adjudicated during implementation, 2026-07-05."
    test_refs:
      - "tests/code-compact.test.ts#git-ops.ts exports resolveRefToCommit(cwd, ref): string | null and refExists(cwd, ref): boolean"
      - "tests/code-compact.test.ts#the rev-parse + --verify idiom appears in NO src file other than core/git-ops.ts"
      - "tests/code-compact.test.ts#the three prior duplicate call sites import the core probe instead of shelling out themselves"
