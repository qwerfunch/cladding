    text: "The four detector-local resolveThreshold() seams shall be inlined to their constants — no resolveThreshold symbol remains anywhere — with the wire-a-config-later narrative comments removed, and no configuration knob added."
    notes: "## Why\nBacklog B3 (audited): all four return bare constants, zero test references, and the review explicitly decided against wiring an unrequested config knob. In-place edits — no file moves, so no shard-module ripple."
    test_refs:
