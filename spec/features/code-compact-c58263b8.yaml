acceptance_criteria:
  - id: AC-de1bc6c5
    statement: The four detector-local resolveThreshold() seams shall be inlined to
      their constants — no resolveThreshold symbol remains anywhere — with the
      wire-a-config-later narrative comments removed, and no configuration knob
      added.
    notes: >-
      ## Why

      Backlog B3 (audited): all four return bare constants, zero test
      references, and the review explicitly decided against wiring an
      unrequested config knob. In-place edits — no file moves, so no
      shard-module ripple.
  - id: AC-65b3d185
    statement: The git ref resolution shall live exactly once in src/core/git-ops.ts
      — resolveRefToCommit(cwd, ref) returning the commit sha or null, never
      throwing, with refExists as its boolean projection — and the three prior
      duplicate sites (changelog collector, report, changelog CLI) routed
      through that single home with no forbidden-import rule violated.
    notes: >-
      ## Why

      The changelog CLI site consumes the resolved sha (not a boolean), so the
      single home is the resolving probe; a boolean-only helper would have
      changed behavior. Split adjudicated during implementation, 2026-07-05.
  - id: AC-243ff1e1
    statement: The system shall define `ModuleReader` exactly once under
      `src/optimizer/`, import that definition wherever needed, and keep
      `resolveActorIdentity` unexported.
    kind: behavior
    notes: >-
      ## Why

      Duplicate identical alias in two optimizer modules; resolveActorIdentity
      had zero external importers. withinCwd was originally in scope but is
      deliberately KEPT exported: tests/optimizer/code-excerpt.test.ts pins its
      path-traversal contract directly, and weakening a security-relevant unit
      contract to buy export hygiene is a bad trade (adjudicated 2026-07-05).
  - id: AC-01797b10
    statement: When a changed compacted module has a compiled proof closure, the
      assurance engine shall evaluate the current bound observations in that
      closure without inferring behavior preservation from an unchanged
      test-file set.
    notes: >-
      The exact 13-suite manifest is code-owned by the criterion observation
      registry; filesystem presence, a clean git tree, and historical green
      results are not observations.


      ## Non-normative history (2026-08-31)


      Replaced the obsolete zero-test-edit/suite-green claim with a current
      bound proof-closure contract.
