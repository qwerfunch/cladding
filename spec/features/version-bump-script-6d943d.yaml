id: F-6d943d
slug: version-bump-script
title: Atomic version-bump script — single command for 11 sync sites
status: done
modules:
  - scripts/version-bump.mjs
  - package.json
  - package-lock.json
  - tests/scripts/version-bump.test.ts
depends_on: [F-080]
acceptance_criteria:
  - id: AC-001
    ears: ubiquitous
    action: ship a single-command script that atomically bumps the cladding version across all eleven sites where it lives
    response: 'scripts/version-bump.mjs accepts a single SemVer argument (major.minor.patch), validates all 11 version sites across 10 files including both package-lock.json copies, and writes only after every site validates; prints a per-site summary; exits non-zero without partial writes on any error'
    text: The system shall ship scripts/version-bump.mjs that atomically bumps the cladding version across all eleven sites where it lives, including both package-lock.json copies and every host manifest, so the manual edit ritual collapses into a single command and version drift is eliminated at the source.
    test_refs: [tests/scripts/version-bump.test.ts]
  - id: AC-002
    ears: ubiquitous
    action: expose the script via `npm run version-bump`
    response: 'package.json scripts adds `"version-bump": "node scripts/version-bump.mjs"` so the script is callable as `npm run version-bump -- 0.3.16` in addition to the direct `node scripts/version-bump.mjs 0.3.16` invocation'
    text: The system shall expose the script via `npm run version-bump` so the canonical npm workflow is preserved alongside the direct node invocation.
    evidence_refs: [package.json]
  - id: AC-003
    ears: state
    condition: while the script is invoked with the same version that already lives in the files
    action: report "already" for each file and exit 0
    response: 'each unchanged site prints a line with the file, the version, and the literal annotation `(already)`; the script exits 0; no file is rewritten so mtime stays stable'
    text: While the script is invoked with the same version that already lives in the files, the system shall report "already" for each file and exit 0 so the operation is idempotent and safe to re-run.
    test_refs: [tests/scripts/version-bump.test.ts]
  - id: AC-004
    ears: state
    condition: while the user passes an argument that is not strict SemVer major.minor.patch
    action: exit non-zero with a SemVer error message
    response: 'the script rejects pre-release/build-metadata strings (e.g. 0.3.15-rc1, 0.3.15+build.2) and free-form strings; stderr names the offending value and references SemVer; exit code 1'
    text: While the user passes an argument that is not strict SemVer major.minor.patch, the system shall exit non-zero with a clear SemVer error message so a typo or a pre-release attempt is caught immediately.
    test_refs: [tests/scripts/version-bump.test.ts]
  - id: AC-005
    ears: state
    condition: while one of the eleven version sites has its anchor pattern broken (e.g. the version field renamed)
    action: report which file is broken and exit non-zero without writing any version-bearing file
    response: the script validates every site before its write phase, prints errors under an `errors:` heading, leaves all 10 files unchanged, and exits non-zero
    text: While one of the eleven version sites has its anchor pattern broken, the system shall report which file is broken and exit non-zero without partial writes, so a refactor that moves a version string cannot leave a half-bumped release.
    test_refs: [tests/scripts/version-bump.test.ts]
