id: F-6d943d
title: Atomic version-bump script — single command for 11 sync sites
status: done
modules:
  - scripts/version-bump.mjs
  - package.json
  - package-lock.json
  - tests/scripts/version-bump.test.ts
depends_on:
  - F-080
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: The system shall ship scripts/version-bump.mjs that atomically bumps
      the cladding version across all eleven sites where it lives, including
      both package-lock.json copies and every host manifest, so the manual edit
      ritual collapses into a single command and version drift is eliminated at
      the source.
  - id: AC-002
    statement: The system shall expose the script via `npm run version-bump` so the
      canonical npm workflow is preserved alongside the direct node invocation.
    evidence_refs:
      - package.json
  - id: AC-003
    statement: While the script is invoked with the same version that already lives
      in the files, the system shall report "already" for each file and exit 0
      so the operation is idempotent and safe to re-run.
  - id: AC-004
    statement: While the user passes an argument that is not strict SemVer
      major.minor.patch, the system shall exit non-zero with a clear SemVer
      error message so a typo or a pre-release attempt is caught immediately.
  - id: AC-005
    statement: While one of the eleven version sites has its anchor pattern broken,
      the system shall report which file is broken and exit non-zero without
      partial writes, so a refactor that moves a version string cannot leave a
      half-bumped release.
