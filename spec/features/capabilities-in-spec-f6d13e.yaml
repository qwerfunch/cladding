id: F-f6d13e
title: Tier-B capabilities are schema-validated + loaded into the typed Spec
  (v0.4.x, J2)
status: done
modules:
  - src/spec/types.ts
  - src/spec/schema.json
  - src/spec/load.ts
depends_on:
  - F-f44d1b
capability_refs:
  - spec-governance
acceptance_criteria:
  - id: AC-001
    statement: When a project's spec is loaded with a capabilities file present, the
      system shall merge its capabilities into the typed Spec where the schema
      validates each entry.
  - id: AC-002
    statement: If a capability is malformed, then the system shall raise a
      parse-time validation error, so Tier B is held to the same schema
      authority as Tier A.
    kind: behavior
  - id: AC-003
    statement: The system shall validate capability feature references with the same
      F-id pattern used for scenarios, leaving existence checks to
      CAPABILITIES_FEATURE_MAPPING.
