capability_refs: []
acceptance_criteria:
  - id: AC-196
    statement: The system shall extend the HaltClass enum with
      TRANSPORT_AUTH_FAILED, TRANSPORT_RATE_LIMITED, and TRANSPORT_NETWORK so
      transport failures map to actionable categories instead of the generic
      LLM_UNAVAILABLE.
  - id: AC-197
    statement: The system shall expose classifyTransportError(err) that maps a
      thrown transport error to the most specific HaltClass based on
      HTTP-status-code prefixes, well-known SDK phrases, and Node.js
      ErrnoException codes.
  - id: AC-198
    statement: While a specialist or reviewer dispatch throws inside the drive loop,
      the system shall classify the error through classifyTransportError and
      halt with the resulting transport-specific HaltClass.
  - id: AC-199
    statement: The system shall add a user-facing sentence for each new transport
      halt class in src/ui/softShell.ts HALT_MESSAGES, preserving the Soft Shell
      convention of hiding the internal enum from the user surface.
  - id: AC-200
    statement: While the integration test exercises each of the four
      transport-failure shapes (auth, rate limit, network, unknown), the drive
      loop shall halt with the matching transport-specific HaltClass — proving
      the classifier is wired correctly end-to-end.
archive_reason: "Retired in 0.10.0 with the headless drive loop: no recorded
  session ran the loop (0 runs across 5,176 events measured 2026-09-02) and the
  host-delegated cycle owns execution."
archived_at: 2026-09-05T12:49:30.971Z
