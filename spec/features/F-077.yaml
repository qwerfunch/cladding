capability_refs: []
acceptance_criteria:
  - id: AC-228
    statement: The system shall ship a Codex plugin manifest at
      plugins/codex/.codex-plugin/plugin.json that declares cladding under the
      OpenAI Codex CLI plugin spec, pointing at the same MCP server and skill
      catalog as the Claude Code plugin manifest.
    evidence_refs:
      - plugins/codex/.codex-plugin/plugin.json
  - id: AC-229
    statement: The system shall register cladding's MCP server in
      plugins/codex/.mcp.json so the Codex CLI auto-launches `clad serve`
      whenever the plugin is enabled, without the user editing any settings.
    evidence_refs:
      - plugins/codex/.mcp.json
  - id: AC-230
    statement: While npm run build:plugin is invoked, the system shall regenerate
      plugins/codex/skills/ from the same single-source canonical files used by
      the Claude Code mirror (repo-root skills/<verb>/SKILL.md for verbs ·
      src/agents/<persona>.md for personas), keeping the two host plugin layouts
      in lockstep.
    evidence_refs:
      - scripts/build-plugin.mjs
  - id: AC-231
    kind: behavior
    statement: The system shall expose five cladding verbs (sync, check, status,
      init, serve) and five persona prompts (orchestrator, planner, reviewer,
      observability, developer) as Codex skills under
      plugins/codex/skills/<id>/SKILL.md.
    evidence_refs:
      - plugins/codex/skills/sync/SKILL.md
      - plugins/codex/skills/check/SKILL.md
      - plugins/codex/skills/orchestrator/SKILL.md
      - plugins/codex/skills/developer/SKILL.md
  - id: AC-232
    statement: If a src/agents/<id>.md persona file lacks a description YAML
      frontmatter field, then the build shall warn and continue copying so a
      soft validation issue does not block release while a future v0.4.0
      generator target may promote this to a hard error.
    kind: behavior
    evidence_refs:
      - scripts/build-plugin.mjs
