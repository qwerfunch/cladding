  - plugins/codex/skills/init/SKILL.md
  - plugins/codex/skills/serve/SKILL.md
  - plugins/codex/skills/orchestrator/SKILL.md
  - plugins/codex/skills/planner/SKILL.md
  - plugins/codex/skills/reviewer/SKILL.md
  - plugins/codex/skills/observability/SKILL.md
