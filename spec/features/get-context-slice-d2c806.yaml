id: F-d2c806
title: clad_get_context + clad context — the Least Context principle becomes
  mechanical (first context-serving wiring of pruneToFeature)
status: done
modules:
  - src/optimizer/context-slice.ts
  - src/serve/server.ts
  - src/cli/clad.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-6aa10d
    statement: When a context lookup receives a feature id or slug or module path,
      the system shall return the compact context slice with focus feature,
      ancestor summaries, bound scenarios, matching ai_hints patterns, and
      test_refs union.
    kind: behavior
    notes: >-
      ## Why

      pruneToFeature existed since the token-efficiency work but its ONLY
      consumer was the benchmark — personas ordered agents to 'dispatch slices'
      that no code produced. ## Decision

      Ancestors are summarized (title+status), not inlined — the slice serves
      orientation, not a full spec dump.
  - id: AC-10ea8a
    statement: If the lookup matches nothing, then the system shall return a
      not-found result naming the accepted forms (F-id, slug, module path) and
      pointing at spec/index.yaml.
    kind: behavior
  - id: AC-0fe45d
    statement: The MCP payload shall carry schema_version and produce a
      deterministically ordered slice for identical specification state so hosts
      can cache and diff it.
    kind: quality
