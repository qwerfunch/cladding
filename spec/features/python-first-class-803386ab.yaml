id: F-803386ab
title: "Python parity in the language SSoT: pytest globs, Cobertura coverage,
  dotted-import architecture checks"
status: done
modules:
  - src/stages/toolchain/language-config.ts
  - src/stages/detectors/coverage-drop.ts
  - src/stages/detectors/architecture-from-spec.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-2b542ed8
    statement: When python resolves, the system shall return a PYTHON_CONFIG with
      .py extensions, pytest test globs (tests/test_*.py and tests/**/test_*.py
      and tests/**/*_test.py), coverageSummary coverage.xml, coverageFormat
      cobertura-xml, and a dotted import matcher covering both import a.b and
      from a.b import c forms.
    notes: "WHY: Python has toolchain gates but no LanguageConfig entry — it
      silently resolves to the TS baseline, leaving COVERAGE_DROP and
      ARCHITECTURE_FROM_SPEC inert on Python repos; pytest ingestion demand
      already arrived via external PRs."
  - id: AC-b6853f60
    statement: When Cobertura coverage resolves, the detector shall read the
      report-level line-rate attribute from coverage.xml and apply the identical
      drop policy as the istanbul and jacoco formats.
    notes: "WHY: pytest --cov emits Cobertura, not istanbul json nor jacoco xml."
  - id: AC-d43aabcc
    statement: When layer rules apply to Python code, the import resolver shall use
      the Kotlin dotted interpretation for from a.b import c and import a.b
      declarations and resolve both against declared layers.
    kind: behavior
    notes: "WHY: the ES-module import regex matches zero Python imports — layer
      rules are currently vacuous on Python."
  - id: AC-c6dae481
    statement: If a Python workspace has no supported Cobertura coverage report,
      then the COVERAGE_DROP shall return no findings.
    kind: behavior
    notes: "2026-08-31 — Restored scoped wording. Displaced active wording: If no
      coverage report exists, then COVERAGE_DROP shall degrade to no findings
      exactly as today — no new failure mode for report-less repos. WHY:
      cladding never installs or runs the user's toolchain; absent evidence
      degrades, never fabricates."
  - id: AC-b5358945
    statement: The system shall keep clad check --strict output on cladding's own
      repository byte-identical before and after this change, enforced by the
      existing no-regression conventions.
    notes: "WHY: language additions must be zero-cost for existing TS/Kotlin users
      (language-config.ts design rule)."
