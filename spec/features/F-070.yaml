acceptance_criteria:
  - id: AC-192
    statement: The system shall expose a test-only seam
      (setDefaultTransportForTesting) on src/adapters/sdk/anthropic.ts so
      integration tests can substitute a stubbed Transport without
      monkey-patching the adapter object.
  - id: AC-193
    statement: While the drive loop runs with SDK plus claude-anthropic environment
      routing and an injected stubbed Transport, the drive loop shall dispatch
      through the real selector and adapter chain and reach ALL_FEATURES_DONE on
      the happy path.
    kind: behavior
  - id: AC-194
    statement: While specialist and reviewer dispatches return the same
      identity.name from a real-shape transport, the system shall halt the loop
      with HUMAN_REQUIRED — proving the F-049 AC-086 barrier works against
      real-LLM data, not only mock data.
  - id: AC-195
    statement: When an adapter dispatch throws, the run loop shall classify the
      error through classifyTransportError and retain the error detail in the
      returned HaltReason.
    notes: >
      ## Historical note

      The one-size LLM_UNAVAILABLE mapping was replaced by actionable transport
      classifications.
archive_reason: "Retired in 0.10.0 with the headless drive loop: no recorded
  session ran the loop (0 runs across 5,176 events measured 2026-09-02) and the
  host-delegated cycle owns execution."
