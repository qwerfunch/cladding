id: F-062
title: CLI behavior evidence
status: done
modules:
  - src/cli/init.ts
  - src/cli/benchmark.ts
  - tests/cli/init.test.ts
  - tests/cli/benchmark.test.ts
  - vitest.config.ts
depends_on: [F-061]
acceptance_criteria:
  - id: AC-153
    ears: ubiquitous
    action: widen the coverage measurement scope
    response: vitest.config.ts coverage.include lists every first-party source dir (cli, drive, optimizer, adapters, router, ui, hitl, events, agents) in addition to stages and spec; pre-v0.2.13 percentages remain valid for the narrow scope but are no longer directly comparable to v0.2.13+ numbers
    text: The system shall widen the vitest coverage scope to every first-party source dir, so the headline coverage number tracks the whole codebase, not just stages + spec.
    evidence_refs: [vitest.config.ts]
  - id: AC-154
    ears: ubiquitous
    action: refactor src/cli/benchmark.ts for testability
    response: src/cli/benchmark.ts exports `approxTokens` and `benchmark`; CLI bootstrap code is wrapped in `isCliEntry` guard so test imports do not trigger process.exit
    text: The system shall refactor src/cli/benchmark.ts to export its helpers and wrap CLI side-effects in an isCliEntry guard, matching every other module's pattern.
    evidence_refs: [src/cli/benchmark.ts]
  - id: AC-155
    ears: ubiquitous
    action: initialize a project seed and managed ignore entry
    response: preserves the supplied or derived project name and user-owned ignore content while adding the managed entry only when it is absent
    text: When initialization manages a project seed and ignore file, it shall preserve the supplied or derived project name and existing ignore content while adding the managed entry only when it is absent.
    test_refs:
      - "tests/cli/init.test.ts#[covers:F-062/AC-155] initialization derives the default project name from its workspace"
      - "tests/cli/init.test.ts#[covers:F-062/AC-155] initialization preserves an explicit project name in the seed"
      - "tests/cli/init.test.ts#[covers:F-062/AC-155] initialization preserves the existing ignore bytes and separator before its managed entry"
      - "tests/cli/init.test.ts#[covers:F-062/AC-155] initialization creates the managed ignore entry from an absent file and remains idempotent"
    notes: |
      ## Historical schema-0.1 note
      2026-05-19 · v0.2.13 · d8dbd81. Init fixtures: explicit names, an ignore
      file without a trailing newline, and a missing ignore file; 100% line coverage
      through three branch tests; non-current. Released title: "cli test batch 1 + widened coverage scope".
  - id: AC-156
    ears: ubiquitous
    action: estimate a selected benchmark context
    response: derives token estimates from text length and reports the selected pruning relationship from current source-to-selector observations
    text: When benchmark helpers report a selected context, they shall estimate tokens by rounding text length up by the documented divisor and preserve the selected pruning relationship in the result.
    test_refs:
      - "tests/cli/benchmark.test.ts#[covers:F-062/AC-156] approxTokens rounds every text length up by the documented divisor"
      - "tests/cli/benchmark.test.ts#[covers:F-062/AC-156] benchmark preserves the selected feature and its semantic pruning relationship"
    notes: |
      ## Historical schema-0.1 note
      2026-05-19 · v0.2.13 · d8dbd81. First benchmark-test fixtures: approxTokens
      in 4 cases plus single, multi, sharded, and formula selection; non-current.
  - id: AC-157
    ears: state
    condition: while current coverage assurance is evaluated
    action: derive it from the coverage obligation
    response: does not treat the widened-scope measurement as current proof
    text: While current coverage assurance is evaluated, it shall be derived from the coverage obligation; the widened-scope measurement remains historical evidence only.
    test_refs:
      - "tests/assurance/registry.test.ts#[covers:F-055/AC-128][covers:F-056/AC-132][covers:F-057/AC-136][covers:F-058/AC-140][covers:F-059/AC-144][covers:F-060/AC-148][covers:F-061/AC-152][covers:F-062/AC-157][covers:F-063/AC-163][covers:F-064/AC-167] derives current coverage assurance only from the coverage obligation"
    notes: |
      ## Historical schema-0.1 note
      The v0.2.13 widened-scope ≥70% measurement is historical, not current assurance.
