acceptance_criteria:
  - id: AC-153
    statement: The system shall widen the vitest coverage scope to every first-party
      source dir, so the headline coverage number tracks the whole codebase, not
      just stages + spec.
    evidence_refs:
      - vitest.config.ts
  - id: AC-154
    statement: The system shall refactor src/cli/benchmark.ts to export its helpers
      and wrap CLI side-effects in an isCliEntry guard, matching every other
      module's pattern.
    evidence_refs:
      - src/cli/benchmark.ts
  - id: AC-155
    statement: When initialization manages a project seed and ignore file, the
      initializer shall preserve the supplied or derived project name and
      existing ignore content while adding the managed entry only when it is
      absent.
    kind: behavior
    notes: >
      ## Historical schema-0.1 note

      2026-05-19 · v0.2.13 · d8dbd81. Init fixtures: explicit names, an ignore

      file without a trailing newline, and a missing ignore file; 100% line
      coverage

      through three branch tests; non-current. Released title: "cli test batch 1
      + widened coverage scope".
  - id: AC-156
    statement: When benchmark helpers report a selected context, the helpers shall
      estimate tokens by rounding text length up by the documented divisor and
      preserve the selected pruning relationship in the result.
    kind: quality
    notes: >
      ## Historical schema-0.1 note

      2026-05-19 · v0.2.13 · d8dbd81. First benchmark-test fixtures:
      approxTokens

      in 4 cases plus single, multi, sharded, and formula selection;
      non-current.
  - id: AC-157
    statement: While current coverage assurance is evaluated, the assurance registry
      shall derive it from the coverage obligation and treat the widened-scope
      measurement as historical evidence only.
    kind: quality
    notes: >
      ## Historical schema-0.1 note

      The v0.2.13 widened-scope ≥70% measurement is historical, not current
      assurance.
