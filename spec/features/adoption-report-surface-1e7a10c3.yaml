id: F-1e7a10c3
title: Adoption report surface — clad measure --sessions renders the B1 verdict
status: done
modules:
  - src/cli/clad.ts
  - src/events/session-report.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-b281f9ec
    statement: When the sessions report renders with adoption signal present, the
      system shall append the adoption section, gated ONLY on hasSignal.
    notes: >-
      ## Why

      The adoption reducer (F-0023ba22) computes the B1 verdict but nothing
      renders it. Gating on hasSignal — never on ValueDeliverySummary.total —
      was the adversarial review's core repair: a cycles-only ledger (CLI-only
      usage, value lane unwired) is the strongest non-adoption evidence and must
      render, not be suppressed.
  - id: AC-14badb09
    statement: The measure --sessions --json output shall gain an additive adoption
      key (always present in JSON mode) while every existing key stays
      byte-stable.
  - id: AC-95686e07
    statement: The existing SILENT/UNWIRED message shall stay byte-identical and
      co-render with the adoption section when cycles ran while the value lane
      was silent or unwired.
  - id: AC-32fe3220
    statement: When hasSignal is false, the text output shall be unchanged from the
      pre-feature behavior.
