acceptance_criteria:
  - id: AC-149
    statement: When the Performance or Visual obligation applies, the system shall
      derive runner availability, configuration, and outcome from its sealed
      descriptor inputs and record a same-run observation as pass, fail, or
      unobserved, unless the compiler proves not-applicable.
    notes: >
      ## Historical schema-0.1 note

      2026-05-19 · v0.2.12 · 5328e63. Performance/Visual execa fixtures:
      language,

      script, exit, error, null, and override cases; at least 85% line coverage
      for

      both sources; non-current. Released title: "Stage runner tests batch 3 —
      every stage covered".
  - id: AC-150
    statement: When UAT applies to a feature, the system shall reduce only a
      verified current human feature receipt whose signed criterion matrix
      exactly enumerates the compiled criterion addresses and whose
      reviewed-input, runtime-dependency, and implementation-author digests
      match the closure and classify all-pass evidence as pass, an explicit
      negative as fail, and missing, untrusted, stale, or incomplete-matrix
      evidence as unobserved.
    notes: |
      ## Historical schema-0.1 note
      2026-05-19 · v0.2.12 · 5328e63. UAT appendEvidence fixtures: absent specs,
      audit states, human/tool failures, status filters, and multiple features;
      at least 85% line coverage; non-current.
  - id: AC-151
    statement: While current runner proof is evaluated, the assurance kernel shall
      derive it per obligation from current observations and treat the former
      twelve-runner test-file milestone as historical evidence only.
    kind: quality
    notes: |
      ## Historical schema-0.1 note
      The twelve-runner, ≥75% milestone is historical, not current proof.
  - id: AC-152
    statement: While current coverage assurance is evaluated, the assurance registry
      shall derive it from the coverage obligation and treat the v0.2.12
      measurement as historical evidence only.
    kind: quality
    notes: |
      ## Historical schema-0.1 note
      v0.2.12’s 84.23% to ≥90% measurement is historical, not current assurance.
