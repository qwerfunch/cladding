acceptance_criteria:
  - id: AC-ce8fe171
    statement: The four README variants shall state the record claim at its verified
      level by locating what was verified in committed attestation content, who
      and when in the local event ledger, and why in the specification without
      claiming audit- or regulation-grade record keeping.
    kind: quality
    notes: >-
      ## Why

      Verified 2026-07-04: the who/when ledger is gitignored with a 5MB
      single-generation rotation (history beyond it is destroyed) and records
      the git/OS account (AI vs human indistinguishable); evidence_refs cover
      51% of shards. "Who · what · why is all on the record — evidence for
      audits, regulatory response" overclaims on who and durability.
      Continuation of the 0.6.x Honest release series.
  - id: AC-374f723c
    statement: The segregation-of-duties sentence naming EU AI Act / SOX shall carry
      the spirit-not-certification hedge in every variant (README.ko.md,
      README.html, README.ko.html gain parity with README.md).
  - id: AC-23cfa17d
    statement: The README variants shall contain no unhedged immutability,
      tamper-proof, or all-on-the-record claim and remain protected by a needle
      sweep across all four variants.
    kind: quality
  - id: AC-bf20e7cc
    statement: When the who-ledger is deferred, the system's backlog doc shall carry
      the deferral entry with its reopen trigger.
