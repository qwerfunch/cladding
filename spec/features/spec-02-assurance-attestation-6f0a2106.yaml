acceptance_criteria:
  - id: AC-6f0a2101
    statement: The assurance authority shall derive official and extension stage
      identities from one descriptor registry.
  - id: AC-6f0a2102
    statement: The assurance authority shall reduce applicable observations with
      failure dominance and explicit unobserved reasons.
  - id: AC-6f0a2103
    statement: The assurance authority shall require a compiler applicability proof
      before marking an obligation not applicable.
  - id: AC-6f0a2104
    statement: The assurance authority shall seal contract, subject, verification,
      and runtime-dependency closures deterministically.
  - id: AC-6f0a2105
    statement: The assurance authority shall keep an unrelated sibling criterion
      outside a criterion subject closure.
  - id: AC-6f0a2111
    statement: The assurance authority shall require only profile-applicable
      closures before an authoritative verdict or stamp.
  - id: AC-6f0a2106
    statement: The assurance authority shall project legacy stage results through
      one profile reducer without executing a stage twice.
  - id: AC-6f0a2107
    statement: The assurance authority shall reject a downgraded requested assurance
      level and a stronger unbounded override.
  - id: AC-6f0a2108
    statement: The assurance authority shall write attestation v3 only from a
      profile-complete GREEN completion, push, or release verdict and only for a
      feature in that compiler-effective scope at its exact input digest.
  - id: AC-6f0a2109
    statement: The assurance authority shall read v1 and v2 attestations while
      applying v3 closure freshness when present.
  - id: AC-6f0a2110
    statement: When a schema 0.2 feature is completed, the completion profile shall
      preserve the flip, gate, compensation, and transaction invariants.
design_impact:
  classification: structural
  rationale: F6 centralizes assurance identity, closure freshness, profile
    reduction, stage compatibility, and v3 sealing without adding an issuer or
    scheduler.
