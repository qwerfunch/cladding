id: F-64a5c159
title: Live graph view — clad graph serve (http + fs.watch + SSE auto-reload) +
  clad_get_graph MCP
status: done
modules:
  - src/cli/graph-serve.ts
  - src/cli/clad.ts
  - src/serve/server.ts
depends_on: []
capability_refs:
  - knowledge-graph
acceptance_criteria:
  - id: AC-6618e320
    statement: When clad graph serve runs, the system shall serve GET / (live
      viewer), GET /graph.json (freshly recomputed graph), and GET /events (SSE
      stream) from a stdlib node:http server.
    notes: >-
      ## Why

      User reframe: the graph is a live derivation of the spec, so the view must
      auto-update as development proceeds, not be a re-exported snapshot.
      buildGraph is pure/stateless — recompute per request = always live, no
      stale-trap.
  - id: AC-94d847fb
    statement: When a watched spec/doc file changes, the server shall (debounced)
      broadcast an SSE refresh so connected viewers auto-update.
    notes: >-
      ## Decision

      node:fs.watch (stdlib) on spec/ + docs/, ~400ms debounce (fs.watch is
      platform-racy; debounce coalesces). No stale-trap: server always
      recomputes; if it dies the connection closes (visible).
  - id: AC-236bcc1e
    statement: When clad_get_graph is called with a query, the graph service shall
      return the live focused subgraph JSON with schema_version and return a
      stats summary rather than the full node and edge dump when called without
      a query.
    kind: behavior
    notes: >-
      ## Why (0.7.1)

      The 0.7.0 no-query form returned the whole graph pretty-printed — measured
      285KB (~70k tokens) on cladding-self in ONE MCP result, contradicting the
      working-set budget discipline. Summary + hint keeps the tool safe to call
      blind; full dumps live on the CLI (clad graph export).
