id: F-bb15e6
title: clad doctor verb consumes sentinel-miss telemetry (v0.3.40)
status: done
modules:
  - src/core/telemetry-summary.ts
  - src/cli/doctor.ts
  - src/cli/clad.ts
depends_on:
  - F-65814a
capability_refs:
  - harness-cli
  - mcp-host
acceptance_criteria:
  - id: AC-001
    statement: The system shall provide a pure aggregation library reducing an Event
      slice into SentinelMissSummary and EventCounts shapes so the doctor verb
      and future telemetry consumers share one reducer.
  - id: AC-002
    statement: The system shall add a clad doctor handler that reads
      events.log.jsonl, runs the aggregation library, and renders the
      human-readable LLM dispatcher health surface.
  - id: AC-003
    statement: While the --json flag is set on clad doctor, the system shall emit
      the DoctorReport shape verbatim and skip the formatted text surface so MCP
      clients parse a clean document.
  - id: AC-004
    statement: While events.log.jsonl is absent, the system shall print a friendly
      note and exit 0 instead of crashing so a greenfield workspace surfaces the
      same exit code as a healthy host.
  - id: AC-005
    statement: While events.log.jsonl exists but cannot be parsed as JSONL, the
      system shall emit a fail pulse and exit 1 so corrupt telemetry is
      observable to CI consumers without leaking partial summary state.
  - id: AC-006
    statement: The system shall register clad doctor in createProgram alongside the
      existing ten verbs so the CLI exposes the new LLM dispatcher health
      surface.
    evidence_refs:
      - src/cli/clad.ts
