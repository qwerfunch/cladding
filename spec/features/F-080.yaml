id: F-080
title: HARNESS_INTEGRITY — multi-host manifest schema + version drift (v0.3.5)
status: done
modules:
  - src/stages/detectors/harness-integrity.ts
  - tests/stages/harness-integrity.test.ts
depends_on:
  - F-076
  - F-077
  - F-078
capability_refs: []
acceptance_criteria:
  - id: AC-241
    statement: The system shall keep the original v0.2.4 detector-count invariant
      intact in the extended detector — same severity ladder (error · warn ·
      info), same trigger conditions, same regression target.
  - id: AC-242
    statement: The system shall validate each of the three host plugin manifests
      (Claude Code, Codex, Gemini CLI) against its per-host required-field
      schema and emit a per-host error finding when a required field is missing.
  - id: AC-243
    statement: While a host manifest is present but its JSON is malformed, the
      system shall emit a warn finding (not an error) so a soft parse issue
      surfaces in `clad check --strict` without blocking the rest of the
      integrity sweep.
  - id: AC-244
    statement: The system shall enforce cross-manifest version consistency by
      reading package.json version as the baseline and comparing it to each host
      manifest version; any mismatch trips a per-host error finding so a release
      with a half-bumped manifest set cannot ship.
  - id: AC-245
    statement: If package.json is absent or has no version field, then the detector
      shall skip the cross-manifest version check silently so it remains a soft
      validator on non-cladding directories.
    kind: behavior
