id: F-10cc42d1
title: Derived-file write guard during in-progress git operations
status: done
modules:
  - src/core/git-ops.ts
  - src/cli/clad.ts
  - src/cli/update.ts
  - src/cli/done.ts
  - src/serve/server.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-578c6226
    statement: While a git operation is in progress, the system shall not write
      spec/attestation.yaml on a GREEN gate and note the deferral instead.
    kind: behavior
    notes: >-
      ## Why

      A gate run mid-merge computes module hashes from a partially merged tree;
      stamping it as verified would commit garbage into the merge commit.
      Observed residue class on 2026-06-29 (external-PR evaluation) came from
      CLI-invoked check/sync during branch operations — the Stop hook itself
      writes nothing (verified hook.ts:339-417).
  - id: AC-28d60113
    statement: When derived-file writers run during an in-progress git operation,
      the system shall skip all of them (inventory, feature index, doc-links,
      test_ref repair, deliverable maintenance) while keeping read-only behavior
      intact.
  - id: AC-611089cf
    statement: If a git operation is in progress, then the system shall refuse clad
      done with an explanatory error and make no writes.
    kind: behavior
  - id: AC-249b0837
    statement: The git-operation probe shall resolve the git dir via git rev-parse
      (worktree layouts included) and return false in non-git directories or on
      any probe error, so the guard can never break normal operation.
