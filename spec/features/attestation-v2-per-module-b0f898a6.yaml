id: F-b0f898a6
title: Attestation v2 — per-module hashes + constant feature markers
  (merge-friendly encoding)
status: done
modules:
  - src/spec/attestation.ts
  - src/stages/detectors/stale-attestation.ts
  - src/ui/panel.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-35f55851
    statement: When the gate attests, the system shall write the v2 two-section
      format whose line-change surface is one line per changed module file.
    notes: >-
      ## Why

      v1 hashed each feature over ALL its module bytes: one shared-file edit
      rewrote every co-owner's line (avg 2.1, hubs dozens) — the #1
      merge-conflict surface in parallel work. Empirically verified (30
      scratch-repo git experiments, 2026-07-04): the same disjoint edit that
      conflicts as a 12-line block in v1 merges CLEAN in v2 under plain 3-way —
      GitHub PR path included. Boundary condition (documented, accepted): edits
      landing on the identical or immediately-adjacent sorted line still
      conflict (git needs one buffer line); ~0.5% tail for hash-keyed markers,
      higher where contributors cluster in one directory.
  - id: AC-458c0035
    statement: "The attestation reader shall accept both v1 (attested:
      feature→tree-hash) and v2 files, preserving pre-change staleness verdicts
      for v1 files, so adopter repos transition on their next GREEN gate with no
      manual step."
  - id: AC-ec3d293e
    statement: When evaluating v2, the system shall preserve both staleness verdicts
      (never-attested, module-drifted) and name the drifted module.
  - id: AC-d6e6f792
    statement: If .gitattributes assigns merge=union to spec/attestation.yaml, then
      the system's attribute-pin test shall fail.
    kind: constraint
    rationale: Protects attestation serialization from an unsafe merge driver.
    notes: >-
      ## Why

      Union converts a rare, loud, safe conflict into a rare SILENT edit-revert
      (proven in v2 format in the scratch experiments). GitHub ignores merge
      attributes either way, and the dup-tolerant last-win reader stays as
      defense-in-depth.
