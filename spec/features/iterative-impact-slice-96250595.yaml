  - src/optimizer/working-set.ts
depends_on:
  - F-7794a6bc
  - F-06dfdad6
capability_refs: []
acceptance_criteria:
  - id: AC-77a026
    statement: When buildIterativeImpactSlice runs, the system shall expand from
      initialDepth and stop at the first depth meeting a deterministic
      sufficiency criterion (coverage / exhaustion / marginal-yield), widening
      narrow misses but not over-expanding complete ones.
    notes: >-
      ## Why

      Fixed depth=1 (buildImpactSlice) under-reports 2nd-hop dependents — the
      'narrow miss' that surfaced in the working-set A/Bs. ## Calibration

      Default criteria (coverage 0.9 + marginal-yield 0.05 + exhaustion; NOT
      'target-nodes') were chosen by simulating 522 cladding-self queries:
      'target-nodes' fired at depth 1 everywhere (test_refs ride along
      immediately) and stopped at ~50% coverage = false completeness. Honest
      limit: cladding's large fan-out hubs never reach 90% coverage at any depth
      → they stop on marginal-yield/max-depth with an honest partial coverage,
      which is correct (giving all ~100 dependents would be noise).
  - id: AC-f77588
    statement: The result shall be self-describing and deterministic, carry
      depthUsed, a stoppedBy reason, and a coverage fraction defined as radius
      intersect all-known-dependents, produce byte-identical results for
      identical specification state so a host can cache and diff it, and not
      report coverage below the threshold for coverage or exhaustion stops.
    kind: quality
  - id: AC-4c8e3f
    statement: When the query resolves to no feature, the system shall return the
      canonical buildImpactSlice not_found miss.
