id: F-09d68b
title: clad refine verb closes the onboarding Q&A loop (v0.3.44)
status: done
modules:
  - src/cli/scan/onboarding-state.ts
  - src/cli/scan/intent-onboarding.ts
  - src/cli/clarify.ts
  - src/cli/init.ts
  - src/cli/clad.ts
  - src/agents/orchestrator.md
  - skills/clarify/SKILL.md
depends_on:
  - F-56abaa
capability_refs:
  - harness-cli
acceptance_criteria:
  - id: AC-001
    statement: The system shall add an onboarding-state library that persists the
      Q&A loop to .cladding/onboarding/state.yaml and exposes helpers for
      loading, saving, advancing, de-duplicating, and completing the session.
  - id: AC-002
    statement: The system shall extend intent-onboarding with a refinement prompt
      builder + interpreter that pass the full Q-A history plus current artifact
      bodies into the LLM so the response refines artifacts based on every
      answer so far.
  - id: AC-003
    statement: While the LLM dispatcher is unavailable or returns an unusable
      response during refinement, the system shall preserve the current artifact
      bodies and append the latest Q-A pair as a footnote under a Q&A log
      heading in docs/project-context.md so the user answer is captured visibly.
  - id: AC-004
    statement: When onboarding has a pending clarification, the clad clarify command
      shall join supplied answer tokens and commit the resulting onboarding
      artifact and state transition through its declared proposal-safe path.
    kind: behavior
    notes: >
      ## Historical note

      The public verb was renamed from refine and its old monolithic state-file
      narrative is obsolete.
  - id: AC-005
    statement: When a current onboarding refinement path needs persistent state, the
      refinement path shall use the artifact and transaction ownership declared
      by the current schema rather than asserted state.yaml history.
    kind: behavior
    notes: >
      ## Historical schema-0.1 note

      The asserted state.yaml refinement history is historical, not ownership
      proof.
  - id: AC-006
    statement: The planner guidance shall describe the current clarify and
      design-impact boundary from the canonical persona source and generated
      mirrors while treating the retired Librarian and refine skill story as
      historical.
    kind: quality
    notes: >
      ## Historical schema-0.1 note

      The Librarian/refine skill loop is historical, not current planner
      authority.
