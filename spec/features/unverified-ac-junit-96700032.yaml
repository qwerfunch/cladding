id: F-96700032
title: UNVERIFIED_AC — verify test_refs ran and passed via JUnit XML (close
  AC→test→observed-pass)
status: done
modules:
  - src/stages/junit-report.ts
  - src/stages/detectors/unverified-ac.ts
  - src/stages/toolchain/gate-config.ts
  - src/stages/detectors/index.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-ab798b7c
    statement: When a JUnit report is present, the system shall verify that each
      done AC's referenced tests ran and passed.
  - id: AC-75ab1c26
    statement: If a referenced test failed, then the system shall emit an error
      finding (a done AC must be backed by passing tests).
  - id: AC-0ac3333c
    statement: If a referenced test was only skipped, then the system shall emit an
      error finding (nothing verified the AC).
  - id: AC-f1cb906a
    statement: While a referenced test has no observed result in a present report,
      the system shall emit a warn finding.
  - id: AC-44e7172f
    statement: While no JUnit report is present, the system shall emit no findings
      and leave the existence check as the baseline.
  - id: AC-14bdc224
    statement: The system shall parse JUnit XML deterministically without an XML
      dependency and match test_ref paths tolerantly.
