id: F-50ff43
title: META_INTEGRITY skips (not errors) when src/spec/schema.json is absent —
  kill the false ENOENT in every user project
status: done
modules:
  - src/stages/detectors/meta-integrity.ts
  - tests/stages/meta-integrity.test.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: If src/spec/schema.json is absent, then the META_INTEGRITY detector
      shall skip the schema self-check rather than report a false error.
    kind: behavior
  - id: AC-002
    statement: While schema.json is present but invalid, the system shall still emit
      an error.
  - id: AC-003
    statement: The system shall run the spec.yaml schema-version check regardless of
      schema.json presence.
