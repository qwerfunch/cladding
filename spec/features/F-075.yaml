id: F-075
title: Host adapter MCP routing + release readiness sweep (v0.2.26, v0.3.0 Phase
  B prime)
status: done
modules:
  - src/adapters/host/sampling-context.ts
  - src/cli/clad.ts
  - scripts/build.mjs
  - SECURITY.md
  - README.md
  - README.ko.md
depends_on:
  - F-049
  - F-073
  - F-074
capability_refs: []
acceptance_criteria:
  - id: AC-217
    kind: behavior
    statement: When clad serve registers the active MCP server, the sampling context
      module shall let host callers read that server back through one
      process-scoped accessor.
  - id: AC-218
    kind: behavior
    statement: While clad serve has registered an MCP server, the sampling context
      shall return that server so the scan dispatcher routes sampling through
      the host.
  - id: AC-219
    kind: behavior
    statement: While no MCP server is registered, the sampling context shall return
      no server so callers fall back to their standalone path.
  - id: AC-220
    statement: The system shall ship a minified single-file bundle (dist/clad.js) so
      the MCP SDK dependency added in v0.2.24 does not bloat the install
      footprint beyond ~1.1 MB.
    evidence_refs:
      - scripts/build.mjs
  - id: AC-221
    statement: The system shall document four structural invariants for the MCP
      server surface in SECURITY.md so a regression on any of them counts as a
      security issue.
    evidence_refs:
      - SECURITY.md
  - id: AC-222
    statement: The system shall keep README.md and README.ko.md status lines in
      lockstep across each release so the bilingual surface presents the same
      capability inventory.
    evidence_refs:
      - README.md
      - README.ko.md
