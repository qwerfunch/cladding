id: F-075
title: Host adapter MCP routing + release readiness sweep (v0.2.26, v0.3.0 Phase
  B prime)
status: done
modules:
  - src/adapters/host/sampling-context.ts
  - src/adapters/host/claude-code.ts
  - src/adapters/host/generic-mcp.ts
  - src/cli/clad.ts
  - scripts/build.mjs
  - SECURITY.md
  - README.md
  - README.ko.md
depends_on:
  - F-049
  - F-073
  - F-074
capability_refs: []
acceptance_criteria:
  - id: AC-217
    statement: The system shall expose a process-scoped sampling context module that
      lets clad serve register the active MCP server and lets host adapters read
      it back so the routing decision is uniform across all host adapters.
  - id: AC-218
    statement: While clad serve has registered an MCP server, the system shall route
      invokeAgent and healthCheck through McpSamplingTransport with a
      host-tagged id (mcp-sampling:claude-code or mcp-sampling:generic-mcp)
      instead of the Mock fallback.
  - id: AC-219
    statement: While no MCP server is registered, the system shall route host
      adapters through the Mock fallback transport so unit tests and standalone
      clad invocations keep their pre-v0.2.26 behaviour.
  - id: AC-220
    statement: The system shall ship a minified single-file bundle (dist/clad.js) so
      the MCP SDK dependency added in v0.2.24 does not bloat the install
      footprint beyond ~1.1 MB.
    evidence_refs:
      - scripts/build.mjs
  - id: AC-221
    statement: The system shall document four structural invariants for the MCP
      server surface in SECURITY.md so a regression on any of them counts as a
      security issue.
    evidence_refs:
      - SECURITY.md
  - id: AC-222
    statement: The system shall keep README.md and README.ko.md status lines in
      lockstep across each release so the bilingual surface presents the same
      capability inventory.
    evidence_refs:
      - README.md
      - README.ko.md
