id: F-bae800bd
slug: ab-case-doc-binding
title: "A/B case-study docs bound into the knowledge graph via explicit doc-link declarations"
status: done
modules:
  - src/spec/doc-references.ts
  - docs/ab-evaluation/case-efficiency-measurement.md
  - docs/ab-evaluation/case-working-set-landmine.md
  - docs/ab-evaluation/case-graph-efficiency.md
