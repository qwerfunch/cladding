acceptance_criteria:
  - id: AC-b0e7dd4d
    statement: When a doc declares feature links explicitly, the system shall
      extract and materialize them in the doc-link index.
    notes: >-
      ## Why

      Backlog B9: five A/B case studies are knowledge-graph orphans — their
      prose reports findings without naming feature ids, so the extractor sees
      nothing. Deleting the NULL-result files was REJECTED (publication bias);
      binding keeps the evidence reachable from the features it substantiates.
      README.md's efficiency claim is receipted only by
      case-efficiency-measurement.md.
  - id: AC-91d9d1a5
    statement: The documentation catalog shall require each of the five A/B case
      docs efficiency-measurement, working-set-landmine, graph-efficiency,
      iterative-vs-fixed-vapt, and doverunner-scale to declare the features its
      evidence substantiates, including F-16138071 for measure, F-06dfdad6 for
      working-set, and F-7794a6bc for graph impact evidence where applicable,
      and appear as a linked graph doc node rather than an orphan.
    kind: behavior
  - id: AC-437fb005
    statement: The Docs without declarations shall extract byte-identically to the
      pre-change behavior, so adopter repos see no index churn.
    kind: quality
  - id: AC-2ee28415
    statement: The DOC_LINK_INTEGRITY shall stay green over the materialized
      declarations (every declared id resolves).
    kind: behavior
