id: F-0f2984d0
title: "infer-deps flags dynamic-import files — honest recall: surface what
  static extraction cannot see"
status: done
modules:
  - src/optimizer/infer-depends-on.ts
  - src/cli/clad.ts
depends_on:
  - F-2be3e3bb
capability_refs: []
acceptance_criteria:
  - id: AC-d7c33b
    statement: When a module uses dynamic imports, the system shall list its path in
      dynamicImportFiles so the under-reported edges are visible, not hidden.
    notes: >-
      ## Why

      The final vapt graph-traversal test measured inference recall at ~70-75% —
      the biggest remaining gap was dynamic imports (importlib/getattr) that
      regex extraction can't see (e.g. catalog/tool_inventory.py). Rather than
      silently miss them, surface the files so a maintainer reviews them by
      hand. Honest-recall, not a precision change (static edges from the same
      files are still inferred). clad infer-deps prints dynamic_import_files.
  - id: AC-1781e6
    statement: The `dynamicImportFiles` function shall return a sorted additive list
      of files carrying untrackable dependencies without changing inferred edges
      and expose that list as `dynamic_import_files` through `clad infer-deps`.
    kind: quality
