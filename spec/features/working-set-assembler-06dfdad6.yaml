id: F-06dfdad6
title: Working-set assembler — one token-budgeted, code-bearing context payload
  (forward+backward fused) for LLM dev
status: done
modules:
  - src/optimizer/working-set.ts
  - src/optimizer/code-excerpt.ts
  - src/serve/server.ts
depends_on:
  - F-d2c806
  - F-7794a6bc
capability_refs: []
acceptance_criteria:
  - id: AC-62d89e
    statement: When buildWorkingSet runs, the system shall resolve the focus from
      id/slug/module (module multi-owner → alphabetically-first owner +
      co-owners listed) or return a not_found miss.
    notes: >-
      ## Why

      Freeze F-d2c806's buildContextSlice + clad_get_context (schema_version=1,
      existing tests) — this is an ADDITIVE buildWorkingSet, never a mutation of
      the existing slice (sim verdict: backward-compat blocker).
  - id: AC-d2b3c8
    statement: The working-set assembler shall fuse in one structured payload
      `must-edit` with the focus feature and full ACs, needs with forward
      depends_on ancestors, `breaks-if-changed` with backward dependents and the
      regression-test union where a module query seeds every co-owner, verify
      with scenarios and test_refs and oracle_refs and EARS unwanted or state
      high-risk AC flags, and guidance with ai_hints preferred_patterns so one
      call replaces the forward-and-backward two-call dance and hand-grep.
    kind: behavior
    notes: >-
      ## Correction (0.7.1)

      0.7.0 computed the backward radius from the alphabetically-first owner
      only — a shared file's other owners contributed nothing (src/cli/clad.ts
      on cladding-self: impacted 0 vs the real 83). The module query now passes
      through to the iterative slice, which seeds all owners.
  - id: AC-42bd08
    statement: When source is included, the system shall read it via a cwd-bounded,
      extension-whitelisted, clipping reader that degrades to a marker on
      binary/missing/oversize.
  - id: AC-05ea70
    statement: While the payload would exceed the token budget, the working-set
      assembler shall clip ancestors then code then deeper backward dependents
      and tests but never the depth-1 direct set, use marker-inclusive fit
      checks, record budget.truncated[], and retain the focus even when it alone
      exceeds the cap.
    kind: quality
    notes: >-
      ## Correction (0.7.1)

      0.7.0 never clipped breaks_if_changed, so hub features + module fan-out
      broke the budget contract exactly where scale bites (simulated: fan-out
      doubles breach paths 17→33/144, worst 2.9x). Clip order (breaks AFTER
      code) was simulation-compared against clip-before-code and is strictly
      better; marker-inclusive fit checks close the +3..10-token overshoot the
      old loops carried.
  - id: AC-c2cef0
    statement: When tools register, the tool registry shall add clad_get_working_set
      without altering clad_get_context and include the skill kind in the
      clad_get_graph description.
    kind: behavior
  - id: AC-833f1c
    statement: The buildWorkingSet function shall produce byte-identical structural
      ordering without timestamps or randomness for identical specification
      state and file contents so a host can cache and diff it.
    kind: quality
