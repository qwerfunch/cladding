id: F-904495a5
title: Changelog render — the spec becomes human-facing change documents
status: done
modules:
  - src/changelog/collect.ts
  - src/changelog/render.ts
  - src/cli/changelog.ts
  - src/cli/clad.ts
  - src/serve/server.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-2c3f34
    statement: The system shall collect shipped changes for <since>..HEAD into a
      deterministic manifest — classifying feature shards from ONE `git diff
      --name-status` (added-as-done / flipped-to-done / modified-while-done /
      archived, with `git show <ref>:<path>` only for shards whose status must
      be compared), grouping them by capability with an `uncategorized` bucket
      for unmatched features, diffing the spec.yaml inventory counts, and
      listing conventional feat/fix commits that name no feature id — with
      sorted keys and sorted ids so two runs serialize byte-identically.
    notes: >
      ## Why

      Traceability for non-coders/audit is cladding's measured value (48-feature
      A/B:

      46 shards/198 ACs vs code-only) — so the release-notes input must be
      COLLECTED

      deterministically, never LLM-recalled. ONE repo-wide diff (enterprise
      review E8:

      no per-shard `git show` loop) keeps cost O(changed shards). The
      `uncategorized`

      bucket is itself a drift signal: a feature shipped without a Tier-B
      capability link.

      The unsharded feat/fix list closes the under-reporting gap honestly — work
      that

      bypassed the spec is reported as exactly that, not silently dropped.
  - id: AC-f38358
    statement: If the since ref does not resolve to a commit in the repository
      (unknown tag/sha, or no tags exist to anchor the default), then the system
      shall fail with a clear error naming the ref — never returning a silently
      empty manifest.
    notes: >
      ## Why

      A silently-empty changelog is the reporting twin of the Vacuous Green: "no
      shipped

      changes" must be a verified fact about the range, never a swallowed input
      error

      masquerading as one.
  - id: AC-72a97f
    statement: The system shall render a capability-grouped Markdown manifest whose
      prose uses only feature titles and acceptance-criterion sentences without
      internal F- or AC- ids and includes an explicit no shipped changes since
      <ref> line for zero changes rather than a blank document.
    kind: behavior
    notes: >
      ## Why

      Release notes are the purest user surface cladding ships, so the Soft
      Shell id ban

      (03-ux §1.2) applies hardest here. This renderer is the deterministic
      no-LLM floor;

      the changelog skill layers EN+KO prose on top of the SAME manifest, so
      both surfaces

      can only say what a feature title or AC sentence already says.
  - id: AC-60067c
    statement: The system shall render an audit table — feature | AC | EARS |
      verification refs — that keeps internal ids and marks each bare-path ref
      resolved (✓) or unresolved (✗) on disk, labeling
      derived:/self-dogfood:/fixture:-prefixed refs by kind rather than
      resolving them.
    notes: >
      ## Why

      The audit surface is the ONE place internal ids belong (forensic replay).
      The ✗ mark

      makes spec-annotation drift — stale test_refs, the defect class the
      48-feature A/B

      measured (17 orphan-test findings) — visible to a non-coder reading a
      single table.

      A `derived:` suggestion is labeled, never ✓-resolved: machine-suggested
      evidence must

      not masquerade as author-confirmed verification.
