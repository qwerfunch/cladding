id: F-ee47fc2b
title: Reverse-edge index — backlinks (dependents, module owners, test
  citations) derived from the spec, memoized per instance
status: archived
modules:
  - src/spec/reverse-index.ts
depends_on: []
capability_refs:
  - knowledge-graph
acceptance_criteria:
  - id: AC-ea650cce
    statement: When buildReverseIndex is called with a loaded spec, the system shall
      produce three reverse maps — featureId→direct-dependent ids,
      module-path→owning-feature-id set, and test-file-path→citing-feature-id
      set — derived purely from the spec without mutating it.
    notes: >-
      ## Why

      pruneToFeature walks depends_on UP (ancestors) only; there is no reverse
      lookup, so 'what depends on me / which features touch this file / which
      feature owns this test' force a full shard scan per query. This is the
      backlink seam the whole graph layer reuses.
  - id: AC-5b48c3c7
    statement: The reverseIndexOf accessor shall memoize the reverse index per spec
      instance (WeakMap-keyed), so repeated calls within one run reuse the first
      computation and never re-walk the feature set.
    notes: >-
      ## Decision

      WeakMap<Spec,ReverseIndex> memo, NOT a mutable field on the readonly Spec.
      Cache is keyed by the spec object primeSpecCache already holds
      one-per-run, so it is auto-invalidated when the spec is replaced and
      GC-collected with it. No changes to types.ts/load.ts/drift.ts.
  - id: AC-17365b3c
    statement: The module-ownership model shall remain many-to-many by mapping a
      module path declared by N features to the full set of N feature IDs
      because `modules` records every feature that touches a file rather than
      exclusive ownership.
    kind: behavior
    notes: >-
      ## Why

      Ground-truth: 131/338 module paths in cladding-self are claimed by 2+
      features. `modules` is a touched-by edge. A uniqueness check would be
      wrong; the value is the many-to-many co-change query.
  - id: AC-7db4f09d
    statement: "If a test_ref carries a recognised non-path prefix or a #anchor,
      then the system shall exclude prefixed pseudo-refs from the citation index
      and key real refs by path only (anchor stripped)."
    kind: behavior
archive_reason: Materialized reverse-index authority is retired by the canonical
  GraphIR v2 cutover.
