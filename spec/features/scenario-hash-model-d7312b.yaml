id: F-d7312b
title: Scenario hash ID model — same multi-dev safety as features (v0.3.12)
status: done
modules:
  - src/spec/new.ts
  - src/serve/server.ts
  - src/spec/schema.json
  - src/stages/detectors/slug-conflict.ts
  - src/stages/detectors/id-collision.ts
depends_on:
  - F-67e33f
