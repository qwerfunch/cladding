capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: The system shall provide an internal createScenario helper that
      mirrors createFeature for the scenario surface — same slug regex, same
      hash input shape (with a scenario namespace prefix), same multi-dev safety
      properties.
  - id: AC-002
    statement: The system shall expose createScenario as the `clad_create_scenario`
      MCP tool so a host LLM can invoke it from a natural-language user request.
      No CLI verb is added — same surface boundary as clad_create_feature.
  - id: AC-003
    statement: The system shall widen scenario.id regex to accept new-model S-<hash>
      ids alongside legacy S-NNN, and add an optional slug field so the new
      scenario file format passes schema validation.
    evidence_refs:
      - src/spec/schema.json
  - id: AC-004
    statement: The system shall extend SLUG_CONFLICT and ID_COLLISION detectors so
      they check the scenario namespace independently from the feature namespace
      — a feature and a scenario sharing a slug or an id-namespace prefix do not
      collide because they live in separate directories and separate id-prefix
      spaces.
  - id: AC-005
    statement: While a feature and a scenario share the same slug, the system shall
      NOT raise a SLUG_CONFLICT finding — feature slugs and scenario slugs are
      independent namespaces, just as F-* and S- id prefixes are independent.
