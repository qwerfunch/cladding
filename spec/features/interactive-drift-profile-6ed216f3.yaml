id: F-6ed216f3
title: Interactive drift profile — PostToolUse runs in-process detectors only
status: done
modules:
  - src/stages/drift.ts
  - src/stages/detectors/index.ts
  - src/stages/detectors/architecture-violation.ts
  - src/stages/detectors/hardcoded-secret.ts
  - src/cli/hook.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-870a2ed8
    statement: When runDrift runs with the interactive profile, the system shall
      execute only in-process detectors and list the skipped subprocess
      detectors on the report.
    notes: >-
      ## Why

      PostToolUse ran all 41 detectors per significant edit; the two subprocess
      detectors cost ~5s of the ~6s total (madge ~1.27s + secretlint ~3.75s),
      making every edit drag. Backlog B7 (H/M/M) required an adversarial review
      before implementation — performed 2026-07-04 (regression+worth lenses +
      inline partition verification: exactly 2 subprocess detectors exist).
  - id: AC-b49435f8
    statement: The PostToolUse hook lane shall request the interactive profile,
      while the Stop hook, all check tiers, and the MCP gateFooter keep the full
      detector suite.
  - id: AC-7ecad295
    statement: If the interactive profile is active, then the system shall never
      execute a subprocess-flagged detector.
    kind: constraint
    rationale: Protects the interactive profile from subprocess execution.
  - id: AC-add14522
    statement: The static registry test shall fail when any detector module imports
      a subprocess runner (execa, execFileSync, spawnSync) without carrying the
      subprocess flag, keeping the partition honest as detectors are added.
    kind: behavior
