id: F-e4159959
title: Polyglot toolchain — Swift (SPM) and Flutter/Dart gate detection
status: done
modules:
  - src/stages/toolchain/detect.ts
  - src/stages/toolchain/types.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-aa3d5503
    statement: When a Package.swift manifest is present, the system shall detect
      language 'swift' and resolve the type/lint/test/coverage gates to swift
      build / swiftlint lint / swift test / swift test --enable-code-coverage
      respectively.
  - id: AC-61dd5a8e
    statement: When a pubspec.yaml declaring a flutter dependency is present, the
      system shall detect language 'dart' and resolve the type/test/coverage
      gates to flutter analyze / flutter test / flutter test --coverage.
  - id: AC-4cb02211
    statement: When a pubspec.yaml without a flutter dependency is present, the
      system shall detect language 'dart' and resolve the type/test/coverage
      gates to dart analyze / dart test / dart test --coverage=coverage.
  - id: AC-dca37b0a
    statement: The system shall map the swift and dart secret gate to gitleaks
      detect --no-banner and intentionally omit the architecture gate,
      consistent with the other compiled-language entries.
