id: F-fb9b48a5
title: SessionStart card advertises the context capability and injects ai_hints
  preferred patterns
status: done
modules:
  - src/cli/hook.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-b08371b3
    statement: When SessionStart fires in a cladding project, the
      renderSessionStartCard shall append one context-capability line describing
      what cladding can slice for the work at hand — naming NO MCP tool (agents
      discover tools via the protocol; users must never meet internal names).
    kind: behavior
    notes: "WHY (amended 2026-07-06, F-f46d5c61): the original tool-name
      advertisement carried its own falsification clause — remove if pull rate
      stays 0 — and the B1 protocol measured exactly that (64 cycles, 0 pulls).
      Names removed per the user-language pivot; the capability phrasing stays
      as the once-per-session nudge."
  - id: AC-14f7778c
    statement: Where preferred_patterns exist, the card shall render at most 2
      prefer lines whose prefer/over/when values are verbatim substrings of the
      spec.yaml values (no paraphrase), each line truncated to 140 characters.
    notes: "WHY: cross-vendor A/B showed a shared artifact both vendors READ
      converges behavior; ai_hints currently reaches an agent only via a
      working-set call it never makes."
  - id: AC-20893cbc
    statement: "The system shall keep the total SessionStart card at or under 9
      lines at any feature count, with ordering: counts, in-progress, last gate,
      stop-block, tools, prefer, policy line."
    notes: "WHY: noise budget — the session card is the one guaranteed-read surface;
      bloat here trains users to ignore it."
  - id: AC-5303e049
    statement: If ai_hints is absent or malformed, then the card shall render only
      the tools-advertisement line with no prefer lines, not throw, and preserve
      the hook error-as-silence contract.
    kind: behavior
    notes: "WHY: guidance is best-effort; a broken hints block must never cost the
      session card."
