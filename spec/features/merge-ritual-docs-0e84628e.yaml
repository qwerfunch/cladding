id: F-0e84628e
title: Derived-file merge ritual — canonical docs for conflicts, PR surface, and
  the v1-to-v2 transition
status: done
modules:
  - docs/spec-ids-multi-dev.md
  - CLAUDE.md
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-19f796fe
    statement: "The docs/spec-ids-multi-dev.md document shall carry the canonical
      derived-file merge ritual: never hand-resolve spec/attestation.yaml or
      spec/index.yaml, accept either side, complete the merge, run clad check
      --tier=pre-push --strict so GREEN rewrites the truth, commit the rewrite,
      explain why the PR surface still conflicts because GitHub ignores merge
      attributes, state the v2 clean disjoint-module merge property with its
      adjacent-sorted-line boundary caveat, and give the one-time v1-to-v2
      transition ritual in which branches cut before cutover rebase past it
      taking the v2 side and then run the gate."
    kind: quality
    notes: >-
      ## Why

      Every piece of the machinery shipped in 0.8.1 (v2 encoding, git-op guard,
      union removal) reduces conflicts but cannot eliminate the same-file and
      adjacent-line cases — the ritual is the documented answer for the
      remainder, and hand-resolving hashes is always wrong (both sides are stale
      against the merged tree). Grounded in 30 scratch-repo experiments + the
      real f2/f3 external validations (2026-07-04/05).
  - id: AC-74fcf893
    statement: When CLAUDE.md contains merge guidance, the guidance shall point to
      the canonical section in docs/spec-ids-multi-dev.md.
    kind: quality
  - id: AC-80b79dac
    statement: "The documented attribute state shall match the repository:
      spec/index.yaml keeps merge=union, spec/attestation.yaml carries no merge
      attribute — pinned so a future .gitattributes change forces a doc update."
