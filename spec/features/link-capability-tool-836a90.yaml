id: F-836a90
title: clad_link_capability — accumulative capability authoring (the Tier-B
  firing path, v0.4.x)
status: done
modules:
  - src/spec/new.ts
  - src/serve/server.ts
depends_on:
  - F-f6d13e
capability_refs:
  - mcp-host
acceptance_criteria:
  - id: AC-001
    statement: When clad_link_capability runs, the system shall upsert the feature
      into the named capability — creating the capability if it does not exist
      and otherwise appending the feature without duplication.
  - id: AC-002
    statement: The system shall prevent clad_create_feature from writing
      capabilities and surface only a non-mutating linking hint so the create
      verb remains honest.
    kind: constraint
    rationale: Preserves the create tool’s non-mutating capability boundary.
  - id: AC-003
    statement: The system shall emit schema-valid capabilities so a linked
      capability loads, validates, and resolves its feature references.
