id: F-56abaa
title: intent-aware init with high-quality onboarding refinement (v0.3.43)
status: done
modules:
  - src/cli/scan/intent-onboarding.ts
  - src/cli/init.ts
  - src/cli/clad.ts
  - src/agents/orchestrator.md
  - skills/init/SKILL.md
depends_on:
  - F-bd07d7
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: The system shall add an intent-onboarding library that turns a short
      user description plus observed environment signals into a domain-aware
      6-section LLM prompt and parses the structured response.
  - id: AC-002
    statement: The system shall thread a free-text intent through clad init so
      positional CLI tokens drive intent-aware onboarding when provided.
  - id: AC-003
    statement: While the LLM dispatcher is unavailable or returns an unparseable
      response, the system shall fall back to a deterministic onboarding result
      that quotes the intent verbatim in project-context.md and uses greenfield
      seeds for the other artifacts.
  - id: AC-004
    statement: While the LLM dispatcher returns a response with only one or two
      non-critical sections blank, the system shall keep the LLM-refined
      sections and substitute deterministic bodies only for the blank sections
      while emitting a per-artifact sentinel_miss event under phase onboarding.
  - id: AC-005
    statement: The system shall surface the LLM-generated clarifying questions as
      CLI hints and add an orchestrator-policy ask-first instruction so the AI
      orchestrator drives intent capture before init.
    evidence_refs:
      - src/cli/clad.ts
      - src/agents/orchestrator.md
  - id: AC-006
    statement: The system shall ensure the clarifying questions emitted by the LLM
      stay at product-owner vocabulary level so users without technical
      expertise can still answer.
  - id: AC-007
    statement: The system shall keep the --scan flag and the bare clad init path
      working so direct CLI power users and AI orchestrators have orthogonal
      ways to express the same intent.
    evidence_refs:
      - src/cli/init.ts
      - src/cli/clad.ts
