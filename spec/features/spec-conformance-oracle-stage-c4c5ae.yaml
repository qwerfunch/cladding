id: F-c4c5ae
title: SPEC_CONFORMANCE — impl-blind oracle execution gate stage (stage_2.3,
  No-Vacuous-Green keystone)
status: done
modules:
  - src/stages/spec-conformance.ts
  - tests/stages/spec-conformance.test.ts
  - src/stages/toolchain/gate-config.ts
  - tests/stages/toolchain/gate-config.test.ts
  - src/stages/detectors/unverified-ac.ts
  - src/stages/detectors/spec-conformance.ts
  - tests/stages/detectors/spec-conformance.test.ts
  - src/oracle/payload.ts
  - tests/oracle-payload.test.ts
  - src/oracle/record.ts
  - tests/oracle-record.test.ts
depends_on:
