capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: When an impl-blind oracle suite is present under tests/oracle/, the
      system shall run it against the implementation and fail the gate (exitCode
      1) on any oracle failure.
  - id: AC-002
    statement: If no oracle suite is present, then the system shall skip (exitCode
      2) rather than false-pass, so the absence of oracles is never reported as
      conformance.
    kind: behavior
  - id: AC-003
    statement: If the test runner binary is not installed, then the system shall
      skip rather than false-fail the stage.
    kind: behavior
  - id: AC-004
    statement: While require_oracles is set, the system shall fail the gate for a
      done AC with no oracle, and always fail when a declared oracle_ref
      resolves to nothing.
  - id: AC-005
    statement: While require_oracles is set, the system shall fail the gate when an
      oracle's recorded author is the implementer or its read-manifest
      intersects the feature's modules, so a passing oracle means impl-blind
      conformance.
  - id: AC-006
    statement: When clad oracle is run, the system shall print an impl-blind
      authoring brief (acceptance criteria + decl-only signatures, never bodies)
      for a host-spawned blind sub-agent to author from.
  - id: AC-007
    statement: When clad_author_oracle is called, the system shall write the oracle,
      record its impl-blind provenance, and stamp oracle_refs without malforming
      the shard.
  - id: AC-008
    statement: When spec conformance runs only the impl-blind oracle suite, the
      system shall preserve shared full-suite test reports across that scoped
      invocation, so a later strict gate cannot misread partial oracle results
      as complete test evidence.
    notes: >
      ## Decision

      Snapshot configured and conventional test-report candidates before the
      oracle-only command, then restore existing files and remove candidates
      created only by that partial run.

      ## Why

      The oracle stage appends `tests/oracle` to the project runner, while
      reporters may still overwrite the shared full-suite result path. Without
      restoration, the next strict gate can report false unverified-acceptance
      findings.

      ## Trade-off

      Report preservation holds existing report bytes for the scoped run;
      restoration failures block instead of leaving misleading evidence.
