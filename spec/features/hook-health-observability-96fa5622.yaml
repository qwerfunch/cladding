acceptance_criteria:
  - id: AC-4c90cd04
    statement: The system shall record every recognized Claude Code lifecycle hook
      invocation in a bounded project-local health snapshot so operators can
      distinguish a live hook runtime from silent wiring without growing the
      append-only event log.
  - id: AC-8b37ba53
    statement: If hook-health evidence is inapplicable or unavailable, then the
      system shall preserve hook protocol behavior and report the runtime as not
      observed rather than guessing that it is installed.
    kind: behavior
  - id: AC-8b386416
    statement: When clad doctor reads a project, the system shall report
      evidence-backed hook installation state and the last observed firing time
      for every shipped Claude Code hook event in both the human and
      machine-readable surfaces.
  - id: AC-19d3a3d0
    statement: If positive host-support claims rely on stale matrix evidence, then
      the system shall surface one non-blocking freshness finding without
      weakening or broadening the existing contradictory-claim warning.
    kind: behavior
design_impact:
  classification: none
  rationale: Adds bounded operational telemetry and an additive doctor report
    field; it does not change architecture, capability taxonomy, or gate
    decisions.
  status: resolved
  artifacts: []
