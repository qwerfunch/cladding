id: F-96fa5622
slug: hook-health-observability
title: "Hook health visibility in doctor and host evidence freshness"
status: done
modules:
  - src/cli/hook-health.ts
  - src/cli/hook.ts
  - src/cli/doctor.ts
  - src/cli/clad.ts
  - src/init/host-setup.ts
  - src/stages/detectors/host-claim-drift.ts
  - skills/doctor/SKILL.md
acceptance_criteria:
  - id: AC-4c90cd04
    ears: ubiquitous
    action: "record each recognized Claude Code lifecycle hook invocation before dispatch in one bounded project-local health sidecar"
    response: "the sidecar keeps the current engine version and only the latest ISO timestamp for SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, and Stop; repeated high-frequency tool hooks overwrite fixed keys instead of growing the lifecycle event log"
    text: "The system shall record every recognized Claude Code lifecycle hook invocation in a bounded project-local health snapshot so operators can distinguish a live hook runtime from silent wiring without growing the append-only event log."
    test_refs: ["tests/cli/hook-health.test.ts"]
  - id: AC-8b37ba53
    ears: unwanted
    condition: "if the project has no spec, the hook event is unknown, or the health snapshot cannot be read or written"
    action: "leave the host protocol result unchanged and represent unavailable health evidence as not observed"
    response: "observability never activates Cladding in unrelated projects, never bricks a host session, and never turns malformed local telemetry into an installation claim"
    text: "If hook-health evidence is inapplicable or unavailable, the system shall preserve hook protocol behavior and report the runtime as not observed rather than guessing that it is installed."
    test_refs: ["tests/cli/hook-health.test.ts", "tests/cli/doctor.test.ts"]
  - id: AC-8b386416
    ears: event
    condition: "when clad doctor reads a project"
    action: "report runtime installation evidence, recorded versus current engine version, and the last observed firing time for all five hook events in both text and JSON"
    response: "operators see observed or not-observed installation state plus explicit never-observed gaps without inspecting host registries or raw telemetry files"
    text: "When clad doctor reads a project, the system shall report evidence-backed hook installation state and the last observed firing time for every shipped Claude Code hook event in both the human and machine-readable surfaces."
    test_refs: ["tests/cli/doctor.test.ts", "tests/cli/setup.test.ts"]
  - id: AC-19d3a3d0
    ears: unwanted
    condition: "if a positive README host-support claim relies on matrix evidence older than 30 days or generated by an older Cladding engine"
    action: "emit one informational HOST_CLAIM_DRIFT freshness finding while retaining the existing warning only for claims that exceed recorded grades"
    response: "stale evidence is visible and actionable without changing Phase 0 gate outcomes"
    text: "If positive host-support claims rely on stale matrix evidence, the system shall surface one non-blocking freshness finding without weakening or broadening the existing contradictory-claim warning."
    test_refs: ["tests/stages/detectors/host-claim-drift.test.ts"]
design_impact:
  classification: none
  rationale: "Adds bounded operational telemetry and an additive doctor report field; it does not change architecture, capability taxonomy, or gate decisions."
  status: resolved
  artifacts: []
