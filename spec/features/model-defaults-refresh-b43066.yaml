id: F-b43066
title: Current-generation SDK model defaults, 16k output ceiling, config-file
  model override, token_budget deprecation
status: done
modules:
  - src/cli/scan/dispatcher.ts
  - src/adapters/sdk/anthropic.ts
  - src/adapters/host/transport.ts
  - src/cli/init.ts
  - src/cli/update.ts
  - src/spec/schema.json
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-3c366e
    statement: "The system shall default the SDK dispatch paths to
      current-generation models (onboarding/refinement: claude-sonnet-4-6; agent
      transport: claude-opus-4-8) with a 16384-token output ceiling, replacing
      the two-generation-old claude-3-5-sonnet-latest / claude-opus-4-7 defaults
      and the 4096 clip that bottlenecked rich onboarding output."
    notes: >-
      ## Why

      The onboarding prompt begs for rich domain inference but the SDK path was
      pinned to a 2024-era cheap model with a 4k output clip — the cheapest
      correctness-relevant fix in the repo (design review T5/P2).
  - id: AC-5119fe
    statement: "When .cladding/config.yaml declares agent.model, the system shall
      use it for SDK dispatch unless an explicit per-call model override is
      given (precedence: opts.model > config > default)."
  - id: AC-3da6fd
    statement: While a specification carries ai_hints.token_budget_per_session, the
      system shall keep accepting it through schema 0.7 without writing it from
      init or clarify, report a one-line deprecation in clad update, and keep
      existing specifications valid while the dead policy drains out.
    kind: behavior
    notes: >-
      ## Decision

      alias-and-deprecate, not delete: the field sits inside
      additionalProperties:false — deleting it from the bundled schema would
      make every existing user spec schema-invalid, which since 8623225 fails
      their gate (review C3).
