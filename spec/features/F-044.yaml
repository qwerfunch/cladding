id: F-044
title: Release prep — CHANGELOG · README.ko · commands · gitignore · bin field
status: done
modules:
  - CHANGELOG.md
  - README.ko.md
  - plugins/claude-code/commands/init.md
  - .gitignore
  - package.json
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-070
    statement: The system shall maintain a CHANGELOG.md in Keep a Changelog 1.1.0
      format with an entry per shipped release, so that `gh release create
      --notes-file CHANGELOG.md` works end-to-end.
    evidence_refs:
      - CHANGELOG.md
  - id: AC-071
    statement: The system shall keep README.md (English) and README.ko.md (Korean)
      in lockstep on every release-prep brick — feature inventory, status badge,
      and CLI section match across both files.
    evidence_refs:
      - README.md
      - README.ko.md
  - id: AC-072
    statement: The system shall expose cladding to Claude Code plugin install sites
      via the /cladding:init slash command
      (plugins/claude-code/commands/init.md); the legacy /cladding:clad wrapper
      was retired in v0.4.0 per F-076 AC-227.
    evidence_refs:
      - plugins/claude-code/commands/init.md
  - id: AC-073
    statement: The package.json shall declare a bin field that installs the clad
      binary on user PATH so plugin install sites can call `clad` directly.
    evidence_refs:
      - package.json
