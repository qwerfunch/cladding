    condition: when the router evaluates a prompt matching both a specific rule and the broad run rule
    action: return the first specific rule's verb
    response: the broad run rule does not shadow the specific rule
    text: When the router evaluates a prompt matching both a specific rule and the broad run rule, it shall return the first specific rule's verb.
    test_refs:
      - "tests/router/intent.test.ts#[covers:F-039/AC-060] prioritizes a specific rule over the broad run rule"
    notes: |
      ## Historical schema-0.1 note
      The retired work/drive/sync/check ordering is historical, not current proof.
