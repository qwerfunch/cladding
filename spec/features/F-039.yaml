id: F-039
title: Intent Router — natural language to CLI verb
status: done
modules:
  - router/intent.ts
  - tests/router/intent.test.ts
acceptance_criteria:
  - id: AC-059
    ears: ubiquitous
    action: classify a free-form Korean or English prompt to one of 5 verbs (init ·
      work · drive · sync · check)
    response: returns 'unknown' when no rule fires
    text: The system shall classify a free-form Korean or English prompt into one of
      five verbs — init, work, drive, sync, check — and return 'unknown' when no
      rule fires.
    test_refs:
      - tests/router/intent.test.ts
  - id: AC-060
    ears: ubiquitous
    action: evaluate more-specific rules before the broadest work rule
    response: the work rule never shadows init / drive / sync / check
    text: The router shall evaluate more-specific rules (init, drive, sync, check)
      before the broadest 'work' rule so that 'work' never shadows a
      more-specific intent.
