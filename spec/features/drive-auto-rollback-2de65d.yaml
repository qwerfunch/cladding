id: F-2de65d
title: Iron Law backbone Phase 3.2 — drive loop checkpoint + auto-rollback on
  RETRY_THRESHOLD (v0.3.21)
status: done
modules:
  - src/drive/loop.ts
depends_on:
  - F-c2c996
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: The system shall pin a checkpoint before the first specialist
      dispatch for every ready feature so a later RETRY_THRESHOLD halt has a
      known-good state to roll back to.
  - id: AC-002
    statement: When checkBudget returns a RETRY_THRESHOLD halt, the system shall
      locate the exhausted feature in the retries map and record a rollback to
      its latest checkpoint so the Iron Law §2.5 "auto-rollback after
      self-healing budget exhausted" contract becomes operational on every clad
      drive invocation.
  - id: AC-003
    statement: The system shall skip the rollback record when no prior checkpoint
      exists for the exhausted feature so the audit trail never references a
      checkpoint that was never pinned — a defensive guard for tests, fresh
      repos, or partial state.
  - id: AC-004
    statement: If a halt class other than RETRY_THRESHOLD ends the loop, then the
      drive loop shall not invoke recordRollback so the rollback event remains
      reserved for the one transition that genuinely needs the Iron Law
      fallback.
    kind: behavior
