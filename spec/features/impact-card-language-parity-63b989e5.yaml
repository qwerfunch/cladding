id: F-63b989e5
title: Watched-path filter derives from the language SSoT — impact cards fire
  for every language cladding claims (incl. .tsx)
status: done
modules:
  - src/cli/hook.ts
  - src/stages/toolchain/language-config.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-faae7baf
    statement: When an edited file extension is registered in the language SSoT
      including .tsx or .jsx or .mts or .cts or .kt or .kts or .java or .rb or
      .php or .cs or .fs or .ex or .exs alongside .ts or .js or .py or .rs or
      .go, the isWatchedSourcePath function shall return true.
    kind: behavior
    notes: "WHY: hook.ts hardcodes 5 extensions — .tsx is missing, so a Next.js
      app/page.tsx gets no impact card in cladding's core TS market;
      JVM/Ruby/PHP/C#/Elixir repos get none outside src/."
  - id: AC-0a3cc0bb
    statement: The watched-path filter shall preserve the existing src path-segment
      rule and every existing watched-path verdict for the current test-suite
      cases and keep the extension table in src/stages/toolchain so a future
      language addition changes exactly one place.
    kind: quality
    notes: "WHY: SSoT — the same argument that motivated language-config.ts; zero
      regressions on shipped behavior."
  - id: AC-25c3a256
    statement: If an edited file is a non-source artifact, then the
      isWatchedSourcePath function shall continue returning false so the impact
      card does not fire on configuration or documentation churn.
    kind: behavior
    notes: "WHY: noise budget — widening reach must not widen noise."
  - id: AC-7e325488
    statement: The system shall keep isWatchedSourcePath synchronous and free of
      filesystem access (pure string/set check).
    notes: "WHY: this check runs on every PostToolUse event before any other gate;
      it must stay O(1)."
