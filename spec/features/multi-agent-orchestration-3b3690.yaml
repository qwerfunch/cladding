id: F-3b3690
title: Multi-agent spec→code→tests feature cycle — host-engine harness (v0.4.x, S0–S4)
status: done
modules:
  - docs/feature-cycle.md
  - src/agents/orchestrator.md
  - src/agents/developer.md
  - src/agents/reviewer.md
depends_on:
  - F-af96b1
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: The system shall announce a non-firing LLM dispatch at clad init so a
      deterministic stub spec is never mistaken for a real domain-aware seed.
  - id: AC-002
    statement: The system shall drive development through a deterministic
      per-feature cycle in which agents propose and cladding gates dispose while
      enforcing spec-first and one-feature-at-a-time as hard barriers.
    kind: constraint
    rationale: The development cycle preserves the specification-first and
      single-feature control boundaries.
    evidence_refs:
      - docs/feature-cycle.md
      - src/agents/orchestrator.md
  - id: AC-003
    statement: The system shall author a feature's acceptance tests in an
      independent agent dispatch given only the acceptance criteria and module
      signatures so the tests are authored from the specification rather than
      the implementation.
    kind: constraint
    rationale: Independent test authoring preserves the separation between the
      implementation and its acceptance checks.
    evidence_refs:
      - src/agents/developer.md
      - docs/feature-cycle.md
  - id: AC-004
    statement: The system shall review code and tests with parallel per-lens
      reviewers whose failing verdict blocks completion until resolved.
    evidence_refs:
      - src/agents/reviewer.md
  - id: AC-005
    statement: The system shall fan out independent work-units in isolated git
      worktrees and reconcile them through a deterministic merge gate, so
      parallel implementation never corrupts siblings.
    evidence_refs:
      - docs/feature-cycle.md
