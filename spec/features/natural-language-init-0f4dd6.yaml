    text: When host integration configuration is created, it shall write normal host configuration under the selected project root; Antigravity additionally receives its documented managed machine-wide bridge because agy 1.1.2 reads no project-local MCP configuration.
    test_refs:
      - "tests/cli/setup.test.ts#[covers:F-0f4dd6/AC-007] writes project-local host configuration with the documented Antigravity bridge exception"
    notes: |
      ## Historical note
      The former universal project-local discovery claim was superseded by the
