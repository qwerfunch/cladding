  - id: AC-019
    ears: ubiquitous
    action: use AGENTS.md as the onboarding-generated cross-host instruction
      surface while preserving the established update behavior for CLAUDE.md
    response: init avoids a new host-specific copy and existing update users retain
      their managed Claude guidance
    text: The system shall generate AGENTS.md during onboarding without creating or
      changing CLAUDE.md, while clad update shall retain its established managed
      CLAUDE.md refresh, so init has one shared guidance source without breaking
      existing update workflows.
    test_refs: [ tests/cli/update.test.ts, tests/cli/init-onboarding-english-source.test.ts ]
  - id: AC-020
    ears: event
    condition: when a process-per-turn host stages a validated onboarding draft
      before showing the approval challenge
    action: retain that exact draft only as ignored project runtime state and apply
      it after the complete approval phrase without asking the model to
      reconstruct intent
    response: MCP process restarts cannot replace a planning document or observed
      project intent with an approval code
    text: When a process-per-turn host stages a validated onboarding draft before
      showing the approval challenge, the system shall retain that exact draft
      only as ignored project runtime state and apply it after the complete
      approval phrase without asking the model to reconstruct intent, so MCP
      process restarts cannot replace a planning document or observed project
      intent with an approval code.
    test_refs: [ tests/serve/init-tools.test.ts ]
    notes: |
      ## Decision
      Add a read-only staging tool between host-model drafting and the destructive apply tool.
      ## Why
      Real Codex headless sessions reload MCP per turn and may isolate temporary directories; without a durable staged draft, a new model turn can reconstruct the wrong intent from the approval code.
      ## Trade-off
      Staging writes an opaque short-lived cache under the already ignored `.cladding/host/` runtime boundary, while authored spec and documentation remain untouched until exact approval.
  - id: AC-021
    ears: event
    condition: when an activated project's ignored runtime launcher receives shell
      command arguments after initialization
    action: forward those arguments to the exact engine used for MCP while retaining
      no-argument MCP startup
    response: post-init shell validation cannot silently use a different global
      build from the connected MCP server
    text: When the project runtime launcher receives shell command arguments, the
      system shall forward them to the same engine used for MCP while preserving
      no-argument MCP startup, so post-init validation cannot silently use
      another build.
    test_refs: [ tests/cli/setup.test.ts ]
    notes: |
      ## Decision
      Make the existing ignored Node launcher dual-purpose instead of adding a second machine-specific command surface.
      ## Why
      The live Codex campaign connected MCP to the branch build but resolved shell `clad` to an older global build carrying the same version string, so schema validation disagreed without an obvious version warning.
      ## Trade-off
      The launcher's historical `serve.cjs` name remains slightly narrower than its role, but existing host configurations stay compatible and every argument is forwarded without shell interpolation.
  - id: AC-022
    ears: state
    condition: while the generated AGENTS.md guides ordinary development after
      initialization
    action: prefer the project runtime for Cladding shell commands and require the
      declared test command to collect relevant tests without shell-expanded
      glob dependencies
    response: agents use one engine and cannot treat a vacuous or host-specific test
      invocation as completion evidence
    text: While generated project guidance directs ordinary development, the system
      shall prefer the project Cladding runtime and require non-vacuous,
      shell-portable test execution, so engine skew and host-specific test globs
      cannot masquerade as completion.
    test_refs: [ tests/init/agents-md.test.ts ]
  - id: AC-023
    ears: state
    condition: while a project marked as onboarding-seeded is below the shared
      eight-feature design-maturity threshold and retains unbound onboarding
      capabilities or scenarios
    action: report those future design links as information while continuing to
      block dangling references and under-bound flows
    response: the first ordinary feature can earn a strict done result without
      deleting valid future intent
    text: While a project explicitly marked as onboarding-seeded is below the
      design-maturity threshold, the system shall treat unbound onboarding
      capabilities and scenarios as informational future intent while retaining
      blocking checks for invalid links, so an early feature can complete without
      changing the warning behavior of legacy or hand-authored projects.
    test_refs:
      [
        tests/stages/capabilities-feature-mapping.test.ts,
        tests/stages/scenario-coverage.test.ts
      ]
    notes: |
      ## Decision
      Persist an onboarding-seeded marker and graduate only those generated empty-link findings from information to warning at the existing eight-feature maturity boundary.
      ## Why
      Onboarding intentionally authors three to eight future capabilities and one to three future journeys with empty feature links, while strict mode promotes every warning to an error. Treating those intentional seeds as warnings made the first `clad done` impossible.
      ## Trade-off
      Onboarding-seeded small projects may retain visibly informational future design; once the project reaches eight features, unresolved empty links become strict-gate blockers again. Projects without the marker keep the established warning at every size.
  - id: AC-027
    ears: state
    condition: while a project marked as onboarding-seeded is below the shared
      eight-feature design-maturity threshold and its first completed domain or
      library slice has no runnable entry point yet
    action: report the missing deliverable decision as information and retain the
      warning after the maturity boundary
    response: the first feature can complete without inventing an unsafe smoke
      target while grown products must resolve the entry-point obligation
    text: While a project explicitly marked as onboarding-seeded is below the
      design-maturity threshold and has no runnable entry point yet, the system
      shall treat the missing deliverable decision as information and restore the
      warning after the threshold, so the first feature can complete without
      changing the warning behavior of legacy or hand-authored projects.
    test_refs: [ tests/stages/detectors/deliverable-integrity.test.ts ]
