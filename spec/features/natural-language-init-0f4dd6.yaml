    notes: "WHY: hiding post-init MCP tools removes their descriptions from pre-init model context; rejecting only at execution time did not satisfy the narrow-bootstrap context boundary."
  - id: AC-018
    ears: event
    condition: when project-scoped setup finds a legacy global Cladding integration
    action: remove only entries whose ownership is proven by a known Cladding
      package root or managed launch signature and preserve every ambiguous file
    response: upgrading stops unrelated-project influence without deleting user
      configuration
    text: When project-scoped setup finds a legacy global Cladding integration, the
      system shall remove only entries whose ownership is proven by a known
      Cladding package root or managed launch signature and preserve every
      ambiguous file, so upgrading stops unrelated-project influence without
      deleting user configuration.
