  - id: AC-006
    ears: event
    condition: when init or clarify returns pending product questions
    action: include the next question and onboarding status in structured MCP output
    response: the host can continue one answer at a time until onboarding is complete
    text: When init or clarify returns pending product questions, the system shall include the next question and onboarding status in structured MCP output, so the host can continue one answer at a time until onboarding is complete.
    test_refs: [tests/serve/init-tools.test.ts]
  - id: AC-007
    ears: state
    condition: while clad setup wires host integrations
    action: leave the current project tree unchanged and direct the user to open a project and request Cladding in natural language
    response: global host setup never implies project adoption
    text: While clad setup wires host integrations, the system shall leave the current project tree unchanged and direct the user to open a project and request Cladding in natural language, so global host setup never implies project adoption.
    test_refs: [tests/cli/setup.test.ts]
  - id: AC-008
    ears: ubiquitous
    action: document natural-language init as the primary path and describe each host's optional explicit invocation syntax accurately
    response: Claude and Gemini use their slash command, Codex uses its Cladding skill picker, and MCP hosts use natural language
    text: The system shall document natural-language init as the primary path and describe each host's optional explicit invocation syntax accurately, so Claude and Gemini use their slash command, Codex uses its Cladding skill picker, and MCP hosts use natural language.
    evidence_refs: [README.md, docs/setup.md]
    notes: |
      ## Decision
      Keep raw `clad init` as a compatibility and automation surface, not the primary onboarding UX.
      ## Why
      A host-neutral natural-language entry point preserves the product model while host-specific syntax remains an optional accelerator.
      ## Trade-off
      MCP init and clarify tools are required to make that promise deterministic for hosts without a bundled skill.
