  - id: AC-008
    ears: ubiquitous
    action: document natural-language init as the primary path and describe each
      host's optional explicit invocation syntax accurately
    response: Claude Code, Codex, Gemini, Antigravity, and Cursor receive accurate
      project-scoped startup guidance
    text: The system shall document natural-language init as the primary path and
      describe each host's project-scoped startup accurately, so Claude Code,
      Codex, Gemini, Antigravity, and Cursor receive accurate project-scoped startup
      guidance.
    evidence_refs: [ README.md, docs/setup.md ]
    notes: |
      ## Decision
      Keep raw `clad init` as a compatibility and automation surface, not the primary onboarding UX.
      ## Why
      A host-neutral natural-language entry point preserves the product model while host-specific syntax remains an optional accelerator.
      ## Trade-off
      MCP init and clarify tools are required to make that promise deterministic for hosts without a bundled skill.
  - id: AC-009
    ears: unwanted
    condition: if an initialization request has not been followed by a separate
      affirmative user confirmation after the read-only preview
    action: reject the apply step without creating project artifacts
    response: opening a project, asking about Cladding, or making the initial
      natural-language request cannot silently authorize file changes
    text: If an initialization request has not been followed by a separate
      affirmative user confirmation after the read-only preview, the system
      shall reject the apply step without creating project artifacts, so opening
      a project, asking about Cladding, or making the initial natural-language
      request cannot silently authorize file changes.
    test_refs: [ tests/serve/init-tools.test.ts ]
    notes: |
      ## Decision
      Natural language may start the read-only preparation, but a distinct user turn authorizes the write.
      ## Why
      All supported MCP hosts can call tools, but they do not expose a common cryptographic user-consent primitive.
      ## Trade-off
      The host instruction and verbatim confirmation field provide the strongest portable boundary; a malicious host could still fabricate consent, so this is not presented as a sandbox guarantee.
  - id: AC-010
    ears: unwanted
    condition: if the apply request does not carry the exact one-time approval
      challenge shown in the read-only preview
    action: reject initialization without writing project artifacts
    response: questions, acknowledgements, and model-invented confirmations cannot
      be mistaken for user consent
    text: If the apply request does not carry the exact one-time approval challenge
      shown in the read-only preview, the system shall reject initialization
      without writing project artifacts, so questions, acknowledgements, and
      model-invented confirmations cannot be mistaken for user consent.
    test_refs: [ tests/serve/init-tools.test.ts ]
    notes: |
      ## Decision
      Use a short preview-bound approval challenge rather than attempting to classify arbitrary affirmative prose across languages.
      ## Why
      MCP has no portable proof of which user turn produced an argument; exact challenge matching is the strongest host-neutral check available and makes accidental application materially harder.
      ## Trade-off
      Initialization is a one-time destructive boundary, so one explicit copy/confirm step is preferred over a lower-friction but ambiguous yes/no classifier.
  - id: AC-011
