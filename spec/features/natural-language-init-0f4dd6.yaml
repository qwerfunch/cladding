  - id: AC-003
    ears: event
    condition: when initialization uses a planning document
    action: read a recognized UTF-8 text file confined to the connected project root and pass its complete body through the existing intent-aware onboarding path
    response: the planning document is neither truncated nor mistaken for literal intent
    text: When initialization uses a planning document, the system shall read a recognized UTF-8 text file confined to the connected project root and pass its complete body through the existing intent-aware onboarding path, so the planning document is neither truncated nor mistaken for literal intent.
    test_refs: [tests/serve/init-tools.test.ts]
  - id: AC-004
    ears: event
    condition: when initialization adopts an existing project
    action: force the observed scan path even when the project contains fewer than three source files
    response: sparse existing projects are not treated as greenfield ideas
    text: When initialization adopts an existing project, the system shall force the observed scan path even when the project contains fewer than three source files, so sparse existing projects are not treated as greenfield ideas.
    test_refs: [tests/serve/init-tools.test.ts]
  - id: AC-005
    ears: unwanted
