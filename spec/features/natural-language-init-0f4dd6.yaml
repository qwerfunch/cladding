    response: MCP hosts can complete init and its follow-up Q&A without asking the user to run a shell command
    text: The system shall expose project initialization and onboarding answers as MCP tools that reuse the CLI core, so MCP hosts can complete init and its follow-up Q&A without asking the user to run a shell command.
    test_refs: [tests/serve/server.test.ts]
  - id: AC-002
    ears: event
    condition: when a new-project initialization request omits the project idea
    action: return a needs-input result before creating any project artifact
    response: the host asks for intent instead of producing a generic scaffold
    text: When a new-project initialization request omits the project idea, the system shall return a needs-input result before creating any project artifact, so the host asks for intent instead of producing a generic scaffold.
