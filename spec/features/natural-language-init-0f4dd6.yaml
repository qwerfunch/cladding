    action: return an already-initialized result without creating proposals or changing project files
    response: repeated natural-language requests remain non-destructive
    text: If the connected project already contains spec.yaml and refresh was not explicitly requested, the system shall return an already-initialized result without creating proposals or changing project files, so repeated natural-language requests remain non-destructive.
