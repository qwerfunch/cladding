  - id: AC-017
    ears: state
    condition: while an activated project has no spec.yaml and the user has not
      explicitly named Cladding
    action: expose only the narrowly described init bootstrap and reject non-init
      mutations before writing
    response: ordinary development remains ordinary even after setup but before
      explicit initialization
    text: While an activated project has no spec.yaml and the user has not
      explicitly named Cladding, the system shall expose only the narrowly
      described init bootstrap and reject non-init mutations before writing, so
      ordinary development remains ordinary even after setup but before explicit
      initialization.
