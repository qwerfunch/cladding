id: F-15999130
title: INFERABLE_DEPENDS_ON detector — flag (info) when code imports cross
  feature boundaries but depends_on is unrecorded
status: done
modules:
  - src/stages/detectors/inferable-depends-on.ts
  - src/stages/detectors/index.ts
depends_on:
  - F-2be3e3bb
capability_refs: []
acceptance_criteria:
  - id: AC-40564f
    statement: When undeclared import-inferable depends_on edges exist, the detector
      shall emit exactly one info finding; otherwise none.
    notes: >-
      ## Why

      The depends_on gap had TWO holes — 'produced by nothing' (closed by
      F-2be3e3bb clad infer-deps) and 'absence flagged by nothing'. This closes
      the second: without it, infer-deps is a latent tool nobody runs (the same
      trap that left the graph empty). ## Non-hostile by design

      INFO severity = never fails the gate even under --strict (which fails on
      error+warn only); a single AGGREGATE finding (not 157 per-feature) so real
      projects that never hand-authored depends_on aren't spammed or blocked.
  - id: AC-e80942
    statement: If inference cannot run or finds nothing, then the detector shall
      return no findings and never throw.
    kind: behavior
