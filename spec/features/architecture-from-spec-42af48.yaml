id: F-42af48
title: ARCHITECTURE_FROM_SPEC detector — resurrect spec/architecture.yaml from
  dead code (v0.3.13)
status: done
modules:
  - src/stages/detectors/architecture-from-spec.ts
  - spec/architecture.yaml
depends_on:
  - F-047
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: The system shall ship the ARCHITECTURE_FROM_SPEC drift detector that
      consumes spec/architecture.yaml as a working invariant — until v0.3.13
      this file was type-loaded but no detector consumed it, leaving the
      layers/forbidden_imports fields as dead code that misled external
      adopters.
  - id: AC-002
    statement: While a file under src/<from-layer>/ contains an import statement
      that crosses into the <to-layer> directory and spec/architecture.yaml has
      a matching forbidden_imports rule, the system shall emit an
      ARCHITECTURE_FROM_SPEC error finding naming the file, the import path, and
      the violated rule.
  - id: AC-003
    statement: While src/ contains a 1-depth directory that is not listed in
      spec.architecture.layers, the system shall emit a warn finding so a new
      architectural layer added in code does not silently bypass spec
      governance.
  - id: AC-004
    statement: While spec.architecture.layers names a layer with no matching
      src/<layer>/ directory, the system shall emit a warn finding so a
      renamed-in-code layer is caught at the next `clad check --strict`.
  - id: AC-005
    statement: The system shall keep the detector a soft validator — silent when
      spec.architecture is absent or empty — so external projects without an
      architecture spec see no findings while still being able to opt in by
      writing the file.
  - id: AC-006
    statement: The system shall bring cladding's own spec/architecture.yaml into
      alignment with the live src/ layout so the dogfood example is
      production-grade rather than misleading placeholder.
    evidence_refs:
      - spec/architecture.yaml
