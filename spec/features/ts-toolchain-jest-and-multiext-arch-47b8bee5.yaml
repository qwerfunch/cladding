acceptance_criteria:
  - id: AC-0d51828d
    ears: event
    condition: "when a jest config file (jest.config.js/.ts/.mjs/.cjs/.json) is present in a detected TypeScript/JavaScript project"
    action: "resolve the test gate to `npx --no-install jest` and the coverage gate to `npx --no-install jest --coverage`"
    response: "a Jest-based project (CRA, React Native, classic React) gates natively instead of silently skipping on a missing vitest"
    text: "When a jest config file is present in a detected TypeScript/JavaScript project, the system shall resolve the test gate to `npx --no-install jest` and the coverage gate to `npx --no-install jest --coverage`."
    test_refs: ["tests/stages/toolchain.test.ts"]
  - id: AC-a3be7a76
    ears: event
    condition: "when no jest config and no custom test script is present in a detected TypeScript/JavaScript project"
    action: "keep the vitest test and coverage gate defaults unchanged"
    response: "legacy config-less projects behave exactly as before while explicit custom runners remain authoritative"
    text: "When no jest config and no custom test script is present in a detected TypeScript/JavaScript project, the system shall keep the vitest `run` test and `run --coverage` defaults unchanged."
    test_refs: ["tests/stages/toolchain.test.ts"]
  - id: AC-4f0c9d
    ears: event
    condition: "when a TypeScript or JavaScript project declares a non-canonical test script or an explicit coverage script"
    action: "run those project-owned workflows instead of substituting an inferred test runner, and omit coverage when neither a script nor supported runner coverage is available"
    response: "Node's built-in test runner and other custom workflows remain authoritative without creating a false optional coverage gate"
    text: "When a TypeScript or JavaScript project declares a custom test or coverage workflow, the system shall run the project-owned script before inferred ecosystem defaults and shall leave unsupported optional coverage unregistered."
    notes: |
      This general toolchain rule was isolated from onboarding handoff work so
      its ownership and compatibility boundary are explicit for every project.
    test_refs: ["tests/stages/toolchain.test.ts"]
  - id: AC-3a899053
    ears: ubiquitous
    action: "configure the architecture (madge --circular) gate to scan .ts, .tsx, .js, and .jsx source files"
    response: "circular-dependency detection covers React/JSX component files, not only .ts"
    text: "The system shall configure the TypeScript/JavaScript architecture gate to scan .ts, .tsx, .js, and .jsx source files so circular-dependency detection covers React/JSX component files."
    test_refs: ["tests/stages/toolchain.test.ts"]
