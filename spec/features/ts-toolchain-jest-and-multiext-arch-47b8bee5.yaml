id: F-47b8bee5
title: TS/JS toolchain fidelity — jest test-gate auto-detection +
  multi-extension arch scan
status: done
modules:
  - src/stages/toolchain/detect.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-0d51828d
    statement: When a jest config file is present in a detected
      TypeScript/JavaScript project, the system shall resolve the test gate to
      `npx --no-install jest` and the coverage gate to `npx --no-install jest
      --coverage`.
  - id: AC-a3be7a76
    statement: When no jest config and no custom test script is present in a
      detected TypeScript/JavaScript project, the system shall keep the vitest
      `run` test and `run --coverage` defaults unchanged.
  - id: AC-4f0c9d
    statement: When a TypeScript or JavaScript project declares a custom test or
      coverage workflow, the toolchain adapter shall run the project-owned
      script before inferred ecosystem defaults and leave unsupported optional
      coverage unregistered.
    kind: behavior
    notes: |
      This general toolchain rule was isolated from onboarding handoff work so
      its ownership and compatibility boundary are explicit for every project.
  - id: AC-3a899053
    statement: The system shall configure the TypeScript/JavaScript architecture
      gate to scan .ts, .tsx, .js, and .jsx source files so circular-dependency
      detection covers React/JSX component files.
