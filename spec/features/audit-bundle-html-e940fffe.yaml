id: F-e940fffe
title: "clad bundle: one self-contained HTML audit bundle a non-coder can open —
  matrix, catalog, changes, audit table, attestation"
status: done
modules:
  - src/report/bundle.ts
  - src/ui/panel.ts
  - src/cli/clad.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-9f191790
    statement: When clad bundle runs, the system shall write one self-contained HTML
      file — zero network requests, no script src, no CDN — containing the
      project header with inventory counts, the feature-by-stage matrix, the
      capability catalog, shipped changes for the range, the audit table with
      resolved refs, and the attestation summary.
    notes: "WHY: every audit surface is CLI-locked today; the proven audience
      (non-coders, auditors) cannot run a CLI. The offline-single-file pattern
      is already proven by the graph viewer shell."
  - id: AC-f511c519
    statement: The bundle shall display a provenance banner — git HEAD sha,
      generation date, cladding version — at the top, so a stale snapshot can
      never masquerade as live status.
    notes: "WHY: a bundle is a snapshot by design; the banner is the staleness
      mitigation."
  - id: AC-15bb0b99
    statement: If no anchor ref resolves, then the changelog and audit sections
      shall render an explicit omitted-no-anchor-ref notice while the rest of
      the bundle still renders — partial degrade, never all-or-nothing.
    notes: "WHY: absence renders as absence; the rest of the audit surface stays
      useful."
  - id: AC-e5f48ce5
    statement: When status is requested as JSON, the system shall expose the same
      row model the ANSI panel renders, produced by an exported row-model
      function split out of renderPanel, with the ANSI output kept
      byte-identical.
    notes: "WHY: one SSoT for terminal, JSON, and bundle — closes the status --json
      gap without forking the matrix logic."
  - id: AC-0116e8d0
    statement: The bundle body shall be deterministic for a fixed repository state
      modulo its generation date stamp and remain under 5 MB on cladding itself.
    kind: quality
    notes: "WHY: deterministic artifacts are diffable evidence; size budget keeps it
      mailable/openable."
