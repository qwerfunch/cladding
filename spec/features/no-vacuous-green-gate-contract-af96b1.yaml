id: F-af96b1
title: No Vacuous Green — honest gate exit-contract, shared spec-load seam,
  ambient hook (v0.4.x)
status: done
modules:
  - src/stages/util.ts
  - src/stages/type.ts
  - src/stages/lint.ts
  - src/stages/unit.ts
  - src/stages/cov.ts
  - src/stages/smoke.ts
  - src/stages/perf.ts
  - src/stages/visual.ts
  - src/stages/detectors/with-spec.ts
  - src/init/git-hook.ts
  - .github/workflows/ci.yml
  - tests/stages/util.test.ts
  - tests/init/git-hook.test.ts
  - tests/self-consistency.test.ts
depends_on:
  - F-99c6e5
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: The system shall map a tool that ran and failed to the blocking
      exitCode 1, reserving the skip exitCode 2 strictly for ENOENT /
      unknown-language / undefined-script, so no toolchain stage can pass a real
      failure off as a vacuous-green skip.
  - id: AC-002
    statement: The system shall centralise the drift detectors' spec-load-failure
      policy in a single withSpec() seam that emits a uniform info finding, so
      spec-vs-reality detectors degrade honestly on a spec-less or unparseable
      project.
  - id: AC-003
    statement: The system shall provide an opt-in `clad init --with-hook` that
      installs an idempotent, non-destructive git pre-commit hook running the
      fast spec-native gate tier, enforcing drift at commit time without a new
      verb.
  - id: AC-004
    statement: The system shall enforce cladding's own self-consistency
      (detector-count claims, spec/package version parity, tier banners) as
      CI-locked tests so the drift-prevention tool cannot silently drift against
      itself.
  - id: AC-005
    statement: When an offline local-only npx invocation cannot resolve its
      executable, the system shall report a setup gap without contacting the
      registry while an internally failing tool remains blocking.
    kind: behavior
    notes: >
      This general stage exit-contract rule was isolated from onboarding handoff

      verification because it applies equally to legacy and hand-authored
      projects.
