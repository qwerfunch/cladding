id: F-078
title: Gemini CLI extension manifest (v0.3.3 · Phase 3 of multi-host rollout)
status: done
modules:
  - plugins/gemini-cli/gemini-extension.json
  - plugins/gemini-cli/GEMINI.md
  - plugins/gemini-cli/commands/init.toml
depends_on:
  - F-049
  - F-073
  - F-076
  - F-077
capability_refs: []
acceptance_criteria:
  - id: AC-233
    statement: The system shall ship a Gemini CLI extension manifest at
      plugins/gemini-cli/gemini-extension.json that declares cladding under the
      Gemini extension spec and registers `clad serve` as a stdio MCP server.
    evidence_refs:
      - plugins/gemini-cli/gemini-extension.json
  - id: AC-234
    statement: The system shall expose cladding's `init` verb as a Gemini CLI custom
      command under plugins/gemini-cli/commands/init.toml so Gemini users invoke
      it as /cladding:init; v0.4.0 narrowed the slash-command surface to `init`
      only.
    evidence_refs:
      - plugins/gemini-cli/commands/init.toml
  - id: AC-235
    statement: The system shall provide plugins/gemini-cli/GEMINI.md as the
      extension context file so Gemini, when the extension is loaded, has the
      persona vocabulary and authentication model in its context window from
      session start.
    evidence_refs:
      - plugins/gemini-cli/GEMINI.md
  - id: AC-236
    statement: The system shall keep the no-API-key invariant intact for the Gemini
      CLI integration — the extension uses the user's Google account login by
      default; cladding never reads GEMINI_API_KEY when a host adapter is
      active.
    evidence_refs:
      - plugins/gemini-cli/GEMINI.md
      - spec/features/F-049.yaml
