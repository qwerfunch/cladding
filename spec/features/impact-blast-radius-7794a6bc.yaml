id: F-7794a6bc
title: Blast-radius impact query — backward slice (what breaks if I change X)
  over MCP + CLI
status: done
modules:
  - src/optimizer/reverse-slice.ts
  - src/serve/server.ts
  - src/cli/clad.ts
depends_on: []
capability_refs:
  - knowledge-graph
acceptance_criteria:
  - id: AC-9980c9b0
    statement: When buildImpactSlice is called with a feature id or slug, the system
      shall return the focus feature plus its transitive dependents (summaries),
      the union of bound scenarios, the deduped union of test_refs (regression
      set), and the union of impacted module paths.
    notes: >-
      ## Why

      This is the missing backward complement of clad_get_context: forward
      answers 'what does this need', impact answers 'what breaks if I change
      this'. The regression-test union is the LLM's safe-refactor set in a long
      project.
  - id: AC-3f4f7202
    kind: behavior
    statement: When a module path is queried, the impact service shall resolve every
      graph-owned artifact owner from GraphIR and compute its directed dependent
      slice.
  - id: AC-6a73f6b1
    statement: If the query resolves to nothing, then the system shall return a
      not_found result naming the accepted forms (feature id, slug, module
      path).
    kind: behavior
  - id: AC-7596b1b6
    statement: When optional depth is supplied, the system shall bound the dependent
      walk to that many hops and produce a deterministically ordered slice for
      identical spec state.
    kind: quality
  - id: AC-c463ed55
    statement: When clad_get_impact / clad impact is called with a query, the system
      shall return the blast-radius slice with schema_version, and report a miss
      as an error result.
purpose: Compute directed impact from canonical GraphIR ownership and dependent
  relations rather than the legacy module-owner index.
