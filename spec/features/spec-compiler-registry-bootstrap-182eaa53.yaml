acceptance_criteria:
  - id: AC-6e5b88fa
    ears: ubiquitous
    text: "The specification compiler shall deterministically compile schema 0.1 artifacts into typed graph facts while preserving authored ownership, source locations, raw references, selectors, and unresolved states."
    test_refs: ["tests/spec/compiler/graph-ir-v2.test.ts#is deterministic, preserves composite criteria, and never resolves a bare AC id"]
    notes: "## Why\nD10 and D17 need a discardable parity boundary before any public graph or migration cutover."
  - id: AC-34749728
    ears: ubiquitous
    text: "The artifact and identifier registries shall give every managed Spec write target and new identifier one executable policy while retaining valid legacy sequential and six-or-more-hex inputs."
    test_refs: ["tests/spec/compiler/artifact-registry.test.ts#keeps descriptor ids unique and root-file regions separate", "tests/spec/compiler/id-policy.test.ts#keeps sequential and six-or-more-hex records readable while writers emit exactly eight lowercase hex"]
    notes: "## Why\nD10 requires one authority for artifact ownership and D04 requires one authority for identity policy."
  - id: AC-dacbffda
    ears: ubiquitous
    text: "The migration baseline schema shall preserve node-level legacy intent and bindings without applying a migration or revoking sibling exemptions."
    test_refs: ["tests/spec/compiler/migration-baseline.test.ts#gives a new node no exemption and revokes only the edited node"]
    notes: "## Why\nD14 baseline data must preserve historical meaning until a later transactional migration feature owns writes."
  - id: AC-b38f45f7
    ears: event
    condition: "when the self corpus changes"
    text: "When the self corpus changes, the independent scanner shall regenerate sorted source records and expose a meaningful parity difference without importing production loading or graph paths."
    test_refs: ["tests/spec/compiler/corpus-snapshot.test.ts#reports a meaningful source mutation instead of hiding it behind a literal count"]
    notes: "## Why\nD15 and D16 require an independent oracle so a compiler regression cannot approve itself."
  - id: AC-6d69273c
    ears: ubiquitous
    text: "The validation ledger shall mark D05-D14, D17, and D20-D24 validation-active while keeping F8-F11 cutover, reference-host, and preregistered completion claims pending."
    test_refs: ["tests/design/spec-0.2/design-validation.test.ts#marks the F7 scenario boundary validation-active without promoting F8-F11 work", "tests/design/spec-0.2/design-validation.test.ts#locks the 0.10 rebaseline without upgrading pending runtime evidence"]
    notes: "## Why\nValidation evidence records the current F7 boundary precisely: deterministic registry and scenario work is active, while F8-F11 cutover, reference-host evidence, and preregistered completion remain pending."
design_impact:
  classification: additive
  rationale: "F1 adds a read-only compiler and registries beside the shipped schema 0.1 loader, reverse index, graph, detector, and MCP contracts."
  status: resolved
  artifacts: []
