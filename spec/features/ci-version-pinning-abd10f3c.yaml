id: F-abd10f3c
title: Pinned Cladding version in generated CI
status: done
modules:
  - src/cli/ci-version.ts
  - src/cli/init.ts
  - src/cli/doctor.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-84011597
    statement: When clad init --with-ci scaffolds CI, the system shall pin Cladding
      to the running binary's numeric major.minor release line while preserving
      the strict pre-push gate.
  - id: AC-8604b579
    statement: If the runtime version cannot produce a numeric major.minor selector,
      then the system shall leave CI untouched and report that pinning was
      unavailable rather than generate an unpinned workflow.
    kind: behavior
  - id: AC-b0ade1e9
    statement: While project CI invokes an unpinned or floating Cladding package,
      the system shall report the exact workflow paths through doctor text and
      JSON while continuing to exit successfully.
  - id: AC-9501f50d
    statement: If CI uses a numeric Cladding version selector or no npx Cladding
      invocation, then the system shall not report a version-pinning warning.
    kind: behavior
design_impact:
  classification: none
  rationale: This tightens the existing generated GitHub Actions command and adds
    read-only doctor diagnostics without changing architecture, capabilities, or
    user journeys.
  status: resolved
  artifacts: []
