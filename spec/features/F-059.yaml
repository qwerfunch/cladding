acceptance_criteria:
  - id: AC-141
    statement: The system shall ship dedicated unit-test files for
      src/stages/type.ts and src/stages/lint.ts, bringing each to at least 85%
      line coverage by mocking execaSync.
  - id: AC-142
    statement: When the Commit obligation runs, the system shall derive repository
      and tool inputs from its descriptor and runner configuration and record
      the sealed-workspace observation as pass, fail, or unobserved.
    notes: >
      ## Historical schema-0.1 note

      2026-05-19 · v0.2.10 · b6e4488. Commit execa fixtures: clean, dirty,
      non-git,

      output, ENOENT, and thrown cases; at least 80% line coverage; non-current.

      Released title: "Stage

      runner tests batch 1 — 70% coverage floor cleared".
  - id: AC-143
    statement: When Audit applies to a criterion, the system shall reduce only a
      verified current human receipt whose exact criterion subject and
      reviewed-input, runtime-dependency, and implementation-author digests
      match the compiled closure and classify all-pass evidence as pass, an
      explicit negative as fail, and missing, untrusted, or stale evidence as
      unobserved.
    notes: |
      ## Historical schema-0.1 note
      2026-05-19 · v0.2.10 · b6e4488. Audit appendEvidence fixtures: empty and
      human evidence, tool-only guards, failures, and mixed paths; at least 80%
      line coverage; non-current.
  - id: AC-144
    statement: While current coverage assurance is evaluated, the assurance registry
      shall derive it from the coverage obligation and treat the v0.2.10
      measurement as historical evidence only.
    kind: quality
    notes: |
      ## Historical schema-0.1 note
      v0.2.10’s 63.49% to ≥70% measurement is historical, not current assurance.
