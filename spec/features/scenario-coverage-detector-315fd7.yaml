id: F-315fd7
title: SCENARIO_COVERAGE detector — grown projects capture cross-feature flows
  (v0.4.x, S-b)
status: done
modules:
  - src/stages/detectors/scenario-coverage.ts
  - src/stages/detectors/index.ts
depends_on:
  - F-f44d1b
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: When a grown project declares no scenarios, the system shall warn
      that cross-feature flows are uncaptured.
  - id: AC-002
    statement: If a scenario binds no features, then the detector shall warn about
      the unresolved link except when an onboarding-seeded project retains it as
      information until the design-maturity threshold.
    kind: behavior
  - id: AC-003
    statement: The system shall make grown-project scenario-coverage gaps blocking
      under strict mode while keeping explicitly marked early onboarding seeds
      informational and all unmarked hollow scenarios advisory.
  - id: AC-004
    statement: When a scenario's flow references a feature slug it does not bind,
      the system shall warn that the scenario under-states its coverage.
