id: F-caff8598
title: Verification policy identity and generated merge attributes
status: done
modules:
  - src/spec/attestation.ts
  - src/cli/clad.ts
  - src/cli/init.ts
  - docs/spec-ids-multi-dev.md
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-a4d41de9
    statement: When a strict GREEN gate attests the tree, the system shall stamp the
      running Cladding version, strict blocking mode, and deterministic
      detector-catalog SHA-256 alongside the module and feature evidence.
  - id: AC-734d8d3b
    statement: While an attestation has no policy section, the reader shall preserve
      its existing v1/v2 semantics and expose policy as unknown rather than
      reject the file.
  - id: AC-1f6b157b
    statement: When the detector catalog is fingerprinted, the system shall produce
      a deterministic full SHA-256 that changes for detector order, name, or
      subprocess classification changes.
  - id: AC-0ef508a1
    statement: When clad init finds no exact index merge attribute, the system shall
      append `spec/index.yaml merge=union` to `.gitattributes` while preserving
      existing content.
  - id: AC-ad6374ef
    statement: If .gitattributes already carries the exact index rule, then the
      system shall neither append it nor assign a merge driver to the
      attestation.
    kind: constraint
    rationale: Protects attestation serialization and idempotent attributes.
design_impact:
  classification: none
  rationale: The change adds provenance fields to an existing derived attestation
    format and scaffolds the already-documented index merge attribute; it
    changes no architecture, capability, or journey.
  status: resolved
  artifacts: []
