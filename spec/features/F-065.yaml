acceptance_criteria:
  - id: AC-173
    statement: The system shall consolidate every code dir under a single src/ root
      while keeping spec data (features/, scenarios/, architecture.yaml) at the
      project root.
    evidence_refs:
      - src
  - id: AC-174
    statement: The system shall preserve runtime behavior after the move — every
      code path that previously worked still works, with no semantic change.
    evidence_refs:
      - bin/clad
      - scripts/build.mjs
      - vitest.config.ts
  - id: AC-175
    statement: When current release assurance is evaluated, the assurance service
      shall mint a current profile-complete authoritative attestation only from
      the authoritative verdict and treat the v0.2.16 all-gates/coverage result
      as historical evidence only.
    kind: quality
    notes: >
      ## Historical schema-0.1 note

      v0.2.16’s 404/404, strict-green, ≥93% result is historical, not current
      release assurance.
  - id: AC-176
    statement: The system shall update the three detectors that hardcode source
      paths (UNMAPPED_ARTIFACT, HARNESS_INTEGRITY, META_INTEGRITY) to point at
      src/.
