id: F-e7d59c88
title: "Bash-lane impact cards: source mutations made through shell commands get
  the same push card via git-delta detection"
status: done
modules:
  - src/cli/hook.ts
  - plugins/claude-code/hooks/hooks.json
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-d6c8d5ed
    statement: When a Bash tool result reveals a mutated watched source path, the
      hook shall render the same tiered push card (F-35954d19 pipeline) for the
      most-recently-modified such path.
    notes: "WHY: sed/heredoc/tee/git-apply edits bypass the Edit|Write matcher
      entirely — the sessions that shell out for edits are exactly the ones with
      zero ambient impact context today (hook.ts self-documents this hole)."
  - id: AC-ab85ee3e
    statement: The system shall evaluate the debounce stamp and a conservative
      read-only command-prefix allowlist containing git status, git log, git
      diff, ls, cat, grep, rg, find, node --version, npm test, and similar
      commands before spawning any git subprocess and add at most one git status
      subprocess per debounce window in the Bash lane.
    kind: quality
    notes: "WHY: PostToolUse Bash fires on every shell command — the fast path must
      stay in-process string checks."
  - id: AC-14c2e2ea
    statement: If git state is unavailable or no watched path changed, then the Bash
      lane shall degrade to silence without writing the tree snapshot and
      without emitting an error.
    notes: "WHY: hook error-as-silence contract; non-git projects must lose nothing."
  - id: AC-4f2df3ee
    statement: When a native write-tool event completes, the hook shall refresh the
      tree snapshot so a subsequent Bash event does not re-attribute that edit
      to the shell command.
    notes: "WHY: attribution honesty — hand-tool edits must never double-fire
      through the Bash lane."
  - id: AC-977e6445
    statement: When the Bash mutation lane produces a result, the system shall emit
      advisory-only context.
    notes: >-
      ## 2026-08-31 criterion decomposition


      Original compound text (verbatim): The system shall never emit a block
      decision from the Bash lane; its output is advisory context only, and all
      F-35954d19 ledger rules (dedup, budget, telemetry reasons) apply
      unchanged.


      Reason: split advisory rendering, cross-lane deduplication, ledger/budget
      governance, and shared telemetry vocabulary while retaining this legacy
      address.


      WHY: a false-positive block on shell parsing is the fastest route to users
      disabling hooks; Stop-gate remains the enforcement lane.
  - id: AC-278b34cd
    statement: The Bash mutation lane shall apply shared cross-lane push-card
      deduplication.
  - id: AC-3021d7dc
    statement: The Bash mutation lane shall apply the shared push-card budget rule.
  - id: AC-fc9532da
    statement: The Bash mutation lane shall use the shared ImpactSkipReason
      vocabulary for its telemetry.
