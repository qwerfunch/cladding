id: F-d6b93648
title: Graph-context wiring — auto impact card on edits + advisory nudge so the
  working set is actually used
status: done
modules:
  - src/cli/hook.ts
  - spec.yaml
  - src/agents/developer.md
  - src/agents/planner.md
depends_on:
  - F-06dfdad6
  - F-7794a6bc
capability_refs: []
acceptance_criteria:
  - id: AC-ee0f17
    statement: When a source edit completes, the system shall append a one-line
      impact card (owner + breaks + tests) derived from the impact slice —
      relativizing the host's absolute file_path to the spec's repo-relative
      module keys — never blocking and degrading to silence on error.
    notes: >-
      ## Why

      The working set (F-06dfdad6) is a PULL tool the AI must remember to call.
      This is the PUSH half: PostToolUse is the only plain-text lane (PreToolUse
      is JSON-only — sim finding), so the blast radius is surfaced automatically
      AFTER the edit. ## Correction (0.7.1)

      'The hook I/O wiring is manual-smoke' hid the fact that the card NEVER
      fired in production: hosts send absolute file paths, the module index is
      repo-relative (0/361 resolved on cladding-self; 99.2% after relativizing).
      The wiring is now pinned end-to-end (runHookEvent + absolute path +
      on-disk spec).
  - id: AC-e49483
    statement: While an edit's changed-char magnitude is below the threshold, the
      system shall not emit an impact card.
  - id: AC-a42705
    statement: The project's ai_hints.preferred_patterns and the developer + planner
      personas shall direct agents to slice the working set
      (clad_get_working_set) / scope the blast radius (clad_get_impact) BEFORE a
      non-trivial edit, over reading the whole spec or editing blind — advisory
      guidance (no detector enforces it).
