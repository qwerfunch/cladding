id: F-f6cc5e5a
title: "clad report: one deterministic review packet per git range — spec
  changes, owning features, regression set, gate state — as markdown and SARIF"
status: done
modules:
  - src/report/report.ts
  - src/report/sarif.ts
  - src/cli/report.ts
  - src/cli/clad.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-cbf1c202
    statement: When clad report runs, the system shall print a markdown report with
      six sections — spec entry changes (from the changelog collector), how each
      acceptance criterion moved, code changes resolved to owning features via
      the reverse index, the tests those features declare, the deduped
      regression set (union of test_refs across impact slices), and gate plus
      attestation state — byte-identical across two runs on the same repository
      state.
    notes: "WHY: the doc-value A/B proved traceability value to reviewers and
      auditors; a PR is where they consume it without reading the spec tree."
  - id: AC-7672ce5d
    statement: When a changed file is unowned, the system shall list it under an
      Unowned changes section, never silently drop it.
    notes: "WHY: honest under-reporting — same contract as the changelog's unsharded
      commits."
  - id: AC-46e8c26f
    statement: When SARIF output is requested, the system shall emit valid SARIF
      2.1.0 with one result per error or warn drift finding, ruleId set to the
      detector name, and physicalLocation built from the finding's path and
      line, validating against the SARIF 2.1.0 schema.
    notes: "WHY: machine-readable annotations at file:line for code-scanning UIs;
      harvests the parked PR #201 decision."
  - id: AC-41572299
    statement: While the ledger is empty, the report's blast-radius section shall
      carry the unknown-not-safe disclosure, never an implicit nothing-breaks.
    notes: "WHY: the 0.7.1 blank-ledger lesson — a graph answer that cannot know
      must say so."
  - id: AC-67fa1d25
    statement: If the ref is unresolvable, then the system shall exit 2 with a clear
      error, never rendering a silently-empty report.
    notes: "WHY: never-silently-empty contract shared with the changelog collector."
