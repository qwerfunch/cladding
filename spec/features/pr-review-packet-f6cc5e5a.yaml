id: F-f6cc5e5a
slug: pr-review-packet
title: "clad report: one deterministic review packet per git range — spec changes, owning features, regression set, gate state — as markdown and SARIF"
status: done
modules:
  - src/report/report.ts
  - src/report/sarif.ts
  - src/cli/report.ts
  - src/cli/clad.ts
acceptance_criteria:
  - id: AC-cbf1c202
    ears: event
    condition: "when clad report --since <ref> runs in a repo with spec.yaml"
    text: "When clad report runs, the system shall print a markdown report with six sections — spec entry changes (from the changelog collector), how each acceptance criterion moved, code changes resolved to owning features via the reverse index, the tests those features declare, the deduped regression set (union of test_refs across impact slices), and gate plus attestation state — byte-identical across two runs on the same repository state."
    test_refs:
      - "tests/report/report.test.ts#emits the six mandated sections in order"
      - "tests/report/report.test.ts#two renders on the same model are byte-identical"
      - "tests/report/report.test.ts#partitions changed files into owned vs unowned by owner count"
      - "tests/report/report-cli.test.ts#AC-cbf1c202 · renders all six sections in order and exits 0"
      - "tests/report/report-cli.test.ts#AC-cbf1c202 · two runs on the same repo state are byte-identical"
    notes: "WHY: the doc-value A/B proved traceability value to reviewers and auditors; a PR is where they consume it without reading the spec tree."
  - id: AC-7672ce5d
    ears: event
    condition: "when a changed source file maps to no feature's modules"
    text: "When a changed file is unowned, the system shall list it under an Unowned changes section, never silently drop it."
    test_refs:
      - "tests/report/report.test.ts#lists an unowned changed file under an Unowned changes section"
      - "tests/report/report.test.ts#an owned file never appears under the Unowned changes section"
      - "tests/report/report.test.ts#no unowned changes → no Unowned changes section at all"
      - "tests/report/report-cli.test.ts#AC-7672ce5d · the unowned file surfaces; the owned file never appears as unowned"
    notes: "WHY: honest under-reporting — same contract as the changelog's unsharded commits."
  - id: AC-46e8c26f
    ears: event
    condition: "when --format sarif is passed"
    text: "When SARIF output is requested, the system shall emit valid SARIF 2.1.0 with one result per error or warn drift finding, ruleId set to the detector name, and physicalLocation built from the finding's path and line, validating against the SARIF 2.1.0 schema."
    test_refs:
      - "tests/report/sarif.test.ts#emits exactly one result per error|warn finding and excludes info"
      - "tests/report/sarif.test.ts#ruleId is the detector name and level maps error→error, warn→warning"
      - "tests/report/sarif.test.ts#physicalLocation is built from a present path, and startLine defaults to 1"
      - "tests/report/sarif.test.ts#stamps SARIF version 2.1.0 and a $schema, with a single run"
    notes: "WHY: machine-readable annotations at file:line for code-scanning UIs; harvests the parked PR #201 decision."
  - id: AC-41572299
    ears: state
    condition: "while the project's dependency ledger is empty (depends_on edges = 0)"
    text: "While the ledger is empty, the report's blast-radius section shall carry the unknown-not-safe disclosure, never an implicit nothing-breaks."
    test_refs:
      - "tests/report/report.test.ts#an empty ledger carries the unknown-not-safe disclosure in the regression section"
      - "tests/report/report.test.ts#a non-empty ledger carries no such disclosure"
    notes: "WHY: the 0.7.1 blank-ledger lesson — a graph answer that cannot know must say so."
  - id: AC-67fa1d25
    ears: unwanted
    condition: "if --since does not resolve to a commit"
    text: "If the ref is unresolvable, then the system shall exit 2 with a clear error, never rendering a silently-empty report."
    test_refs:
      - "tests/report/report-cli.test.ts#AC-67fa1d25 · an unresolvable --since exits 2 with an error naming the ref"
      - "tests/report/report-cli.test.ts#AC-67fa1d25 · a valid --since ref exits 0"
    notes: "WHY: never-silently-empty contract shared with the changelog collector."
