depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-28df4cc4
    statement: When Stop finds a fresh blocking fingerprint, the system shall record
      count, fingerprint, sorted detector names, counts introduced since versus
      present in the latest observed gate, dirty-path intersection, head, and
      identity without changing the block decision.
  - id: AC-5c94711a
    statement: When Stop sees the identical persisted fingerprint again, the system
      shall preserve the existing empty allow response and append a
      stop_exit_recorded event for that known-failing exit.
  - id: AC-8894d11f
    statement: The system shall retain enough compact gate evidence to determine at
      read time whether a blocked Stop fingerprint was observed by any later
      gate, without persisting a second correlation state file.
  - id: AC-3cb0ca39
    statement: When a completion attempt finishes its strict gate, the system shall
      add a sorted blockers array to done_attempted, empty on green and
      populated on red, without changing flip-gate-revert behavior.
  - id: AC-a2a3beb3
    statement: When doctor reads the lifecycle ledger, the system shall expose Stop
      exit and later-gate observation counters in text and JSON while tolerating
      legacy events that lack the new fields.
design_impact:
  classification: none
  rationale: This additively enriches the existing lifecycle event stream and
    doctor summary without adding a service, boundary, capability, or committed
    policy surface.
  status: resolved
  artifacts: []
