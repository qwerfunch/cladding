id: F-ebbb20af
title: close Soft Shell jargon leaks and tighten the plain-language enforcement
status: done
modules:
  - src/ui/softShell.ts
  - src/cli/clad.ts
  - src/cli/done.ts
  - src/cli/hook.ts
  - src/cli/init.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-77f0ec75
    statement: While rendering user-facing output, the system shall never use the
      internal shard term, say spec, spec entry, or feature instead, and keep
      readers who never saw the source from seeing a maintainer-only term.
    kind: constraint
    rationale: Keeps internal terminology out of user-facing output.
    notes: "Leaks the audit found: INVENTORY_DRIFT.lead (softShell.ts), the clad
      check footer (clad.ts), and the clad done git-op / no-feature refusals
      (done.ts). Iron Core surfaces (code comments, field names, persona
      prompts) keep 'shard' by design."
  - id: AC-78c153fa
    statement: If a user-facing card would surface a raw detector name or a raw
      stage id as its lead, then the system shall render the plain-English lead
      instead — the machine id may appear only as a demoted tail.
    kind: behavior
    notes: The SessionStart stop-block line led with failures[0].detector (a raw
      detector name); the clad sync deliverable note leaked a raw stage id
      (stage_2.4). Reuse plainLead (already imported in hook.ts).
  - id: AC-c7c1c6e1
    statement: While generating scenarios README prose, the system shall use no
      clad_-shaped MCP tool identifier or shard term and describe behavior in
      plain language instead.
    kind: constraint
    rationale: Keeps internal identifiers out of generated user-facing prose.
    notes: "init.ts wrote `clad_create_feature` into the scenarios README prose. The
      spec.yaml first line is a structured, documented, tier-tagged provenance
      banner (Tier A · Refreshed by: <verb>), verified by verb-residue +
      tier-banner tests — that is Iron Core metadata, out of scope here, and
      keeps its verb clause."
  - id: AC-0cece94c
    statement: If a future edit reintroduces the word shard into a DETECTOR_PLAIN
      lead or a raw detector-name lead into a driven card, then the tightened
      enforcement tests shall fail so these leaks cannot recur.
    kind: behavior
    notes: plain-render.test.ts scanned only `action` for MCP names; extend it to
      scan each `lead` for 'shard'. human-first-cards.test.ts banned MCP names +
      'shard' per line; extend the stop-block case so a raw detector-name lead
      fails.
  - id: AC-408e6838
    statement: The behavior-triggered signals (the unbound-edit nudge and the
      enforcement advisory) shall fire from the same single English source
      regardless of the user's language — an all-non-ASCII spec (titles, paths)
      still triggers them — so the host can relay one message into any language.
    notes: "cladding emits one English string; the host AI relays it into the user's
      language (instruction-led-language: English-only catalog, no locale keys).
      Firing is behavior-driven (edits, spec status), so it is language-agnostic
      by construction; this AC pins that."
