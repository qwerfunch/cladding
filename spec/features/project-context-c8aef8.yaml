acceptance_criteria:
  - id: AC-001
    statement: The system shall write docs/project-context.md on every clad init
      invocation so the forest-level why-and-what entry document exists in every
      cladding workspace regardless of whether code or README was observable at
      adoption time.
  - id: AC-002
    statement: When README.md is present in the project root, the system shall
      extract first paragraph plus headings plus sibling-doc links plus
      representative interface signatures into ProjectContext so the rendered
      markdown surfaces what the project tells the world plus how its main
      interfaces look.
  - id: AC-003
    statement: When README is absent and no source plus no sibling docs surfaced,
      the system shall return null for projectContext and render the template
      body so greenfield projects do not see misleading auto-extracted text.
  - id: AC-004
    statement: The system shall skip decorative HTML wrappers plus badge links when
      extracting README first paragraph so OSS READMEs leading with centred
      logos plus shields do not pollute the project-context document with raw
      HTML.
  - id: AC-005
    statement: The system shall auto-detect whether to write scan artifacts based on
      observed source file count so external adopters invoke clad init without
      flags and cladding decides on their behalf; --scan and --no-scan remain as
      explicit overrides for CI reproducibility.
    evidence_refs:
      - src/cli/init.ts
