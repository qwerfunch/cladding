  - src/cli/clad.ts
depends_on:
  - F-7794a6bc
capability_refs: []
acceptance_criteria:
  - id: AC-ffcc0e
    statement: When inferDependsOn runs, the system shall emit a feature→feature
      edge for each import that resolves to a module owned by a different
      feature.
    notes: >-
      ## Why

      Measured gap: depends_on is load-bearing for the whole graph layer
      (prune/context/impact/iterative/drive) but PRODUCED by nothing —
      clad_create_feature/scan/onboarding never emit it, no detector flags its
      absence. doverunner-vapt (174 features, cladding-authored) had 0 edges →
      all graph tools returned empty. This reconstructs edges deterministically
      from the import graph (vapt: 0 → 698 edges, 157/174 features). ## Honesty

      This POPULATES the graph (a precondition for any graph value); it is NOT a
      correctness claim. It does not auto-write the spec — it produces
      reviewable suggestions (anti-self-cert: a human merges the edges).
  - id: AC-84b71a
    statement: While an imported module is owned by more than maxOwnerAmbiguity
      features, the system shall not emit an edge for it.
    notes: >-
      ## Why

      Measured: vapt has 129/434 multi-owner modules (one shared by 23
      features). Counting every co-owner tripled edges (4357) with noise;
      capping at 1 unambiguous owner gives a clean 698 (median 4/feature).
  - id: AC-4e0fd0
    statement: The inference core shall remain deterministic and pure for the
      specification and injected file contents, use an injected reader like
      code-excerpt instead of direct filesystem access, separate new edges from
      edges already declared in `depends_on`, and expose only the newly inferred
      edges to callers.
    kind: quality
