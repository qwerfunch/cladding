acceptance_criteria:
  - id: AC-b431ecb1
    ears: ubiquitous
    text: "The specification compiler shall parse one strict schema 0.2 EARS statement with exactly one unprotected `shall` modal and report atomicity signals without blocking valid authoring."
    test_refs: ["tests/spec/statement-parser.test.ts#P01 ubiquitous", "tests/spec/statement-parser.test.ts#P10 fragment/unbalanced rejection"]
    notes: "## Why\nSchema 0.2 needs an unambiguous criterion boundary before it can replace legacy structured EARS fields."
  - id: AC-fba49136
    ears: ubiquitous
    text: "The migration preview shall preserve each authored schema 0.1 text and proof spelling while reporting unresolved migration meaning without writing workspace bytes."
    test_refs: ["tests/spec/legacy-statement-scanner.test.ts#L04 deterministic seeded arbitrary-input no-throw", "tests/spec/compiler/migration-preview.test.ts#copies authored text and raw selectors without inferring schema 0.2 meaning"]
    notes: "## Why\nD14 retains source text and human confirmation rather than fabricating meaning from partial legacy fields."
  - id: AC-6413ee0c
    ears: event
    condition: "when an operator requests a schema 0.2 migration preview"
    text: "When an operator requests a schema 0.2 migration preview, clad shall return a deterministic read-only proposal and explain that apply awaits the transactional migration feature."
    test_refs: ["tests/cli/migrate.test.ts#previews schema 0.2 migration without writing", "tests/cli/migrate.test.ts#refuses apply without writing"]
    notes: "## Why\nThe preview is useful now, while F4 remains the sole authority for journaled writes."
design_impact:
  classification: additive
