id: F-c6a32fff
title: Fallback safety contract — a graph answer that cannot know says so and
  points back to baseline search
status: done
modules:
  - src/optimizer/reverse-slice.ts
  - src/optimizer/iterative-slice.ts
  - src/optimizer/working-set.ts
  - src/optimizer/measurement.ts
  - src/cli/hook.ts
  - src/serve/server.ts
  - src/optimizer/context-slice.ts
depends_on: []
capability_refs:
  - knowledge-graph
acceptance_criteria:
  - id: AC-30e00a5c
    statement: While the dependency ledger is empty, the system shall mark impact
      answers with ledger counts and a fallback hint so blank-map emptiness is
      distinguishable from verified emptiness.
    notes: >-
      ## Why

      Measured (vapt clone, 196 features/0 edges): a feature with 10 real
      dependents answered impacted:[] coverage:1.0 — byte-identical to a
      verified leaf. 44% of cladding-self features hit the totalKnown=0 path, so
      this is a mainstream path, not an edge case. Ledger is the SOLE
      blank-vs-leaf disambiguator (3-case simulation, wf_04e7f5b8).
  - id: AC-67150016
    statement: While a feature has zero known dependents, the iterative impact slice
      shall report stoppedBy no-known-dependents with null coverage and include
      total_known_dependents in the working-set radius.
    kind: behavior
    notes: >-
      ## Decision

      coverage:null (not 0/1): JS null*100===0, so the working-set rounding site
      needs an explicit null guard or the radius would show a legitimate-looking
      FALSE 0% (simulation-caught). measurement.ts excludes null coverages from
      its median.
  - id: AC-85daff2d
    statement: If spec.yaml is absent from the hook cwd, then the Stop and
      PostToolUse hooks shall print nothing and write nothing.
    kind: behavior
    notes: >-
      ## Why

      Reproduced with the shipped bundle: in a spec-less dir the Stop hook
      blocked with 4 ABSENCE findings and wrote 3 state files; a monorepo SUBDIR
      of a valid cladding project behaved identically (hook cwd is
      process.cwd(), no upward search) — the guard is a repair there, not a
      regression. Broken-but-present spec keeps its honest one-time block.
  - id: AC-c57ea33e
    statement: If the gate footer cannot run, then the system shall report
      pass:false with unavailable:true rather than a fabricated pass:true.
    kind: constraint
    rationale: Prevents an unavailable gate footer from fabricating success.
    notes: >-
      ## Decision

      pass:false stays alongside unavailable:true — removing the pass field
      would contradict F-570a3f's wire contract (drift pass flag) and hosts
      branching on gate.pass; explicit false is fail-closed at zero migration
      cost (simulation: no test pins the catch branch).
  - id: AC-6704a592
    statement: "When a graph tool fails to answer, the system shall include recovery
      guidance: clad init for a missing spec, and fall-back-to-normal-search
      wording in the miss discovery hints."
    notes: >-
      ## Why

      clad_list_features already had this precedent (loadSpecOrError); the four
      graph tools shipped with raw err.message. Zero tests pin the raw ENOENT
      text (simulation), so this is a text-only change.
  - id: AC-10b1a2f8
    statement: When rendering over a blank ledger or an unparseable spec with no
      resolvable counts, the push cards shall disclose the unknown state instead
      of rendering it as empty-and-healthy.
    notes: >-
      ## Decision

      SessionStart line is conditional on parseFailed AND !counted —
      spec/index.yaml is the primary count source, so an unparseable master with
      a healthy index still renders true counts (unconditional rendering would
      be wrong more often than right — simulation).
