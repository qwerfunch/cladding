acceptance_criteria:
  - id: AC-3f0cc5c3
    statement: The self-consistency suite shall fail when detector-count prose in
      README.md or src/stages/detectors/README.md disagrees with
      allDetectors.length.
    kind: behavior
    notes: "WHY: the drift tool carried uncaught drift in its own docs — prose said
      38, SVGs said 40, registry has 41; the existing guard covered only 4 files
      and neither README."
  - id: AC-a5633112
    statement: The self-consistency suite shall fail when the "15-stage" prose in
      README.md or AGENTS.md disagrees with TIER_STAGES.all.length.
    kind: behavior
    notes: "WHY: HARNESS_INTEGRITY guards plugin.json stage arrays but no check tied
      the prose headline to the tier table; TIER_STAGES already imports cleanly
      in tests (precedent tests/cli/clad.test.ts)."
  - id: AC-a454cb4e
    statement: The src/stages/detectors/README.md prose and the four docs/img SVGs
      (en/ko ecosystem + relationship) shall state the live detector count (41),
      with the dead cladding-abc report link removed while preserving the
      severity-reality (core-vs-conditional) breakdown.
    kind: quality
    evidence_refs:
      - src/stages/detectors/README.md
      - docs/img/en/ecosystem.svg
      - docs/img/ko/ecosystem.svg
      - docs/img/en/relationship.svg
      - docs/img/ko/relationship.svg
    notes: "WHY: SVGs are hand-authored art (no generator — verified), excluded from
      the automated guard because tspan-split text and noun variance (checks vs
      detectors) make regex matching brittle; repair is manual, guard covers
      markdown prose only."
  - id: AC-f779e18c
    statement: "The docs/README.md tier index shall list every live doc under docs/
      (adding the previously missing rows: glossary, feature-cycle, gate-scope,
      ssot-testing, knowledge-graph/design)."
    kind: behavior
    evidence_refs:
      - docs/README.md
    notes: "WHY: the index omissions made live docs read as orphaned; several
      deletion candidates in the 2026-07 audit were misjudged dead partly
      because the index never listed them."
  - id: AC-8ded2bb9
    statement: When a Vitest-collected total differs from a registered public claim,
      the release check shall fail with the mismatching file and collected
      total.
    notes: "2026-08-31 — Atomic split: retained prior compound text verbatim for
      non-normative history: The release build shall fail with the file and
      collected total, while the explicit write mode shall update all six
      Markdown and HTML README variants only after every claim surface
      validates. WHY: the public 2522/2522 claim lagged the live 2551-test
      suite; deriving the number at build time prevents the reference
      implementation from publishing another stale all-pass total."
  - id: AC-533f2108
    statement: When every registered public claim surface validates, the explicit
      write mode shall update all six registered README surfaces.
    kind: behavior
  - id: AC-5bf471be
    statement: When any registered public claim surface is malformed or partial, the
      explicit write mode shall leave every registered surface byte-identical.
    kind: behavior
