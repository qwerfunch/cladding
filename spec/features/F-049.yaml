id: F-049
title: Cladding drive — agent dispatch & runtime orchestration (host or sdk)
status: archived
modules: []
depends_on:
  - F-048
capability_refs: []
acceptance_criteria:
  - id: AC-085
    statement: When clad run dispatches a named persona, the drive loop shall load
      that persona from the shipped catalog and pass the selected adapter only
      the compiled feature context and declared guardrails.
    kind: behavior
    notes: >
      ## Historical note

      The retired five-persona/librarian-specialists list and fixed adapter
      roster are not current product identity.
  - id: AC-086
    statement: While the drive loop dispatches a reviewer hand-off, the system shall
      require the reviewer identity by author name to differ from the
      implementing specialist identity, refuse review evidence whose author
      equals the implementer, emit a HUMAN_REQUIRED halt instead, and preserve
      the structural reviewer-versus-author barrier prescribed by Iron Law
      stage_4.1.
    kind: behavior
  - id: AC-087
    statement: When a feature in flight clears L1-L3 but stage_4.2 UAT lacks
      human-pass evidence in the audit log, the system shall halt the drive loop
      with class HUMAN_REQUIRED and include the feature id and audit-log path in
      the halt reason.
    kind: behavior
  - id: AC-088
    statement: If an active agent adapter invocation fails during dispatch for
      host-unavailable or authentication or rate-limit or network or
      context-window or safety-filter reasons, then the system shall halt the
      drive loop with class LLM_UNAVAILABLE, include the underlying adapter
      error class, record consumption of the current feature's single retry
      budget, and preserve the class name for specification stability when the
      failing layer is a host rather than an LLM SDK.
    kind: behavior
  - id: AC-089
    statement: The system shall select the active agent adapter from one
      configuration entry in src/adapters/index.ts, read .cladding/config.yaml
      (`agent.mode ∈ {host, sdk}`, `agent.name`) and the `CLADDING_AGENT_MODE`
      and `CLADDING_AGENT_NAME` environment variables, give environment
      variables precedence, and default to `host` mode auto-detection with the
      `claude-code` adapter in Claude Code or the `generic-mcp` adapter
      otherwise when no configuration is present.
    kind: behavior
  - id: AC-090
    statement: The system shall keep the AgentResult schema, audit-log evidence
      shape, and 10-class halt enum invariant across all agent adapters, with
      parity tests asserting that swapping host claude-code, host generic-mcp,
      SDK Anthropic, SDK OpenAI, or SDK Gemini does not alter those contracts on
      a synthetic single-feature project.
    kind: quality
  - id: AC-091
    statement: The system shall not require an API key for host adapters, make the
      claude-code and generic-mcp and future host adapters operate through the
      host environment's existing subscription or session, neither read nor
      require `ANTHROPIC_API_KEY` or `OPENAI_API_KEY` or `GOOGLE_API_KEY` while
      a host adapter is active, and read a provider environment variable only
      when `agent.mode = sdk` and `agent.name = <provider>` select that
      provider.
    kind: constraint
    rationale: Host-mode dispatch relies on the host-managed session and must not
      trigger SDK provider credential access.
  - id: AC-092
    statement: "The system shall ship real transport bodies for both host and sdk
      modes by v0.3.0. The SDK path lands in F-069 as AnthropicTransport
      (Anthropic API direct dispatch). The host path lands in three substeps:
      F-073 (clad serve MCP server scaffold), F-074 (McpSamplingTransport + live
      audit notification), and F-075 (host adapter routing through the sampling
      context). The Mock bodies in claude-code and generic-mcp remain only as
      the fallback when no MCP server is registered through setHostMcpServer.
      The architectural decision and rationale are recorded in
      docs/multi-provider-roadmap.md."
    evidence_refs:
      - docs/multi-provider-roadmap.md
      - src/adapters/sdk/anthropic.ts
      - src/serve/server.ts
      - src/adapters/host/sampling-context.ts
archive_reason: "Retired in 0.10.0 with the headless drive loop: no recorded
  session ran the loop (0 runs across 5,176 events measured 2026-09-02) and the
  host-delegated cycle owns execution."
