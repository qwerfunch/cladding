id: F-94dda4
title: scan polyglot extensions + layer blacklist + per-language docstrings (v0.3.26)
status: done
modules:
  - src/cli/scan/thresholds.ts
  - src/cli/scan/conventions.ts
depends_on:
  - F-c48eb2
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: The system shall walk the source tree for the nine languages cladding
      officially supports so external Go/Rust/Java/Kotlin/C#/Ruby/PHP/Swift/Dart
      projects produce a real architecture.yaml instead of an empty layers list.
  - id: AC-002
    statement: The system shall hide peer directories from the architecture layer
      view while still feeding them to the convention analyzer so commander,
      express, fastapi, and similar repos no longer surface tests/, docs/,
      examples/ as if they were architectural layers.
  - id: AC-003
    statement: The system shall match the layer blacklist case-insensitively across
      the monorepo workspace prefix so capitalised peer directories (Tests/,
      Playground/, …) and workspace-scoped peers (a:tests/, b:examples/) are
      equally excluded.
  - id: AC-004
    statement: The system shall extend the docblock and tag heuristics to six
      language families so Python projects show Args/Returns counts, Rust
      projects show /// + Errors / Safety sections, and Go/Ruby projects show
      their leading-comment idioms rather than reporting zero.
  - id: AC-005
    statement: The system shall preserve the semantic projection of existing flat
      src/cli and src/core layer records with default extensions and the default
      layer blacklist when supported polyglot source files are added and emit an
      additive record for a new language layer.
    kind: quality
    notes: |
      ## Historical note (2026-05-20, v0.3.26, source commit 696fbb6)
      The v0.3.25 dogfood smoke report said the flat src/ output was
      byte-identical after the polyglot expansion and named the [cli, core]
      layer set. That fixed baseline is historical evidence, not a current
      output-byte invariant.
