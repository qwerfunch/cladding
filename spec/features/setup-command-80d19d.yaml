id: F-80d19d
title: clad setup command — project-scoped host wire (0.9.0 model; replaced the
  0.3.x global symlink wire)
status: done
modules:
  - src/init/host-setup.ts
  - src/init/host-instructions.ts
  - src/cli/clad.ts
  - src/cli/init.ts
  - .claude/settings.json
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: When the user runs `clad setup` with no `--host` option, the system
      shall wire only the detected host channels and leave undetected hosts
      untouched (warning when none are detected), so projects gain wiring only
      for AI tools actually installed while `--host all` stays available as an
      explicit override.
  - id: AC-002
    statement: While every selected host channel is already wired for the current
      engine root, the system shall report each channel as already ready and
      perform no filesystem changes, so idempotent re-runs are safe.
  - id: AC-003
    statement: When the user runs `clad setup` after installing a new AI tool that
      was not detected on the previous run, the system shall wire only the newly
      detected channel while leaving previously wired channels untouched, so the
      new tool gets a cladding channel without re-touching the already-wired
      ones.
  - id: AC-004
    statement: When the user runs `clad setup` after upgrading cladding so the
      engine root differs from the one baked into the project runtime launcher,
      the system shall regenerate `.cladding/host/serve.cjs` against the new
      root, so host channels launch the upgraded engine without manual cleanup.
  - id: AC-005
    statement: When the user runs `clad setup` and the project runtime launcher has
      been deleted, the system shall re-create it, so `clad setup` works as a
      repair command without a separate flag.
  - id: AC-006
    statement: While `clad init` runs and no project setup-status exists, the system
      shall print a friendly skipped notice naming `clad setup` and continue
      with spec generation, so missing host wire does not block spec creation
      and the user is guided to the next step.
  - id: AC-007
    statement: While `clad init` runs and the engine version differs from the
      version recorded in the project's setup-status, the system shall print a
      friendly notice and continue with spec generation, so version skew is
      surfaced without blocking.
  - id: AC-008
    statement: If a user runs npm install -g cladding, then the system shall perform
      pure binary installation with no host-wiring side effects and zero
      filesystem side effects in $HOME.
    kind: constraint
    rationale: Preserves pure installation without unexpected host mutation.
    evidence_refs:
      - package.json
  - id: AC-009
    statement: If a host config already carries a cladding MCP entry that setup does
      not recognize as its own launch shape, then the system shall emit a
      conflict notice and refuse to overwrite unless `--force` is supplied, so
      user customisations are preserved unless explicitly overridden.
    kind: behavior
  - id: AC-010
    statement: When `clad setup` finishes successfully, the system shall end the
      report with a numbered next-steps block, so the user always sees a
      concrete next-step recipe.
  - id: AC-011
    statement: When `clad setup` wires the Cursor channel, the system shall write
      the project-local Cursor MCP config, permissions, bootstrap rule, and
      skill copy while preserving unrelated entries, so Cursor users get
      cladding wired per-project without manual JSON edits.
  - id: AC-012
    statement: When `clad setup` runs on a machine with pre-0.9.0 global wires, the
      system shall remove only ownership-proven entries and preserve everything
      else, so legacy installs migrate without destroying user configuration.
  - id: AC-013
    statement: When `clad init` runs and an existing CLAUDE.md `## cladding` section
      carries v0.3.x markers, the system shall refresh that section in place
      without requiring `--force` while preserving user content outside the
      marker block, so AI sessions do not surface stale guidance that confuses
      hosts where cladding is not wired as an MCP server.
  - id: AC-014
    statement: While a maintainer clones the cladding repository and opens it with
      Claude Code, the system shall ship a `.claude/settings.json` with
      `enabledPlugins["claude-code@cladding"] = true` so Claude Code activates
      the local cladding plugin on entry without a separate maintainer-only
      setup step.
    evidence_refs:
      - .claude/settings.json
  - id: AC-015
    statement: When `clad setup` wires the Antigravity channel, the system shall
      write the machine-wide wire agy actually reads (engine-absolute launch;
      project resolved per session working directory), keep the forward-compat
      project file, refuse foreign or symlinked targets without `--force`, and
      report the exception, so Antigravity connects without silently breaking
      the project-local activation story.
