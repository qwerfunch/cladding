acceptance_criteria:
  - id: AC-9ea2eae1
    statement: The accepted design shall distinguish the bounded AB01-AB12 MCP
      challenger experiment from an optional broader GraphIR generalization
      study without making either a 0.10.0 release prerequisite.
    notes: >-
      ## Why

      The validation added a 12-task MCP experiment while older owners still
      named a 40-task retrieval experiment, leaving their authority and scope
      ambiguous.
  - id: AC-21a9e51f
    statement: The evidence snapshot shall preserve the earlier partial MCP census
      while separately recording the current full list-surface bytes,
      task-profile challenger bytes, graph projection comparison, cadence model,
      and refreshed routed-document census with explicit measurement scope.
  - id: AC-3e816b4c
    statement: The continuation router shall preserve D01-D24 anchors and task
      routes within a 7.5 KiB operational ratchet while the normative hard
      ceiling remains 8 KiB.
