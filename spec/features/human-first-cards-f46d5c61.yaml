id: F-f46d5c61
title: Human-first cards — no internal tool names on user surfaces, and the
  locale follows the user's own language
status: done
modules:
  - src/cli/hook.ts
  - src/optimizer/push-card.ts
  - src/stages/detectors/README.md
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-2c63b999
    statement: The system shall keep the session-start card, prompt suggestions,
      pre-tool block reasons, and impact cards free of MCP tool names and the
      shard term while allowing capability phrasing and user-typeable CLI
      commands in the resolved locale.
    kind: constraint
    rationale: Preserves the Soft Shell boundary on hook surfaces.
    notes: >-
      ## Why

      Adopters do not know internal tool names (user-locked decision), and the
      B1 adoption data shows the names drove zero pulls even when shown — the
      line scared users without moving agents. Agent-facing guidance lives in
      the MCP tool descriptions and the injected instruction files instead.
  - id: AC-37b6d2d6
    statement: The system shall render every user-visible hook string in clear
      jargon-free English as the single source from which the host translates
      without detecting, storing, or forcing the user's language.
    kind: quality
    notes: >-
      ## Why

      User decision: do not force-transform output — elicit user-friendly,
      user-language text from the LLM via instructions. Hook messages are
      agent-delivered channels; the agent naturally answers in the user's
      language. Static detection/localization machinery was removed from scope.
  - id: AC-2a7fed0c
    statement: The impact cards shall describe dependent features and guarding tests
      in person-centered language, show feature titles alongside IDs, and remain
      within the existing line and byte caps.
    kind: quality
  - id: AC-ed9d8a26
    statement: The detector catalog document shall describe the shipped status
      policy of the missing-implementation detector instead of the stale
      status-blind narrative.
