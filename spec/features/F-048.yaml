acceptance_criteria:
  - id: AC-083
    statement: The drive loop shall select the first ready non-archived feature in
      authored dependency order.
    notes: >
      ## Historical atomicity note — 2026-08-31

      Reason: the former criterion combined scheduling, stub fallback, and gate
      evidence.

      Previous compound criterion text (non-normative): The system shall ship a
      deterministic drive floor — an autonomous loop that scaffolds in_progress
      and planned features without invoking an LLM. The loop iterates ready
      features in dependency order, materialises module stubs, and runs L1 gates
      (type · lint · arch), recording an evidence entry per successful pass.
  - id: AC-dff8f340
    statement: When the specialist adapter returns zero concrete mutations, the
      drive loop shall create stubs only for absent declared modules.
  - id: AC-f7e0aea5
    statement: When each drive-loop iteration runs, the drive loop shall record
      type, lint, and architecture gate observations reduced through the F6
      adapter with the current closure digest and registered adapter identities.
    kind: behavior
  - id: AC-084
    statement: When the run loop terminates, the drive loop shall return a
      HaltReason whose class is declared by the current HaltClass registry and
      whose detail identifies the deciding condition.
    kind: behavior
    notes: >
      ## Historical note

      The historical closed ten-class enumeration is obsolete because transport
      classes expanded.
