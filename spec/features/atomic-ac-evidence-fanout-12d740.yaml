id: F-12d740
title: Atomic AC evidence fan-out in drive loop (v0.3.18)
status: archived
modules: []
depends_on:
  - F-098d3b
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: The system shall record one evidence entry per acceptance criterion
      when the drive loop completes a feature so anti-self-cert.checkAc() can
      attribute gates at AC granularity instead of seeing only unattributed
      tool/LLM evidence.
  - id: AC-002
    statement: When a feature has no acceptance_criteria field or an empty array,
      the system shall fall back to a single feature-scoped evidence entry so
      legacy specs without AC declarations stay supported and the audit-log diff
      is empty for them.
  - id: AC-003
    statement: The system shall leave identity.author as tool on every drive-loop
      evidence entry so anti-self-cert still requires a separate human evidence
      before stage_4 can clear — the fan-out increases granularity, not
      authority.
  - id: AC-004
    statement: The system shall preserve the existing 17 drive-loop tests through
      the refactor so the AC fan-out is a strict additive enhancement without
      behavioural regression for legacy callers.
    evidence_refs:
      - tests/drive/loop.test.ts
archived_at: 2026-08-31T00:00:00Z
archive_reason: The retired drive-loop per-criterion audit fanout fabricated
  authoritative-looking evidence from an internal observer; F-048 supersedes it
  with a compact, non-authoritative gate observation.
superseded_by: F-048
