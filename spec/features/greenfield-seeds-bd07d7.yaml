acceptance_criteria:
  - id: AC-001
    statement: The system shall add a deterministic seed-renderer library so the
      three scan-derived artifacts can be written as toolchain-default templates
      when no code is yet available to observe.
  - id: AC-002
    statement: The system shall ensure the conventions seed renders all 14
      convention signals for every supported language as 12 table rows plus
      explicit doc-tag and module-boilerplate sections, with the canonical
      style-guide URL inline, so the seed body is consistent with the observed
      renderer downstream.
  - id: AC-003
    statement: The system shall render an architecture seed that names the typical
      directory baseline for the detected toolchain while keeping the layers
      array empty so the user has to opt in to layer declarations.
  - id: AC-004
    statement: The system shall render a capabilities seed that is
      language-independent and interpolates the project name into the guidance
      comment.
  - id: AC-005
    statement: While shouldWriteScanArtifacts evaluates to false, the system shall
      write the three greenfield seeds plus the scenarios README via the
      existing writeArtifact divert mechanism.
  - id: AC-006
    statement: The system shall realign the persona and skill prompts so they treat
      every scan artifact as always-present and drop the if-absent branch from
      their guidance.
