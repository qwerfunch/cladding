acceptance_criteria:
  - id: AC-001
    ears: ubiquitous
    action: add a deterministic seed-renderer library so the three scan-derived artifacts (docs/conventions.md, spec/architecture.yaml, spec/capabilities.yaml) can be written as toolchain-default templates when no code is yet available to observe
    response: 'src/cli/scan/greenfield-seeds.ts exports three side-effect-free renderers — renderGreenfieldConventionsMd(language, projectName), renderGreenfieldArchitectureYaml(language), renderGreenfieldCapabilitiesYaml(projectName) — each producing a string body with the SEED header that names the language and tells the reader the body will divert to .cladding/scan/<basename>.proposal on the next clad init --scan; the per-language Conventions mapping covers typescript, javascript, python, go, rust, ruby, java with TypeScript defaults as the unknown fallback'
    text: The system shall add a deterministic seed-renderer library so the three scan-derived artifacts can be written as toolchain-default templates when no code is yet available to observe.
    test_refs: [tests/cli/scan-greenfield-seeds.test.ts]
  - id: AC-002
    ears: ubiquitous
    action: ensure the conventions seed renders the full 14-signal table for every supported language plus the canonical style-guide URL inline
    response: 'renderGreenfieldConventionsMd populates indent / quote / semicolon / namingExports / namingConstants / docBlockRatio / docTagCounts / importOrder / exportPattern / errorHandling / typeDefLocation / fileHeaderPattern / testLocation / moduleBoilerplate per language; the body shape matches the observed table from src/cli/scan/llm.ts::renderConventionsTable so reading downstream stays consistent across seed vs observed mode; the Recommended baseline section names the style guide URL (Google TypeScript Style / PEP 8 / Effective Go / Google Java Style / Rust Style / Ruby Style); 12 visible table rows render unconditionally, with file header showing (none) for the seed body'
    text: The system shall ensure the conventions seed renders the full 14-signal table for every supported language plus the canonical style-guide URL inline so the seed body is consistent with the observed table downstream.
    test_refs: [tests/cli/scan-greenfield-seeds.test.ts]
  - id: AC-003
    ears: ubiquitous
    action: render an architecture seed that names the typical directory baseline for the detected toolchain inside header comments while keeping the layers array empty
    response: 'renderGreenfieldArchitectureYaml returns version "0.1" + an empty layers array + comment lines listing the language-specific baseline directories (TypeScript src/cli/ src/core/ src/lib/ src/ui/, Python src/<package>/ tests/, Go cmd/ pkg/ internal/, Rust src/lib.rs src/main.rs src/bin/ tests/, Ruby lib/<gem>/ spec/, Java src/main/java/<package>/ src/test/java/<package>/); the re-scan instruction tells the user the observed body will divert to .cladding/scan/architecture.yaml.proposal; unknown languages fall back to the TypeScript baseline'
    text: The system shall render an architecture seed that names the typical directory baseline for the detected toolchain while keeping the layers array empty so the user has to opt in to layer declarations.
    test_refs: [tests/cli/scan-greenfield-seeds.test.ts]
  - id: AC-004
    ears: ubiquitous
    action: render a capabilities seed that is language-independent and interpolates the project name into the guidance comment
    response: 'renderGreenfieldCapabilitiesYaml ignores any language signal and returns schema "0.1" + source README.md + an empty capabilities array; the comment block documents the per-entry shape (id / title / summary / surface) so a user editing the file by hand has a template to follow; the re-scan instruction names the proposal divert path (.cladding/scan/capabilities.yaml.proposal); two calls with the same projectName produce byte-identical bodies'
    text: The system shall render a capabilities seed that is language-independent and interpolates the project name into the guidance comment.
    test_refs: [tests/cli/scan-greenfield-seeds.test.ts]
  - id: AC-005
    ears: state
    condition: while shouldWriteScanArtifacts in runInit evaluates to false (auto-scan threshold of 3 source files not met or --no-scan)
    action: write the three greenfield seeds plus the scenarios README via the existing writeArtifact divert mechanism
    response: 'src/cli/init.ts runInit grows an else-branch on shouldWriteScanArtifacts that calls renderGreenfieldConventionsMd(language, projectName) renderGreenfieldArchitectureYaml(language) renderGreenfieldCapabilitiesYaml(projectName) and writes each into docs/conventions.md spec/architecture.yaml spec/capabilities.yaml; spec/scenarios/README.md continues to land in both branches; writeArtifact diverts each seed to .cladding/scan/<basename>.proposal when the target already exists so re-running clad init on an already-seeded workspace stays idempotent'
    text: While shouldWriteScanArtifacts evaluates to false, the system shall write the three greenfield seeds plus the scenarios README via the existing writeArtifact divert mechanism.
    test_refs: [tests/cli/init.test.ts]
  - id: AC-006
    ears: ubiquitous
    action: realign the persona and skill prompts so they treat every scan artifact as always-present and drop the if-absent branch from their guidance
    response: 'src/agents/specialists.md Code policy collapses to single-state guidance (follow docs/conventions.md, header marks seed vs observed mode); src/agents/librarian.md What you do gains a bullet declaring spec/architecture.yaml + spec/capabilities.yaml are always seeded by clad init and refined to observed bodies by clad init --scan with hand edits staying in the live file; skills/init/SKILL.md gains a Greenfield seeds (v0.3.42+) subsection naming the three seeds and the per-language defaults so adopters can predict the body shape before running the verb'
    text: The system shall realign the persona and skill prompts so they treat every scan artifact as always-present and drop the if-absent branch from their guidance.
    evidence_refs: [src/agents/specialists.md, src/agents/librarian.md, skills/init/SKILL.md]
