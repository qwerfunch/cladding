id: F-2e28cc72
title: clad verdict — the loop's earned stop-condition poll
status: done
modules:
  - src/verdict/verdict.ts
  - src/cli/verdict.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-1b403763
    statement: The system shall reduce the pre-push strict gate outcome and the
      feature statuses to a single verdict — one of DONE, ITERATE, ESCALATE,
      BLOCKED, or BOOTSTRAP — together with a next_action pointer and a
      remaining-features list.
    notes: "WHY: a host loop must not re-implement the disposition→decision mapping
      over the raw gate dump; one poll answers iterate/escalate/stop."
  - id: AC-acc5ae0a
    statement: If the gate is GREEN but no unit or spec-conformance oracle or
      deliverable-smoke behavioral-proof stage passed as a non-liveness green,
      then the verdict service shall return ITERATE and not return DONE.
    kind: behavior
    notes: "WHY: DONE must require >=1 non-liveness behavioral proof (honest-smoke:
      liveness/na are non-green per src/stages/disposition.ts) — else verdict
      ships the confident-garbage 'finished' signal the gate exists to prevent."
  - id: AC-a29d9485
    statement: While any non-archived feature is not status:done, the system shall
      not return DONE.
    notes: DONE is over the whole goal, not one feature.
  - id: AC-5d88c6b9
    statement: The verdict service shall compute its verdict through the same
      runCheckStages pipeline that clad done gates on, invoke it exactly once
      per poll, and not reimplement the gate.
    kind: behavior
    notes: "WHY: single gate touch — a second, laxer gate would drift from clad done
      and reintroduce vacuous-green. Latency guard: one gate execution per poll,
      never an added run."
  - id: AC-eb5de98c
    statement: While invoked with --json, the verdict command shall emit the
      machine-readable verdict object and keep its reducer pure and
      unit-testable without spawning the toolchain.
    kind: behavior
    notes: Pure reducer in src/verdict/verdict.ts (no cli import — topology
      cli→serve→verdict); CLI handler wires runCheckStages + loadSpec + reducer.
