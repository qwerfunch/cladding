id: F-37b4a8
title: clad sync generates spec/index.yaml — one line per feature for 1-file
  lookup at scale
status: done
modules:
  - src/spec/inventory.ts
  - src/stages/detectors/inventory-drift.ts
  - src/cli/done.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-9f9309
    statement: When sync runs on a sharded spec, the system shall regenerate
      spec/index.yaml as a Tier-C-bannered, id-sorted mapping with one line per
      feature, so feature lookup is a 1-file grep at any scale.
    notes: >-
      ## Why

      With sharding there is no feature index anywhere — locating a feature is a
      150+-file scan; the project's own extended A/B flagged this (H10 caveat).
      One sorted line per feature also keeps git merges line-independent
      (committed-but-derived; union-friendly).
  - id: AC-f1a3f5
    statement: If spec/index.yaml exists but its feature-id set has a missing or
      extra id or any row status lies against the shards on disk, then the
      INVENTORY_DRIFT detector shall flag it with the clad sync remediation so
      stale committed index data cannot silently mislead agents that trust it.
    kind: behavior
  - id: AC-7e3086
    statement: While the project is unsharded (features inline in spec.yaml), the
      system shall not generate an index file, so small projects keep their
      single-file shape.
  - id: AC-e3ad59
    statement: When clad done flips a feature's status (keeping it on a GREEN gate
      or reverting on RED), the system shall regenerate spec/index.yaml in the
      same operation so the committed index's per-row status never lags the
      shard.
    notes: >-
      ## Why

      clad done wrote only the shard, leaving spec/index.yaml's status row stale
      until the next clad sync; the SessionStart card reads that row, so a
      finished feature could read as in_progress. The refresh runs BEFORE the
      gate (the status-aware INVENTORY_DRIFT would otherwise RED the flip's own
      write) and again after a revert (else the index keeps the pre-gate done
      against a reverted shard).
