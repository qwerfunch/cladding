id: F-5cac007a
title: init/onboarding CLI output is English single-source (the agent relays the
  user's language)
status: done
modules:
  - src/cli/clad.ts
  - src/init/host-setup.ts
  - src/cli/clarify.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-f12ce851
    statement: The init and onboarding CLI output surfaces shall carry exactly one
      clear English string per line with no hardcoded Korean output across clad
      init completion hints, the clad setup host-wiring report with
      renderSetupReport and activation hints, and clad clarify Q-and-A prompts.
    kind: quality
    notes: >-
      ## Why

      F-9af291fa (2026-07-06) moved cladding's language capability from shipped
      strings to the instruction layer: one English source per surface, and the
      host agent relays it into the user's language via the CLAUDE.md/AGENTS.md
      rule. That pivot converted the Soft Shell catalog + host-instructions but
      left the init/onboarding CLI stdout (clad.ts hints, host-setup.ts report,
      clarify.ts prompts) hardcoded in Korean — a leftover that contradicts the
      pivot's own principle. English single-source lets the agent render every
      language for free.
  - id: AC-b32265b7
    statement: When these surfaces render, the output shall lead with the plain
      English text (e.g. the setup report ends with a 'Next steps:' block) and
      contain no Hangul characters.
    notes: >-
      ## Why

      Behavioral proof, not just a source grep: the pure renderer
      renderSetupReport returns an English report, and the clad init hint stdout
      is English. Korean intent/answers still flow through as data (the
      LLM-generated clarifying questions remain in the user's language) — only
      cladding's own framing text is English.
  - id: AC-7c50ac34
    statement: If any of the three init or onboarding output files reintroduces
      Hangul, then the structural sweep shall fail while input-matching regexes
      that legitimately match Korean user input remain allowed in
      src/cli/hook.ts and src/router/intent.ts rather than those output files.
    kind: quality
    notes: >-
      ## Why

      Mirrors F-9af291fa's AC-3f34759a locale-machinery sweep: a regression
      guard so a future edit cannot re-hardcode a language on this surface.
      Scoped to the three output-only files; the input matchers and the LLM
      few-shot prompt (scan/intent-onboarding.ts, which teaches the dispatcher
      to emit user-language questions) are deliberately out of scope.
