id: F-ee5f643e
title: Doc graph — doc→spec (F-id) + doc→doc (.md) link index and integrity,
  scoped to avoid example/fixture false positives
status: done
modules:
  - src/spec/doc-references.ts
  - src/spec/feature-id.ts
  - src/stages/detectors/doc-reference-integrity.ts
  - src/stages/detectors/index.ts
  - src/cli/clad.ts
depends_on: []
capability_refs:
  - knowledge-graph
acceptance_criteria:
  - id: AC-5c0ae481
    statement: When clad sync runs, the system shall extract per-doc F-id references
      and resolved relative .md links from docs/**/*.md (excluding fixture dirs,
      skipping code spans) and write them to spec/_doc-links.yaml
      deterministically.
    notes: >-
      ## Why

      85 doc F-id refs + 26 doc↔doc links were validated by nothing — a renamed
      feature silently rotted prose. This is the 'all documents connected,
      always current' half of the graph.
  - id: AC-cd5c3e00
    statement: If a doc's relative .md link resolves to no file, then the
      DOC_LINK_INTEGRITY detector shall emit an error naming the doc and missing
      target.
    kind: behavior
  - id: AC-3f1644f5
    statement: If a scoped doc references an unknown F-id, then the
      DOC_LINK_INTEGRITY detector shall warn naming the doc and id.
    kind: behavior
  - id: AC-f6f6188a
    statement: "If a doc carries the clad-doc-links: ignore marker, then the system
      shall exempt it from F-id resolution but still validate its .md links."
    kind: behavior
  - id: AC-a08b70e9
    statement: The Fixture/benchmark dirs (docs/ab-evaluation*, docs/dogfood,
      docs/benchmarks) and code spans (fenced and inline) shall be excluded from
      F-id extraction, so fixture-namespace ids and format examples never
      produce findings.
    kind: behavior
    notes: >-
      ## Why

      Ground-truth: 16/36 doc F-ids legitimately don't resolve — fixture-project
      ids + format examples like `F-abc123`. Scoping is what keeps the detector
      honest (zero false-RED on cladding-self).
