acceptance_criteria:
  - id: AC-00d84b33
    statement: The specification compiler shall retain explicit schema 0.2 project
      purpose, assurance level, scenario policy, and existing project policies
      without inventing defaults.
    notes: >-
      ## Why

      D05 requires explicit policy selection while D14 keeps migration proposals
      separate from a schema switch; D15/D16 keep that evidence additive and
      honest.
  - id: AC-10b158d6
    statement: The specification compiler shall materialize only feature-owned
      capability contributions and block missing, unknown, or legacy
      second-owner links.
    kind: behavior
    notes: >-
      ## Why

      D07 assigns one forward-edge owner so D14 can prove the migration
      candidate without a runtime L-union; D15/D16 defer byte cutover to its
      later owner.
  - id: AC-2ca57e75
    statement: The specification compiler shall preserve directed architecture rules
      and require local rationale or resolving architecture references for each
      constraint criterion.
    notes: >-
      ## Why

      D08 makes importer-to-dependency direction and durable constraint
      rationale explicit; D14 must not turn legacy explanatory comments into
      architecture meaning.
  - id: AC-3f2d0ad2
    statement: When an operator requests a schema 0.2 migration preview, the
      compiler shall return sorted capability L equals N evidence and unresolved
      architecture rationale without writing workspace bytes.
    notes: >-
      ## Why

      D14 requires a human-confirmed in-memory candidate, not an apply path;
      D05/D07/D08 feed that proof, while D15/D16 reserve transactional cutover
      for F4.
design_impact:
  classification: additive
  rationale: F3 expands the additive Spec 0.2 compiler and read-only preview only.
    Schema 0.1 consumers, the existing F2 baseline, and the refused migration
    apply boundary remain unchanged.
  status: resolved
