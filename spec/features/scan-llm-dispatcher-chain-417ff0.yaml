acceptance_criteria:
  - id: AC-001
    statement: The system shall introduce a dispatcher selection chain that picks
      the highest-priority LLM transport available so projects with an MCP host
      get sampling refinement, projects with only an API key get direct
      refinement, and offline projects keep the deterministic fallback.
  - id: AC-002
    statement: While opts.noLlm is true, the system shall return null without
      inspecting environment so the --no-llm CLI flag remains a hard override.
  - id: AC-003
    statement: The system shall add an LLM refinement path for
      docs/project-context.md so the Why/What/Purpose sections become polished
      prose while the observed README quote stays visible underneath for audit.
  - id: AC-004
    statement: While the dispatcher throws or returns an unparsable response, the
      system shall collapse to the deterministic project-context renderer so the
      resulting artifact is always usable.
  - id: AC-005
    statement: The system shall thread the dispatcher selection through clad init so
      the LLM refinement path runs end-to-end at scaffolding time without
      leaking the await into the test surface or the deterministic-only
      fallback.
    evidence_refs:
      - src/cli/init.ts
      - src/cli/clad.ts
