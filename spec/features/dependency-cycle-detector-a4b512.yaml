id: F-a4b512
title: DEPENDENCY_CYCLE detector — error on a circular depends_on graph (v0.4.x, J3)
status: done
modules:
  - src/stages/detectors/dependency-cycle.ts
  - src/stages/detectors/index.ts
depends_on:
  - F-f6d13e
capability_refs:
  - drift-detection
acceptance_criteria:
  - id: AC-001
    statement: When features[].depends_on contains a cycle, the system shall raise
      an error finding identifying the cycle so the drive-loop deadlock is
      caught at the gate.
  - id: AC-002
    statement: If a depends_on references a non-existent feature, then the system
      shall not treat it as a cycle here — dangling references are
      REFERENCE_INTEGRITY's concern, so the two detectors do not double-report.
    kind: constraint
    rationale: Prevents duplicate detector ownership of dangling references.
  - id: AC-003
    statement: The system shall report each distinct dependency cycle exactly once
      at error severity.
