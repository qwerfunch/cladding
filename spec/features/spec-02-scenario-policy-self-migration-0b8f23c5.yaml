acceptance_criteria:
  - id: AC-0b8f2301
    statement: The specification compiler shall retain schema 0.1 scenarios while
      compiling strict schema 0.2 scenario nodes, source-bearing feature edges,
      and contract projections.
    notes: >-
      ## Why

      D09 preserves durable 0.1 reads while making scenario v2 a compiler-owned,
      provenance-preserving contract.
  - id: AC-0b8f2302
    statement: The specification compiler shall reject malformed scenario types,
      legacy or unknown fields, duplicate feature references, and unresolved
      feature references under every policy while governing absent and correctly
      typed hollow coverage only by scenario policy.
    kind: behavior
    notes: >-
      ## Why

      D09 keeps schema and reference integrity blocking under off, advisory, and
      required; only coverage demand follows the selected policy.
  - id: AC-0b8f2303
    statement: The specification compiler shall apply explicit off, advisory, and
      required scenario policy outcomes to absent, hollow, and valid scenario
      coverage.
    notes: >-
      ## Why

      D09 assigns a visible policy outcome instead of silently treating missing
      journeys as verified coverage.
  - id: AC-0b8f2304
    statement: The assurance closure shall hash only required scenario identifiers
      and actor, goal, success, and ordered step intent for every referenced
      feature criterion.
    notes: >-
      ## Why

      This extends the existing sibling-criterion control rather than
      duplicating it: D13 needs required-scenario freshness without receipt
      fan-out beyond the referenced feature.
  - id: AC-0b8f2305
    statement: When a clean-room migration resolves a legacy scenario, the
      compiler-derived ConsumerSpecView shall preserve its strict scenario
      projection and its baseline-exempt feature and criterion projections for
      assurance consumers.
    notes: >-
      ## Why

      This reuses the existing F4 migration fixture rather than adding a second
      transaction suite. It requires a non-empty compiler contract with the
      resolved scenario, exposes the missing-purpose and legacy-unclassified
      baseline identities in its compiler-derived ConsumerSpecView and assurance
      input, and leaves purpose and kind strict for new nodes. Live bindings are
      live-or-baseline, never a union.
design_impact:
  classification: structural
  rationale: F7 self-migration and compiler-derived compatibility consumer cutover
    are structural. The reviewed P0 boundary comprises compiler/types and
    ConsumerSpecView; raw 0.2 reader/selector retirement, the inventory
    authority guard, assurance workspace/closures and the shared workspace
    binding seam with live-or-baseline never-union; drift-detector inputs for
    AC, proof, scenario, reference, capability, and architecture; and v1
    graph/context/reverse-slice compatibility. F8 public GraphIR v2 remains
    outside this feature.
  status: resolved
  artifacts:
    - docs/design/spec-0.2/model-and-migration.md
    - docs/design/spec-0.2/graph.md
    - docs/design/spec-0.2/proof-and-editing.md
    - docs/design/spec-0.2/assurance.md
    - docs/design/spec-0.2/delivery.md
