acceptance_criteria:
  - id: AC-37cd2624
    statement: When compressing a benchmark run-log, the system shall amend the
      policy first and preserve headline results (including NULLs) in the dated
      abstract at the original path.
    notes: >-
      ## Why

      2026-07-05 adjudication (all-shard cross-check):
      v0.4.0-consistency-bench's numbers back no live claim (the README
      efficiency receipt is case-efficiency-measurement.md), and
      v0.6.0-real-user-verification is operationally superseded by the 0.7.1
      real-usage battery + 0.8.0 telemetry — but the latter records protected
      NULLs and shipped-bug catches, so compression (not deletion) is the honest
      form. Reopening the standing rejection with recorded evidence honors the
      backlog's own do-not-reopen-without-new-evidence rule.
  - id: AC-19da3bd1
    statement: The four protected benchmark files (event-store spec and trap-catch
      pair, cross-vendor-spec-convergence, prereg-context-hypothesis) shall
      remain byte-identical — the event-store pair is bound as done-feature
      modules with a live GOVERNANCE citation, cross-vendor is a
      publication-bias-protected positive result, and the pre-registration is
      un-discharged (its experiment was never run).
  - id: AC-1e657d14
    statement: The F-066 acceptance criterion shall state that GOVERNANCE.md is the
      living citation of the trap-catch result and that no README carries a
      benchmarks link.
    kind: quality
