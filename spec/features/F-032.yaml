acceptance_criteria:
  - id: AC-048
    statement: The system shall tag every evidence entry with an author identity
      drawn from the enum (human / llm / tool). Identity is required for any
      audit-log append.
    evidence_refs:
      - fixture:F-032_AC-048
  - id: AC-049
    statement: The system shall record each evidence entry as one JSON object on its
      own line in .cladding/audit.log.jsonl, in chronological append order.
  - id: AC-050
    statement: If an AC has only tool- or LLM-authored evidence and zero
      human-authored evidence, then the anti-self-cert guard shall return
      pass=false with a machine-readable reason and block stage_4 from clearing
      the AC.
    kind: behavior
