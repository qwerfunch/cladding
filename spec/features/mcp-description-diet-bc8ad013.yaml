acceptance_criteria:
  - id: AC-82b0e788
    statement: The system shall keep the `clad_create_feature`, `clad_changelog`,
      and `clad_get_graph` descriptions in `src/serve/server.ts` within 400
      characters and about two lines, relocate hash-concurrency rationale to
      `docs/spec-ids-multi-dev.md`, changelog formats to `skills/changelog`, and
      graph taxonomy to `docs/knowledge-graph/design.md`, and keep that
      rationale out of the always-resident schema.
    kind: quality
    notes: "WHY: tool descriptions are resident in every session (14,042B total for
      14 tools at 0.8.0); these three carried workflow essays
      (2,115B/1,383B/1,138B) that agents pay for on every turn of every loop."
  - id: AC-7f832957
    statement: The description-budget suite shall fail, keeping the blind-authoring
      protocol resident for skill-less MCP hosts.
    kind: behavior
    notes: "WHY: build-plugin Phase C ships only the init skill to Gemini
      (USER_FACING_VERBS={'init'}), so for Gemini/generic-MCP hosts the
      clad_author_oracle description is the only copy of the blind protocol —
      adversarial review flagged trimming it as the dangerous half of this
      diet."
  - id: AC-56434559
    statement: The system shall keep every registered MCP tool description within
      its enforced per-tool budget, with a documented clad_author_oracle
      exemption tier.
    kind: quality
    notes: "WHY: without a budget tripwire the diet regresses one helpful edit at a
      time; the suite pins the ceiling the way self-consistency pins public
      counts."
