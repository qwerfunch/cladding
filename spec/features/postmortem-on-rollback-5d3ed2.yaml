id: F-5d3ed2
title: Iron Law backbone Phase 3.3 — Librarian post-mortem on auto-rollback (v0.3.22)
status: done
modules:
  - src/core/postmortem.ts
  - src/drive/loop.ts
depends_on:
  - F-2de65d
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: The system shall author a markdown post-mortem under
      .cladding/post-mortems/ after every auto-rollback so the next session has
      a maintainer-readable brief of why the previous attempt failed and what to
      do next.
  - id: AC-002
    statement: The system shall sanitise the rollback timestamp for the filename
      segment so the post-mortem path stays filesystem-safe on every platform —
      Windows, macOS, and Linux.
  - id: AC-003
    statement: The system shall produce distinct files for successive rollbacks of
      the same feature so the audit trail does not overwrite — each failure
      cycle gets its own post-mortem.
  - id: AC-004
    statement: When the checkpoint has no pinned git head, the system shall emit a
      manual-restore guidance line instead of a git checkout command so the
      post-mortem stays usable even for projects cladding tracked outside a git
      repo or before the first commit.
  - id: AC-005
    statement: The system shall hand the drive loop the last failed gate and retry
      count from in-memory maps so the post-mortem authoritatively names what
      went wrong without re-reading events.log.
