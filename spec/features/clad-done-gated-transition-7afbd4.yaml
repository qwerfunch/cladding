id: F-7afbd4
title: clad done — the gated done-transition (honest done floor, v0.4.x)
status: done
modules:
  - src/cli/done.ts
depends_on:
  - F-3788c2
capability_refs:
  - harness-cli
acceptance_criteria:
  - id: AC-001
    statement: When clad done runs for a feature and the pre-push strict gate is
      GREEN, the system shall set that feature's status to done and exit 0.
  - id: AC-002
    statement: If the strict gate is not GREEN, then the system shall revert the
      shard byte-for-byte, leave the status unchanged, and exit non-zero — done
      is never claimed beyond what the gate verifies.
    kind: behavior
  - id: AC-003
    statement: When clad done gates a feature, the system shall flip the status to
      done before invoking the gate, so the done-aware detectors evaluate the
      feature's test evidence.
    notes: >
      ## Decision  flip status→done BEFORE the gate, not after.

      ## Why       a still-`planned` feature lets the done-aware detectors
      (UNTESTED_AC, MISSING_TESTS) skip it → a feature could reach done without
      test evidence.

      ## Trade-off mutating before verifying forces the byte-exact revert in
      AC-002 on a RED gate.
  - id: AC-004
    statement: The system shall gate the done-transition through the same stage
      pipeline that clad check runs, so the floor cannot be weaker than the gate
      it claims.
