    notes: "## Why\nThe adopter screenshot shows the agent saying 'Shard AC 3개 추가 완료' — cladding's injected instructions teach shard-vocabulary and nothing tells the agent to translate. The rule is the third layer: hooks render plain (U2), cards drop jargon (U3), and the agent's own sentences translate (U4)."
