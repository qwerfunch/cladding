  - id: AC-6bf501f8
    ears: ubiquitous
    text: "All five persona prompts shall extend their user-facing-language section beyond id translation — shard, attestation, and detector findings are reported by meaning, in the user's language."
    test_refs: [tests/agent-interpreter-rule.test.ts]
  - id: AC-b3b7a118
    ears: ubiquitous
    text: "The template size guard shall be deliberately raised (with its rationale recorded in the test) rather than silently loosened, and the repository's own CLAUDE.md section shall equal the new template output byte-for-byte."
