id: F-2c02991f
title: The architecture gate scans source, not build output
status: done
modules:
  - src/stages/toolchain/detect.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-caa9471d
    statement: When the TypeScript or JavaScript architecture gate is composed for a
      project, the gate shall exclude generated build-output directories from
      the circular-dependency scan at any depth when unambiguous and only at
      repository root when their names also occur as real source directories.
    kind: behavior
    notes: >-
      WHY: a bundler's output legitimately contains mutual imports, so scanning
      it reports cycles that exist in no hand-written file. Measured on a live
      adopter: five recorded hard-blocking gate failures, all five inside a
      version-ignored bundle — 100% false with respect to source. The adopter's
      recorded root cause was wrong and the issue stayed open for sixteen days.


      WHY THE TWO DEPTHS: excluding `build`, `out` or `target` at any depth
      would drop hand-written code from the scan, and a false negative is worse
      than the false RED this fixes. `dist`, `coverage` and the framework caches
      carry no such risk — no repository on hand commits source under them — and
      anchoring THEM at the root left a monorepo package or a front-end
      subdirectory (`frontend/dist`) still blocking.


      HONEST SCOPE OF THE MEASUREMENT: the four-cycles-to-zero figure was taken
      by running the scanner directly in a front-end subdirectory that is not
      itself a gate root, so it corroborates the pattern rather than measuring
      gate impact. On the gate roots on record the fix removes no findings today
      — cladding is already clean, and the adopter that filed the issue has its
      own scanner config, which makes cladding stand down there by design.
  - id: AC-554d9436
    statement: If the project declares its own dependency-scanner configuration,
      then the system shall not pass its own exclusion, leaving the project's
      rules in force.
    notes: "WHY: the scanner REPLACES its configured exclusions with the
      command-line flag rather than merging them. Passing ours unconditionally
      would silently delete an adopter's own rules — including the workaround
      one adopter is currently relying on, which they discovered alone and
      buried in an unrelated commit."
  - id: AC-c04171bd
    statement: The system shall keep the repository root as the scan root, so a
      project whose layout has no conventional source directory is scanned
      rather than silently skipped.
    notes: "WHY: narrowing the root to a named directory was measured to be worse
      than the defect it fixes. A missing root makes the scanner exit with a
      file-not-found error, which the harness classifies as a setup gap and
      reports as advisory — so the whole stage skips and the gate goes green
      having checked nothing. One adopter's front-end has exactly that layout.
      Trading a loud false failure for a silent pass is a mistake this project
      has already made once."
  - id: AC-dd5c3abf
    statement: When a circular dependency exists among hand-written source files,
      the architecture gate shall report it after applying generated-output
      exclusion.
    kind: behavior
    notes: "WHY: this change may only remove findings, never hide a real one.
      Measured before implementing: the excluded files pull ninety-four further
      files transitively and contain zero source-level cycles, so the measured
      false-negative count is zero — but that is a property of three
      repositories, not a proof, so it is pinned as a requirement."
design_impact:
  classification: none
  rationale: Corrects which files an existing gate scans. No new capability, no
    architecture change, no project-context change, no schema field — the gate,
    its severity, and its exit contract are untouched.
  status: resolved
  artifacts: []
