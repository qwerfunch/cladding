acceptance_criteria:
  - id: AC-2590c81a
    statement: When nodeHealth runs, the system shall map each drift finding to a
      graph node (path→module/test/doc, F-id→feature) and return per-node worst
      severity + which detectors fired.
    notes: >-
      ## Why

      THE KILLER: only cladding (spec-SSoT + 38 detectors) can tell, per node,
      whether spec↔code↔test↔doc conformance holds. Lives in stages/ (imports
      detectors; graph→stages is forbidden, stages→graph is fine).
  - id: AC-3d67e1c9
    statement: When clad graph serve serves /health.json (live, watch-refreshed),
      the viewer shall overlay problem-node health and heal smoothly as drift is
      fixed.
    notes: >-
      ## Decision

      Default is the pretty 6-color graph; health is an OVERLAY (problem nodes
      pulse), so healthy/new repos stay beautiful. The wow = the live red→green
      heal. Static export embeds a stamped snapshot.
