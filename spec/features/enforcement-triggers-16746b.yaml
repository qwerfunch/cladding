id: F-16746b
title: Pre-push hook + CI workflow template — the strict tier finally has
  triggers, with CI named the authoritative gate
status: done
modules:
  - src/init/git-hook.ts
  - src/cli/init.ts
  - src/cli/update.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-b0e73e
    statement: When clad init --with-hook runs in a git worktree, the system shall
      install both the pre-commit hook and a pre-push hook running the strict
      pre-push tier, with idempotent and foreign-hook-safe semantics.
    notes: >-
      ## Why

      TIER_STAGES defined a pre-push tier since 0.4.x but NO pre-push hook
      installer existed — stage_2.3/2.4 had no local trigger at all (enterprise
      review blocker E2).
  - id: AC-a3152c
    statement: When clad init --with-ci runs, the initializer shall scaffold a CI
      workflow running the strict pre-push gate on push and PR, have clad update
      suggest it when missing, and identify CI as the authoritative gate and
      hooks as latency reducers in documentation.
    kind: behavior
    notes: >-
      ## Decision

      The template is GitHub Actions (the dominant host); it is a starting point
      the user owns after scaffolding — cladding never edits an existing
      workflow.
  - id: AC-bf640e
    statement: If a foreign non-cladding pre-push hook or existing CI workflow file
      is present, then the initializer shall skip and report it rather than
      overwrite user-owned enforcement while a force flag is required for hooks
      and the CI scaffold never overwrites.
    kind: constraint
    rationale: Project-owned hooks and CI workflows require explicit ownership
      before cladding can replace them.
