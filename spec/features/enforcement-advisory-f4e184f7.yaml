id: F-f4e184f7
title: clad check advisory when the feature cycle has no hook or CI enforcement
status: done
modules:
  - src/cli/enforcement-advisory.ts
  - src/init/git-hook.ts
  - src/cli/clad.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-4566fd98
    statement: When clad check runs in a project that has features not yet done and
      no cladding git hook and no CI workflow is wired, the system shall surface
      one non-blocking advisory naming how many features are undone and how to
      wire enforcement.
    notes: "The gap: a project can run for months with authored-but-undone features
      while every commit stays green because pre-commit is not --strict and no
      hook/CI is installed. Reuses the existsSync('.github/workflows') idiom
      from clad update; the hook reader matches the `cladding <kind> hook`
      marker."
  - id: AC-2fd01eaa
    statement: If an enforcing cladding hook is installed or a CI workflow directory
      exists or no feature is not-yet-done, then the system shall return no
      advisory.
    kind: behavior
    notes: Any ONE of the three suppressors is enough. A missing/invalid spec also
      yields no advisory — it is not this check's place to speak.
  - id: AC-be0cbdaa
    statement: The advisory shall remain informational without depending on the gate
      outcome or changing clad check's exit status.
    kind: behavior
    notes: enforcementAdvisory takes only cwd (never a stage result), so it cannot
      depend on or alter pass/fail; runCheckCommand prints it but still sets
      process.exitCode from the gate's worst status.
