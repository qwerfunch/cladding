id: F-aee61f
title: UNMAPPED_ARTIFACT scan roots derive from declared architecture layers
  instead of two hardcoded directories
status: done
modules:
  - src/stages/detectors/unmapped-artifact.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-cd6984
    statement: When a full-scale loaded spec declares architecture layers, the
      detector shall derive its scan universe from observed known and
      layer-claimed source extensions for every declared layer, accepting both
      string and {name} layer forms without relying on project.language, so the
      unclaimed-file check covers the declared source map.
    notes: >-
      ## Why

      The old hardcoded roots left cladding's governance blind to most declared
      source directories. The observed-source policy keeps a lazy or
      mixed-language spec honest without treating project.language as evidence;
      modules under declared layers may teach additional roots and extensions.
  - id: AC-c0e388
    statement: While no architecture layers are declared, the detector shall fall
      back to the legacy narrow patterns unchanged, so early projects see no new
      findings from this change.
