id: F-31eeb8
title: scan BFS walk + entrypoint priority + per-directory soft cap (v0.3.28)
status: done
modules:
  - src/cli/scan/walker.ts
  - src/cli/scan/thresholds.ts
depends_on:
  - F-aee1da
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: The system shall walk directories in breadth-first order so a single
      large subtree cannot exhaust the maxFiles budget before sibling
      directories are visited.
  - id: AC-002
    statement: The system shall sort each directory file list by entrypoint priority
      before admitting them under the per-directory soft cap so layer identity
      survives even when the cap truncates the tail.
  - id: AC-003
    statement: The system shall stop admitting files from a single directory once
      PER_DIR_SOFT_CAP is reached so the budget redistributes across the rest of
      the project.
  - id: AC-004
    statement: The system shall keep Python __init__.py recognised as an entrypoint
      so Python packages do not lose their conventional entry document when the
      soft cap activates.
  - id: AC-005
    statement: The system shall keep flat src/ project regression byte-identical so
      the v0.3.27 dogfood smoke output stays stable when v0.3.28 lands.
    evidence_refs:
      - tests/cli/scan.test.ts
