id: F-b7873005
title: gate-error finding-parser — structured file:line from tool-stage output
status: done
modules:
  - src/stages/finding-parser.ts
  - src/assurance/criterion-observations.ts
  - src/assurance/kernel.ts
  - src/assurance/adapters.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-6931d251
    statement: The system shall parse a tool stage's machine-readable output
      (TypeScript, ESLint, Vitest) into structured findings — each carrying a
      file path, line, rule, and message — attached to the stage result, while
      preserving the raw output.
    notes: "WHY: verdict.next_action already surfaces the first path-bearing
      finding; today tool stages return only raw stderr, so tool failures fall
      to the raw-tail. Populating findings[] makes next_action a structured
      file:line with no change to the verdict reducer."
  - id: AC-20b69848
    statement: If a tool stage exits non-zero but yields no parsed finding, then the
      system shall emit a single synthetic finding derived from the raw output
      tail, so an unparsed failure is never presented as no problem.
    kind: behavior
    notes: "Side-effect lock: 'no structure' must never read as 'no problem' — an
      unparsed failure still surfaces a pointer."
  - id: AC-8e636e0b
    statement: While a failing tool stage carries at least one parsed finding, the
      clad verdict's next_action shall surface a structured path:line pointer
      rather than the raw stderr tail.
    kind: behavior
    notes: "Integration with F-2e28cc72: no verdict change needed — the reducer
      already prefers path-bearing findings; this AC verifies the end-to-end
      wiring."
  - id: AC-0fa3265d
    statement: When the finding parser emits a location-bearing finding, the system
      shall derive every reported location only from the structured output
      supplied by the declared tool adapter without performing a second source
      analysis.
    kind: behavior
    notes: >-
      SOUNDNESS LOCK: parser API accepts captured adapter output only; raw stage
      output remains untouched.


      ## Non-normative history (2026-08-31)


      Replaced the broad no-reanalysis wording with an adapter-bound,
      location-level behavior proof and a deterministic source-dependency guard.
  - id: AC-bd425422
    statement: If a tool's structured output is unavailable or unrecognized, then
      the stage shall fall back to its existing raw behavior without error and
      without changing the gate outcome.
    kind: behavior
    notes: "NO-SIDE-EFFECT LOCK: the parser is additive — parsing failure must never
      crash a stage or flip green/red. Pass/fail is still owned by the tool's
      exit code, never by whether parsing succeeded."
