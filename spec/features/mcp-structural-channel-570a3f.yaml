id: F-570a3f
title: "MCP results carry the gate state: gate-footer field on mutating tools,
  schema_version, and a full-gate clad_run_gate tool"
status: done
modules:
  - src/serve/server.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-a8ee9c
    statement: When a mutating MCP tool returns, the result shall include a gate
      field (drift pass flag, top-3 findings, next obligation) inside the JSON
      object, so every host structurally sees the gate state after each spec
      mutation.
    notes: >-
      ## Why

      In-session enforcement was 100%% prompt-advisory and host-dependent
      (Gemini auto-complies, Claude needs prompts, leaks measured 4/4). Tool
      results are the one channel the model cannot not see, on every host — and
      Gemini/Codex have no lifecycle hooks, making this their ONLY structural
      channel.
  - id: AC-86dd41
    statement: The mutating-tool and gate-tool payloads shall carry a schema_version
      field as a frozen wire identifier beginning at 1 so clients can detect
      payload-shape changes across cladding versions.
    kind: behavior
    notes: >-
      ## Why

      MCP tool names are stable wire ids but result shapes were unversioned — a
      0.5.1-built client parsing 0.6.0 results had no signal (review C7).
  - id: AC-4cba6e
    statement: When a host calls clad_run_gate with an optional tier, the system
      shall run the real runCheckStages pipeline and return its untruncated JSON
      outcome, so in-session verification executes the actual gate.
