id: F-02343cd1
title: Bespoke HTML graph viewer — SSoT 4-tier colors + slug labels +
  self-contained canvas force render (offline export)
status: done
modules:
  - src/graph/render.ts
  - src/graph/viewer-shell.ts
  - src/cli/graph.ts
  - src/cli/clad.ts
depends_on: []
capability_refs:
  - knowledge-graph
acceptance_criteria:
  - id: AC-5bab5d89
    statement: When buildGraph builds nodes, the system shall assign a tier (A to
      features/scenarios, B to capabilities, the banner-parsed tier to docs,
      none to modules/tests) and label feature nodes by slug (falling back to
      title then id).
    notes: >-
      ## Why

      User: color each SSoT layer differently + show feature slug not F-id. tier
      is computed at graph-build time (derived, not stored in Spec); banner
      regex + fallback map is deterministic. Feature.slug already exists + is
      unique (SLUG_CONFLICT).
  - id: AC-a00ff60c
    statement: The graph viewer shall use getTierColor to map each tier A, B, C, and
      D plus the non-tier code class to a distinct stable color and use
      getTierLegend to summarize live per-tier counts so the 4-tier architecture
      is legible with a legend.
    kind: quality
  - id: AC-ba8f9036
    statement: When toHtmlShell is called, the system shall return a single
      self-contained, offline HTML string (no external script/CDN) embedding the
      graph data + a zero-dependency canvas force renderer with tier colors,
      slug labels, status opacity, and an interactive sidebar.
    notes: >-
      ## Decision

      Hand-rolled compact canvas force (charge/spring/center) instead of
      vendoring force-graph: truest to zero-dep ethos, no inlined blob / no
      re-vendor maintenance / no supply-chain surface, full aesthetic control,
      ~30-50KB output. Layout is presentation (not gate-tested), so physics
      determinism is a non-issue.
  - id: AC-1aeddbd7
    statement: When clad graph export --format html runs, the system shall write a
      single self-contained .html via toHtmlShell to the mandatory --out path.
