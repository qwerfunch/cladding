id: F-c3747d7d
title: The spec-first window is one coherent normal state across all drift detectors
status: done
modules:
  - src/stages/detectors/spec-first-window.ts
  - src/stages/detectors/status-drift.ts
  - src/stages/detectors/stale-specification.ts
  - src/stages/detectors/missing-implementation.ts
  - src/ui/softShell.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-2f8fb0b6
    statement: While a feature is in the spec-first window, the STATUS_DRIFT's
      stale-start finding and STALE_SPECIFICATION's all-modules-vanished finding
      shall each be emitted at info severity, matching MISSING_IMPLEMENTATION,
      so no drift detector reports the documented author-then-implement state as
      a blocking error or warning.
    kind: behavior
    notes: Completes U1 (F-e8912be3), which demoted only MISSING_IMPLEMENTATION. The
      Stop hook blocks on error OR warn (hook.ts:371) and --strict promotes
      warn, so the two surviving warns kept the spec-first window blocking the
      turn-end Stop — the exact screenshot symptom. Proven deterministically in
      ab-082/GATE-FINDING.md.
  - id: AC-d8be9f4d
    statement: If a feature is outside the spec-first window, then the STATUS_DRIFT
      and STALE_SPECIFICATION shall keep their original error/warn severities,
      so done stays a shipped-code invariant and archived keeps its guards.
    kind: behavior
    notes: "Anti-regression: the demotion must be surgical to the
      planned/in_progress-all-missing branch only. done+missing stays error
      (double-guarded with missing-implementation), hollow-done stays error,
      archived branches stay warn."
  - id: AC-c6b06ec4
    statement: The spec-first window predicate shall be defined once and imported by
      every detector that consults it, so the window definition cannot drift
      between detectors.
    notes: Hoist isSpecFirstWindow (currently private in missing-implementation.ts)
      to a shared module imported by all three detectors.
  - id: AC-d574a481
    statement: While STATUS_DRIFT or STALE_SPECIFICATION renders on a human surface,
      the its single plain-language lead shall be accurate for every sub-case it
      can still be shown for, so the user is never shown a lead describing a
      different sub-case than the one that fired.
    kind: behavior
    notes: U2's one-lead-per-detector flattening currently shows 'A feature is
      marked done but its files do not back that up' for an in_progress
      stale-start (wrong). After U7 the window cases are info (not shown); the
      STALE_SPECIFICATION lead must be generalized so it reads true for its
      surviving warn sub-cases without re-introducing per-sub-case branching (U6
      pivot).
