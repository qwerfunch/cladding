acceptance_criteria:
  - id: AC-001
    statement: The system shall introduce a single governance document defining the
      4-tier SSoT model so every persona and skill references one source of
      truth instead of repeating policy.
    evidence_refs:
      - docs/ssot-model.md
      - docs/README.md
      - spec/README.md
      - src/agents/README.md
  - id: AC-002
    statement: The system shall standardize the first-line banner across every
      cladding-managed artifact so the tier is readable from head -1 without
      loading the body.
  - id: AC-003
    statement: The system shall resolve the spec/capabilities.yaml orphan by
      introducing the CAPABILITIES_FEATURE_MAPPING detector so the Tier B
      artifact gains an actual consumer.
    notes: The optional project.onboarding_seeded marker scopes the maturity grace
      to generated future intent; missing markers retain the established warning
      behavior.
  - id: AC-004
    statement: The system shall close the docs/project-context.md ↔ spec/scenarios
      loop by extending intent-aware onboarding to extract user-journey
      scenarios from the project-context prose.
  - id: AC-005
    statement: The system shall wire src/cli/init.ts and src/cli/clarify.ts to
      persist onboarding scenarios as Tier A shards under
      spec/scenarios/<slug>-<hash6>.yaml.
    evidence_refs:
      - src/cli/init.ts
      - src/cli/clarify.ts
  - id: AC-006
    statement: The system shall realign every persona prompt with the 4-tier model
      so each agent names the tier slice it consumes and points to
      docs/ssot-model.md instead of repeating policy.
    evidence_refs:
      - src/agents/orchestrator.md
      - src/agents/planner.md
      - src/agents/developer.md
      - src/agents/reviewer.md
      - src/agents/observability.md
      - src/agents/README.md
  - id: AC-007
    statement: While the directory layout already encodes domain, the system shall
      keep the directories as-is and encode tier via the header banner +
      meta-doc, not by introducing tier-named directories.
    evidence_refs:
      - docs/ssot-model.md
      - spec/README.md
      - docs/README.md
