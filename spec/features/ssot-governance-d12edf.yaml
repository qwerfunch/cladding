acceptance_criteria:
  - id: AC-001
    ears: ubiquitous
    action: introduce a single governance document defining the 4-tier SSoT model so every persona and skill references one source of truth instead of repeating policy
    response: 'docs/ssot-model.md describes the 4 tiers (A Spec SSoT, B Design SSoT, C Derived, D Audit/Transient) with per-artifact (tier, producer, consumer, refresh trigger) registry; documents the Tier B entry condition (clear consumer required); declares the directory policy (directories encode domain, tier is metadata via header banner); spec/README.md and docs/README.md gain Tier index paragraphs pointing back to ssot-model.md; src/agents/README.md PERSONAS table is reshaped to name the tier slice each persona consumes'
    text: The system shall introduce a single governance document defining the 4-tier SSoT model so every persona and skill references one source of truth instead of repeating policy.
    evidence_refs: [docs/ssot-model.md, docs/README.md, spec/README.md, src/agents/README.md]
  - id: AC-002
    ears: ubiquitous
    action: standardize the first-line banner across every cladding-managed artifact so the tier is readable from head -1 without loading the body
    response: 'every renderer (greenfield-seeds.ts, intent-onboarding.ts, llm.ts, init.ts, onboarding-state.ts) emits the standard banner format `<!-- Cladding · Tier <X> · <authority> · Refreshed by: <verb> -->` (or `# Cladding · Tier <X> · ... -->` for yaml); existing test assertions migrate from the old "Auto-generated by ..." pattern to the new tier-banner pattern; the on-disk first line of every artifact identifies its tier deterministically'
    text: The system shall standardize the first-line banner across every cladding-managed artifact so the tier is readable from head -1 without loading the body.
    test_refs: [tests/cli/scan-greenfield-seeds.test.ts, tests/cli/scan-llm.test.ts, tests/cli/init.test.ts]
  - id: AC-003
    ears: ubiquitous
    action: resolve the spec/capabilities.yaml orphan by introducing the CAPABILITIES_FEATURE_MAPPING detector so the Tier B artifact gains an actual consumer
    response: 'src/stages/detectors/capabilities-feature-mapping.ts exports a detector that loads spec/capabilities.yaml and spec.yaml, then emits error findings for capability features[] entries that reference a non-existent feature id, warn findings for capabilities whose features[] is empty or missing (orphan capability), and info findings for spec.yaml features that no capability claims; detector skips silently when capabilities.yaml is missing or capabilities array is empty (adoption hasn`t reached this artifact yet); registered in src/stages/detectors/index.ts (24 → 25 detectors)'
    text: The system shall resolve the spec/capabilities.yaml orphan by introducing the CAPABILITIES_FEATURE_MAPPING detector so the Tier B artifact gains an actual consumer.
    test_refs: [tests/stages/capabilities-feature-mapping.test.ts]
  - id: AC-004
    ears: ubiquitous
    action: close the docs/project-context.md ↔ spec/scenarios loop by extending intent-aware onboarding to extract user-journey scenarios from the project-context prose
    response: 'src/cli/scan/intent-onboarding.ts grows a 7th sentinel `=== SCENARIOS_YAML ===` in both buildOnboardingPrompt and buildRefinementPrompt; the LLM is instructed to extract 1-3 user-journey scenarios from the intent + project-context paragraphs (NOT architecture layers); parseOnboardingResponse returns scenariosRaw; extractScenarios parses YAML into OnboardingScenario entries with deterministic S-<hash6> ids derived from slugs (FNV-1a 32-bit); OnboardingResult.scenarios is populated on LLM success and empty on deterministic fallback'
    text: The system shall close the docs/project-context.md ↔ spec/scenarios loop by extending intent-aware onboarding to extract user-journey scenarios from the project-context prose.
    test_refs: [tests/cli/intent-onboarding.test.ts]
  - id: AC-005
    ears: ubiquitous
    action: wire src/cli/init.ts and src/cli/refine.ts to persist onboarding scenarios as Tier A shards under spec/scenarios/<slug>-<hash6>.yaml
    response: 'init.ts iterates onboarding.scenarios after writing other artifacts and calls writeArtifact for each scenario, generating filenames from slug + hash and bodies from renderScenarioYaml; refine.ts adds the same loop after refining other artifacts so existing scenario files divert to .cladding/scan/<basename>.proposal; renderScenarioYaml emits the Tier A banner + {id, slug, title, flow, features: []} shape; clad_create_feature can later bind features to existing scenarios via the features[] array (the consumer for spec/scenarios/*.yaml`s flow field)'
    text: The system shall wire src/cli/init.ts and src/cli/refine.ts to persist onboarding scenarios as Tier A shards under spec/scenarios/<slug>-<hash6>.yaml.
    evidence_refs: [src/cli/init.ts, src/cli/refine.ts]
  - id: AC-006
    ears: ubiquitous
    action: realign every persona prompt with the 4-tier model so each agent names the tier slice it consumes and points to docs/ssot-model.md instead of repeating policy
    response: 'src/agents/orchestrator.md adds a Sources (by Tier) table naming B (project-context) + D (events.log, state.yaml) + A (dispatch slice only) and explicitly excludes Tier C; src/agents/librarian.md adds Sources A (write target) + B (cross-validate); src/agents/specialists.md adds Sources B (project-context, architecture, capabilities) + C (conventions) + A (current feature slice); src/agents/reviewer.md adds Sources A + B + C + D with the tier conflict-resolution rule (A wins); src/agents/observability.md adds Sources D only; src/agents/README.md PERSONAS table reshapes the reads column to name the tier slice; net effect: persona prompts repeat less policy and reference ssot-model.md once for the shared definitions'
    text: The system shall realign every persona prompt with the 4-tier model so each agent names the tier slice it consumes and points to docs/ssot-model.md instead of repeating policy.
    evidence_refs: [src/agents/orchestrator.md, src/agents/librarian.md, src/agents/specialists.md, src/agents/reviewer.md, src/agents/observability.md, src/agents/README.md]
  - id: AC-007
    ears: state
    condition: while the directory layout already encodes domain (spec/, docs/, .cladding/)
    action: keep the directories as-is and encode tier via the header banner + meta-doc, not by introducing tier-named directories
    response: 'docs/ssot-model.md §Directory policy documents the decision to keep current paths (spec/, docs/, .cladding/) — directories encode domain (structured spec, human-readable docs, runtime audit), tier is metadata encoded in the first-line header banner + the artifact registry; introducing tier-named directories (tier-a/ etc.) was considered and rejected because (a) it would require ~1500 LOC of detector path rewrites, (b) it breaks upstream Ironclad standard compatibility, (c) every external project`s cladding workspace would need migration, (d) the benefit (path-encoded tier) is already delivered by the header banner; spec/README.md and docs/README.md add Tier index paragraphs so readers landing in those directories see the local tier map without leaving'
    text: While the directory layout already encodes domain, the system shall keep the directories as-is and encode tier via the header banner + meta-doc, not by introducing tier-named directories.
    evidence_refs: [docs/ssot-model.md, spec/README.md, docs/README.md]
