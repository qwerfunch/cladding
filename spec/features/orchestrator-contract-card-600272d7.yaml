id: F-600272d7
title: Orchestrator persona is a declarative cycle contract card, not choreography
status: done
modules:
  - src/agents/orchestrator.md
  - docs/feature-cycle.md
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-ee97a22e
    statement: The orchestrator persona shall contain no procedural choreography —
      no intent-routing table and no imperative agent-sequencing or
      concurrent-dispatch instructions; how work is decomposed across agents is
      the host's decision.
  - id: AC-805ee617
    statement: "The orchestrator persona shall declare the per-feature cycle as a
      contract: stage outcome conditions (spec-first, gated completion), the
      independence condition tied to the evidence-based label (independent |
      self-certified), the hand-off data contract, and an explicit statement
      that execution form — agent count, models, parallelism, progress UI — is
      owned by the host."
  - id: AC-bc42f601
    statement: The feature-cycle guide shall position headless `clad run` as the
      CI/SDK lane, and interactive host-engine execution as the default path.
design_impact:
  classification: none
  rationale: "Prose-layer change: the orchestrator persona stops prescribing
    execution form (host-owned per the role-contract architecture) and instead
    declares the cycle contract the deterministic gates already enforce. No
    engine code or capability changes."
  status: resolved
  artifacts: []
