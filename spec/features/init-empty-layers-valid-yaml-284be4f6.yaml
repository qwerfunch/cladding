id: F-284be4f6
title: clad init writes schema-valid architecture.yaml when the scan finds no layers
status: done
modules:
  - src/cli/scan/llm.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-a76ab3fd
    statement: "When renderArchitectureYaml receives an empty layer array, the
      function shall emit the line layers: [] rather than a bare layers: so
      generated architecture.yaml parses to an empty array and the assembled
      specification loads instead of failing schema validation."
    kind: behavior
    notes: "Reproduced on npm cladding@0.8.1 AND current HEAD: bare 'layers:' parses
      to YAML null, fails schema.json's architecture.layers type:array, loadSpec
      throws, and every clad check then reports ABSENCE_OF_GOVERNANCE ('no
      cladding spec set up') on a brand-new adopter's first init. Trigger
      boundary = SCAN_AUTO_THRESHOLD(3) < files < ROOT_PROMOTION_THRESHOLD(5),
      or --scan forcing the scan. Fix mirrors greenfield-seeds.ts:350 which
      already emits 'layers: []'. Full repro:
      scratchpad/uxlang/initbug-repro.md."
  - id: AC-743bfe4e
    statement: If the layer array is non-empty, then the renderArchitectureYaml
      function shall emit the layers block form followed by one entry per layer
      so normal multi-layer output does not regress.
    kind: behavior
    notes: "Anti-regression: the renderer keeps the block form ('layers:' followed
      by one entry per layer) for any non-empty input — only the empty-array
      input changes here. The correctness of each entry's dir/glob (source-root
      prefix) and the flat-root promotion rework are owned by the sibling
      feature [[scan-layer-glob-source-root]] (F-77a90ac6), not this renderer
      contract."
