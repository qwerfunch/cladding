id: F-046
title: clad init — workspace scaffolder (placeholder → real)
status: done
modules:
  - src/cli/init.ts
depends_on:
  - F-004
  - F-010
  - F-040
capability_refs: []
acceptance_criteria:
  - id: AC-078
    statement: The system shall scaffold a cladding workspace by creating spec.yaml
      seed, the .cladding/ runtime directory, and appending .cladding/ to
      .gitignore. It returns the lists of created and skipped artifacts plus the
      auto-detected project language.
  - id: AC-079
    statement: If spec.yaml already exists and --force is not passed, then the
      system shall skip the spec write and preserve existing user content while
      --force overrides this safety.
    kind: behavior
  - id: AC-080
    statement: When initialization encounters an existing managed artifact without
      explicit replacement authority, the system shall preserve that artifact
      and report the resulting skip or proposal disposition.
    kind: behavior
    notes: >
      ## Historical note

      The absolute “creates nothing/every artifact skipped” wording predates
      onboarding and proposal paths.
  - id: AC-081
    statement: The system shall detect the project language via the toolchain
      manifest chain and fall back to typescript when no manifest matches. The
      seed spec.yaml's project.language reflects that detection.
