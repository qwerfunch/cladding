id: F-073
title: MCP server (`clad serve`) — read surface (v0.2.24, v0.3.0 substep B Phase A)
status: done
modules:
  - src/serve/server.ts
  - src/cli/clad.ts
depends_on:
  - F-049
  - F-068
  - F-069
  - F-070
  - F-071
  - F-072
capability_refs: []
acceptance_criteria:
  - id: AC-206
    statement: The system shall expose cladding as an MCP server reachable over
      stdio through a new `clad serve` verb so any MCP-aware host (Claude Code,
      Cursor, Continue, Cline) can consume cladding's tools, resources, and
      persona prompts.
  - id: AC-207
    statement: The system shall register `clad_list_features`, `clad_get_feature`,
      `clad_run_check`, and `clad_get_events` as MCP tools so an MCP client can
      query cladding's state without touching the filesystem directly.
  - id: AC-208
    statement: The system shall register `cladding://spec`, `cladding://events`, and
      `cladding://audit` as MCP resources so an MCP client can subscribe to or
      read cladding's canonical streams.
  - id: AC-209
    statement: The system shall register the five cladding personas (orchestrator,
      planner, reviewer, observability, developer) as MCP prompts so an MCP
      client can request the persona body without re-parsing src/agents/.
  - id: AC-210
    statement: While the MCP client invokes clad_get_feature with an id absent from
      the spec, the system shall surface a CallToolResult with isError=true so
      the client sees a tool-level failure instead of a transport exception.
