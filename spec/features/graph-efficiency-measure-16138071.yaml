acceptance_criteria:
  - id: AC-493895
    statement: "When measureGraphEfficiency runs, the system shall produce
      per-feature and aggregate context-efficiency metrics that ATTRIBUTE shrink
      honestly (cap-driven vs structural: fits/truncated split +
      medianStructuralRatio via an uncapped second pass), search-efficiency
      (depth/edges), and regression-coverage metrics, feeding the slice and the
      naive baseline through ONE injected reader."
    notes: >-
      ## Why

      The graph tooling's goal is search/context efficiency + stable dev at
      scale, NOT agent correctness — four correctness-framed A/Bs were NULL on
      the wrong axis. This measures the right axis DETERMINISTICALLY (no agent,
      no NULL risk). ## Correction (0.7.1)

      The original 4.1x headline was largely the 3000-token budget CAP
      compressing, not the graph: uncapped, the structural slice is ~1.16x of
      naive on cladding-self (code + metadata). The report now splits cap-driven
      vs structural shrink and the CLI attributes the reduction to the budget;
      the honest sell is a GUARANTEED bounded context with needs/breaks/verify
      wiring, not raw shrink. The injected reader also reaches buildWorkingSet
      now, so slice and baseline read one universe. ## Honest scope

      Upper bound of what the infrastructure CAN provide vs ONE naive baseline
      (shard+all-modules) — NOT proof a strong agent adopts it (A/Bs show strong
      agents grep regardless).
  - id: AC-612e57
    statement: The measurement core shall be pure and deterministic for the
      specification and an injected file reader like code-excerpt, avoid direct
      filesystem access, and skip a feature whose lookup misses without
      throwing.
    kind: quality
  - id: AC-d18961
    statement: When the CLI registers, the system shall add a `measure` verb that
      prints the efficiency report.
