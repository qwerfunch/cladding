id: F-0023ba22
title: Adoption reducer — pull-vs-push adoption verdict from the event ledger
status: done
modules:
  - src/events/session-report.ts
  - src/events/log.ts
depends_on: []
capability_refs:
  - knowledge-graph
acceptance_criteria:
  - id: AC-3362d108
    statement: When reducing the ledger, the system shall derive adoption
      exclusively from resolved pull serves and never raise the verdict from
      push events.
    kind: behavior
    notes: >-
      ## Why

      0.8.0 shipped the working-set/push machinery plus telemetry, but no
      judgment layer: backlog B1 (deprecate clad_get_context) is gated on
      "adoption confirmed" with no definition. The pull/push distinction is the
      guard against vacuous confirmation — hook-fired cards prove delivery, not
      that an agent chose the tool. Design adversarially verified 3-lens +
      Sonnet-simulated (S1 tool-user / S2 grep-around / S3 adversarial separate
      cleanly) on 2026-07-04.
  - id: AC-b200151f
    statement: The verdict shall be computed against exported B1_ADOPTION_THRESHOLDS
      (minimum completed cycles, minimum total pulls, minimum cycle-pull-rate,
      minimum distinct git heads) such that a single accidental call or a
      push-only ledger can never yield confirmed.
    notes: >-
      ## Why

      Single-call and push-only vacuous-satisfaction attacks were the sim's core
      probes. Thresholds are constants (trivially adjustable pre-release) and
      the B1 protocol doc records the chosen values.
  - id: AC-0d7273dd
    statement: When cycles ran but the value lane is silent, the system shall report
      hasSignal true and a not_confirmed verdict — the adoption reducer is never
      gated on ValueDeliverySummary totals.
  - id: AC-345af0b5
    statement: The reducer shall read both the live and the rolled event-log
      generation, be deterministic over identical input, and yield
      insufficient_data with hasSignal false on an empty or pre-0.8 ledger.
