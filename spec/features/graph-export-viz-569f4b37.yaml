id: F-569f4b37
title: Knowledge-graph model + export (mermaid / Obsidian vault / DOT / JSON) +
  hub stats — see the graph in best-in-class viewers
status: in_progress
modules:
  - src/graph/render.ts
  - src/graph/stats.ts
  - src/cli/graph.ts
  - src/cli/clad.ts
depends_on: []
capability_refs:
  - knowledge-graph
acceptance_criteria:
  - id: AC-0b21a485
    kind: behavior
    statement: When graph export constructs its input, the export boundary shall
      serialize the canonical GraphIR v2 node and edge model instead of the
      legacy reverse-index taxonomy.
  - id: AC-0afdbdc6
    statement: When clad graph export --format mermaid|dot|json runs, the system
      shall render the graph to stdout in that format, deterministically.
  - id: AC-a5a942b7
    statement: When clad graph export --format obsidian --out <dir> runs, the system
      shall write a markdown-vault (one note per node, [[wikilinks]] +
      Backlinks) renderable as a graph in Obsidian.
  - id: AC-f8676994
    statement: When clad graph stats runs, the system shall report node/edge counts
      by kind and the top hubs by degree.
  - id: AC-d95b03ac
    kind: behavior
    statement: When --focus is supplied, the graph export shall use a relation-aware
      directed projection with a validated bounded depth and no sibling
      expansion.
purpose: Export and render deterministic, bounded GraphIR v2 projections without
  retaining v1 graph taxonomy or undirected-neighborhood authority.
