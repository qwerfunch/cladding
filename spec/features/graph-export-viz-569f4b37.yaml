id: F-569f4b37
title: Knowledge-graph model + export (mermaid / Obsidian vault / DOT / JSON) +
  hub stats — see the graph in best-in-class viewers
status: done
modules:
  - src/graph/model.ts
  - src/graph/render.ts
  - src/graph/stats.ts
  - src/cli/graph.ts
  - src/cli/clad.ts
depends_on: []
capability_refs:
  - knowledge-graph
acceptance_criteria:
  - id: AC-0b21a485
    statement: When buildGraph is called, the system shall assemble a deterministic
      typed knowledge graph (feature/module/test/scenario/capability/doc nodes;
      depends_on/touches/covers/binds/implements/references/links edges) from
      the spec + reverse-index + doc-link index.
    notes: >-
      ## Why

      The edges already exist scattered (forward in shards, backward in the
      reverse-index, doc edges in _doc-links). buildGraph is the single
      materialization every viewer + query reads. Pure, derived, deterministic.
  - id: AC-0afdbdc6
    statement: When clad graph export --format mermaid|dot|json runs, the system
      shall render the graph to stdout in that format, deterministically.
  - id: AC-a5a942b7
    statement: When clad graph export --format obsidian --out <dir> runs, the system
      shall write a markdown-vault (one note per node, [[wikilinks]] +
      Backlinks) renderable as a graph in Obsidian.
  - id: AC-f8676994
    statement: When clad graph stats runs, the system shall report node/edge counts
      by kind and the top hubs by degree.
  - id: AC-d95b03ac
    statement: When --focus is supplied, the system shall restrict the exported
      graph to the focus node's N-hop (forward+backward) neighborhood.
