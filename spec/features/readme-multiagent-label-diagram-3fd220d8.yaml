acceptance_criteria:
  - id: AC-6b0a1f74
    statement: The README section shall open with the stake that one AI writing both
      code and tests produces a green run proving nothing before naming a label,
      place the two self-certified examples together with the second saying it
      lands on the same label, and close the list with the independent case.
    kind: quality
  - id: AC-c1e7a3b5
    statement: The README section shall explain that the independent label follows
      from test-writer access rather than assurance claims and that
      self-certified means the absence of a separate check rather than a mark
      against the work.
    kind: quality
  - id: AC-4d92c806
    statement: The README section shall include a locale diagram in all four
      languages that draws the completion label decision with the host band,
      single question, two labels, and refusal produced only by a require policy
      while never presenting a roster of agents or roles.
    kind: quality
  - id: AC-83f1ba27
    statement: The documentation build shall embed the diagram in each README
      variant for its own language and not resurrect the retired cast diagram.
    kind: quality
  - id: AC-0e5cb419
    statement: The README rewrite shall preserve every prior README pin, including
      the Multi-Agent heading token and its position after the loop section, the
      three-item list in the English slice, the hedged EU AI Act sentence in
      four EN and KO variants, and detector and stage count literals.
    kind: quality
design_impact:
  classification: none
  rationale: "Documentation-layer clarity pass. The prior inversion (F-8476ccb1)
    fixed the framing but left a reader-facing defect: a yes/no question
    answered with three examples carrying two labels, with no statement that two
    of them share one. This entry restructures the section around the two label
    values, lowers the vocabulary (the cast metaphor is dropped; the label
    values are glossed on first use in the localized variants), and reinstates a
    diagram at a new path. The prose-only decision of F-8476ccb1 was taken after
    four drafts that all drew roles and all read as a fixed cast; the user has
    since asked for a diagram, and this one draws the label decision instead — a
    host band with no agent detail, one question, two outcomes, and the refusal
    a require policy adds. Because it depicts the judgment rather than a roster,
    the invariant that mattered (never restore multi-agent.svg) is untouched,
    and AC-7d433517 of F-8476ccb1 is reworded to state that invariant rather
    than a blanket no-diagram rule. No engine changes."
  status: resolved
  artifacts: []
