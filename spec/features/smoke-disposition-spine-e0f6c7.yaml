id: F-e0f6c7
title: Smoke disposition spine — honest 5-state gate reducer
status: done
modules:
  - src/stages/types.ts
  - src/stages/disposition.ts
  - src/cli/clad.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-b26813
    statement: The gate reducer shall derive a stage's top-line status from the
      stage result's disposition when present, and fall back to the exit-code
      mapping (pass / exit-2 skip / fail) for stages that emit no disposition.
  - id: AC-e1effa
    statement: When a stage reports disposition 'pending_env' or 'advisory', the
      gate shall treat it as blocking (worst >= 1, anyFailed true) and
      contribute a non-zero exit regardless of --strict, never folding it into
      the non-blocking exit-2 skip lane.
    kind: behavior
  - id: AC-ccc5c2
    statement: The gate shall render disposition 'na' and legacy 'liveness' as
      non-green and non-blocking — surfaced as their own status, never counted
      as a passing/green stage and never failing the gate on their own.
  - id: AC-f7dd12
    statement: While any blocking disposition is present in a strict pre-push/all
      run, the gate shall not stamp spec/attestation.yaml.
