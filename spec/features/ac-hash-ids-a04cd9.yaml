id: F-a04cd9
title: Hash-model acceptance-criterion ids + advisory architecture layer.modules
  (v0.4.x, J5)
status: done
modules:
  - src/spec/new.ts
  - src/spec/schema.json
  - src/spec/types.ts
depends_on:
  - F-a4b512
capability_refs:
  - spec-governance
acceptance_criteria:
  - id: AC-001
    statement: When the create tool renders acceptance_criteria, the system shall
      assign each AC a hash-model id so concurrent additions to one shard do not
      collide.
  - id: AC-002
    statement: The system shall accept both legacy sequential and hash-model
      acceptance-criterion ids, so the change is backward-compatible.
  - id: AC-003
    statement: The system shall omit architecture layer.modules from onboarding
      prompts while documenting its consumers precisely.
    kind: constraint
    rationale: Avoids publishing an unsupported architecture field.
    notes: |
      ## Why (amended 2026-08-26)
      Originally the field was advisory because no detector consumed it.
      F-87bb7ed3 (AC-96ff696f) made UNMAPPED_ARTIFACT consume declared layer
      globs; this criterion's prose is updated so the two entries agree.
