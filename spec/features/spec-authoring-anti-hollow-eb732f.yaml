id: F-eb732f
title: Anti-hollow spec authoring — rich create tools + inventory auto-sync +
  INVENTORY_DRIFT (v0.4.x)
status: done
modules:
  - src/stages/detectors/inventory-drift.ts
  - tests/stages/inventory-drift.test.ts
depends_on:
  - F-3b3690
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: The system shall let the create tools author a feature with its
      acceptance_criteria and modules in one call, so a created feature is
      governable rather than a hollow stub.
  - id: AC-002
    statement: The system shall keep spec.yaml's inventory in sync on every MCP
      create so a host LLM cannot leave the stats stale after authoring shards.
    evidence_refs:
      - src/serve/server.ts
      - src/spec/inventory.ts
  - id: AC-003
    statement: The system shall fail the drift gate when the declared inventory
      disagrees with the real shard/test count, so a desynced (hollow) spec can
      no longer pass.
