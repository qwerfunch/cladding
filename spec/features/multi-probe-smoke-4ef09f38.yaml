id: F-4ef09f38
title: Deliverable smoke runs every declared probe with worst-of aggregation and
  per-feature binding
status: done
modules:
  - src/stages/deliverable-smoke.ts
  - src/stages/detectors/smoke-probe-demand.ts
  - src/spec/types.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-2a12fdf6
    statement: When multiple probes are declared, the stage_2.4 smoke stage shall
      execute every probe within the stage time ceiling, report one result line
      per probe, and use the worst per-probe disposition ordering fail over
      pending_env over liveness over pass over na.
    kind: behavior
    notes: "WHY: v1 ran only probes[0] — probes 2..N were silently non-executed, a
      latent vacuous green of exactly the class the Honest series forbids."
  - id: AC-48ad9997
    statement: If one probe fails, then the smoke stage shall exit 1 naming the
      failing probe's argv and detail and not allow a green probe to mask it.
    kind: behavior
    notes: "WHY: worst-of is the only honest aggregate for a gate."
  - id: AC-f747836a
    statement: While a probe's bound feature is not done, the system shall evaluate
      that probe as disposition na without executing its argv.
    notes: "WHY: nothing shipped yet — nothing to smoke; binding makes probe demand
      per-feature instead of project-global (deferred F-c full)."
  - id: AC-5e95db0b
    statement: If a probe binds to a dangling feature id, then the
      SMOKE_PROBE_DEMAND detector shall emit a warn finding naming the probe and
      dangling id.
    kind: behavior
    notes: "WHY: a dangling binding is annotation drift — same disease as stale
      test_refs."
  - id: AC-3770e5fa
    statement: If the minimum of probe count times per-probe timeout and 30 seconds
      truncates execution, then the smoke stage shall report each unexecuted
      probe as pending_env with reason stage time ceiling and not omit it from
      the report.
    kind: behavior
    notes: "WHY: visible non-execution is the entire point of this feature."
