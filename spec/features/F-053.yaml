id: F-053
title: Fixture registry — validated anchor for evidence_refs labels
status: done
modules:
  - conformance/fixtures.yaml
  - src/stages/detectors/fixture-reference.ts
  - src/stages/detectors/index.ts
  - src/stages/detectors/README.md
  - tests/stages/fixture-reference.test.ts
  - tests/conformance/registry.test.ts
depends_on:
  - F-022
  - F-052
capability_refs: []
acceptance_criteria:
  - id: AC-115
    statement: The system shall maintain conformance/fixtures.yaml as the single
      source of truth for valid fixture names that cladding's own spec/features
      may cite.
  - id: AC-116
    statement: While an AC declares a fixture:NAME citation, the
      FIXTURE_REFERENCE_INVALID detector shall emit a warn finding when the name
      is not present in conformance/fixtures.yaml.
  - id: AC-117
    statement: When conformance/fixtures.yaml is absent, the detector shall return
      no findings, so user projects that do not adopt the fixture convention are
      not punished.
  - id: AC-118
    statement: The fixture registry shall require each entry to declare kind as
      runnable or documentary and require each runnable entry to correspond to a
      fixture id in conformance/runner.ts.
    kind: constraint
    rationale: The registry classification must remain traceable to executable
      fixture identities.
  - id: AC-119
    statement: While the cladding self-spec has done features, the self-spec shall
      give every done AC at least one test_ref or evidence_ref so MISSING_TESTS
      emits no findings against it.
    kind: quality
    evidence_refs:
      - spec/features
  - id: AC-120
    statement: The system shall register fixtureReference in
      src/stages/detectors/index.ts and document it in
      src/stages/detectors/README.md as the 20th detector (cladding extension).
    evidence_refs:
      - src/stages/detectors/index.ts
      - src/stages/detectors/README.md
