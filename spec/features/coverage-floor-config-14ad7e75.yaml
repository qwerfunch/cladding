id: F-14ad7e75
slug: coverage-floor-config
title: "Configurable coverage floor — COVERAGE_DROP reads project.coverage_floor"
status: done
modules:
  - src/spec/types.ts
  - src/spec/schema.json
  - src/stages/detectors/coverage-drop.ts
depends_on: []
acceptance_criteria:
  - id: AC-8c7e53
    ears: ubiquitous
    action: "enforce the line-coverage floor declared by the project, defaulting to 70% when none is declared"
    response: "COVERAGE_DROP reads project.coverage_floor (a percent in [0,100]) from the spec and compares total line coverage against it; absent the field, the floor stays 70; the warn message names the floor actually applied"
    text: "The system shall enforce the line-coverage floor declared at spec.yaml::project.coverage_floor — comparing the vitest coverage-summary total line percentage against that value when it is a valid percent in [0,100], and against the 70% default when the field is absent — so a project whose instrumentation overhead makes a uniform 70 punitive can declare a justified lower bound (and a stricter project can raise it) without the floor being hand-edited into the detector."
    notes: |
      ## Why
      COVERAGE_DROP runs inside the pre-push strict gate that `clad done` must pass,
      and coverage is a SINGLE project-wide number the detector reads from an artifact
      — it has no per-feature context (done.ts flips one shard, but the coverage metric
      is global). So the knob is correctly project-level, matching the detector's own
      long-standing "project-configurable later via spec.yaml" note. Without it, a
      feature whose logic is correct but whose perf/instrumentation harness depresses
      project coverage cannot earn `done` at all — a structural block with no override,
      which is exactly the friction this closes.
    test_refs:
      - "tests/stages/coverage-drop.test.ts#coverage_floor lowers the floor → coverage above the override is silent"
      - "tests/stages/coverage-drop.test.ts#coverage_floor raises the floor → coverage below the override warns"
      - "tests/stages/coverage-drop.test.ts#warn message names the configured floor, not the default"
      - "tests/stages/coverage-drop.test.ts#valid spec without coverage_floor → default 70"
  - id: AC-de2636
    ears: unwanted
    condition: "if the spec is absent or fails schema validation (e.g. coverage_floor outside [0,100])"
    action: "fall back to the 70% default rather than crash the coverage check"
    response: "resolveFloor catches the load/validation error and returns 70, so the coverage check keeps working spec-less and a malformed override never breaks the gate"
    text: "If the spec is absent or fails schema validation — including a coverage_floor outside the [0,100] range — then the system shall fall back to the 70% default floor instead of throwing, keeping the coverage check operable spec-less and leaving a broken SSoT root to be reported by ABSENCE_OF_GOVERNANCE rather than crashing COVERAGE_DROP."
    notes: |
      ## Why
      Error-as-data: a detector must never turn a malformed input into a crash that
      hides every other finding. The coverage check predates the spec dependency and
      must stay independent of it — reading the floor is best-effort, and the absence
      or invalidity of governance is a different detector's job to surface.
    test_refs:
      - "tests/stages/coverage-drop.test.ts#out-of-range coverage_floor → spec rejected, falls back to default 70"
