id: F-ba4b7a
title: Pulse UI progressive — in-place status updates in drive loop (v0.3.23)
status: done
modules:
  - src/ui/pulse.ts
  - src/drive/loop.ts
depends_on:
  - F-5d3ed2
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: The system shall expose pulseProgress + pulseProgressEnd alongside
      the existing pulse function so long-running operations like clad drive can
      show in-place progress without breaking the original audit-log contract
      that pulse offers.
  - id: AC-002
    statement: While running on a TTY, the system shall render pulseProgress with a
      clear-line ANSI sequence and no trailing newline so successive updates
      overwrite the same terminal row.
  - id: AC-003
    statement: While running on a non-TTY (CI, pipe), the system shall keep
      pulseProgress silent and emit only on pulseProgressEnd so captured stdout
      stays a clean append-only stream and the original pulse contract holds for
      downstream tooling.
  - id: AC-004
    statement: The system shall emit pulseProgress for every drive-loop phase
      (specialist, L1 gates, reviewer, UAT) so a user staring at clad drive sees
      what's happening instead of a frozen screen during agent dispatch.
  - id: AC-005
    statement: When a feature fails a gate, the system shall emit
      pulseProgressEnd("fail") with the retry counter in the detail string so
      the user sees exactly how many attempts remain before the loop rolls back.
