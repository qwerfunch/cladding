id: F-c17e1edc
title: "Runner-less skips name their exit: gate.commands guidance"
status: done
modules:
  - src/stages/types.ts
  - src/stages/type.ts
  - src/stages/lint.ts
  - src/stages/unit.ts
  - src/stages/cov.ts
  - src/stages/util.ts
  - src/cli/clad.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-4b7d20e5
    statement: The system shall carry a structured skipReason ('no-runner' |
      'tool-missing') on command-stage skip results, tagged at the production
      sites, with by-design skips untagged and every existing skip message
      byte-identical.
    notes: |
      ## Why
      Measured on a zig adopter: six of nine stages skip, and the six split into
      two classes — four say "no <X> registered for language" (curable by
      declaring gate.commands) and two are by-design (oracle absence, no
      deliverable) where that cure is a false prescription. Blanket guidance
      would lie on two stages; a stderr regex would be a parser where a field
      belongs.
  - id: AC-90c3f1a8
    statement: When at least one stage skipped for lack of a runner, the system
      shall print one info line naming those stages and gate.commands while
      remaining silent when none skipped.
    kind: behavior
    notes: |
      ## Why
      The exit exists but is invisible: across every adopter-reachable surface
      (gate output, READMEs, managed AGENTS.md, doctor, MCP tool descriptions)
      gate.commands is mentioned once — a CHANGELOG line. The gate.language
      external E2E proved this exact configuration fails: removing that one
      line left a fully-capable AI unable to find the exit. The guidance is
      inline (key path + example) because docs/ does not ship in the npm
      package. The language name is not printed — it reads 'unknown' in the
      motivating case.
  - id: AC-2f6e88d0
    statement: If no stage skipped for lack of a runner, then the system shall print
      no guidance.
    kind: behavior
  - id: AC-b59a37c4
    statement: When emitting JSON, the system shall include skipReason on tagged
      stage entries and change no existing field.
design_impact:
  classification: none
  rationale: "Additive observability: a structured reason on an existing skip lane
    and one rendered line. No gate decision, severity, or stage semantics
    change; skips stay skips."
  status: resolved
  artifacts: []
