id: F-d3bde4
title: spec/capabilities.yaml LLM extraction from README headings (v0.3.38)
status: done
modules:
  - src/cli/scan/llm.ts
  - src/cli/scan/index.ts
  - src/cli/init.ts
depends_on:
  - F-17df0a
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: The system shall add a fourth labelled section to the scan-artifact
      LLM prompt that asks the dispatcher to emit a spec/capabilities.yaml body
      derived from observed README headings so the dispatcher refines every
      cladding-authored artifact in a single round-trip.
  - id: AC-002
    statement: The system shall export a deterministic
      renderCapabilitiesYaml(headings) that converts each README heading into a
      kebab-slug id plus the verbatim title so --no-llm runs still ship a usable
      spec/capabilities.yaml.
  - id: AC-003
    statement: While the dispatcher returns a reply whose CAPABILITIES_YAML section
      is blank or missing but the conventions and architecture sentinels still
      parse, the system shall keep the overall mode as llm and substitute the
      deterministic capabilities body for the missing section.
  - id: AC-004
    statement: The system shall extend InterpretedScan with a capabilitiesYaml field
      and write the result to spec/capabilities.yaml from runInit alongside the
      existing scan artifacts so adopters receive the capability inventory
      automatically.
    evidence_refs:
      - src/cli/init.ts
      - src/cli/scan/llm.ts
  - id: AC-005
    statement: The system shall update the project-context renderers to reference
      spec/capabilities.yaml as the canonical capability mirror now that it
      ships as a real artifact so docs/project-context.md no longer claims the
      file is queued for a future release.
    evidence_refs:
      - src/cli/scan/llm.ts
