id: F-c48eb2
title: clad init --scan robustness — multi-root inference + forbidden_imports
  candidates (v0.3.25)
status: done
modules:
  - src/cli/scan/roots.ts
  - src/cli/scan/architecture.ts
  - src/cli/scan/llm.ts
  - src/cli/init.ts
  - src/cli/clad.ts
depends_on:
  - F-9b643e
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: The system shall infer source roots from manifest hints and directory
      heuristics so external adopters in TypeScript monorepos, Python projects,
      Go layouts, and Rust workspaces all see a meaningful scan result instead
      of the v0.3.24 src/-only behaviour.
  - id: AC-002
    statement: The system shall prefix monorepo layers with their workspace name so
      two workspaces sharing an internal layer (e.g. a/core and b/core) keep
      distinct identities in the architecture view.
  - id: AC-003
    statement: The system shall emit forbidden_import candidates for layer pairs the
      import graph never exercised so spec/architecture.yaml no longer ships an
      empty forbidden_imports array — the maintainer prunes the list instead of
      authoring it from scratch.
  - id: AC-004
    statement: When a flat source tree is scanned with inferred or explicit source
      roots, the scanner shall resolve bare layer names and matching
      root-qualified directories and module counts.
    notes: |
      ## Historical note (2026-05-20, v0.3.25, source commit bd257a6)
      The retired self-scan smoke gate compared layer names and scenarios with
      v0.3.24 by byte identity. It is retained only as historical evidence;
      current verification uses an isolated semantic fixture.
  - id: AC-005
    statement: The system shall thread the --roots CLI option through to scanRoot
      via runInit so a maintainer with an exotic layout can pin the scanner
      without editing manifests.
    evidence_refs:
      - src/cli/clad.ts
      - src/cli/init.ts
