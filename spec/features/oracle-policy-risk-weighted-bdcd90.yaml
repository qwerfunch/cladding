id: F-bdcd90
title: oracle_policy — risk-weighted, sampled spec-conformance oracle
  requirement (Lever 1, cost reduction)
status: done
modules:
  - src/oracle/policy.ts
  - tests/oracle-policy.test.ts
  - src/stages/detectors/spec-conformance.ts
  - tests/stages/detectors/spec-conformance.test.ts
  - src/cli/clad.ts
  - tests/cli/clad.test.ts
  - src/spec/types.ts
  - src/spec/schema.json
depends_on:
  - F-c4c5ae
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: While project.oracle_policy is set, the system shall require an
      oracle only for high-risk (always_ears) and sampled done ACs, not for
      every done AC.
  - id: AC-002
    statement: The system shall let oracle_policy take precedence over
      require_oracles when both are set.
    kind: behavior
  - id: AC-003
    statement: The system shall sample ACs deterministically (hash of
      featureId.acId), so the gate is reproducible.
    kind: quality
  - id: AC-004
    statement: When clad oracle --required is run, the system shall list the
      policy-required done ACs and exit non-zero if any lacks an oracle.
  - id: AC-005
    statement: If no oracle mandate is set, then the system shall not require any
      oracle, staying inert on legacy specs.
    kind: behavior
