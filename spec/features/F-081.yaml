id: F-081
title: SKILL.md → TOML build-time transpile for Gemini commands (v0.3.6)
status: done
modules:
  - scripts/build-plugin.mjs
  - plugins/gemini-cli/commands/init.toml
  - plugins/gemini-cli/commands/README.md
depends_on:
  - F-078
  - F-076
  - F-077
capability_refs: []
acceptance_criteria:
  - id: AC-246
    statement: The system shall transpile each user-facing repo-root
      skills/<verb>/SKILL.md into a Gemini CLI commands/<verb>.toml at build
      time so the canonical SKILL.md source is the single source of truth and
      the TOML files are generated artifacts.
    evidence_refs:
      - scripts/build-plugin.mjs
  - id: AC-247
    statement: The system shall emit the prompt body using TOML literal multi-line
      strings so backticks, backslashes, and other markdown punctuation in the
      SKILL.md body pass through unaltered.
    evidence_refs:
      - scripts/build-plugin.mjs
  - id: AC-248
    statement: If a SKILL.md body contains the literal sequence `'''`, then the
      transpiler shall fall back to TOML basic multi-line strings with backslash
      and double-quote escapes so transpilation cannot produce malformed TOML.
    kind: behavior
    evidence_refs:
      - scripts/build-plugin.mjs
  - id: AC-249
    statement: The build shall place an AUTO-GENERATED sentinel at
      commands/README.md on every build so readers know the TOMLs are generated
      artifacts and hand edits are reverted.
    kind: behavior
    evidence_refs:
      - plugins/gemini-cli/commands/README.md
  - id: AC-250
    statement: While a SKILL.md is missing YAML frontmatter or its frontmatter has
      no description field, the system shall warn and skip the verb without
      aborting the build so a malformed source file does not block the rest of
      the multi-host transpile.
    evidence_refs:
      - scripts/build-plugin.mjs
