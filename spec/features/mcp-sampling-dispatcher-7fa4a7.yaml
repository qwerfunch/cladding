id: F-7fa4a7
title: MCP sampling dispatcher — clad serve wires Priority 1 of the chain (v0.3.34)
status: done
modules:
  - src/cli/scan/dispatcher.ts
depends_on:
  - F-417ff0
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: The system shall wire the MCP sampling branch of the scan dispatcher
      chain so a host like Claude Code, Cursor, or Continue can refine the scan
      output through its own sampling capability without cladding holding API
      credentials of its own.
  - id: AC-002
    statement: While both an MCP server registration and an ANTHROPIC_API_KEY are
      present, the system shall pick the MCP sampling dispatcher so hosted
      refinement wins and cladding never spends credentials it does not own.
  - id: AC-003
    statement: While opts.noLlm is true, the system shall skip the MCP dispatcher
      even when a server is registered so the --no-llm CLI flag remains a hard
      override.
  - id: AC-004
    statement: The system shall extract the reply text deterministically and return
      an empty string when no text block is present so non-text sampling
      responses do not crash the dispatcher contract.
