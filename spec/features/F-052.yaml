id: F-052
title: test_refs / evidence_refs split — honest AC verification taxonomy
status: done
modules:
  - src/spec/schema.json
  - src/spec/types.ts
  - src/stages/detectors/missing-tests.ts
  - src/stages/detectors/README.md
  - tests/stages/missing-tests.test.ts
depends_on: [F-022, F-051]
acceptance_criteria:
  - id: AC-106
    ears: ubiquitous
    action: schema declares evidence_refs alongside test_refs
    response: spec/schema.json acceptance_criterion definition lists both fields with descriptions distinguishing executable code-tests from non-test verification artifacts
    text: The acceptance_criterion schema shall declare evidence_refs (non-test verification artifacts) as a sibling of test_refs (executable code-tests).
    test_refs: [tests/spec/validate.test.ts]
    evidence_refs: [src/spec/schema.json]
  - id: AC-107
    ears: state
    condition: while a status=done AC has non-empty evidence_refs but empty test_refs
    action: MISSING_TESTS does not emit a finding
    response: detector treats either field as satisfying the verification requirement
    text: While a status=done AC has non-empty evidence_refs, the MISSING_TESTS detector shall not flag it even when test_refs is empty.
    test_refs: [tests/stages/missing-tests.test.ts]
  - id: AC-108
    ears: ubiquitous
    action: migrate self-spec non-test refs to evidence_refs
    response: every AC in spec/features/ whose former test_refs pointed at npm scripts (self-dogfood:…), fixtures (fixture:…), or docs (*.md) carries those refs under evidence_refs; test_refs contains only paths under tests/ or matching *.test.*
    text: The cladding self-spec shall carry only code-test paths in test_refs; all other verification artifacts shall live under evidence_refs.
    evidence_refs: [spec/features/F-001.yaml, spec/features/F-051.yaml]
  - id: AC-109
    ears: event
    condition: when a done legacy criterion has neither a confirmed non-derived test reference nor an evidence reference
    action: MISSING_TESTS emits an error
    response: identifies the absent verification fields
    text: When a done legacy criterion has neither a confirmed non-derived test reference nor an evidence reference, MISSING_TESTS shall emit an error identifying the absent verification fields.
    test_refs:
      - "tests/stages/missing-tests.test.ts#[covers:F-052/AC-109][covers:F-067/AC-180][covers:F-067/AC-181] errors when status=done AC has neither test_refs nor evidence_refs"
    notes: |
      ## Historical note
      The former warn-level promise was intentionally promoted to an error.
