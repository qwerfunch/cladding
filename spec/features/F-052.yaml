id: F-052
title: test_refs / evidence_refs split — honest AC verification taxonomy
status: done
modules:
  - src/spec/schema.json
  - src/spec/types.ts
  - src/stages/detectors/missing-tests.ts
  - src/stages/detectors/README.md
  - tests/stages/missing-tests.test.ts
depends_on:
  - F-022
  - F-051
capability_refs: []
acceptance_criteria:
  - id: AC-106
    statement: The acceptance_criterion schema shall declare evidence_refs (non-test
      verification artifacts) as a sibling of test_refs (executable code-tests).
    evidence_refs:
      - src/spec/schema.json
  - id: AC-107
    statement: While a status=done AC has non-empty evidence_refs, the MISSING_TESTS
      detector shall not flag it even when test_refs is empty.
  - id: AC-108
    statement: The cladding self-spec shall place only code-test paths in test_refs
      and place all other verification artifacts under evidence_refs.
    kind: constraint
    rationale: The verification taxonomy separates executable test paths from other
      evidence artifacts.
    evidence_refs:
      - spec/features/F-001.yaml
      - spec/features/F-051.yaml
  - id: AC-109
    statement: When a done legacy criterion has neither a confirmed non-derived test
      reference nor an evidence reference, the MISSING_TESTS detector shall emit
      an error identifying the absent verification fields.
    kind: behavior
    notes: |
      ## Historical note
      The former warn-level promise was intentionally promoted to an error.
