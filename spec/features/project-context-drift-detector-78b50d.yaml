id: F-78b50d
title: PROJECT_CONTEXT_DRIFT detector — flag an unrefined project-context on a
  grown project (v0.4.x, S-c)
status: done
modules:
  - src/stages/detectors/project-context-drift.ts
  - src/stages/detectors/index.ts
depends_on:
  - F-315fd7
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: When a grown project's project-context.md is still the unrefined init
      template, the system shall warn that its narrative was never filled in.
  - id: AC-002
    statement: If the project is small or its project-context has been refined, then
      the system shall not flag it, so the signal targets only
      grown-but-unrefined projects.
    kind: behavior
  - id: AC-003
    statement: If project-context.md is missing, then the system shall not flag it
      here — existence is ABSENCE_OF_GOVERNANCE's concern; this detector owns
      the present-but-unrefined case.
    kind: behavior
