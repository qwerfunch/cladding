capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: The system shall ship an integration test that simulates two or more
      contributors concurrently calling createFeature and asserts the multi-dev
      safety invariant end-to-end — file paths distinct by hash entropy,
      ID_COLLISION silent, SLUG_CONFLICT raises only on semantic intent overlap.
  - id: AC-002
    statement: While two simulated cwds call createFeature with the same slug and
      the resulting trees are copy-merged, the system shall keep file paths
      distinct through hash entropy and make SLUG_CONFLICT raise exactly one
      error finding on the merged specification so a human resolves the semantic
      duplicate.
    kind: behavior
  - id: AC-003
    statement: The system shall widen scenario.features[] regex to accept new-model
      hash feature ids so a scenario can reference both legacy F-NNN and new
      F-<hash> features in the same array without schema rejection.
  - id: AC-004
    statement: The system shall ship a regression test confirming the scenario regex
      accepts a mix of legacy F-NNN and new F-<hash> ids so the future detector
      author and the schema maintainer cannot silently un-widen this pattern.
