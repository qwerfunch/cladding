id: F-e803c149
title: B1 adoption observation protocol — window, thresholds, fork, and the
  first real data point
status: done
modules:
  - docs/b1-adoption-protocol.md
  - docs/refinement-backlog.md
  - docs/glossary.md
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-538802ac
    statement: The docs/b1-adoption-protocol.md document shall state
      B1_ADOPTION_THRESHOLDS values, an observation window of at least 10
      cladding-self completed cycles plus at least 5 external-project cycles
      before the 0.9 cut, maintainer weekly and release-prep cadence, clad
      measure --sessions and --json commands, an append-only results table
      seeded with the first real data point, per-machine locality, 5MB
      single-generation rotation, and silent-versus-unwired caveats, and the
      verdict fork where confirmed leads to B1 deprecation in 0.9 while
      not_confirmed makes wiring or push improvement the next lever and never
      more capability.
    kind: behavior
    notes: >-
      ## Why

      The adoption reducer (F-0023ba22) and report surface (F-1e7a10c3) produce
      the verdict, but a verdict without a written decision rule invites
      motivated reading. The first real data point exists: 2026-07-05,
      cladding-self ledger, 64 completed cycles, 0 pulls, verdict not_confirmed
      — the protocol records it as row one.
  - id: AC-8753c264
    statement: When B1 is read in the backlog, the backlog row shall point at
      docs/b1-adoption-protocol.md as the gate.
    kind: behavior
  - id: AC-d2182432
    statement: The docs/glossary.md document shall define the adoption verdict as
      pull versus push with its three verdict values and point at
      docs/b1-adoption-protocol.md.
    kind: behavior
