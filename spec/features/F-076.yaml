id: F-076
title: Claude Code plugin formalization — skills · agents mirror · .mcp.json (v0.3.1)
status: done
modules:
  - plugins/claude-code/.claude-plugin/plugin.json
  - skills/sync/SKILL.md
  - skills/check/SKILL.md
  - skills/status/SKILL.md
  - skills/run/SKILL.md
  - skills/init/SKILL.md
  - skills/serve/SKILL.md
  - plugins/claude-code/agents/orchestrator.md
  - plugins/claude-code/agents/planner.md
  - plugins/claude-code/agents/reviewer.md
  - plugins/claude-code/agents/observability.md
  - plugins/claude-code/agents/developer.md
