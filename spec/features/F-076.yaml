capability_refs: []
acceptance_criteria:
  - id: AC-223
    statement: The system shall declare cladding's MCP server (`clad serve`) in the
      Claude Code plugin manifest
      (plugins/claude-code/.claude-plugin/plugin.json `mcpServers`) so Claude
      Code auto-launches it whenever the cladding plugin is enabled, without
      requiring the user to edit settings or run a separate command.
    evidence_refs:
      - plugins/claude-code/.claude-plugin/plugin.json
  - id: AC-224
    statement: The system shall expose cladding's six primary verbs (sync, check,
      status, run, init, serve) as Claude Code skills under
      skills/<verb>/SKILL.md so a user can invoke them via /cladding:<verb>
      instead of the bare CLI.
    evidence_refs:
      - skills/sync/SKILL.md
      - skills/check/SKILL.md
      - skills/status/SKILL.md
      - skills/run/SKILL.md
      - skills/init/SKILL.md
      - skills/serve/SKILL.md
  - id: AC-225
    statement: The system shall mirror cladding's five persona files (orchestrator,
      planner, reviewer, observability, developer) from src/agents/ into
      plugins/claude-code/agents/ so Claude Code's agent picker surfaces them;
      the copy is performed by scripts/build-plugin.mjs and the result is
      committed to git.
    evidence_refs:
      - plugins/claude-code/agents/orchestrator.md
      - plugins/claude-code/agents/planner.md
      - plugins/claude-code/agents/reviewer.md
      - plugins/claude-code/agents/observability.md
      - plugins/claude-code/agents/developer.md
  - id: AC-226
    statement: While npm run build or npm run build:plugin is invoked, the system
      shall regenerate the plugins/claude-code/agents/ plugin mirror from
      src/agents/ so source and plugin manifest stay in lockstep and a hand-edit
      of plugins/claude-code/agents/<id>.md is reverted on the next build.
    evidence_refs:
      - scripts/build-plugin.mjs
  - id: AC-227
    statement: The system shall expose `init` as the only user-facing slash command
      per host plugin (Claude Code, Gemini CLI), removing the legacy
      commands/clad.md wrapper and per-verb .toml files, because cladding is
      infrastructure (drift is auto-detected, gate runs in CI) and the user only
      invokes `init` directly at project start.
    evidence_refs:
      - plugins/claude-code/commands/init.md
      - plugins/gemini-cli/commands/init.toml
