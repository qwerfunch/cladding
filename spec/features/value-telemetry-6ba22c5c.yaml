id: F-6ba22c5c
title: "Value-delivery telemetry: card surfaces record fired/skipped events;
  clad measure --sessions aggregates them"
status: done
modules:
  - src/events/log.ts
  - src/cli/hook.ts
  - src/serve/server.ts
  - src/events/session-report.ts
  - src/cli/clad.ts
depends_on: []
capability_refs:
  - harness-cli
acceptance_criteria:
  - id: AC-238a3658
    statement: The system shall declare the EventType member impact_card_fired.
    notes: >-
      ## 2026-08-31 criterion decomposition


      Original compound text (verbatim): The system shall define EventType
      members impact_card_fired, impact_card_skipped, session_card_rendered,
      prompt_suggestion_served, and working_set_served in src/events/log.ts,
      with impact_card_skipped.reason restricted to a closed enum
      (not_write_tool | unwatched_path | no_spec | debounced | trivial_edit |
      owner_miss | spec_unreadable | dedup | ledger_exhausted) mapping
      one-to-one onto the degrade branches of runPostToolUseDrift and its mini
      working-set push card (F-35954d19).


      Reason: split independent event declarations and skip-disposition
      observables while retaining this legacy address.


      WHY: the 0.7.1 impact-card 0%-firing bug was invisible to the harness
      itself — the closed reason enum makes silent-vs-broken distinguishable
      from the ledger alone.
  - id: AC-93b89336
    statement: The system shall declare the EventType member impact_card_skipped.
  - id: AC-f0c4df75
    statement: The system shall declare the EventType member session_card_rendered.
  - id: AC-298fb2b3
    statement: The system shall declare the EventType member prompt_suggestion_served.
  - id: AC-74b24595
    statement: The system shall declare the EventType member working_set_served.
  - id: AC-2712ade0
    statement: The system shall restrict every emitted impact-card skip reason to
      the closed ImpactSkipReason vocabulary.
  - id: AC-76331365
    statement: The system shall map every applicable runPostToolUseDrift or mini
      push-card degradation branch to one declared ImpactSkipReason disposition.
  - id: AC-373257b2
    statement: When an impact card is emitted, the system shall record exactly one
      impact_card_fired event containing its rendered file, feature, impacted,
      tests, and unledgered fields.
    notes: >-
      ## 2026-08-31 criterion decomposition


      Original compound text (verbatim): When a value surface produces output,
      the system shall record exactly one corresponding event
      (fired/rendered/served) with accurate payload fields (impact card: file,
      feature, impacted, tests, unledgered; working set: query, resolved,
      truncated, sliceTokens; cards: bytes).


      Reason: split the four output surfaces into independently observable
      event-to-output contracts while retaining this legacy address.


      WHY: event-to-output bijection is what makes fire-rate a trustworthy
      number.
  - id: AC-a313dc92
    statement: When a nonempty SessionStart card is rendered, the system shall
      record exactly one session_card_rendered event containing its UTF-8 byte
      count.
  - id: AC-eeed2259
    statement: When a prompt suggestion is served, the system shall record exactly
      one prompt_suggestion_served event containing its kind.
  - id: AC-26c4f8b6
    statement: When a working-set request reaches a serve result, the system shall
      record exactly one working_set_served event with resolved=true plus
      truncation and slice fields for a hit or resolved=false for a miss.
  - id: AC-8fc6bea0
    statement: While a debounce window is open, the system shall aggregate
      high-frequency skip reasons (not_write_tool, unwatched_path) into at most
      one flushed impact_card_skipped event per window, so skip volume cannot
      rotate gate_run history out of events.log.jsonl.
    notes: "WHY: 5MB rotation protects gate history; per-call skip events would
      evict it."
  - id: AC-c070212c
    statement: When clad measure --sessions runs, the system shall report
      fired-vs-skipped counts, a per-reason skip histogram, and the fired
      percentage over eligible edits (eligible = fired + skipped excluding
      not_write_tool and unwatched_path), with a header stating the numbers
      measure delivery, not adoption.
    notes: "WHY: adoption claims were falsified by A/B; delivery is what this can
      honestly measure."
  - id: AC-2dff87ef
    statement: If the ledger contains zero value-delivery events, then the clad
      measure --sessions command shall report that no value-delivery telemetry
      was recorded and that it cannot distinguish silent surfaces from unwired
      emission before exiting 0.
    kind: behavior
    notes: "WHY: absence of telemetry must never render as 0% value nor as success."
  - id: AC-e9d041de
    statement: If event emission fails for any reason, then the hosting hook or MCP
      handler shall return its normal output unchanged — telemetry is
      observer-only and extends the recordEvent silent-degrade contract.
    notes: "WHY: a hook failure must never brick the host session (hook.ts
      invariant)."
