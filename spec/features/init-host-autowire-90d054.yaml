id: F-90d054
title: clad init writes host wiring + enrichment marker (archived; superseded by
  F-80d19d in v0.4.0)
status: archived
modules: []
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: When `npm install -g cladding` completes, the postinstall hook shall
      create `~/.claude/plugins/cladding` as a symlink pointing at the
      npm-global cladding package, so Claude Code auto-discovers cladding from
      every project without requiring `--plugin-dir`.
  - id: AC-002
    statement: When the postinstall hook runs, the system shall create
      `~/.gemini/extensions/cladding` as a symlink pointing at the npm-global
      `cladding/plugins/gemini-cli`, so Gemini CLI auto-discovers cladding as an
      installed extension.
  - id: AC-003
    statement: When the postinstall hook runs, the system shall create
      `~/.agents/skills/cladding-<verb>` symlinks for every verb skill in
      `cladding/plugins/codex/skills/`, so Codex CLI auto-discovers all cladding
      skills from its global skills directory.
  - id: AC-004
    statement: When the postinstall hook runs, the system shall merge a
      `[mcp_servers.cladding]` table into `~/.codex/config.toml`, preserving all
      existing tables and keys outside that namespace, so Codex CLI
      auto-launches the cladding MCP server on every session.
  - id: AC-005
    statement: When `clad init` runs and any of AC-001 through AC-004 was previously
      skipped (for example because `npm install --ignore-scripts` was used), the
      system shall retry those skipped host wiring operations, so users who
      disabled npm scripts still reach the wired state without running any
      additional commands.
  - id: AC-006
    statement: If the TOML merger encounters keys outside the
      `[mcp_servers.cladding]` table while merging into `~/.codex/config.toml`,
      then the system shall NOT modify or remove those keys, so existing user
      MCP server entries and Codex configuration are preserved verbatim.
    kind: behavior
  - id: AC-007
    statement: If a target symlink already resolves to the cladding npm-global path,
      then the host wiring step shall NOT re-create or rewrite that symlink, so
      idempotent re-runs touch nothing they do not need to touch.
    kind: behavior
  - id: AC-008
    statement: When `clad init` runs in a target project, the system shall write
      `AGENTS.md` at the project root containing the cross-tool entry point and
      the enrichment instruction block, so Codex, Cursor, Continue, Copilot, and
      Aider auto-recognize the project as cladding-managed.
  - id: AC-009
    statement: When `clad init` runs and no `CLAUDE.md` exists at the project root,
      the system shall create `CLAUDE.md` with the cladding instruction block,
      so Claude Code memory is primed with the cladding rules from the very
      first session.
  - id: AC-010
    statement: "When clad init runs and CLAUDE.md already exists, the system shall
      append a ## cladding section idempotently without duplicating it or
      altering prior file content."
    kind: behavior
  - id: AC-011
    statement: When `clad init` runs, the system shall write
      `_meta.enrichment_status` to `"pending"` plus `enrichment_scope` (the
      checklist of items to populate) and `detected` (deterministic project
      observations) into `spec.yaml`, so any host AI opening the project later
      can pick up the checklist and finish enrichment before the user's first
      task.
  - id: AC-012
    statement: While a second `clad init` runs in a project that already has a
      populated `spec.yaml`, the system shall preserve all existing spec body
      content and only re-activate `enrichment_scope` items whose `detected`
      observations have changed since the previous init, so idempotent re-runs
      never overwrite human or AI work.
