  - src/cli/scan/thresholds.ts
  - src/ui/softShell.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-1c7a90b2
    statement: The system shall expose the extension-to-language vocabulary and the
      observed source-language distribution from a single foundation module
      under src/core/ that both the scan layer and the stage layer import.
    notes: >
      ## Why

      Three divergent language tables (scan EXT_TO_LANGUAGE 15, toolchain CHAIN
      12,

      unmapped EXT_BY_LANGUAGE 6) meant clad init could seed a label the
      detector

      layer then rejected under --strict — measured: init seeded cpp/rust and
      the

      gate blocked both with zero user error. Architecture forbids stages -> cli

      imports, so the shared home must be the foundation tier.
  - id: AC-3f8e6d15
    statement: If the declared language is unknown to the vocabulary or fewer than 5
      classified source files exist, then the TECH_STACK_MISMATCH detector shall
      emit nothing.
    kind: behavior
    notes: |
      ## Why
      The prior manifest-chain comparison blocked 12 of 19 realistic normal repo
      shapes (63%) under --strict. A coverage-ratio guard (D7) was tried and
      refuted out-of-sample: whether an unknown extension sat in the denominator
      list flipped the failure between false-warn and missed-drift. The
      evidence-count rule replaces it and removes that list entirely.
  - id: AC-5b2d47c9
    statement: When the declared language is absent from the observed source set
      with at least 5 classified files, the detector shall emit one warn finding
      naming the declared language and the observed distribution.
  - id: AC-8d94a1e6
    statement: When the declared language is observed at under 10% of classified
      sources, the detector shall emit one info finding and never a gate-failing
      severity.
    notes: |
      ## Why
      Boundary attack proved a normal thin-native SDK (4.8%) sits BELOW a real
      ported-residue case (8.3%) — no threshold separates them, so the minority
      band discloses instead of blocking. Corpus-supported ranges: evidence
      floor K in [3,10] (5 chosen), minority t in [9,50]% (10 chosen; higher t
      only adds info noise on normal polyglots).
  - id: AC-e07c3241
    statement: If the declared language is present at or above the minority
      threshold among observed sources, then the detector shall emit nothing,
      regardless of what the build-manifest chain resolves.
    kind: behavior
design_impact:
  classification: none
  rationale: Moves a vocabulary map to the foundation tier and re-anchors one
    detector's evidence source; no architecture layer, capability, or
    gate-severity policy changes. detectToolchain and gate-command selection are
    untouched.
  status: resolved
  artifacts: []
