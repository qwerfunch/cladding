id: F-9e1279d4
slug: language-evidence-core
title: "Language evidence core and evidence-based TECH_STACK_MISMATCH"
status: done
modules:
  - src/core/language-evidence.ts
  - src/stages/detectors/tech-stack-mismatch.ts
  - src/cli/scan/thresholds.ts
