id: F-208eaa79
title: Spec 0.2 GraphIR v2 directed query and public graph cutover
status: in_progress
purpose: Make every graph-aware Cladding surface consume one canonical,
  provenance-preserving, bounded GraphIR so impact and retrieval remain complete
  without unbounded context or parallel graph authorities.
