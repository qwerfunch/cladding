acceptance_criteria:
  - id: AC-145
    statement: When an architecture or secret detector-adapter stage reports an
      observation, the stage adapter shall preserve its supplied options,
      applicable shared result, error severity, and finding order in the stage
      result.
    kind: behavior
    notes: >
      ## Historical schema-0.1 note

      2026-05-19 · v0.2.11 · e0dec700. Architecture/Secret detector fixtures: no

      findings, severity mixes, and options; at least 75% line coverage for both

      sources; non-current. Released title: "Stage runner tests batch 2 (5
      stages)".
  - id: AC-146
    statement: When a unit or coverage runner is observed, the stage adapter shall
      distinguish successful execution and executed failure from unavailable
      execution classified as unobserved and reserve not applicable for
      compiler-derived applicability.
    kind: behavior
    notes: |
      ## Historical schema-0.1 note
      2026-05-19 · v0.2.11 · e0dec700. Unit/Coverage execa fixtures: language,
      override, exit, stderr, and null outcomes; at least 85% line coverage for
      both sources; non-current.
  - id: AC-147
    statement: The system shall ship tests/stages/smoke.test.ts bringing the
      stage_3.1 smoke runner to at least 85% line coverage.
  - id: AC-148
    statement: While current coverage assurance is evaluated, the assurance registry
      shall derive it from the coverage obligation and treat the v0.2.11
      measurement as historical evidence only.
    kind: quality
    notes: |
      ## Historical schema-0.1 note
      v0.2.11’s 72.58% to ≥80% measurement is historical, not current assurance.
