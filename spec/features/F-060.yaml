id: F-060
title: Stage runner behavior evidence
status: done
modules:
  - src/stages/arch.ts
  - src/stages/secret.ts
  - src/stages/unit.ts
  - src/stages/cov.ts
  - tests/stages/arch.test.ts
  - tests/stages/secret.test.ts
  - tests/stages/unit.test.ts
  - tests/stages/cov.test.ts
