acceptance_criteria:
  - id: AC-e44c29b6
    statement: When a focus feature declares modules[] on a Gradle repo under the
      default feature scope, the system shall scope the type, lint, unit, and
      coverage stages to that feature's Gradle projects (a single batched
      ./gradlew :a:test :b:test … invocation) rather than the root aggregate
      task.
  - id: AC-0653c05d
    statement: The system shall map each repo-relative module path to a Gradle
      project path by walking up to the nearest ancestor directory holding both
      a build script and gradle.properties (normalizing a file path to its
      directory), converting path separators to a colon-prefixed project path,
      de-duplicating and deterministically sorting the result, and throwing a
      clear error — never a silent whole-repo fallback — when a path resolves to
      no Gradle project.
  - id: AC-0c7ee62f
    statement: When the coverage stage is scoped on a Kotlin project, the system
      shall run :project:koverXmlReport for modules applying the Kover plugin
      and read build/reports/kover/report.xml or run :project:jacocoTestReport
      otherwise, collect each scoped module report, and merge their LINE
      counters into one aggregate percentage.
    kind: behavior
  - id: AC-c0f5a1b2
    statement: When a Kotlin coverage gate runs, the system shall select Kover or
      JaCoCo from .cladding/config.yaml gate.coverage first or else ordered
      Kover-plugin detection in the root build, settings,
      gradle/libs.versions.toml version catalog, or buildSrc or build-logic
      convention plugin, default to JaCoCo, and set both the Gradle coverage
      task and the report path read by COVERAGE_DROP.
    kind: behavior
  - id: AC-40882a42
    statement: Where .cladding/config.yaml declares a gate block, the system shall
      honor gate.scope (feature default, or repo to force the whole-repo
      aggregate) and gate.commands templates that replace toolchain
      auto-detection, expanding each {modules:TASK} token into one :project:TASK
      argument per focus project.
  - id: AC-9fe3c8c3
    statement: If a feature declares no modules[] or the project is a non-Gradle
      language or gate.scope is repo, then the system shall run the original
      whole-repo gate unchanged so no existing behavior or snapshot regresses.
    kind: behavior
