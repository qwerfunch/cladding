acceptance_criteria:
  - id: AC-1a2b3c4d
    statement: The renderer shall encode node meaning as hue from SSoT tier A, B, C,
      or D or else kind feature, scenario, capability, module, test, or doc,
      drive luminosity from degree with hubs mixed toward white, and boost final
      per-instance colors above 1.0 so bloom renders a glow corona.
    kind: quality
    notes: >-
      ## Why

      User: 'go identical to the reference design'
      (DeusData/codebase-memory-mcp). The reference colors stars BY DEGREE and
      boosts color >1.0 (meshBasicMaterial toneMapped=false) so UnrealBloom
      catches the corona. We keep cladding's VALUE — hue still encodes SSoT
      tier/kind — and fold the stellar luminosity on top (more information than
      the reference). ## Caveat

      The WebGL scene itself (three.js InstancedMesh + UnrealBloomPass strength
      1.2/radius 0.6/threshold 0.3 + OrbitControls + 60s idle auto-rotate) lives
      in src/graph/viewer/main.ts and is NOT headless-testable (no WebGL in
      vitest) — it is verified by manual browser smoke. These ACs pin the pure,
      tested cores (stellar.ts color math, layout3d.ts) that the scene consumes;
      this is deliberately NOT a vacuous green.
  - id: AC-2b3c4d5e
    statement: When a node has drift, the system shall override its color to a
      red/amber burn brighter than any healthy node, and restore the semantic
      hue once the drift is fixed.
    notes: >-
      ## Why

      The live killer (F-af45042a) carried into the WebGL viewer: the color
      contract (drift = brightest burn) is pinned here; the SSE
      live-refresh/heal wiring is in main.ts (manually verified).
  - id: AC-3c4d5e6f
    statement: When the layout runs, the system shall compute finite, bounded
      (±4000), deterministic 3D positions for every node.
  - id: AC-4d5e6f70
    statement: The Edges shall render as additive filaments colored by edge kind,
      with intensity scaled by focus — same-cluster brighter than cross when
      idle, both-endpoints-highlighted brightest, and skipped entirely when a
      highlight is active and neither endpoint is in it.
    kind: behavior
