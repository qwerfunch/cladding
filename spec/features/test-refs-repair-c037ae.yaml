id: F-c037ae
title: "sync auto-repairs stale test_ref paths and suggests derived: candidates
  — annotation drift stops rejecting correct features"
status: done
modules:
  - src/spec/test-ref-repair.ts
  - src/stages/detectors/untested-ac.ts
  - src/stages/detectors/missing-tests.ts
  - src/cli/clad.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-07fa86
    statement: When sync finds a done AC test_ref whose path no longer resolves but
      exactly one same-basename test file exists under tests/, the system shall
      rewrite the ref's path part (anchor preserved), so move/rename annotation
      drift self-heals.
    kind: behavior
    notes: >-
      ## Why

      The Scale A/B's single biggest cost: the gate refused 9 CORRECT features
      because ref strings lagged file moves. A WARN downgrade could not fix this
      — clad done gates on --strict where warn fails (review blocker T2);
      deterministic auto-repair resolves the ref instead.

      ## Decision

      Unique-match only: two candidates with the same basename = ambiguous, no
      rewrite (repair must never guess).
  - id: AC-c78837
    statement: If sync discovers a candidate test for a done AC with no test_refs,
      then the system shall append it as a derived-prefixed suggestion that does
      not satisfy MISSING_TESTS or UNTESTED_AC until its prefix is removed.
    kind: constraint
    rationale: Prevents derived suggestions from being mistaken for verified tests.
    notes: >-
      ## Why

      Auto-linking an existing-but-wrong test would convert 'verification
      absent' (RED) into fabricated GREEN — exactly the hole UNTESTED_AC guards
      (review blocker T1). The derived: prefix extends the established
      self-dogfood:/fixture: provenance convention.
  - id: AC-3e4d09
    statement: While a ref is resolved or ambiguous or belongs to a non-done
      feature, the sync command shall leave the shard untouched so repair never
      guesses.
    kind: behavior
