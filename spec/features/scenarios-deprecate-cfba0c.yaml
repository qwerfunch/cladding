acceptance_criteria:
  - id: AC-001
    statement: The system shall stop auto-extracting scenarios from observed code so
      the architecture-layer-as-scenario false signal that the 5차 audit flagged
      (vitest 24 layer-scenarios, ripgrep crate-scenarios, rails monorepo) no
      longer ships in cladding output.
  - id: AC-002
    statement: When clad init runs with --scan, the system shall write
      spec/scenarios/README.md documenting the new paradigm so an external
      adopter opening the directory understands why it is empty and how it
      grows.
    evidence_refs:
      - src/cli/init.ts
  - id: AC-003
    statement: The system shall keep the ScanResult.scenarios type stable through
      the deprecation so v0.3.31+ feature-time auto-registration can populate
      the array later without re-introducing types.
    evidence_refs:
      - src/cli/scan/types.ts
      - src/cli/scan/scenarios.ts
  - id: AC-004
    statement: The system shall align scenarios with features as a single mental
      model so external adopters understand the same paradigm applies to both
      intent-side artifacts — observable code surfaces automatically, declared
      intent waits for a request.
    evidence_refs:
      - src/cli/init.ts
      - src/cli/scan/scenarios.ts
  - id: AC-005
    statement: The system shall retain derived architecture, return empty scenarios,
      write spec/scenarios/README.md, and emit no per-layer scenario YAML during
      an intent-free adoption scan.
    kind: behavior
    notes: >
      ## Scope

      Intent-based onboarding is outside this criterion and can generate
      scenario shards.


      ## Historical note (2026-05-20, v0.3.30, source commit 25ab4b9)

      The completed deprecation report recorded an unchanged 713-test baseline,

      clean lint and typecheck, and drift-green self-scan plus the 16-OSS audit

      corpus. Those results are dated historical evidence, not continuing
      release

      gates.
