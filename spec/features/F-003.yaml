acceptance_criteria:
  - id: AC-004
    statement: The system shall aggregate findings from every registered drift
      detector and fail the stage only when at least one finding has error
      severity.
    evidence_refs:
      - self-dogfood:stage:drift
  - id: AC-005
    statement: Where a detector is registered with a duplicate name, the system
      shall replace the prior entry while preserving the registration order of
      the first occurrence.
  - id: AC-006
    statement: The system shall emit complete newline-terminated DriftReport JSON to
      stdout when the serialized report exceeds 64 KiB and preserve the report
      exitCode as the process exit code.
