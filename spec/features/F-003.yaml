id: F-003
title: stage_1.3 Drift — registry + aggregator
status: done
modules:
  - stages/drift.ts
  - stages/detectors/index.ts
acceptance_criteria:
  - id: AC-004
    ears: ubiquitous
    action: aggregate findings from every registered drift detector
    response: returns a DriftReport that fails only on error-severity findings
    text: The system shall aggregate findings from every registered drift detector
      and fail the stage only when at least one finding has error severity.
    evidence_refs: [self-dogfood:stage:drift]
  - id: AC-005
    ears: optional
    condition: where a detector is registered with a duplicate name
    action: replace the prior entry idempotently
    response: registration order of the first occurrence is preserved
    text: Where a detector is registered with a duplicate name, the system shall
      replace the prior entry while preserving the registration order of the
      first occurrence.
    test_refs: [tests/stages/drift.test.ts]
