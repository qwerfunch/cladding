id: F-67d2e9
slug: strict-skip-policy
title: "Strict mode REDs any skipped stage the spec demands — generalizing the unit-only vacuous-green guard"
status: done
modules:
  - src/stages/skip-policy.ts
  - src/cli/clad.ts
acceptance_criteria:
  - id: AC-11101f
    ears: unwanted
    condition: "if a stage skips (exit 2) under --strict while the spec DEMANDS that stage"
    action: "append a fail entry naming the unmet demand and force the gate RED, where demand means: stage_1.1 — project.language declared AND >=1 done feature; stage_2.1 — >=1 done feature declaring test_refs (the pre-0.6 guard); stage_2.3 — >=1 done AC declaring oracle_refs; stage_2.4 — project.deliverable declared is_safe_to_smoke:true AND >=1 done feature"
    response: "a missing toolchain can no longer convert 'done = verified' into a silent pass for ANY verification stage the spec relies on"
    text: "If a stage skips under --strict while the spec demands it (1.1: language+done; 2.1: tested-done; 2.3: oracle-refs-done; 2.4: safe-deliverable+done), the gate shall append a fail entry naming the unmet demand and go RED, so missing toolchains cannot silently waive demanded verification."
    notes: "## Why\nOnly Unit had this guard — a project with tsc missing went GREEN at done with type checking never run (review blocker class). ## Decision\nDemand-gated, not blanket: no demand means skip stays green — this is the false-RED defense that must ship BEFORE the 0.6 enforcement hooks."
    test_refs:
      - "tests/cli/gate-golden-matrix.test.ts#[covers:F-d49585/AC-40db4c] strict demand table promotes skips only for declared stage 1.1/2.1/2.3/2.4 demands and keeps non-strict or undemanded skips non-blocking"
      - "tests/stages/skip-policy.test.ts#multiple demands violated in one run are all reported"
  - id: AC-6c0c35
    ears: state
    condition: "while the spec makes no demand on a skipped stage (no done features, undeclared language, no oracle_refs, no safe deliverable) or strict is off"
    action: "keep the skip non-blocking exactly as the pre-0.6 contract"
    response: "fresh projects and partial toolchains keep their lenient skip-as-pass behavior — zero new false REDs"
    text: "While the spec makes no demand on a skipped stage or strict is off, the skip shall stay non-blocking exactly as before, so fresh projects and partial toolchains see zero new false REDs."
    test_refs:
      - "tests/cli/gate-golden-matrix.test.ts#demands do NOT fire: non-strict, or no demand in the spec, or the stage outside the tier"
      - "tests/stages/skip-policy.test.ts#2.4: safe declared deliverable + done feature → violation; opt-out or undeclared deliverable → none"
      - "tests/stages/skip-policy.test.ts#a demanded stage that PASSED (not skipped) yields no violation"
  - id: AC-b265bf
    ears: ubiquitous
    text: "The gate golden matrix shall pin the full demand table as an explicit, visible contract diff (which stage REDs under which spec shape), so this semantics change is reviewable in one file rather than inferred from behavior."
    notes: "## Decision\nThe skip-policy lives in runCheckStages (gate core), not a stage — the conformance runner wraps stages, so the golden matrix + dedicated unit tests are the executable contract here (honest deviation from the blanket fixture-pair rule)."

    test_refs:
      - "tests/cli/gate-golden-matrix.test.ts#[covers:F-d49585/AC-40db4c] strict demand table promotes skips only for declared stage 1.1/2.1/2.3/2.4 demands and keeps non-strict or undemanded skips non-blocking"
