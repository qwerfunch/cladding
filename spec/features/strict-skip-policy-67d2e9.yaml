id: F-67d2e9
title: Strict mode REDs skipped code-verification demands without duplicating
  the smoke-demand owner
status: done
modules:
  - src/stages/skip-policy.ts
  - src/cli/clad.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-11101f
    statement: If stage 1.1 or 2.1 or 2.3 skips under --strict while the
      specification demands it through language-and-done or tested-done or
      oracle-refs-done, then the gate shall append a fail entry naming the unmet
      demand and go RED while leaving stage 2.4 to SMOKE_PROBE_DEMAND so no
      duplicate strict-skip failure is appended.
    kind: behavior
    notes: >-
      ## Why

      Only Unit had this guard — a project with tsc missing went GREEN at done
      with type checking never run (review blocker class). ## Decision

      Demand-gated, not blanket: no demand means skip stays green — this is the
      false-RED defense that must ship BEFORE the 0.6 enforcement hooks.
  - id: AC-6c0c35
    statement: "While the spec makes no demand on a skipped policy stage or strict
      is off, the skip shall stay non-blocking exactly as before, so fresh
      projects and partial toolchains see zero new false REDs. A stage_2.4 skip
      also receives no strict-skip duplicate: SMOKE_PROBE_DEMAND remains its
      sole demand owner."
  - id: AC-b265bf
    statement: The gate golden matrix shall pin the full demand table as an
      explicit, visible contract diff (which stage REDs under which spec shape),
      so this semantics change is reviewable in one file rather than inferred
      from behavior.
    notes: >-
      ## Decision

      The skip-policy lives in runCheckStages (gate core), not a stage — the
      conformance runner wraps stages, so the golden matrix + dedicated unit
      tests are the executable contract here (honest deviation from the blanket
      fixture-pair rule).
