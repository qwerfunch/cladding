id: F-f44d1b
title: HOLLOW_GOVERNANCE detector — close the design-tier Vacuous Green (v0.4.x)
status: done
modules:
  - src/stages/detectors/hollow-governance.ts
  - src/stages/detectors/index.ts
depends_on:
  - F-3788c2
capability_refs:
  - drift-detection
acceptance_criteria:
  - id: AC-001
    statement: When a project has grown past the design threshold yet its
      capabilities or architecture artifact is present but empty, the system
      shall emit a warn finding that the design SSoT is a hollow seed.
  - id: AC-002
    statement: If the project has fewer than the design threshold of features, then
      the system shall not flag empty design artifacts, so small projects are
      never nagged.
    kind: behavior
  - id: AC-003
    statement: The system shall count all features regardless of lifecycle status
      when deciding whether the design tier has grown stale, so an all-done
      feature set still triggers the check.
  - id: AC-004
    statement: If spec/capabilities.yaml or spec/architecture.yaml is absent, then
      the system shall not flag it here — existence is ABSENCE_OF_GOVERNANCE's
      concern; this detector owns present-but-empty content only.
    kind: behavior
