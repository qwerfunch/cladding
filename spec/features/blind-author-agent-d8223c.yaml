    response: "the dispatch protocol is documented in the agent body and the orchestrator routing table, so hosts wire the structural barrier instead of inventing their own"
    text: "When a policy-required oracle is needed, the documented dispatch protocol shall hand the blind-author agent only the spec brief and record provenance blind: true after it writes the test, so the structural barrier is the standard path."
