  - id: AC-862413
    ears: ubiquitous
    text: "The blind-author agent definition shall restrict tools to Write and Bash (test execution only) — no Read, Grep, Glob, or Edit — so the agent CANNOT see any implementation: its sole input is the spec-only brief from clad oracle pasted into its prompt, and 'authored impl-blind' becomes a structural fact rather than a self-reported boolean."
    notes: "## Why\nAnti-self-cert blindness was prompt-advisory and leaked 4/4 in the A/B; the provenance record's blind flag is caller-asserted. Tool restriction is the only mechanism that makes the claim physical. ## Trade-off\nNo Edit means rewrites are whole-file Writes — acceptable for single oracle test files."
    test_refs:
      - "tests/agents/loader.test.ts#the canonical definition grants NO read-capable tool and no read capability"
