id: F-d8223c
title: blind-author agent — structurally tool-blinded test/oracle authoring
  (anti-self-cert by physics, not prose)
status: done
modules:
  - src/agents/blind-author.md
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-862413
    statement: "The blind-author agent definition shall restrict tools to Write and
      Bash (test execution only) — no Read, Grep, Glob, or Edit — so the agent
      CANNOT see any implementation: its sole input is the spec-only brief from
      clad oracle pasted into its prompt, and 'authored impl-blind' becomes a
      structural fact rather than a self-reported boolean."
    notes: >-
      ## Why

      Anti-self-cert blindness was prompt-advisory and leaked 4/4 in the A/B;
      the provenance record's blind flag is caller-asserted. Tool restriction is
      the only mechanism that makes the claim physical. ## Trade-off

      No Edit means rewrites are whole-file Writes — acceptable for single
      oracle test files.
  - id: AC-386e48
    statement: "When a policy-required oracle is needed, the documented dispatch
      protocol shall hand the blind-author agent only the spec brief and record
      provenance blind: true after it writes the test, so the structural barrier
      is the standard path."
    evidence_refs:
      - src/agents/blind-author.md
      - src/agents/orchestrator.md
  - id: AC-a3bcb9
    statement: The agent shall be mirrored by the plugin build (agents/ + codex
      skills) and registered in the glossary like every persona, with the
      size-budget ratchet extended, so the new definition lives under the same
      drift discipline as the existing five.
    evidence_refs:
      - tests/scenarios/_size-budgets.ts
