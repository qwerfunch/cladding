id: F-8234ec3c
title: Graph viewer — radial galaxy layout + always-on ambient animation +
  bloom/glow UX overhaul
status: archived
modules: []
depends_on: []
capability_refs:
  - knowledge-graph
acceptance_criteria:
  - id: AC-d092db6f
    statement: When the viewer settles, the system shall apply a degree-weighted
      radial force so the graph converges to a circular galaxy (hubs central,
      leaves on the rim) with finite, bounded positions.
    notes: >-
      ## Why

      User: 'these graphs are usually circular (when nodes gather it forms a
      circle)'. Radial-by-degree also encodes meaning: central =
      most-depended-on.
  - id: AC-bec33744
    statement: While idle and not interacting, the viewer shall keep a low-cost
      ambient animation with slow global rotation, node breathing, edge
      particles, and hub glow pulse and freeze it for static reading when Calm
      is toggled on.
    kind: quality
    notes: >-
      ## Decision

      Ambient is O(n)/O(edges) DRAW only (rotation is a free global transform);
      physics stays burst-only. Default = ambient ON (idle animates), Calm =
      freeze.
  - id: AC-c4dc13ea
    statement: When the viewer renders, the system shall draw every visible node
      (with a bloom glow pass) and support click-to-focus selection with a
      smooth recenter.
archived_at: 2026-06-29T00:00:00Z
archive_reason: "Superseded by graph-viewer-obsidian (F-04f50847): the
