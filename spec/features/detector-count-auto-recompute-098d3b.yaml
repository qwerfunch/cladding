id: F-098d3b
title: Detector count auto-recompute in build-plugin.mjs (v0.3.17)
status: done
modules:
  - scripts/build-plugin.mjs
depends_on:
  - F-245bd5
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: The system shall recompute the detector count from the filesystem
      during the plugin build so concurrent detector additions on parallel
      branches converge to the correct value without manual edits.
  - id: AC-002
    statement: When .claude-plugin/plugin.json already declares the
      filesystem-correct count, the system shall produce no diff so the build
      phase is idempotent and safe to run on every commit.
  - id: AC-003
    statement: The system shall limit the rewrite to ironclad.target.detectors and
      ironclad.current.detectors so unrelated detector-named keys elsewhere in
      the manifest are not corrupted.
  - id: AC-004
    statement: The system shall exclude index.ts from the detector file count so the
      auto-recomputed value matches the HARNESS_INTEGRITY detector's existing
      contract.
    evidence_refs:
      - src/stages/detectors/harness-integrity.ts
