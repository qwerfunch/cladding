id: F-551a1c
title: "Oracle policy binds behavior, not just the gate: scale-graduated
  risk-weighted default + policy-aware authoring guidance"
status: done
modules:
  - src/oracle/policy.ts
  - src/serve/server.ts
  - src/agents/developer.md
  - skills/oracle/SKILL.md
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-7bb981
    statement: While a grown project (>=8 done features) declares no oracle policy,
      the system shall resolve a report-only risk-weighted default
      ({always_ears:[unwanted]}) whose report names the EARS-untagged blind
      spot, so the obligation becomes visible without blocking.
    notes: >-
      ## Why

      opt-in empirical gates do not get opted into (the DELIVERABLE_SMOKE
      lesson); but a hard default-on would false-RED legacy projects, and
      untagged-EARS projects would satisfy it vacuously (review T5) — hence
      report-only with the denominator named.
  - id: AC-0e9245
    statement: "When clad_author_oracle records an oracle the policy does not
      require, the result shall carry voluntary: true and a cost note, so
      out-of-policy authoring is informed rather than silent."
    notes: >-
      ## Why

      The 0.6.0 A/B measured 42-52%% of output tokens going to VOLUNTARY
      exhaustive oracle authoring under an undeclared (= no-mandate) policy —
      prose guidance overrode the policy knob. The governance tool must not
      bypass its own governance.
  - id: AC-177022
    statement: The persona and skill guidance shall key oracle authoring to the clad
      oracle --required policy worklist and not urge oracle creation when the
      worklist is empty unless the user explicitly asks.
    kind: behavior
    evidence_refs:
      - skills/oracle/SKILL.md
    notes: >-
      ## Decision

      The worklist command already exists and resolves through the single policy
      SSoT — guidance just has to point at it.
