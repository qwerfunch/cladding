id: F-9b643e
title: clad init --scan — observed-conventions extractor (v0.3.24)
status: done
modules:
  - src/cli/scan/conventions.ts
  - src/cli/scan/index.ts
  - src/cli/scan/llm.ts
  - src/cli/init.ts
  - src/cli/clad.ts
depends_on:
  - F-ba4b7a
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: The conventions extractor shall determine indentation from observed
      source files.
    notes: "2026-08-31 — Atomic split: retained prior compound text verbatim for
      non-normative history: The system shall walk the existing project source
      tree and extract 14 deterministic convention signals so a downstream LLM
      dispatch (scan-llm.ts) or the deterministic interpreter has enough
      observed data to compose a maintainer-readable docs/conventions.md. Prior
      action: walk the existing project source tree and extract 14 deterministic
      convention signals. Prior response: src/cli/scan.ts scanRoot reads files
      from cwd (respecting .gitignore-like defaults plus an explicit ignore list
      of node_modules, dist, build, .cladding, .git, coverage, .next, .nuxt),
      caps at maxFiles (default 500), and returns Conventions with indent,
      quote, semicolon, namingExports, namingConstants, docBlockRatio,
      docTagCounts, importOrder, exportPattern, errorHandling, typeDefLocation,
      fileHeaderPattern, testLocation, and moduleBoilerplate; each field uses
      majority-rule heuristics that the unit tests assert for synthetic project
      trees."
  - id: AC-0c18509d
    statement: The conventions extractor shall determine quote, semicolon, export,
      and constant naming from observed source files.
  - id: AC-499af50d
    statement: The conventions extractor shall determine documentation and tags,
      import ordering, export pattern, error handling, type location, header,
      test location, and boilerplate conventions from observed source files.
  - id: AC-d268d58a
    statement: The Conventions type and extractor shall own every emitted convention
      field.
  - id: AC-002
    statement: The system shall group source files by architectural layer collapsing
      src/<layer>/ to <layer> so the architecture view stays src-centric while
      the scanner walks the entire cwd to also reach tests/ and other peer
      directories.
  - id: AC-003
    statement: The system shall pick the longest non-test module per layer as the
      representative example with its sibling test so docs/conventions.md can
      quote a concrete boilerplate that AI maintainers follow when adding new
      code.
  - id: AC-004
    statement: When optional scan interpretation accepts a model response, the
      system shall parse only the current labelled sentinel sections and
      deterministically fall back for every missing or malformed section.
    kind: behavior
    notes: >
      ## Historical note

      The three-section/v0.3.24-v0.3.25 compatibility story is historical;
      current sentinels and fallback policy are authoritative.
  - id: AC-005
    statement: The system shall produce a deterministic fallback when --no-llm is
      set or no dispatcher is available so CI environments and offline
      workstations still see valid artifacts — at lower prose quality but full
      data fidelity.
  - id: AC-006
    statement: When scan initialization writes a generated conventions or
      architecture artifact, the system shall preserve an existing authored
      artifact by emitting the declared proposal disposition without claiming
      executable scenario generation.
    kind: behavior
    notes: >
      ## Historical note

      Per-layer scenario generation was deprecated; its old maintenance-brief
      claim remains historical.
  - id: AC-007
    statement: The system shall thread --scan and --no-llm options from CLI through
      runInit so a future v0.3.25 dispatcher can be injected at the runInit
      boundary without re-touching the CLI option layer.
