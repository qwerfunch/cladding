acceptance_criteria:
  - id: AC-201
    statement: While the drive loop starts and the active adapter's healthCheck
      reports ready=false, the system shall halt the loop at iteration 0 without
      dispatching any feature so the user gets immediate feedback instead of
      after the first failed invoke.
  - id: AC-202
    statement: While the pre-flight failure reason names a credential problem
      (missing API key, invalid key, unauthorized, forbidden), the system shall
      halt with TRANSPORT_AUTH_FAILED instead of the generic LLM_UNAVAILABLE.
  - id: AC-203
    statement: The system shall extend classifyTransportError to detect the "api
      key" and "api_key" phrases (case-insensitive), so the AnthropicTransport
      pre-flight reason "ANTHROPIC_API_KEY env var is not set" classifies as
      TRANSPORT_AUTH_FAILED.
  - id: AC-204
    statement: Where DriveOptions.skipHealthCheck is true, the system shall bypass
      the pre-flight health check and proceed directly to the iteration loop —
      used by unit tests that stub runAgent and never reach a real adapter
      dispatch.
  - id: AC-205
    statement: While the pre-flight health check returns ready=true, the system
      shall continue past it without recording any halt — pre-flight is a
      fast-fail filter, not a normal control-flow branch.
archive_reason: "Retired in 0.10.0 with the headless drive loop: no recorded
  session ran the loop (0 runs across 5,176 events measured 2026-09-02) and the
  host-delegated cycle owns execution."
archived_at: 2026-09-05T12:49:30.981Z
