    kind: quality
    statement: The system shall ship tests/optimizer/envelope.test.ts bringing
      src/optimizer/envelope.ts to 100% line coverage so the optimizer chapter
      closes.
  - id: AC-162
    statement: The system shall ship dedicated tests for src/ui/pulse.ts and
      src/ui/panel.ts, bringing both to 100% line coverage so the ui chapter
      closes.
  - id: AC-163
    statement: While current coverage assurance is evaluated, the assurance registry
      shall derive it from the coverage obligation and treat the v0.2.14
