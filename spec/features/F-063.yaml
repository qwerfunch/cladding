      - "tests/events/log.test.ts#[covers:F-063/AC-160] absent and empty event logs read as no observations"
      - "tests/events/log.test.ts#[covers:F-063/AC-160] multiple JSONL appends preserve observed order"
      - "tests/events/log.test.ts#[covers:F-063/AC-160] managed symbolic paths remain observer-only no-ops"
    notes: |
