    statement: When the autonomous loop finishes an iteration, the drive loop shall
      return the current deciding halt detail while preserving retry,
      skipped-runner, and transport behavior without granting authority to its
      observer record.
    kind: behavior
    notes: >
      ## Historical schema-0.1 note

      2026-05-19 · v0.2.14 · 3324b23. Loop fixtures: spec, persona, agent,
      stage,

      event, audit, halt, and happy paths; at least 85% line coverage;
      non-current.

      Release headline: "Coverage sweep — drive · agents · events · optimizer ·
      ui all covered" (5 chapters).
  - id: AC-159
    statement: The system shall ship tests/agents/loader.test.ts bringing
      src/agents/loader.ts to at least 90% line coverage.
  - id: AC-160
    statement: When a lifecycle event is appended or read, the event log shall
      preserve valid JSONL append order and safe absent or empty reads while
      treating unsafe managed paths as observer-only no-ops.
    kind: behavior
    notes: >
      ## Historical schema-0.1 note

      2026-05-19 · v0.2.14 · 3324b23. Event-log fixtures: event shape, directory

      creation, round trips, absent, empty, whitespace, and ordered appends;
      100%

      line coverage; non-current.
