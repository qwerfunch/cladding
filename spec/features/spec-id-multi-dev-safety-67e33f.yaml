id: F-67e33f
title: Multi-developer-safe spec ID system — slug filename + hash ID + AC-scope
  sequential (v0.3.9)
status: done
modules:
  - src/spec/new.ts
  - src/spec/schema.json
  - src/serve/server.ts
  - src/stages/detectors/slug-conflict.ts
  - src/stages/detectors/id-collision.ts
  - src/stages/detectors/ac-duplicate-within-feature.ts
  - src/stages/detectors/index.ts
depends_on:
  - F-049
  - F-073
  - F-076
  - F-080
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: The system shall provide an internal createFeature helper that issues
      a new sharded feature file (spec/features/<slug>.yaml) with an
      auto-generated hash id derived from inputs that distinguish simultaneous
      invocations, so two contributors on separate branches cannot collide.
  - id: AC-002
    statement: The system shall expose createFeature as the `clad_create_feature`
      MCP tool exclusively — no CLI subcommand — so the spec-authoring surface
      is host-LLM-mediated and the user's path is natural-language only.
  - id: AC-003
    statement: The system shall validate slug shape at the schema layer and reject
      malformed slugs at createFeature time so a slug that cannot round-trip
      through git paths is caught before the file is written.
  - id: AC-004
    statement: While two features in the loaded spec share the same slug, the system
      shall emit a SLUG_CONFLICT error finding naming both feature ids and the
      slug so a silent merge that left two features with the same slug is caught
      by `clad check`.
  - id: AC-005
    statement: While two features in the loaded spec share the same id, the system
      shall emit an ID_COLLISION error finding so the 1/16M hash coincidence —
      or a legacy hand-typed duplicate — is caught by `clad check`.
  - id: AC-006
    statement: While a single feature declares the same AC id more than once, the
      duplicate detector shall emit an AC_DUPLICATE_WITHIN_FEATURE error finding
      and not trigger for two features sharing an AC id such as F-001.AC-001 and
      F-002.AC-001 because the model is feature-scoped.
    kind: behavior
  - id: AC-007
    statement: The system shall register the three new detectors in
      src/stages/detectors/index.ts and bump .claude-plugin/plugin.json
      ironclad.current.detectors from 20/20 to 23/23 so HARNESS_INTEGRITY
      catches the count drift on the next `clad check --strict`.
