acceptance_criteria:
  - id: AC-21dfe21a
    statement: The validation ledger shall map every D01-D24 decision to a canonical
      owner, an executable or explicitly deferred scenario, and a unique
      evidence classification without presenting preregistered work as a passing
      result.
    notes: >-
      ## Why

      The accepted design is larger than the 37 parser/migration seeds, so
      section-level prose confidence is not enough to begin a long
      implementation safely.
  - id: AC-e0f0c4b1
    statement: The deterministic simulator shall evaluate design ownership,
      migration and proof contracts, GraphIR and context constraints, assurance
      scheduling, and delivery ordering with independent fixtures while leaving
      implementation-pending behavior explicitly unverified.
  - id: AC-bd12a73c
    statement: The MCP validation suite shall distinguish wire conformance, semantic
      parity, mutation safety, reference-host end-to-end use, efficiency when
      used, and observed adoption and fail closed when required evidence is
      absent.
    kind: quality
  - id: AC-4c8c08d1
    statement: The validation system shall report exact controlled UTF-8 bytes, a
      named token estimator, cache knowledge, and only counterfactually
      demonstrated avoidable bytes as waste for every deterministic and live
      validation result.
    kind: quality
  - id: AC-55c159b4
    statement: When the Spec 0.2 validation command runs, the system shall emit a
      deterministic machine-readable summary and a human-readable report whose
      pass, fail, inconclusive, not-run, and implementation-pending states
      remain distinct.
design_impact:
  classification: additive
  rationale: The work adds a contributor-only validation boundary and
    target-design owner without changing the shipped 0.1 runtime contract.
  status: resolved
  artifacts: []
