id: F-b2094740
title: Lint config detection — stage_1.2 picks the project's configured linter,
  not always eslint
status: done
modules:
  - src/stages/toolchain/detect.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-7bf859
    statement: The system shall resolve the stage_1.2 lint gate for a
      TypeScript/JavaScript project from the workflow that project declared —
      preferring scripts.lint, otherwise selecting biome on biome configuration,
      oxlint on oxlint configuration, or eslint on eslint configuration, and
      leaving lint unregistered when none is declared.
    notes: >
      ## Why

      stage_1.2 is the polyglot lint gate that `clad done` must pass, and it

      detected only the LANGUAGE (via manifest), then hardcoded eslint within

      TypeScript — so a biome/oxlint project could not turn ✓ Lint green without

      bridging eslint in. The JS/TS ecosystem has several mainstream linters;
      the

      honest gate runs the one the project declared, read from its config file,

      not a single assumed default.

      This criterion also owns the project-script precedence requirement that

      was first discovered during onboarding handoff verification; it applies

      to every TypeScript or JavaScript project, not only initialized ones.
  - id: AC-86822d
    statement: If a non-TypeScript project carries a stray linter config (e.g. a
      python project with a biome.json) or the resolved linter is not installed,
      then the system shall neither apply the TS linter choice to that other
      language nor install the tool — the config-driven resolution is scoped to
      the typescript entry, and every gate retains --no-install so a missing
      linter skips (the strict skip-policy escalates it) instead of being
      fetched and executed.
    notes: >
      ## Why

      Two invariants must survive the new detection: (1) the --no-install

      typosquat defense (0.6.0) — detection decides WHICH tool to call, never

      installs one; (2) language isolation — a config file for one ecosystem
      must

      not rewrite another language's gate. Both are error-as-data: a missing or

      mis-placed tool is a skip/visible signal, never a silent install or a

      crash.
