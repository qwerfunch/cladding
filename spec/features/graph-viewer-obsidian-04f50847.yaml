acceptance_criteria:
  - id: AC-906052ea
    statement: When a user drags a node, the graph viewer shall reheat a continuous
      simulation so connected nodes follow elastically, pause the simulation on
      hover, and apply no global rotation.
    kind: behavior
    notes: >-
      ## Why

      Frozen layout had no tension; hover must stop motion; rotation
      un-Obsidian; too fast. Replaced burst+freeze+rotation with continuous
      alpha thermostat + dt normalization + center-only pull (radial-by-degree
      removed).
  - id: AC-8ea2f245
    statement: When a force slider changes, the system shall live-update the
      matching coefficient (center/repel/link strength/link distance) and
      persist it.
  - id: AC-51d974a7
    statement: The graph viewer shall separate SSoT tiers A, B, C, and D in distinct
      hues and assign code, test, and documentation classes their own distinct
      colors.
    kind: quality
    notes: >-
      ## Why

      Tiers needed clearer separation + code/test/doc were all gray. nodeColor =
      tier hue if tiered (A blue/B purple/C teal/D amber) else kind color
      (module orange/test green/doc pink).
archived_at: 2026-06-29T00:00:00Z
archive_reason: "Superseded by webgl-stellar-viewer (F-77f7ead0): the
  hand-rolled 2D canvas viewer (continuous tension sim, hover-pause, force
  sliders) was replaced by a real three.js WebGL galaxy (instanced sphere stars
  + UnrealBloom, OrbitControls + idle auto-rotate) to match the referenced
  DeusData/codebase-memory-mcp design. The 6-color hue distinction carried
  forward (now hue × degree-luminosity); drag-tension / hover-pause /
  force-sliders were dropped for OrbitControls."
