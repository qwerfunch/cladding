id: F-5f6b45
title: clad init recognizes file path as intent and auto-loads its contents
status: done
modules:
  - src/cli/intent-from-path.ts
  - src/cli/init.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-001
    statement: When the user runs `clad init <relative-path>` where the argument
      matches a text-file extension (.md, .txt, .yaml, .yml, .markdown) and the
      file exists under cwd, the system shall read the file contents and use
      them as the intent text fed to the onboarding LLM dispatcher, so the
      produced docs/project-context.md and spec/capabilities.yaml reflect the
      planning document rather than treating the path string itself as raw
      intent.
  - id: AC-002
    statement: When the user runs `clad init <absolute-path>` and the file exists
      with a recognized extension, the system shall load and use the file
      contents identically to the relative-path case, so absolute and relative
      paths produce equivalent onboarding output.
  - id: AC-003
    statement: If a user passes a path-like argument with a recognized text
      extension but the file does not exist, then the initializer shall warn on
      stderr, name the missing path, and treat the original argument as
      free-text intent so onboarding proceeds and the user is told why the
      planning document was not loaded.
    kind: behavior
  - id: AC-004
    statement: While the intent argument is not path-like (does not match the
      recognized text-file extensions), the system shall pass the argument
      through unchanged to the onboarding LLM dispatcher as free-text intent, so
      existing free-text intent behavior is preserved with zero regression.
  - id: AC-005
    statement: If a path argument resolves to a directory or symlink loop or
      non-UTF-8-readable file, then the initializer shall not crash, warn on
      stderr, and treat the original argument as free-text intent.
    kind: behavior
  - id: AC-006
    statement: When `/cladding init <path>` is invoked from a plugin marketplace
      install (Claude Code, Codex CLI, Gemini CLI), the plugin skill shall
      invoke the same `clad init` CLI such that AC-001 and AC-002 path
      resolution behavior is inherited automatically, so plugin users get
      identical path-aware intent loading without separate plugin-side code.
