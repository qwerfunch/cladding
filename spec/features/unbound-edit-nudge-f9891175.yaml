id: F-f9891175
title: PostToolUse nudge when sustained source edits are bound to no feature
status: done
modules:
  - src/cli/hook.ts
depends_on: []
capability_refs: []
acceptance_criteria:
  - id: AC-8542cc63
    statement: When watched source edits that resolve to no owning feature reach the
      nudge threshold within one window, the PostToolUse card shall include
      exactly one non-blocking nudge line naming how many recent source edits
      are unbound and how to start a feature.
    notes: The feature cycle is never TRIGGERED for a stream of edits that touch no
      feature's modules — cladding stays silent
      (impact_card_skipped{owner_miss}). This nudge closes that gap without
      blocking, reusing the owner_miss site in emitCardForPath.
  - id: AC-388518f4
    statement: If a PostToolUse event is Read or targets a non-source path or is
      below threshold or edits a bound module file, then the system shall emit
      no nudge.
    kind: behavior
    notes: Bound files resolve to an owner (a real card fires) and never reach the
      owner_miss counter, so binding a file suppresses the nudge for that file
      with no extra logic.
  - id: AC-5d379d4e
    statement: While a nudge has already fired within the current window, the system
      shall suppress further nudges until the window rolls over, so unbound
      editing cannot spam the card.
    notes: "Mirrors the SkipAgg once-per-window discipline: a dedicated
      .cladding/hook-unbound-agg.json sidecar keyed to a rolling window,
      flushed/reset the same way."
  - id: AC-228fdc15
    statement: The nudge shall never block the tool call and leave the hook's stdout
      byte-identical to the output produced without the nudge feature when a
      sidecar or telemetry failure occurs.
    kind: behavior
    notes: "Preserves F-6ba22c5c AC-e9d041de (observer-only, byte-identical on
      failure) and the PostToolUse never-block invariant: the nudge is advisory
      text appended to the card, wrapped so any sidecar throw returns ''."
