# Cladding · Tier B · SSoT — editable, cross-validated · Refreshed by: clad init / clad refine
# cladding · architectural layers
#
# Each entry of `layers` is a tier — a peer group of directories at
# the same architectural level. ARCHITECTURE_FROM_SPEC (F-088,
# v0.3.13) reads this file and enforces:
#   1. forbidden_imports — listed `from`/`to` pairs raise an error
#      when an import statement crosses the boundary.
#   2. undeclared directory — anything under src/ that isn't listed
#      below raises a warn.
#   3. empty layer — a layer here with no matching src/<layer>/
#      directory raises a warn.
#
# Foundation tier 가 top — 의존성이 아래로만 흐름.
layers:
  - - spec
    - agents
    - changelog
    - core
    - events
    - hitl
    - init
    - optimizer
    - oracle
    - report
    - router
    - ui
    - graph
  - - stages
    - adapters
    - verdict
  - - drive
    - serve
  - - cli

# spec/* (foundation) must not depend on stage runners. The Iron Law
# stage layer wraps the spec; spec itself stays pure.
forbidden_imports:
  - from: spec
    to: stages
  - from: spec
    to: drive
  - from: spec
    to: cli
  - from: spec
    to: serve
  # changelog (foundation) mirrors spec's purity: the collector/renderers
  # must stay importable by cli AND serve without dragging stage runners in.
  - from: changelog
    to: stages
  - from: changelog
    to: drive
  - from: changelog
    to: cli
  - from: changelog
    to: serve
  # graph (foundation) derives a knowledge graph from the spec — it must stay a
  # pure reader importable by cli AND serve without dragging stage runners in.
  - from: graph
    to: stages
  - from: graph
    to: drive
  - from: graph
    to: cli
  - from: graph
    to: serve
  # report (foundation) renders a review packet from spec/changelog/optimizer
  # data the CLI composes — it must stay a pure renderer importable by cli AND
  # serve without dragging stage runners in. The CLI runs the detectors and
  # passes findings into the pure SARIF/markdown emitters.
  - from: report
    to: stages
  - from: report
    to: drive
  - from: report
    to: cli
  - from: report
    to: serve
  - from: stages
    to: drive
  - from: stages
    to: cli
  - from: stages
    to: serve
  # verdict (reducer tier, F-2e28cc72) is the PURE decision layer: it reads the
  # disposition spine (stages/*) + spec types and is imported only by cli. It
  # must never reach up into cli/serve/drive — topology cli → serve → verdict.
  - from: verdict
    to: drive
  - from: verdict
    to: cli
  - from: verdict
    to: serve
  - from: stages/detectors
    to: adapters
  - from: adapters
    to: drive
  - from: adapters
    to: cli
  - from: adapters
    to: serve
