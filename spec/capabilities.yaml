capabilities:
  - id: ab-evaluation
    title: A/B evaluation framework
    outcome: Compares Cladding-managed workflows with a curated vanilla Claude Code
      simulation across eight structural metrics plus drift-catch and AI-query
      outcomes; evidence is deterministic and historical, not a live-agent
      quality claim.
  - id: drift-detection
    title: Drift detection
    outcome: Runs 41 registered drift detectors across specification, code, tests,
      fixtures, architecture, governance, environment, attestation, and
      documentation; blocking depends on each detector's declared policy.
  - id: harness-cli
    title: Harness CLI (clad)
    outcome: Provides the public `clad` command surface for initialization,
      clarification, specification migration, assurance, graph, and host/MCP
      workflows.
  - id: knowledge-graph
    title: Knowledge graph (spec↔code↔doc)
    outcome: Provides an invocation-current spec↔code↔doc graph with reverse-index
      and blast-radius queries, doc-link integrity,
      Mermaid/Obsidian/DOT/JSON/offline-HTML exports, live auto-reloading serve,
      and hub stats; it supports retrieval and traceability, not correctness.
  - id: mcp-host
    title: MCP host (clad serve)
    outcome: Exposes Cladding operations as stable MCP tools for AI-agent hosts,
      with approval-gated mutation and shared CLI behavior.
  - id: spec-governance
    title: Spec governance (4-tier SSoT)
    outcome: Defines the four-tier SSoT model with explicit producer, consumer, and
      refresh authority and emits Tier A/B/C/D banners for managed artifacts.
