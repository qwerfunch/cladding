# Cladding conformance fixture registry — SSoT for fixture:NAME labels.
#
# Each entry registers a fixture name that spec/features/*.yaml is
# allowed to cite via `evidence_refs: [fixture:NAME]`. The
# FIXTURE_REFERENCE_INVALID drift detector validates every such
# citation against this file; an unregistered name trips a `warn`
# finding.
#
# kind:
#   runnable     — implemented in conformance/runner.ts; setup() +
#                  run() execute on every `npm run conformance`
#   documentary  — labels-only; the AC's verification lives in the
#                  source or in a paired AC's test_refs. The name
#                  exists here so the detector accepts the citation
#                  and reviewers can grep for it.
#
# Runnable fixtures must stay in sync with conformance/runner.ts —
# tests/conformance/registry.test.ts guards that invariant.

fixtures:
  # ─── runnable (26) — conformance/runner.ts is the executable SSoT ─────
  - name: stage_1.1.pass
    stage: stage_1.1
    kind: runnable
    description: Type stage passes when valid TS code lives in a tsconfig-bearing tree
  - name: stage_1.1.fail
    stage: stage_1.1
    kind: runnable
    description: Type stage fails when a TS file contains a deliberate type error
  - name: stage_1.2.pass
    stage: stage_1.2
    kind: runnable
    description: Lint stage passes when ESLint reports zero violations
  - name: stage_1.2.fail
    stage: stage_1.2
    kind: runnable
    description: Lint stage fails on a forbidden rule violation
  - name: stage_1.3.pass
    stage: stage_1.3
    kind: runnable
    description: Drift stage passes on a fixture whose spec and code agree
  - name: stage_1.3.fail
    stage: stage_1.3
    kind: runnable
    description: Drift stage fails when a declared module is missing from disk
  - name: stage_1.4.pass
    stage: stage_1.4
    kind: runnable
    description: Commit stage passes when the working tree is clean
  - name: stage_1.4.fail
    stage: stage_1.4
    kind: runnable
    description: Commit stage fails when there are uncommitted changes
  - name: stage_1.5.pass
    stage: stage_1.5
    kind: runnable
    description: Architecture stage passes when madge finds no circular deps
  - name: stage_1.5.fail
    stage: stage_1.5
    kind: runnable
    description: Architecture stage fails on a deliberate circular import
  - name: stage_1.6.pass
    stage: stage_1.6
    kind: runnable
    description: Secret stage passes when secretlint detects no secrets
  - name: stage_1.6.fail
    stage: stage_1.6
    kind: runnable
    description: Secret stage fails on a hard-coded credential in source
  - name: stage_2.1.pass
    stage: stage_2.1
    kind: runnable
    description: Unit stage passes when every vitest test passes
  - name: stage_2.1.fail
    stage: stage_2.1
    kind: runnable
    description: Unit stage fails when at least one vitest test fails
  - name: stage_2.2.pass
    stage: stage_2.2
    kind: runnable
    description: Coverage stage passes when total line coverage meets the floor
  - name: stage_2.2.fail
    stage: stage_2.2
    kind: runnable
    description: Coverage stage fails when total line coverage drops below the floor
  - name: stage_3.1.pass
    stage: stage_3.1
    kind: runnable
    description: Smoke stage passes when a synthetic golden command exits 0
  - name: stage_3.1.fail
    stage: stage_3.1
    kind: runnable
    description: Smoke stage fails when the synthetic command exits non-zero
  - name: stage_3.2.pass
    stage: stage_3.2
    kind: runnable
    description: Performance stage passes when no perf budget is configured
  - name: stage_3.2.fail
    stage: stage_3.2
    kind: runnable
    description: Performance stage fails when a configured budget is exceeded
  - name: stage_3.3.pass
    stage: stage_3.3
    kind: runnable
    description: Visual stage passes on a deterministic snapshot match
  - name: stage_3.3.fail
    stage: stage_3.3
    kind: runnable
    description: Visual stage fails on a snapshot divergence
  - name: stage_4.1.pass
    stage: stage_4.1
    kind: runnable
    description: Audit stage passes when the audit log is well-formed
  - name: stage_4.1.fail
    stage: stage_4.1
    kind: runnable
    description: Audit stage fails when the audit log contains an unauthorised mutation
  - name: stage_4.2.pass
    stage: stage_4.2
    kind: runnable
    description: UAT stage passes when every declared UAT scenario passes
  - name: stage_4.2.fail
    stage: stage_4.2
    kind: runnable
    description: UAT stage fails when at least one UAT scenario fails

  # ─── documentary (placeholders for v0.2.4 self-spec coverage) ─────────
  # These names exist so cladding's own self-spec ACs that have code but
  # no test_refs can declare `evidence_refs: [fixture:NAME]` honestly —
  # the detector accepts the citation, reviewers can grep, and a future
