name: CI

# No Vacuous Green — cladding's own safeguards must actually run somewhere.
# The self-consistency tests (tests/self-consistency.test.ts) and the
# spec-native self-drift gate are only honest if a machine enforces them on
# every change; otherwise "regression fails CI" is itself a vacuous claim.
# See spec/features/no-vacuous-green-gate-contract-af96b1.yaml AC-004.

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    name: build · test · self-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (clad + plugin mirrors)
        run: npm run build

      - name: Plugin mirrors are committed in sync
        # `npm run build` regenerates the committed host-plugin mirrors
        # (plugins/**, generated commands/agents). If the build produced any
        # change, a source edit was committed without rebuilding the mirror —
        # that is drift. Fail loudly rather than ship a stale manifest.
        run: git diff --exit-code

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (full suite + self-consistency lock)
        run: npm test

      - name: Conformance fixtures (stage contracts)
        # The 33 runnable {pass,fail} fixture pairs are the executable form of
        # the stage contracts. They drifted silently (3 stale expectations)
        # precisely because nothing ran them on push — same Vacuous Green
        # class the header warns about. Run them on every change.
        run: npm run conformance

      - name: Self-drift gate (spec-native, strict)
        # cladding dogfoods its OWN drift gate under --strict: stale module
        # paths, hollow `done` features, and archived-but-live modules fail
        # CI instead of accumulating silently. Deterministic, no toolchain.
        run: node bin/clad.mjs check --tier=pre-commit --strict

  entry:
    # The published entry point, exercised through npm's own bin shim — the
    # path a user hits, which `node bin/clad.mjs` never covers. It exists
    # because an extensionless entry shipped and died inside Node's ESM loader
    # on an unsupported release, on a platform and a Node version this
    # workflow tested on neither axis. Smoke only: pack, global install, one
    # command. Node 18 stands in for the release that broke — below the
    # declared floor, so it proves the refusal speaks instead of crashing.
    name: entry · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, node: 20, expect: version}
          - {os: ubuntu-latest, node: 22, expect: version}
          - {os: windows-latest, node: 22, expect: version}
          - {os: ubuntu-latest, node: 18, expect: refusal}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: npm ci && npm run build

      - name: Pack
        run: npm pack --pack-destination .

      # The tarball is built on a supported Node, then installed and run on the
      # matrix Node — otherwise `npm ci` itself would fail below the floor and
      # the entry point would never be reached.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install the tarball globally
        shell: bash
        run: npm install -g ./cladding-*.tgz

      - name: The entry point reports its version
        if: matrix.expect == 'version'
        shell: bash
        run: |
          set -euo pipefail
          clad --version

      - name: The entry point refuses an unsupported Node with a sentence
        if: matrix.expect == 'refusal'
        shell: bash
        run: |
          set +e
          output=$(clad --version 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0 || { echo "expected a non-zero exit below the floor"; exit 1; }
          grep -q 'requires Node 20 or newer' <<<"$output"
          grep -q 'Upgrade Node' <<<"$output"
