<svg width="700" height="470" viewBox="0 0 700 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cycle-title" font-family="-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title id="cycle-title">Spec → Code → Tests サイクル — 1つの feature のライフサイクル</title>
  <defs>
    <style>
      :root{
        --brand:#3b82f6; --brand-deep:#1d4ed8; --brand-soft:#eff6ff;
        --ink:#0f172a; --text:#1e293b; --muted:#64748b; --faint:#94a3b8;
        --border:#d8dfea; --surface:#ffffff; --ok:#16a34a; --block:#e11d48;
      }
      .title{font-size:19px;font-weight:800;fill:var(--ink);letter-spacing:-.3px}
      .sub0{font-size:12.5px;fill:var(--muted)}
      .hdr{font-size:13.5px;font-weight:700;fill:#ffffff}
      .item{font-size:12.5px;fill:var(--text)}
      .muted{font-size:10.5px;fill:var(--faint)}
      .focal{font-size:20px;font-weight:800;fill:#ffffff;letter-spacing:-.3px}
      .flow{font-size:10.5px;font-weight:600;fill:var(--brand-deep)}
      .card{fill:var(--surface);stroke:var(--border);stroke-width:1.25}
      .band{fill:var(--brand)} .focalbox{fill:var(--brand-deep)}
      .okfill{fill:var(--ok)} .blockfill{fill:var(--block)} .inkfill{fill:var(--ink)}
    </style>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#3b82f6"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16a34a"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e11d48"/></marker>
  </defs>

  <rect width="700" height="470" fill="#ffffff"/>

  <!-- Title -->
  <text x="350" y="34" text-anchor="middle" class="title">Spec → Code → Tests サイクル</text>
  <rect x="308" y="44" width="84" height="3" rx="1.5" fill="#3b82f6"/>
  <text x="350" y="66" text-anchor="middle" class="sub0">spec が権威 — コードとテストは spec に従う</text>

  <!-- Spec card : top center -->
  <rect x="245" y="78" width="210" height="92" rx="14" class="card"/>
  <path d="M245 108 L245 92 Q245 78 259 78 L441 78 Q455 78 455 92 L455 108 Z" class="band"/>
  <text x="263" y="99" class="hdr">Spec · 意図の記録</text>
  <text x="265" y="134" class="item">▸ spec/features/*.yaml</text>
  <text x="265" y="158" class="item">▸ 権威の源 (SSoT)</text>

  <!-- 검증 관문 : deep-blue focal -->
  <rect x="285" y="206" width="130" height="72" rx="16" class="focalbox"/>
  <text x="350" y="240" text-anchor="middle" class="focal">検証ゲート</text>
  <text x="350" y="262" text-anchor="middle" font-size="11.5" font-weight="600" fill="#dbeafe">15段階 · 40 検査</text>

  <!-- Code card : bottom-right -->
  <rect x="445" y="340" width="225" height="96" rx="14" class="card"/>
  <path d="M445 370 L445 354 Q445 340 459 340 L656 340 Q670 340 670 354 L670 370 Z" class="band"/>
  <text x="463" y="361" class="hdr">Code · 実装</text>
  <text x="465" y="396" class="item">▸ ホスト LLM が作成</text>
  <text x="465" y="420" class="item">▸ cladding はコードを書かない</text>

  <!-- Tests card : bottom-left -->
  <rect x="30" y="340" width="225" height="96" rx="14" class="card"/>
  <path d="M30 370 L30 354 Q30 340 44 340 L241 340 Q255 340 255 354 L255 370 Z" class="band"/>
  <text x="48" y="361" class="hdr">Tests · 証拠</text>
  <text x="50" y="396" class="item">▸ AC ↔ test リンク</text>
  <text x="50" y="420" class="item">▸ 結果を検証する</text>

  <!-- Arrow: Spec → Code (right side, clockwise) -->
  <path d="M 455 142 Q 640 205 557 336" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
  <text x="600" y="208" text-anchor="middle" class="flow">意図を注入</text>

  <!-- Arrow: Code → Tests (bottom) -->
  <line x1="443" y1="388" x2="259" y2="388" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
  <text x="350" y="378" text-anchor="middle" class="flow">検証</text>

  <!-- Arrow: Tests → Spec (left side, clockwise) -->
  <path d="M 120 338 Q 55 205 243 142" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
  <text x="100" y="206" text-anchor="middle" class="flow">逸脱は遮断</text>
  <text x="100" y="223" text-anchor="middle" class="flow">更新は記録</text>

  <!-- Caption -->
  <text x="350" y="458" text-anchor="middle" class="sub0">一度に1つの feature — ゲート通過で「完了」を獲得しサイクルを閉じる</text>
</svg>
