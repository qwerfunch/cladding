<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" font-family="-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <style>
      :root{
        --brand:#3b82f6; --brand-deep:#1d4ed8; --brand-soft:#eff6ff;
        --ink:#0f172a; --text:#1e293b; --muted:#64748b; --faint:#94a3b8;
        --border:#d8dfea; --surface:#ffffff; --ok:#16a34a; --block:#e11d48;
      }
      .title{font-size:19px;font-weight:800;fill:var(--ink);letter-spacing:-.3px}
      .sub0{font-size:12.5px;fill:var(--muted)}
      .hdr{font-size:13.5px;font-weight:700;fill:#ffffff}
      .item{font-size:12.5px;fill:var(--text)}
      .muted{font-size:10.5px;fill:var(--faint)}
      .focal{font-size:20px;font-weight:800;fill:#ffffff;letter-spacing:-.3px}
      .flow{font-size:10.5px;font-weight:600;fill:var(--brand-deep)}
      .card{fill:var(--surface);stroke:var(--border);stroke-width:1.25}
      .band{fill:var(--brand)} .focalbox{fill:var(--brand-deep)}
      .okfill{fill:var(--ok)} .blockfill{fill:var(--block)} .inkfill{fill:var(--ink)}
    </style>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#3b82f6"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16a34a"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e11d48"/></marker>
  </defs>

  <rect width="760" height="280" fill="#ffffff"/>

  <text x="380" y="30" text-anchor="middle" class="title">A Feature's Lifecycle</text>
  <rect x="338" y="38" width="84" height="3" rx="1.5" fill="#3b82f6"/>
  <text x="380" y="58" text-anchor="middle" class="sub0">Define → Sync → Build → Earn</text>

  <!-- step ① Define -->
  <rect x="24" y="78" width="142" height="62" rx="14" class="card"/>
  <path d="M24 104 L24 92 Q24 78 38 78 L152 78 Q166 78 166 92 L166 104 Z" class="band"/>
  <text x="95" y="96" text-anchor="middle" class="hdr">① Define</text>
  <text x="36" y="128" class="item">▸ Record intent</text>

  <!-- step ② Sync -->
  <rect x="198" y="78" width="142" height="62" rx="14" class="card"/>
  <path d="M198 104 L198 92 Q198 78 212 78 L326 78 Q340 78 340 92 L340 104 Z" class="band"/>
  <text x="269" y="96" text-anchor="middle" class="hdr">② Sync</text>
  <text x="210" y="128" class="item">▸ Verify·heal spec</text>

  <!-- step ③ Build -->
  <rect x="372" y="78" width="142" height="62" rx="14" class="card"/>
  <path d="M372 104 L372 92 Q372 78 386 78 L500 78 Q514 78 514 92 L514 104 Z" class="band"/>
  <text x="443" y="96" text-anchor="middle" class="hdr">③ Build</text>
  <text x="384" y="128" class="item">▸ LLM: code·tests</text>

  <!-- step ④ Earn : deep-blue focal -->
  <rect x="546" y="78" width="142" height="62" rx="14" class="focalbox"/>
  <text x="617" y="103" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">④ Earn</text>
  <text x="617" y="126" text-anchor="middle" font-size="11.5" font-weight="600" fill="#dbeafe">Request done</text>

  <!-- step arrows -->
  <line x1="166" y1="109" x2="196" y2="109" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="340" y1="109" x2="370" y2="109" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="514" y1="109" x2="544" y2="109" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>

  <!-- fork: green pass → done earned (right, w316 = under ③④ : 372-688) -->
  <line x1="617" y1="140" x2="617" y2="178" stroke="#16a34a" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="628" y="164" text-anchor="start" font-size="10.5" font-weight="600" fill="#16a34a">All pass</text>
  <rect x="372" y="180" width="316" height="42" rx="11" class="okfill"/>
  <text x="530" y="206" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Done earned · signed off</text>

  <!-- fork: red fail → auto-revert (left, w316 = under ①② : 24-340) -->
  <path d="M 560 140 L 560 162 L 182 162 L 182 178" fill="none" stroke="#e11d48" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="380" y="156" text-anchor="middle" font-size="10.5" font-weight="600" fill="#e11d48">Any failure</text>
  <rect x="24" y="180" width="316" height="42" rx="11" class="blockfill"/>
  <text x="182" y="200" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Auto-revert</text>
  <text x="182" y="216" text-anchor="middle" font-size="10.5" fill="#fecdd3">Done is earned, not declared</text>

  <!-- caption -->
  <text x="380" y="256" text-anchor="middle" class="sub0">Writing 'done' by hand doesn't count — only the gate makes it valid</text>
</svg>
