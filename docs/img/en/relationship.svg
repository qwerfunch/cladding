<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" width="720" height="426">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#475569"/>
    </marker>
    <marker id="ah-green" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#16a34a"/>
    </marker>
    <marker id="ah-red" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="568" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#0f172a">cladding × host LLM — the goal is &#8216;code verified against the spec&#8217;</text>

  <!-- LEFT group: before (intent in) -->
  <rect x="32" y="88" width="216" height="216" rx="10" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="116" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="700" fill="#15803d">Before — inject the spec&#8217;s intent</text>
  <rect x="46" y="132" width="188" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="140" y="155" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#0f172a">extract only what&#8217;s needed now</text>
  <text x="140" y="173" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#0f172a">from the intent in the spec</text>
  <rect x="46" y="194" width="188" height="36" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="140" y="217" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#0f172a">auto-inject the project map</text>
  <rect x="46" y="240" width="188" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="140" y="263" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#0f172a">apply team rules</text>
  <text x="140" y="281" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#0f172a">(forbidden / preferred patterns)</text>

  <!-- CENTER: host LLM -->
  <rect x="354" y="120" width="252" height="152" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="172" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#0f172a">host LLM</text>
  <text x="480" y="201" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="10.5" fill="#475569">Claude Code · Codex · Gemini · Cursor</text>
  <text x="480" y="240" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11.5" font-weight="600" fill="#2563eb">writes the code — generation is the LLM&#8217;s job</text>

  <!-- RIGHT group: after (verify out) -->
  <rect x="712" y="88" width="216" height="216" rx="10" fill="#f8fafc" stroke="#d97706" stroke-width="2"/>
  <text x="820" y="116" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13.5" font-weight="700" fill="#b45309">After — verify the result</text>
  <rect x="726" y="132" width="188" height="40" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="820" y="157" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#0f172a">15-stage gate</text>
  <rect x="726" y="184" width="188" height="40" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="820" y="209" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#0f172a">37 drift detectors</text>
  <rect x="726" y="236" width="188" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="820" y="259" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#0f172a">impl-blind grader</text>
  <text x="820" y="277" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#0f172a">runs the deliverable directly</text>

  <!-- main flow arrows -->
  <line x1="248" y1="196" x2="350" y2="196" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="300" y="182" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="10.5" fill="#475569">start with the right intent</text>
  <line x1="606" y1="196" x2="708" y2="196" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="658" y="182" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="10.5" fill="#475569">check every output</text>

  <!-- outcome arrows from amber group -->
  <line x1="830" y1="304" x2="830" y2="346" stroke="#16a34a" stroke-width="1.8" marker-end="url(#ah-green)"/>
  <line x1="736" y1="304" x2="646.8" y2="347.1" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ah-red)"/>

  <!-- outcome chips -->
  <rect x="688" y="348" width="252" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="814" y="372.5" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#0f172a">pass → completion earned · signed</text>
  <rect x="515" y="348" width="160" height="40" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="595" y="372.5" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#0f172a">block → repair card</text>

  <!-- arrows into record band -->
  <line x1="814" y1="388" x2="814" y2="426" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="595" y1="388" x2="595" y2="426" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- record band -->
  <rect x="240" y="428" width="640" height="58" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="560" y="452" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="700" fill="#334155">Record — fed back as next-turn input</text>
  <text x="560" y="472" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#475569">audit ledger · verification signature · repair card</text>

  <!-- feedback loop: record -> left group -->
  <path d="M 240 457 C 164 457, 100 438, 96 384 C 93 348, 99 322, 109 308" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah-green)"/>
  <text x="208" y="402" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" font-weight="700" fill="#15803d">feedback loop</text>
  <text x="208" y="420" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11" fill="#475569">results flow back into context</text>

  <!-- captions -->
  <text x="480" y="528" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#64748b">cladding = the cladding layer. It doesn&#8217;t replace the LLM — it wraps it.</text>
  <text x="480" y="550" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="700" fill="#16a34a">One goal — turn the AI&#8217;s &#8216;all done&#8217; from a claim into proof.</text>
</svg>
