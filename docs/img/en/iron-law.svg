  <!-- Title -->
  <text x="320" y="32" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#0f172a">15-stage gate — all of it in one verification</text>

