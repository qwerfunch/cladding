  <rect x="32" y="88" width="184" height="28" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="124" y="106" text-anchor="middle" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0f172a">Type</text>
