  <rect x="331" y="428" width="70" height="28" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="366" y="446" text-anchor="middle" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0f172a">UAT</text>

  <!-- diverging outcome arrows -->
  <path d="M320,466 L202,498" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#ah-green)"/>
  <path d="M320,466 L490,498" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ah-red)"/>

  <!-- outcome chips -->
  <rect x="36" y="500" width="330" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="201" y="525" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Pass → verified signature (this code is verified)</text>
  <rect x="378" y="500" width="226" height="40" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="491" y="525" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Fail → blocked · cannot complete</text>

  <!-- caption -->
  <text x="320" y="564" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#64748b">CI · git hook · manual call — the same 15 stages apply wherever you run it</text>
</svg>
