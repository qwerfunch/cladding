  <rect x="236" y="228" width="200" height="28" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="336" y="246" text-anchor="middle" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0f172a">Spec conformance (oracle)</text>
