  <text x="518" y="246" text-anchor="middle" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0f172a">Deliverable smoke</text>

  <line x1="320" y1="266" x2="320" y2="292" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- stage_3 band -->
  <rect x="16" y="294" width="608" height="72" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="32" y="316" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#0f172a"><tspan font-family="'SF Mono', Menlo, monospace" fill="#b45309">stage_3</tspan><tspan>&#160;·&#160;E2E (3)</tspan></text>
  <rect x="193" y="328" width="80" height="28" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="233" y="346" text-anchor="middle" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0f172a">Smoke</text>
  <rect x="285" y="328" width="70" height="28" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="320" y="346" text-anchor="middle" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0f172a">Perf</text>
  <rect x="367" y="328" width="80" height="28" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="407" y="346" text-anchor="middle" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0f172a">Visual</text>

  <line x1="320" y1="366" x2="320" y2="392" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- stage_4 band -->
  <rect x="16" y="394" width="608" height="72" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="32" y="416" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#0f172a"><tspan font-family="'SF Mono', Menlo, monospace" fill="#b45309">stage_4</tspan><tspan>&#160;·&#160;evidence (2)</tspan></text>
  <rect x="239" y="428" width="80" height="28" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
