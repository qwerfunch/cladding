  <rect x="424" y="88" width="184" height="28" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="516" y="106" text-anchor="middle" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0f172a">Drift (38 detectors)</text>
  <rect x="32" y="126" width="184" height="28" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="124" y="144" text-anchor="middle" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0f172a">Commit</text>
  <rect x="228" y="126" width="184" height="28" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="320" y="144" text-anchor="middle" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0f172a">Arch</text>
  <rect x="424" y="126" width="184" height="28" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="516" y="144" text-anchor="middle" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0f172a">Secret</text>

  <line x1="320" y1="166" x2="320" y2="192" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- stage_2 band -->
  <rect x="16" y="194" width="608" height="72" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
