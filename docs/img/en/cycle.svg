<svg width="700" height="460" viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cycle-title">
  <title id="cycle-title">Spec → Code → Tests cycle — one feature lifecycle</title>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="30" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Spec → Code → Tests cycle</text>

  <!-- Spec box (top, green) -->
  <rect x="225" y="54" width="250" height="82" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="350" y="82" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Spec</text>
  <text x="350" y="104" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#475569" text-anchor="middle">the record of intent</text>
  <text x="350" y="123" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#64748b" text-anchor="middle">spec/features/*.yaml</text>

  <!-- Code box (bottom-right, blue) -->
  <rect x="425" y="330" width="255" height="75" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="552" y="360" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Code</text>
  <text x="552" y="386" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#475569" text-anchor="middle">implementation — written by the LLM</text>

  <!-- Tests box (bottom-left, amber) -->
  <rect x="20" y="330" width="255" height="75" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="147" y="360" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Tests</text>
  <text x="147" y="386" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#475569" text-anchor="middle">evidence — AC ↔ test linkage</text>

  <!-- Arrow: Spec → Code (right side, clockwise) -->
  <path d="M 475 108 Q 625 200 545 328" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <text x="515" y="212" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">inject intent</text>

  <!-- Arrow: Code → Tests (bottom) -->
  <line x1="425" y1="368" x2="277" y2="368" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <text x="350" y="357" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">verify</text>

  <!-- Arrow: Tests → Spec (left side, clockwise) -->
  <path d="M 150 330 Q 75 200 223 110" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <text x="185" y="200" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">drift is blocked</text>
  <text x="185" y="219" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">updates are recorded</text>

  <!-- Center: the gate -->
  <text x="350" y="232" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">the gate</text>
  <text x="350" y="254" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#475569" text-anchor="middle">15-stage gate · 38 drift detectors</text>

  <!-- Caption -->
  <text x="350" y="438" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">one feature at a time — completion is earned by passing the gate, then the cycle closes</text>
</svg>
