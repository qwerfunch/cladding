<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 444" width="640" height="444" role="img" aria-labelledby="ecosystem-title" font-family="-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title id="ecosystem-title">Ecosystem Venn — SDD · 실행기 · Multi-agent 거버넌스 세 흐름의 교집합에 cladding이 위치</title>
  <defs>
    <style>
      :root{
        --brand:#3b82f6; --brand-deep:#1d4ed8; --brand-soft:#eff6ff;
        --ink:#0f172a; --text:#1e293b; --muted:#64748b; --faint:#94a3b8;
        --border:#d8dfea; --surface:#ffffff; --ok:#16a34a; --block:#e11d48;
      }
      .title{font-size:19px;font-weight:800;fill:var(--ink);letter-spacing:-.3px}
      .sub0{font-size:12.5px;fill:var(--muted)}
      .hdr{font-size:13.5px;font-weight:700;fill:#ffffff}
      .item{font-size:12.5px;fill:var(--text)}
      .muted{font-size:10.5px;fill:var(--faint)}
      .focal{font-size:20px;font-weight:800;fill:#ffffff;letter-spacing:-.3px}
      .flow{font-size:10.5px;font-weight:600;fill:var(--brand-deep)}
      .card{fill:var(--surface);stroke:var(--border);stroke-width:1.25}
      .band{fill:var(--brand)} .focalbox{fill:var(--brand-deep)}
      .okfill{fill:var(--ok)} .blockfill{fill:var(--block)} .inkfill{fill:var(--ink)}
    </style>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#3b82f6"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16a34a"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e11d48"/></marker>
  </defs>

  <rect width="640" height="444" fill="#ffffff"/>

  <!-- Title -->
  <text x="320" y="34" text-anchor="middle" class="title">cladding의 생태계 위치</text>
  <rect x="278" y="44" width="84" height="3" rx="1.5" fill="#3b82f6"/>
  <text x="320" y="64" text-anchor="middle" class="sub0">세 흐름이 겹치는 교집합</text>

  <!-- Venn circles (flat, blue-primary family) -->
  <circle cx="240" cy="200" r="105" fill="#eff6ff" fill-opacity="0.75" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="400" cy="200" r="105" fill="#eff6ff" fill-opacity="0.5" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="320" cy="300" r="105" fill="#f1f5f9" fill-opacity="0.75" stroke="#64748b" stroke-width="2"/>

  <!-- SDD label (top-left, above circle) -->
  <text x="122" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3b82f6">SDD — spec 작성 도구</text>
  <text x="122" y="110" text-anchor="middle" font-size="11" fill="#64748b">Spec Kit · OpenSpec · Kiro</text>

  <!-- Runner label (top-right, above circle) -->
  <text x="516" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">실행기 — AI에게 코드 짜게</text>
  <text x="516" y="110" text-anchor="middle" font-size="11" fill="#64748b">OpenHands · Cline · Aider</text>

  <!-- Governance label (bottom-left, outside circles) -->
  <text x="116" y="356" text-anchor="middle" font-size="13.5" font-weight="700" fill="#64748b">Multi-agent 거버넌스</text>
  <text x="116" y="374" text-anchor="middle" font-size="11" fill="#64748b">BMAD · Agent Teams</text>

  <!-- cladding center : single deep-blue focal at the triple overlap -->
  <rect x="232" y="200" width="176" height="62" rx="14" class="focalbox"/>
  <text x="320" y="227" text-anchor="middle" class="focal">cladding</text>
  <text x="320" y="248" text-anchor="middle" font-size="11" fill="#dbeafe">셋을 하나의 검증 루프로</text>

  <!-- Caption -->
  <text x="320" y="430" text-anchor="middle" font-size="11" fill="#64748b">40 drift detectors · 15-stage gate</text>
</svg>
