<svg width="640" height="444" viewBox="0 0 640 444" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ecosystem-title">
  <title id="ecosystem-title">Ecosystem Venn — SDD · 실행기 · Multi-agent 거버넌스 세 흐름의 교집합에 cladding이 위치</title>

  <!-- Title -->
  <text x="320" y="30" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">cladding의 생태계 위치 — 세 흐름의 교집합</text>

  <!-- Venn circles -->
  <circle cx="240" cy="193" r="105" fill="#fef3c7" fill-opacity="0.55" stroke="#d97706" stroke-width="2"/>
  <circle cx="400" cy="193" r="105" fill="#dbeafe" fill-opacity="0.55" stroke="#2563eb" stroke-width="2"/>
  <circle cx="320" cy="298" r="105" fill="#e2e8f0" fill-opacity="0.55" stroke="#64748b" stroke-width="2"/>

  <!-- SDD label (top-left, fully above circle strokes) -->
  <text x="122" y="58" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">SDD — spec 작성 도구</text>
  <text x="122" y="76" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#475569" text-anchor="middle">Spec Kit · OpenSpec · Kiro</text>

  <!-- Runner label (top-right, fully above circle strokes) -->
  <text x="518" y="58" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">실행기 — AI에게 코드 짜게</text>
  <text x="518" y="76" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#475569" text-anchor="middle">Claude Code · Aider · OpenHands</text>

  <!-- Governance label (bottom-left, outside all circles) -->
  <text x="120" y="345" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">Multi-agent 거버넌스</text>
  <text x="120" y="363" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#475569" text-anchor="middle">BMAD · Agent Teams</text>

  <!-- cladding center box (triple-overlap) -->
  <rect x="232" y="190" width="176" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="320" y="213" font-family="'SF Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">cladding</text>
  <text x="320" y="235" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#475569" text-anchor="middle">셋을 하나의 검증 루프로</text>

  <!-- Caption -->
  <text x="320" y="426" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">v0.6.1 · 38 drift detectors · 15-stage gate</text>
</svg>
