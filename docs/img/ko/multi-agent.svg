<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 724 456" width="724" height="456" role="img" aria-labelledby="multi-agent-title" font-family="-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title id="multi-agent-title">에이전트 역할 분리 — 역할을 분리해 어떤 에이전트도 자기 작업을 스스로 승인하지 못하고, 모든 완료는 기록된 근거에 따라 independent 또는 self-certified 라벨이 붙는다. 에이전트를 어떻게 돌릴지는 호스트가 정한다 (anti-self-cert).</title>
  <defs>
    <style>
      :root{
        --brand:#3b82f6; --brand-deep:#1d4ed8; --brand-soft:#eff6ff;
        --ink:#6b7280; --text:#737a84; --muted:#6f757f; --faint:#8b919b;
        --border:#8b93a1; --surface:rgba(148,163,184,0.18); --ok:#16a34a; --block:#e11d48; --brand-text:#3f76d6;
      }
      .title{font-size:19px;font-weight:800;fill:var(--ink);letter-spacing:-.3px}
      .sub0{font-size:12.5px;fill:var(--muted)}
      .hdr{font-size:13.5px;font-weight:700;fill:#ffffff}
      .item{font-size:12.5px;fill:var(--text)}
      .muted{font-size:10.5px;fill:var(--faint)}
      .focal{font-size:20px;font-weight:800;fill:#ffffff;letter-spacing:-.3px}
      .flow{font-size:10.5px;font-weight:600;fill:var(--brand-text)}
      .card{fill:var(--surface);stroke:var(--border);stroke-width:1.25}
      .band{fill:var(--brand)} .focalbox{fill:var(--brand-deep)}
      .okfill{fill:var(--ok)} .blockfill{fill:var(--block)} .inkfill{fill:var(--ink)}
    </style>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#3b82f6"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16a34a"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e11d48"/></marker>
  </defs>


  <!-- title -->
  <text x="362" y="38" text-anchor="middle" class="title">에이전트 역할 분리</text>
  <rect x="320" y="48" width="84" height="3" rx="1.5" fill="#3b82f6"/>
  <text x="362" y="71" text-anchor="middle" class="sub0">EU AI Act · SOX가 요구하는 직무 분리 원칙과 맞닿는다</text>

  <!-- host : deep-blue focal -->
  <rect x="242" y="86" width="240" height="58" rx="14" class="focalbox"/>
  <text x="362" y="114" text-anchor="middle" class="focal" font-size="18">host</text>
  <text x="362" y="133" text-anchor="middle" font-size="11.5" font-weight="600" fill="#dbeafe">에이전트 실행 — 개수 · 모델 · 병렬성</text>

  <!-- host runs the role briefs -->
  <g fill="none" stroke="#3b82f6" stroke-width="1.6">
    <line x1="302" y1="144" x2="98"  y2="185" marker-end="url(#ab)"/>
    <line x1="340" y1="144" x2="274" y2="185" marker-end="url(#ab)"/>
    <line x1="386" y1="144" x2="450" y2="185" marker-end="url(#ab)"/>
    <line x1="424" y1="144" x2="626" y2="185" marker-end="url(#ab)"/>
  </g>

  <!-- planner -->
  <rect x="18" y="188" width="160" height="104" rx="14" class="card"/>
  <path d="M18 220 L18 202 Q18 188 32 188 L164 188 Q178 188 178 202 L178 220 Z" class="band"/>
  <text x="98" y="209" text-anchor="middle" class="hdr">planner</text>
  <text x="34" y="252" class="item">▸ spec 작성</text>
  <text x="34" y="278" class="muted">SSoT 관리자</text>

  <!-- developer -->
  <rect x="194" y="188" width="160" height="104" rx="14" class="card"/>
  <path d="M194 220 L194 202 Q194 188 208 188 L340 188 Q354 188 354 202 L354 220 Z" class="band"/>
  <text x="274" y="209" text-anchor="middle" class="hdr">developer</text>
  <text x="210" y="252" class="item">▸ 코드 작성</text>
  <text x="210" y="278" class="muted">구현 · 테스트</text>

  <!-- reviewer -->
  <rect x="370" y="188" width="160" height="104" rx="14" class="card"/>
  <path d="M370 220 L370 202 Q370 188 384 188 L516 188 Q530 188 530 202 L530 220 Z" class="band"/>
  <text x="450" y="209" text-anchor="middle" class="hdr">reviewer</text>
  <text x="386" y="252" class="item">▸ 감사 · 승인</text>
  <text x="386" y="278" class="muted">독립 감사자 (읽기전용)</text>

  <!-- blind-author -->
  <rect x="546" y="188" width="160" height="104" rx="14" class="card"/>
  <path d="M546 220 L546 202 Q546 188 560 188 L692 188 Q706 188 706 202 L706 220 Z" class="band"/>
  <text x="626" y="209" text-anchor="middle" class="hdr">blind-author</text>
  <text x="562" y="246" class="item">▸ 테스트 작성자</text>
  <text x="562" y="268" class="item">▸ 구현 못 봄</text>
  <text x="562" y="287" class="muted">Read/Grep 미부여</text>

  <!-- converging arrows : workers -> the judged record -->
  <g fill="none" stroke="#3b82f6" stroke-width="1.6">
    <line x1="98"  y1="292" x2="200" y2="336" marker-end="url(#ab)"/>
    <line x1="274" y1="292" x2="250" y2="336" marker-end="url(#ab)"/>
    <line x1="450" y1="292" x2="310" y2="336" marker-end="url(#ab)"/>
    <line x1="626" y1="292" x2="360" y2="336" marker-end="url(#ab)"/>
  </g>

  <!-- cladding : judgment card -->
  <rect x="130" y="340" width="300" height="84" rx="14" class="card"/>
  <path d="M130 372 L130 354 Q130 340 144 340 L416 340 Q430 340 430 354 L430 372 Z" class="band"/>
  <text x="280" y="361" text-anchor="middle" class="hdr">cladding</text>
  <text x="146" y="398" class="item">▸ 게이트 — 완료는 얻는 것</text>
  <text x="146" y="416" class="item">▸ 라벨 — independent | self-certified</text>

  <!-- anti-self-cert principle : red block band -->
  <rect x="448" y="340" width="258" height="84" rx="14" class="card"/>
  <path d="M448 372 L448 354 Q448 340 462 340 L692 340 Q706 340 706 354 L706 372 Z" class="blockfill"/>
  <text x="577" y="361" text-anchor="middle" class="hdr">자기 승인 금지</text>
  <text x="464" y="398" class="item">▸ 만드는 자 ≠ 검증하는 자</text>
  <text x="464" y="416" class="muted">anti-self-cert 불변식</text>

  <!-- caption -->
  <text x="362" y="446" text-anchor="middle" class="sub0">완료는 검증 관문 전체 통과로만 획득 — 검증 기록은 <tspan font-family="'SF Mono', Menlo, monospace" fill="#3f76d6">attestation.yaml</tspan></text>
</svg>
