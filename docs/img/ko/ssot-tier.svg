<svg width="640" height="540" viewBox="0 0 640 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ssot-tier-title">
  <title id="ssot-tier-title">4-Tier SSoT — A(Spec) → B(Design) → C(Derived) → D(Audit), A가 B보다 우선</title>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="320" y="36" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#0f172a">4-Tier SSoT — 진실의 원천 계층 (v0.6.0)</text>

  <!-- Band A : Spec -->
  <rect x="20" y="56" width="424" height="84" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="232" y="83" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#15803d">A — Spec</text>
  <text x="232" y="105" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" fill="#0f172a">의도 · 사람이 정의 · 봉인 (LLM 수정 금지)</text>
  <text x="232" y="126" text-anchor="middle" font-family="'SF Mono', Menlo, monospace" font-size="11.5" fill="#475569">spec.yaml · spec/features/&lt;slug&gt;-&lt;hash8&gt;.yaml</text>

  <!-- Arrow A -> B -->
  <line x1="232" y1="142" x2="232" y2="166" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="246" y="158" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#64748b">A 우선</text>

  <!-- Band B : Design -->
  <rect x="20" y="168" width="424" height="84" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="232" y="195" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">B — Design</text>
  <text x="232" y="217" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" fill="#0f172a">설계 · 사람이 자유 편집 · A와 일치 검증</text>
  <text x="232" y="238" text-anchor="middle" font-family="'SF Mono', Menlo, monospace" font-size="11.5" fill="#475569">architecture.yaml · ai_hints · conventions.md</text>

  <!-- Arrow B -> C -->
  <line x1="232" y1="254" x2="232" y2="278" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="246" y="270" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#64748b">구현</text>

  <!-- Band C : Derived -->
  <rect x="20" y="280" width="424" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="232" y="307" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#334155">C — Derived</text>
  <text x="232" y="329" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" fill="#0f172a">구현물(코드 · 테스트) + 검증 서명(attestation)</text>
  <text x="232" y="349" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" fill="#475569">자동 재생성 · 서명은 검증 관문 통과로 획득</text>
  <text x="232" y="370" text-anchor="middle" font-family="'SF Mono', Menlo, monospace" font-size="11.5" fill="#475569">src/ · tests/ · attestation.yaml</text>

  <!-- Arrow C -> D -->
  <line x1="232" y1="386" x2="232" y2="410" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="246" y="402" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#64748b">이벤트 기록</text>

  <!-- Band D : Audit -->
  <rect x="20" y="412" width="424" height="84" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="232" y="439" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#1e293b">D — Audit</text>
  <text x="232" y="461" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" fill="#0f172a">감사 기록 · append-only · 수정 불가</text>
  <text x="232" y="482" text-anchor="middle" font-family="'SF Mono', Menlo, monospace" font-size="11.5" fill="#475569">.cladding/events.log.jsonl</text>

  <!-- Side annotation bracket : spans A..C -->
  <path d="M466,60 h-6 v320 h6" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="478" y="200" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#0f172a">A가 B보다 우선</text>
  <text x="478" y="222" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#475569">코드와 spec이 다르면</text>
  <text x="478" y="240" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#475569">코드가 틀린 것</text>

  <!-- Caption -->
  <text x="320" y="522" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#64748b">계층 간 일치는 15-stage gate · 37 drift detectors가 검증</text>
</svg>
