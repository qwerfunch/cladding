<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" width="640" height="540" role="img" aria-labelledby="ssot-tier-title" font-family="-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title id="ssot-tier-title">스펙이 기준이다 (4계층) — A(Spec) → B(Design) → C(Derived) → D(Audit), 위 계층이 아래보다 우선</title>
  <defs>
    <style>
      :root{
        --brand:#3b82f6; --brand-deep:#1d4ed8; --brand-soft:#eff6ff;
        --ink:#0f172a; --text:#1e293b; --muted:#64748b; --faint:#94a3b8;
        --border:#d8dfea; --surface:#ffffff; --ok:#16a34a; --block:#e11d48;
      }
      .title{font-size:19px;font-weight:800;fill:var(--ink);letter-spacing:-.3px}
      .sub0{font-size:12.5px;fill:var(--muted)}
      .hdr{font-size:13.5px;font-weight:700;fill:#ffffff}
      .item{font-size:12.5px;fill:var(--text)}
      .muted{font-size:10.5px;fill:var(--faint)}
      .focal{font-size:20px;font-weight:800;fill:#ffffff;letter-spacing:-.3px}
      .flow{font-size:10.5px;font-weight:600;fill:var(--brand-deep)}
      .card{fill:var(--surface);stroke:var(--border);stroke-width:1.25}
      .band{fill:var(--brand)} .focalbox{fill:var(--brand-deep)}
      .okfill{fill:var(--ok)} .blockfill{fill:var(--block)} .inkfill{fill:var(--ink)}
    </style>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#3b82f6"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16a34a"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e11d48"/></marker>
  </defs>

  <rect width="640" height="540" fill="#ffffff"/>

  <!-- Title -->
  <text x="320" y="34" text-anchor="middle" class="title">스펙이 기준이다 — 4계층 구조</text>
  <rect x="278" y="44" width="84" height="3" rx="1.5" fill="#3b82f6"/>
  <text x="320" y="66" text-anchor="middle" class="sub0">위 계층이 우선 — 코드가 스펙을 따른다</text>

  <!-- A : Spec (focal, deep blue anchor) -->
  <rect x="28" y="78" width="408" height="96" rx="14" class="focalbox"/>
  <text x="48" y="110" class="focal" font-size="15">A — Spec · 모든 것의 기준</text>
  <text x="48" y="138" class="item" fill="#ffffff">▸ 사람이 의도 정의 → AI가 EARS로 작성</text>
  <text x="48" y="161" font-size="10.5" fill="#bfdbfe">spec.yaml · features/&lt;slug&gt;-&lt;hash8&gt;.yaml</text>

  <!-- arrow A -> B -->
  <line x1="232" y1="174" x2="232" y2="194" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
  <text x="242" y="189" class="flow">A 우선</text>

  <!-- B : Design -->
  <rect x="28" y="194" width="408" height="88" rx="14" class="card"/>
  <path d="M28 224 L28 208 Q28 194 42 194 L422 194 Q436 194 436 208 L436 224 Z" class="band"/>
  <text x="44" y="214" class="hdr">B — Design · 설계</text>
  <text x="46" y="252" class="item">▸ 사람이 방향, AI가 작성 · A와 일치 검증</text>
  <text x="46" y="274" class="muted">architecture.yaml · capabilities.yaml · project-context.md</text>

  <!-- arrow B -> C -->
  <line x1="232" y1="282" x2="232" y2="302" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
  <text x="242" y="297" class="flow">구현</text>

  <!-- C : Derived + attestation -->
  <rect x="28" y="302" width="408" height="104" rx="14" class="card"/>
  <path d="M28 332 L28 316 Q28 302 42 302 L422 302 Q436 302 436 316 L436 332 Z" class="band"/>
  <text x="44" y="322" class="hdr">C — Derived · 구현물</text>
  <text x="46" y="358" class="item">▸ 코드 · 테스트 + 검증 서명(attestation)</text>
  <text x="46" y="380" class="item"><tspan fill="#16a34a">▸ </tspan>서명은 게이트 통과로 획득 · 자동 재생성</text>
  <text x="46" y="400" class="muted">src/ · tests/ · conventions.md · attestation.yaml</text>

  <!-- arrow C -> D -->
  <line x1="232" y1="406" x2="232" y2="426" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
  <text x="242" y="421" class="flow">기록</text>

  <!-- D : Audit -->
  <rect x="28" y="426" width="408" height="84" rx="14" class="card"/>
  <path d="M28 456 L28 440 Q28 426 42 426 L422 426 Q436 426 436 440 L436 456 Z" class="band"/>
  <text x="44" y="446" class="hdr">D — Audit · 감사 장부</text>
  <text x="46" y="482" class="item">▸ append-only · 수정 불가 · 신원·HEAD 기록</text>
  <text x="46" y="502" class="muted">.cladding/events.log.jsonl</text>

  <!-- side annotation : A outranks lower tiers (spans A..C) -->
  <path d="M456 82 h-6 v300 h6" fill="none" stroke="#d8dfea" stroke-width="1.5"/>
  <text x="466" y="208" font-size="12.5" font-weight="700" fill="#1d4ed8">상위 계층 우선</text>
  <text x="466" y="232" font-size="11" fill="#64748b">코드·spec 충돌 시</text>
  <text x="466" y="249" font-size="11" fill="#64748b">코드가 틀린 것</text>

  <!-- Caption -->
  <text x="320" y="528" text-anchor="middle" class="sub0">계층 일치는 15단계 게이트 · 39가지 검사로 검증</text>
</svg>
