<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="768" height="344" role="img" aria-labelledby="intervention-title" font-family="-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title id="intervention-title">한 장면 — '다 됐습니다'가 진실이 되기까지: 호스트 LLM의 완료 직접 기입을 cladding이 차단하고, 15단계 게이트의 실패가 피드백되어 수리 후 검증 서명과 함께 완료를 획득한다</title>
  <defs>
    <style>
      :root{
        --brand:#3b82f6; --brand-deep:#1d4ed8; --brand-soft:#eff6ff;
        --ink:#6b7280; --text:#737a84; --muted:#6f757f; --faint:#8b919b;
        --border:#8b93a1; --surface:rgba(148,163,184,0.18); --ok:#16a34a; --block:#e11d48; --brand-text:#3f76d6;
      }
      .title{font-size:19px;font-weight:800;fill:var(--ink);letter-spacing:-.3px}
      .sub0{font-size:12.5px;fill:var(--muted)}
      .hdr{font-size:13.5px;font-weight:700;fill:#ffffff}
      .item{font-size:12.5px;fill:var(--text)}
      .muted{font-size:10.5px;fill:var(--faint)}
      .focal{font-size:20px;font-weight:800;fill:#ffffff;letter-spacing:-.3px}
      .flow{font-size:10.5px;font-weight:600;fill:var(--brand-text)}
      .card{fill:var(--surface);stroke:var(--border);stroke-width:1.25}
      .band{fill:var(--brand)} .focalbox{fill:var(--brand-deep)}
      .okfill{fill:var(--ok)} .blockfill{fill:var(--block)} .inkfill{fill:var(--ink)}
    </style>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#3b82f6"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16a34a"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e11d48"/></marker>
  </defs>


  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" class="title">한 장면 — '다 됐습니다'가 진실이 되기까지</text>
  <rect x="438" y="44" width="84" height="3" rx="1.5" fill="#3b82f6"/>

  <!-- ① Host LLM -->
  <rect x="30" y="72" width="248" height="112" rx="14" class="card"/>
  <path d="M30 110 L30 86 Q30 72 44 72 L264 72 Q278 72 278 86 L278 110 Z" class="band"/>
  <text x="50" y="97" class="hdr">① 호스트 LLM</text>
  <text x="52" y="134" class="item">▸ 기능 완성했습니다</text>
  <text x="52" y="158" class="item">▸ done 처리할게요</text>
  <text x="52" y="178" class="muted">완료를 직접 쓰려 함</text>

  <!-- ② cladding intercept — deep-blue focal -->
  <rect x="356" y="72" width="248" height="112" rx="14" class="focalbox"/>
  <text x="480" y="112" text-anchor="middle" class="focal">② cladding 차단</text>
  <text x="480" y="142" text-anchor="middle" font-size="11.5" fill="#bfdbfe">done은 쓰는 값이 아니라</text>
  <text x="480" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">검증으로 얻는다</text>

  <!-- ③ 15-stage gate (RED verdict) -->
  <rect x="682" y="72" width="248" height="112" rx="14" class="card"/>
  <path d="M682 110 L682 86 Q682 72 696 72 L916 72 Q930 72 930 86 L930 110 Z" class="band"/>
  <text x="702" y="97" class="hdr">③ 15단계 게이트</text>
  <text x="704" y="134" class="item"><tspan class="blockfill" font-weight="700">✗ </tspan>AC-3 테스트 없음</text>
  <text x="704" y="158" class="item"><tspan class="blockfill" font-weight="700">✗ </tspan>커버리지 81→76%</text>
  <text x="704" y="178" class="muted">RED — 통과 못 함</text>

  <!-- ⑤ done earned (bottom-LEFT, under ①) -->
  <rect x="30" y="262" width="340" height="112" rx="14" class="card"/>
  <path d="M30 300 L30 276 Q30 262 44 262 L356 262 Q370 262 370 276 L370 300 Z" class="band"/>
  <text x="50" y="287" class="hdr">⑤ done 획득</text>
  <text x="52" y="324" class="item"><tspan class="okfill" font-weight="700">✓ </tspan>검사 전부 통과</text>
  <text x="52" y="348" class="item"><tspan class="okfill" font-weight="700">✓ </tspan>완료 기록 + 검증 서명</text>
  <text x="52" y="368" class="muted">검증 서명 = attestation</text>

  <!-- ④ LLM repairs (bottom-RIGHT, right edge 930 aligned to ③) -->
  <rect x="590" y="262" width="340" height="112" rx="14" class="card"/>
  <path d="M590 300 L590 276 Q590 262 604 262 L916 262 Q930 262 930 276 L930 300 Z" class="band"/>
  <text x="610" y="287" class="hdr">④ LLM이 수리</text>
  <text x="612" y="324" class="item">▸ 지적 사항 보강</text>
  <text x="612" y="348" class="item">▸ 테스트 추가 · 회복</text>
  <text x="612" y="368" class="muted">실패 지점만 고친다</text>

  <!-- arrows: ① → ② (intercept / block) -->
  <line x1="282" y1="128" x2="352" y2="128" stroke="#e11d48" stroke-width="2" marker-end="url(#ar)"/>
  <text x="317" y="120" text-anchor="middle" font-size="10.5" font-weight="600" fill="#e11d48">가로채기</text>

  <!-- ② → ③ (run gate) -->
  <line x1="608" y1="128" x2="678" y2="128" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
  <text x="643" y="120" text-anchor="middle" class="flow">검증 실행</text>

  <!-- ③ → ④ (failure feedback) -->
  <path d="M806 184 L806 258" fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ab)"/>
  <text x="818" y="214" font-size="10.5" font-weight="600" fill="#3f76d6">실패 내용이</text>
  <text x="818" y="230" class="muted">컨텍스트로</text>

  <!-- ④ → ⑤ (re-verify, rightward → leftward across center) -->
  <line x1="586" y1="318" x2="374" y2="318" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
  <text x="480" y="310" text-anchor="middle" class="flow">재검증</text>

  <!-- closing caption -->
  <text x="480" y="408" text-anchor="middle" class="sub0">이제 '다 됐다'는 말이 아니라 증명이다</text>
</svg>
