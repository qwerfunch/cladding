<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="920" height="537" font-family="-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <style>
      /* ── design tokens (blue-primary, flat / no shadow) ── */
      :root{
        --brand:#3b82f6; --brand-deep:#1d4ed8; --brand-soft:#eff6ff;
        --ink:#6b7280; --text:#737a84; --muted:#6f757f; --faint:#8b919b;
        --border:#8b93a1; --surface:rgba(148,163,184,0.18); --ok:#16a34a; --block:#e11d48; --brand-text:#3f76d6;
      }
      .title{font-size:19px;font-weight:800;fill:var(--ink);letter-spacing:-.3px}
      .sub0{font-size:12.5px;fill:var(--muted)}
      .hdr{font-size:13.5px;font-weight:700;fill:#ffffff}
      .item{font-size:12.5px;fill:var(--text)}
      .muted{font-size:10.5px;fill:var(--faint)}
      .focal{font-size:21px;font-weight:800;fill:#ffffff;letter-spacing:-.3px}
      .flow{font-size:10.5px;font-weight:600;fill:var(--brand-text)}
      .card{fill:var(--surface);stroke:var(--border);stroke-width:1.25}
      .band{fill:var(--brand)} .focalbox{fill:var(--brand-deep)}
      .okfill{fill:var(--ok)} .blockfill{fill:var(--block)} .inkfill{fill:var(--ink)}
    </style>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#3b82f6"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16a34a"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e11d48"/></marker>
  </defs>


  <text x="480" y="42" text-anchor="middle" class="title">cladding × 호스트 LLM</text>
  <rect x="438" y="52" width="84" height="3" rx="1.5" fill="#3b82f6"/>
  <text x="480" y="76" text-anchor="middle" class="sub0">코드는 LLM이 쓰고, cladding이 그 전과 후를 맡는다</text>

  <!-- 전 card -->
  <rect x="40" y="108" width="236" height="186" rx="14" class="card"/>
  <path d="M40 148 L40 122 Q40 108 54 108 L262 108 Q276 108 276 122 L276 148 Z" class="band"/>
  <text x="60" y="133" class="hdr">전 · 의도를 넣는다</text>
  <text x="62" y="182" class="item">▸ 필요한 의도만 추출</text>
  <text x="62" y="214" class="item">▸ 프로젝트 지도 자동 주입</text>
  <text x="62" y="246" class="item">▸ 팀 규칙 적용 (금지·선호)</text>
  <text x="62" y="274" class="muted">스펙 전체를 덤프하지 않는다</text>

  <!-- 호스트 LLM : deep-blue focal -->
  <rect x="356" y="158" width="248" height="96" rx="16" class="focalbox"/>
  <text x="480" y="198" text-anchor="middle" class="focal">호스트 LLM</text>
  <text x="480" y="219" text-anchor="middle" font-size="10.5" fill="#bfdbfe">Claude Code · Codex · Gemini · Cursor</text>
  <text x="480" y="239" text-anchor="middle" font-size="11.5" font-weight="600" fill="#dbeafe">코드를 쓴다 — 생성은 LLM의 일</text>

  <!-- 후 card -->
  <rect x="684" y="108" width="236" height="186" rx="14" class="card"/>
  <path d="M684 148 L684 122 Q684 108 698 108 L906 108 Q920 108 920 122 L920 148 Z" class="band"/>
  <text x="704" y="133" class="hdr">후 · 결과를 검증한다</text>
  <text x="706" y="180" class="item">▸ 15단계 검증 관문</text>
  <text x="706" y="209" class="item">▸ 41가지 어긋남 검사</text>
  <text x="706" y="238" class="item">▸ 구현 못 보는 채점자</text>
  <text x="706" y="267" class="item">▸ 실행물 직접 구동</text>

  <!-- flow arrows -->
  <line x1="282" y1="206" x2="350" y2="206" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
  <text x="316" y="197" text-anchor="middle" class="flow">의도 주입</text>
  <line x1="610" y1="206" x2="678" y2="206" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
  <text x="644" y="197" text-anchor="middle" class="flow">단계적 검사</text>

  <!-- outcomes -->
  <line x1="800" y1="296" x2="632" y2="333" stroke="#16a34a" stroke-width="1.8" marker-end="url(#ag)"/>
  <line x1="716" y1="296" x2="372" y2="333" stroke="#e11d48" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="530" y="336" width="172" height="40" rx="11" class="okfill"/>
  <text x="616" y="361" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">통과 → 완료 획득</text>
  <rect x="258" y="336" width="172" height="40" rx="11" class="blockfill"/>
  <text x="344" y="361" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">차단 → 완료 거부</text>
  <line x1="616" y1="376" x2="616" y2="414" stroke="#8b93a1" stroke-width="1.6" marker-end="url(#ab)"/>
  <line x1="344" y1="376" x2="344" y2="414" stroke="#8b93a1" stroke-width="1.6" marker-end="url(#ab)"/>

  <!-- record band : ink anchor (both outcomes land here) -->
  <rect x="258" y="418" width="444" height="58" rx="14" class="inkfill"/>
  <text x="480" y="443" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">기록 — 다음 턴의 입력</text>
  <text x="480" y="462" text-anchor="middle" font-size="11" fill="#8b919b">감사 장부 · 검증 서명 · 수리 카드</text>

  <!-- feedback loop -->
  <path d="M 258 447 C 190 447, 150 410, 150 340 C 150 314, 158 300, 168 292" fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ab)"/>
  <text x="158" y="412" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3f76d6">피드백 루프</text>
  <text x="158" y="429" text-anchor="middle" class="muted">검증 결과가 다시 컨텍스트로</text>

  <text x="480" y="518" text-anchor="middle" class="sub0">cladding = 외장재. LLM을 대체하지 않는다 — 감싼다.</text>
  <text x="480" y="540" text-anchor="middle" font-size="13" font-weight="800" fill="#3f76d6">목표는 하나 — AI의 ‘다 됐습니다’를 말이 아니라 증명으로.</text>
</svg>
