# Cladding SSoT — full self-spec (v0.1)
#
# Authored under L5b (T2b). Every shipped feature in the cladding repo
# has an entry here, with EARS-structured ACs and module pointers.
# This file is read by the upcoming T4 Ironclad-native detectors
# (UNMAPPED_ARTIFACT, MISSING_IMPLEMENTATION, AC_DRIFT, UNTESTED_AC, …)
# to detect spec ↔ code drift.
#
# Feature numbering is independent of Lego brick (L0/L1/L2…); the Lego
# ladder is a delivery sequence, while features here are units of
# capability.

schema: "0.1"

project:
  name: cladding
  language: typescript

scenarios:
  - id: S-001
    title: User runs the L1 base-static suite on their project
    flow: >-
      Developer installs cladding · invokes the six stage runners
      (type/lint/drift/commit/arch/secret) on their codebase · receives a
      one-line JSON StageResult per gate. cladding auto-resolves the
      project's toolchain so the same six commands work across 9 languages.
    features: [F-001, F-002, F-003, F-004, F-005, F-006, F-007, F-008, F-009]

  - id: S-002
    title: Author and validate a cladding spec.yaml
    flow: >-
      Developer writes spec.yaml · runs `clad spec:validate` · sees
      schema errors point-by-point or a green pass. Once valid, the spec
      becomes the input for the upcoming T4 drift detectors.
    features: [F-010]

architecture:
  layers:
    - [spec, stages, detectors, toolchain]
  forbidden_imports:
    - {from: spec, to: stages}
    - {from: toolchain, to: stages}

features:
  - id: F-001
    title: stage_1.1 Type — polyglot type-check delegation
    status: done
    modules:
      - stages/type.ts
      - stages/types.ts
      - stages/toolchain/detect.ts
      - stages/toolchain/types.ts
    acceptance_criteria:
      - id: AC-001
        ears: ubiquitous
        action: delegate type checking to the project's own toolchain
        response: returns a stage_1.1 StageResult with exitCode mirroring the tool
        text: >-
          The system shall delegate type checking to the project's own
          toolchain, returning a stage_1.1 result whose exit code mirrors
          the underlying type checker.
        test_refs: [self-dogfood:stage:type]
      - id: AC-002
        ears: event
        condition: when no type checker is registered for the detected language
        action: return pass=false with exitCode 2
        response: the stage is treated as skipped rather than failed
        text: >-
          When no type checker is registered for the detected language,
          the system shall return exitCode 2 so callers can treat the
          stage as skipped.

  - id: F-002
    title: stage_1.2 Lint — polyglot lint delegation
    status: done
    modules:
      - stages/lint.ts
    depends_on: [F-001]
    acceptance_criteria:
      - id: AC-003
        ears: ubiquitous
        action: delegate linting to the project's own toolchain
        response: returns a stage_1.2 StageResult mirroring the linter exit
        text: >-
          The system shall delegate linting to the project's own
          toolchain and return a stage_1.2 result with the linter's exit
          code.
        test_refs: [self-dogfood:stage:lint]

  - id: F-003
    title: stage_1.3 Drift — registry + aggregator
    status: done
    modules:
      - stages/drift.ts
      - stages/detectors/index.ts
    acceptance_criteria:
      - id: AC-004
        ears: ubiquitous
        action: aggregate findings from every registered drift detector
        response: returns a DriftReport that fails only on error-severity findings
        text: >-
          The system shall aggregate findings from every registered
          drift detector and fail the stage only when at least one
          finding has error severity.
        test_refs: [self-dogfood:stage:drift]
      - id: AC-005
        ears: optional
        condition: where a detector is registered with a duplicate name
        action: replace the prior entry idempotently
        response: registration order of the first occurrence is preserved
        text: >-
          Where a detector is registered with a duplicate name, the
          system shall replace the prior entry while preserving the
          registration order of the first occurrence.

  - id: F-004
    title: Polyglot toolchain adapter
    status: done
    modules:
      - stages/toolchain/detect.ts
      - stages/toolchain/types.ts
    acceptance_criteria:
      - id: AC-006
        ears: event
        condition: when invoked on a project root
        action: scan for the first matching manifest and return the toolchain
        response: returns 'unknown' language when no manifest matches
        text: >-
          When invoked on a project root, the system shall scan the
          manifest priority chain and return the first match's
          toolchain, or 'unknown' when nothing matches.
        notes: >-
          Languages supported: typescript, python, rust, go, java, php,
          ruby, elixir, dotnet.

  - id: F-005
    title: stage_1.6 Secret — polyglot secret scanning
    status: done
    modules:
      - stages/secret.ts
    depends_on: [F-004, F-006]
    acceptance_criteria:
      - id: AC-007
        ears: ubiquitous
        action: invoke the toolchain's secret scanner via the HARDCODED_SECRET detector
        response: returns a stage_1.6 StageResult folded from detector findings
        text: >-
          The system shall invoke the toolchain's secret scanner via the
          HARDCODED_SECRET detector and fold the findings into a
          stage_1.6 result.
        test_refs: [self-dogfood:stage:secret]

  - id: F-006
    title: HARDCODED_SECRET drift detector (#11)
    status: done
    modules:
      - stages/detectors/hardcoded-secret.ts
    depends_on: [F-003, F-004]
    acceptance_criteria:
      - id: AC-008
        ears: event
        condition: when the toolchain's secret scanner reports a non-zero exit
        action: emit one error-severity DriftFinding summarizing the output
        response: stage_1.3 fails for the host pipeline
        text: >-
          When the secret scanner reports a non-zero exit, the detector
          shall emit one error-severity finding that summarises the
          scanner output.
      - id: AC-009
        ears: unwanted
        condition: if the secret scanner is not installed
        action: emit one info-severity finding instead of failing
        response: the stage stays in pass state so unconfigured projects keep green CI
        text: >-
          If the secret scanner is not installed, the detector shall
          emit an info finding rather than failing the stage.

  - id: F-007
    title: stage_1.4 Commit — clean-tree check
    status: done
    modules:
      - stages/commit.ts
    acceptance_criteria:
      - id: AC-010
        ears: ubiquitous
        action: invoke `git status --porcelain` and pass iff the output is empty
        response: returns a stage_1.4 StageResult
        text: >-
          The system shall invoke `git status --porcelain` and pass
          stage_1.4 iff the working tree and index are both clean.
        test_refs: [self-dogfood:stage:commit-postcommit]
      - id: AC-011
        ears: unwanted
        condition: if git is not available or the directory is not a repo
        action: return pass=false with exitCode 2
        response: the stage is treated as skipped, not a false failure
        text: >-
          If git is unavailable or the cwd is not a git repository, the
          system shall return exitCode 2 so the stage is treated as
          skipped.

  - id: F-008
    title: stage_1.5 Arch — architecture validation delegation
    status: done
    modules:
      - stages/arch.ts
    depends_on: [F-004, F-009]
    acceptance_criteria:
      - id: AC-012
        ears: ubiquitous
        action: invoke the toolchain's architecture validator via the ARCHITECTURE_VIOLATION detector
        response: returns a stage_1.5 StageResult folded from detector findings
        text: >-
          The system shall invoke the toolchain's architecture
          validator via the ARCHITECTURE_VIOLATION detector and fold
          the findings into a stage_1.5 result.
        test_refs: [self-dogfood:stage:arch]

  - id: F-009
    title: ARCHITECTURE_VIOLATION drift detector (#5)
    status: done
    modules:
      - stages/detectors/architecture-violation.ts
    depends_on: [F-003, F-004]
    acceptance_criteria:
      - id: AC-013
        ears: event
        condition: when the architecture validator reports a non-zero exit
        action: emit one error-severity DriftFinding summarising the output
        response: stage_1.3 fails for the host pipeline
        text: >-
          When the architecture validator reports a non-zero exit, the
          detector shall emit one error-severity finding summarising the
          output.
      - id: AC-014
        ears: optional
        condition: where the detected language enforces acyclic imports at compile time
        action: emit one info finding noting no gate is registered
        response: the stage stays in pass state
        text: >-
          Where the detected language enforces acyclic imports at
          compile time, the detector shall emit an info finding noting
          no architecture gate is registered.

  - id: F-010
    title: spec.yaml schema + parser + validator
    status: done
    modules:
      - spec/types.ts
      - spec/schema.json
      - spec/parse.ts
      - spec/validate.ts
      - spec/cli.ts
      - spec/load.ts
    acceptance_criteria:
      - id: AC-015
        ears: ubiquitous
        action: parse the spec.yaml file and validate it against schema.json
        response: returns valid=true with empty errors or valid=false with point-by-point messages
        text: >-
          The system shall parse spec.yaml and validate it against
          schema.json, returning point-by-point errors when invalid.
        test_refs: [self-dogfood:spec:validate]
      - id: AC-016
        ears: state
        condition: while the schema field equals the supported version
        action: accept the spec as a candidate for downstream detectors
        response: T4 native detectors consume the validated payload
        text: >-
          While the spec.schema field matches the supported version, the
          system shall accept the document as input for downstream
          drift detectors.

  - id: F-011
    title: MISSING_IMPLEMENTATION drift detector (#2)
    status: done
    modules:
      - stages/detectors/missing-implementation.ts
    depends_on: [F-003, F-010]
    acceptance_criteria:
      - id: AC-017
        ears: ubiquitous
        action: emit an error finding for every spec-declared module path that does not exist on disk
        response: stage_1.3 fails when any such finding is produced
        text: >-
          The system shall emit an error-severity drift finding for
          every module path declared in spec.yaml that does not exist
          on disk, failing stage_1.3 when at least one is produced.
        test_refs: [fixture:missing-implementation]
      - id: AC-018
        ears: unwanted
        condition: if spec.yaml is absent or unparseable
        action: emit one info finding rather than failing
        response: spec-less projects keep green CI
        text: >-
          If spec.yaml is absent or unparseable, the detector shall
          emit one info finding rather than failing the stage.

  - id: F-012
    title: UNMAPPED_ARTIFACT drift detector (#1)
    status: done
    modules:
      - stages/detectors/unmapped-artifact.ts
    depends_on: [F-003, F-010]
    acceptance_criteria:
      - id: AC-019
        ears: ubiquitous
        action: emit an error finding for every source file not referenced by any features[].modules
        response: stage_1.3 fails when any such finding is produced
        text: >-
          The system shall emit an error-severity drift finding for
          every source file under the scanned patterns that no feature
          in spec.yaml claims, failing stage_1.3 when at least one is
          produced.
        test_refs: [self-dogfood:stage:drift]
        notes: >-
          Scan patterns intentionally narrow (cladding's own
          tsconfig.include) so test fixtures and tooling configs do
          not surface as false positives.
      - id: AC-020
        ears: unwanted
        condition: if spec.yaml is absent or unparseable
        action: emit one info finding rather than failing
        response: spec-less projects keep green CI
        text: >-
          If spec.yaml is absent or unparseable, the detector shall
          emit one info finding rather than failing the stage.

  - id: F-013
    title: TECH_STACK_MISMATCH drift detector (#4)
    status: done
    modules:
      - stages/detectors/tech-stack-mismatch.ts
    depends_on: [F-003, F-004, F-010]
    acceptance_criteria:
      - id: AC-021
        ears: event
        condition: when spec.project.language differs from the toolchain-detected language
        action: emit a warn finding
        response: stage_1.3 surfaces but does not fail on this finding alone
        text: >-
          When spec.project.language differs from the language resolved
          by the toolchain manifest chain, the detector shall emit a
          warn-severity finding.

  - id: F-014
    title: STATUS_DRIFT drift detector (#14)
    status: done
    modules:
      - stages/detectors/status-drift.ts
    depends_on: [F-003, F-010]
    acceptance_criteria:
      - id: AC-022
        ears: event
        condition: when a feature with status 'done' has missing declared modules
        action: emit an error finding listing the missing paths
        response: stage_1.3 fails for the host pipeline
        text: >-
          When a feature with status='done' has at least one declared
          module missing on disk, the detector shall emit an error
          finding listing the missing paths.
      - id: AC-023
        ears: event
        condition: when status='in_progress' but every declared module is missing
        action: emit a warn finding noting a likely stale start
        response: surfaced but not failed
        text: >-
          When status='in_progress' but every declared module is absent,
          the detector shall emit a warn finding suggesting a stale start.

  - id: F-015
    title: STALE_SPECIFICATION drift detector (#16)
    status: done
    modules:
      - stages/detectors/stale-specification.ts
    depends_on: [F-003, F-010]
    acceptance_criteria:
      - id: AC-024
        ears: optional
        condition: where a feature carries archived_at but status is not 'archived'
        action: emit a warn finding
        response: surfaced for cleanup
        text: >-
          Where a feature has archived_at set but status is not
          'archived', the detector shall emit a warn finding.
      - id: AC-025
        ears: optional
        condition: where status='archived' but the feature's modules still exist on disk
        action: emit a warn finding listing the surviving paths
        response: surfaced for code removal cadence decision
        text: >-
          Where status='archived' but at least one declared module still
          exists on disk, the detector shall emit a warn finding so the
          project can decide on code-removal cadence.

  - id: F-016
    title: REFERENCE_INTEGRITY drift detector (#18)
    status: done
    modules:
      - stages/detectors/reference-integrity.ts
    depends_on: [F-003, F-010]
    acceptance_criteria:
      - id: AC-026
        ears: ubiquitous
        action: validate every internal id reference in spec.yaml resolves
        response: error finding per unresolved reference
        text: >-
          The system shall validate that every internal id reference in
          spec.yaml — features[].depends_on, features[].superseded_by,
          scenarios[].features — resolves to an actual feature id,
          emitting an error finding per unresolved reference.

  - id: F-017
    title: HARNESS_INTEGRITY drift detector (#17)
    status: done
    modules:
      - stages/detectors/harness-integrity.ts
    depends_on: [F-003]
    acceptance_criteria:
      - id: AC-027
        ears: ubiquitous
        action: cross-check plugin.json current.detectors against actual files under stages/detectors/
        response: error finding when the numerator does not match the file count
        text: >-
          The system shall cross-check the numerator of plugin.json
          current.detectors against the number of non-index .ts files
          under stages/detectors/, emitting an error finding on mismatch.

  - id: F-018
    title: META_INTEGRITY drift detector (#19)
    status: done
    modules:
      - stages/detectors/meta-integrity.ts
    depends_on: [F-003, F-010]
    acceptance_criteria:
      - id: AC-028
        ears: ubiquitous
        action: validate spec/schema.json declares the root keys spec/types.ts depends on
        response: error finding per missing root key
        text: >-
          The system shall validate that spec/schema.json declares and
          requires the root keys (schema, project, features) that
          spec/types.ts depends on, and that spec.yaml's schema version
          equals the supported version.

  - id: F-020
    title: L1 conformance fixture suite + declaration
    status: done
    modules:
      - conformance/runner.ts
    depends_on: [F-001, F-002, F-003, F-007, F-008, F-005]
    acceptance_criteria:
      - id: AC-031
        ears: ubiquitous
        action: run 12 fixtures (6 stages × pass/fail) and assert each stage's signal matches expectation
        response: returns conformance result with iron_law='L1' on full match, 'L0' otherwise
        text: >-
          The system shall run 12 conformance fixtures (6 stages × pass
          + fail) and assert every stage's signal matches its expected
          outcome, declaring iron_law='L1' on full match.
        test_refs: [self-dogfood:conformance]
      - id: AC-032
        ears: ubiquitous
        action: isolate fixtures in fresh temp dirs and symlink cladding's node_modules
        response: fixtures use cladding's installed devDeps without contaminating the source tree
        text: >-
          The system shall isolate each fixture in a fresh temp dir,
          symlink cladding's node_modules into it, and clean up after
          execution so the source tree stays uncontaminated.

  - id: F-019
    title: AC_DRIFT drift detector (#3) + EARS syntactic check
    status: done
    modules:
      - stages/detectors/ac-drift.ts
      - spec/ears.ts
    depends_on: [F-003, F-010]
    acceptance_criteria:
      - id: AC-029
        ears: ubiquitous
        action: flag any AC that has neither rendered text nor any EARS field
        response: error finding per structurally empty AC
        text: >-
          The system shall flag any acceptance_criterion that has
          neither a rendered text nor any EARS field
          (condition/action/response), emitting an error finding per
          structurally empty AC.
        notes: >-
          Structural floor — always on.
      - id: AC-030
        ears: event
        condition: when an AC declares an EARS pattern (event / state / optional / unwanted)
        action: verify the condition string begins with the pattern's trigger keyword
        response: error finding per misaligned trigger
        text: >-
          When an AC declares a non-ubiquitous EARS pattern, the
          system shall verify the condition begins with the pattern's
          trigger keyword (when / while / where / if), emitting an
          error finding per misalignment.
        notes: >-
          Delegates to spec/ears.ts. Lenient syntactic check; the
          richer semantic AC-vs-implementation drift remains TBD
          behind T9 (LLM-assisted inference).
